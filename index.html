    });
    const lbl = $('spinLbl');
    if (lbl) lbl.textContent = A.spin === 0 ? 'Ingen skruv' : `Skruv ${A.spin < 0 ? 'vänster' : 'höger'}${Math.abs(A.spin) > 1 ? ' ++' : ''}`;
  }
  A.setSpin = v => { A.spin = clamp(v, -2, 2); drawSpin(); Sound.play('soft'); if (active) active.changed(); };
  A.cycleSpin = dir => { const s = A.spin; A.setSpin(Math.sign(s) === dir ? (Math.abs(s) >= 2 ? 0 : s + dir) : dir); };

  /* ---------- En siktning ---------- */
  // opts: {seat, color, x, id} -> Promise<input> (kastet) eller null om den avbryts
  A.run = opts => {
    A.cancel();
    A.spin = 0;
    return new Promise(resolve => {
      const st = {seat: opts.seat, x: clamp(opts.x ?? 0, -HALF + R, HALF - R), a: 0, p: 0, mode: 'idle', resolve, sx: 0, sy: 0, px: 0, py: 0, x0: 0, lastTickP: 0, kb: false};
      active = st;
      const puckId = opts.id;
      const layer = $('aimLayer');
      layer.classList.add('on');
      document.body.classList.add('aiming');
      drawSpin();
      const hint = $('aimHint');
      if (hint) { hint.classList.toggle('show', !!opts.hint); hint.textContent = opts.hint || ''; }
      // ett finger som visar rörelsen (första kasten)
      const finger = $('finger');
      if (finger && opts.hint && !isPad()) {
        setTimeout(() => { if (active !== st || st.mode !== 'idle') return; const sp = Cam.toScreen(st.x, Y0, 0.02); finger.style.left = sp.x + 'px'; finger.style.top = Math.max(Scene.h * 0.28, sp.y - refLen() * 0.8) + 'px'; finger.style.setProperty('--pull', Math.round(refLen() * 0.75) + 'px'); finger.classList.add('show'); }, 700);
      }
      // meter på rätt sida för vänsterhänta
      document.body.classList.toggle('lefty', !!Settings.lefty);
      guardMini();
      const worldPerPx = () => {
        // handkontrollen: fingret flyttar pucken lika långt som på bordet i 2D
        if (isPad()) { const P = padGeom(); return P ? 1 / P.xs : 0.002; }
        const a = Cam.toTable(Scene.w / 2, Scene.h * 0.75), b = Cam.toTable(Scene.w / 2 + 100, Scene.h * 0.75);
        return a && b ? Math.abs(b.x - a.x) / 100 : 0.002;
      };
      st.changed = () => {
        const pull = st.p * 0.22;
        const vx = st.x - Math.sin(st.a) * pull, vy = Y0 - Math.cos(st.a) * pull;
        Pucks.set(puckId, vx, vy);
        const len = Settings.aim === 'av' ? 0 : A.help() ? L - Y0 - 0.1 : 1.3;
        showLine(st.x, Y0, st.a, st.mode === 'pull' || st.kb ? len : Math.min(len, 1.3), opts.color);
        Cam.aimAt(st.x);
        drawMeter(st.p, st.seat);
        padAim = {x: st.x, a: st.a, p: st.p, color: opts.color};
        if (opts.onAim) opts.onAim({x: st.x, a: st.a, p: st.p, w: A.spin});
      };
      st.changed();

      const down = e => {
        if (e.button > 0 || st.mode !== 'idle') return;
        Sound.unlock();
        Sound.primeSpeech();
        st.mode = 'touch'; st.id = e.pointerId; st.sx = e.clientX; st.sy = e.clientY; st.x0 = st.x; st.kb = false;
        st.len = refLen();
        st.scale = worldPerPx();
        try { layer.setPointerCapture(e.pointerId); } catch (x) { /* ok */ }
        if (hint) hint.classList.remove('show');
        if (finger) finger.classList.remove('show');
        e.preventDefault();
      };
      const move = e => {
        if (e.pointerId !== st.id || st.mode === 'idle') return;
        const dx = e.clientX - st.sx, dy = e.clientY - st.sy;
        if (st.mode === 'touch' || st.mode === 'place') {
          if (dy > 16 && dy > Math.abs(dx) * 0.55) { st.mode = 'pull'; st.px = e.clientX; st.py = e.clientY - 4; Sound.play('soft'); }
          else if (Math.abs(dx) > 6 || st.mode === 'place') {
            st.mode = 'place';
            st.x = clamp(st.x0 + dx * st.scale, -HALF + R, HALF - R);
            // börja spänna från den nya höjden om fingret har glidit uppåt
            if (dy < 0) st.sy = e.clientY;
            st.changed();
          }
        }
        if (st.mode === 'pull') {
          const len = st.len || refLen();
          const pull = Math.max(0, e.clientY - st.py);
          const p = clamp(pull / len, 0, 1);
          st.a = clamp(-(e.clientX - st.px) / len * GAIN, -A_MAX, A_MAX);
          // ticka för varje 5 %, och tydligt vid kanten
          const step = Math.floor(p * 20);
          if (step !== Math.floor(st.p * 20)) { Sound.play('tick', p); if (p > .05) vibrate(4); }
          if (A.help() && (p > Phys.POWER_EDGE) !== (st.p > Phys.POWER_EDGE)) { Sound.play('edgeTick'); vibrate(18); }
          st.p = p;
          st.changed();
        }
      };
      const up = e => {
        if (e.pointerId !== st.id) return;
        try { layer.releasePointerCapture(e.pointerId); } catch (x) { /* ok */ }
        if (st.mode === 'pull' && st.p > 0.035) { fire(); return; }
        // avbrutet: pucken glider tillbaka till linjen
        st.mode = 'idle'; st.p = 0; st.a = 0; st.changed();
      };
      const cancel = e => { if (e.pointerId === st.id) { st.mode = 'idle'; st.p = 0; st.a = 0; st.changed(); } };
      const key = e => {
        if (!active || active !== st) return;
        const k = e.key;
        const fine = e.altKey ? 0.2 : 1;
        if (k === 'ArrowLeft' || k === 'ArrowRight') {
          const d = k === 'ArrowLeft' ? -1 : 1;
          if (e.shiftKey) st.a = clamp(st.a - d * 0.0015 * fine, -A_MAX, A_MAX); else st.x = clamp(st.x + d * 0.005 * fine, -HALF + R, HALF - R);
        } else if (k === 'a' || k === 'A') st.a = clamp(st.a + 0.0015 * fine, -A_MAX, A_MAX);
        else if (k === 'd' || k === 'D') st.a = clamp(st.a - 0.0015 * fine, -A_MAX, A_MAX);
        else if (k === 'ArrowUp' || k === 'w' || k === 'W') { st.kb = true; st.p = clamp(st.p + 0.005 * fine, 0, 1); Sound.play('tick', st.p); }
        else if (k === 'ArrowDown' || k === 's' || k === 'S') { st.kb = true; st.p = clamp(st.p - 0.005 * fine, 0, 1); Sound.play('tick', st.p); }
        else if (k === 'q' || k === 'Q') { A.cycleSpin(-1); return; }
        else if (k === 'e' || k === 'E') { A.cycleSpin(1); return; }
        else if ((k === ' ' || k === 'Enter') && st.p > 0.035) { e.preventDefault(); fire(); return; }
        else if (k === 'Escape') { st.p = 0; st.a = 0; st.kb = false; }
        else return;
        e.preventDefault();
        st.changed();
      };
      function fire() {
        const speed = Phys.speedFor(st.p);
        const input = Phys.inputFrom(st.x, st.a, speed, A.spin * Phys.SPIN_MAX / 2);
        lastPower[st.seat] = st.p;
        Sound.play('release', st.p);
        vibrate(12);
        cleanup();
        resolve({input, power: st.p});
      }
      function cleanup() {
        layer.classList.remove('on');
        document.body.classList.remove('aiming');
        layer.removeEventListener('pointerdown', down);
        layer.removeEventListener('pointermove', move);
        layer.removeEventListener('pointerup', up);
        layer.removeEventListener('pointercancel', cancel);
        window.removeEventListener('keydown', key);
        if (hint) hint.classList.remove('show');
        if (finger) finger.classList.remove('show');
        drawMeter(0, st.seat);
        A.hideLine();
        padAim = null;
        if (active === st) active = null;
      }
      st.cleanup = () => { cleanup(); resolve(null); };
      layer.addEventListener('pointerdown', down);
      layer.addEventListener('pointermove', move);
      layer.addEventListener('pointerup', up);
      layer.addEventListener('pointercancel', cancel);
      window.addEventListener('keydown', key);
    });
  };
  A.cancel = () => { if (active) active.cleanup(); };
  A.active = () => !!active;

  // Någon annan siktar (över nätet eller datorn): visa pucken, linjen och mätaren
  A.showRemote = (puckId, s, color) => {
    if (!s) { A.hideLine(); drawMeter(0, -1); padAim = null; return; }
    const pull = (s.p || 0) * 0.22, a = clamp(s.a || 0, -A_MAX, A_MAX), x = clamp(s.x || 0, -HALF + R, HALF - R);
    Pucks.set(puckId, x - Math.sin(a) * pull, Y0 - Math.cos(a) * pull);
    showLine(x, Y0, a, s.p > 0.02 ? 1.6 : 0.8, color);
    Cam.aimAt(x);
    drawMeter(s.p || 0, -1);
    padAim = {x, a, p: s.p || 0, color};
  };
  A.lastPower = seat => lastPower[seat];
  A.resetMemory = () => { lastPower = {}; };
  return A;
})();

/* ---- 10-mqtt.js ---- */
/* ================= Meddelanden över internet (MQTT) ================= */
// Spelarna hittar varandra och skickar kasten via öppna MQTT-servrar (publika "brokers") över krypterade
// WebSockets. Det fungerar genom alla hemnätverk och mobilnät utan egen server. För säkerhets skull ansluter
// spelet till flera servrar samtidigt och skickar allt till alla. Dubbletter känns igen och kastas.
// Litet eget MQTT 3.1.1-bibliotek: CONNECT, SUBSCRIBE (även + och #), PUBLISH (QoS 0, ibland sparat hos servern:
// "retain", för topplistan), PING och "last will" (ett bye-meddelande som servern skickar om anslutningen bryts oväntat).
const Mqtt = (() => {
  const M = {};
  M.BROKERS = [
    'wss://test.mosquitto.org:8081/mqtt',
    'wss://broker.emqx.io:8084/mqtt',
    'wss://broker.hivemq.com:8884/mqtt'
  ];
  M.cid = 'c' + randId(10);
  const enc = new TextEncoder(), dec = new TextDecoder();
  const u16 = n => [n >> 8 & 255, n & 255];
  const str = s => { const b = enc.encode(s); return [...u16(b.length), ...b]; };
  const remLen = n => { const out = []; do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; out.push(d); } while (n > 0); return out; };
  const packet = (type, body) => { const b = body instanceof Uint8Array ? body : new Uint8Array(body); const h = [type, ...remLen(b.length)]; const out = new Uint8Array(h.length + b.length); out.set(h); out.set(b, h.length); return out; };

  let seq = 0, will = null;
  const subs = new Map();        // topic -> Set(handler)
  const conns = [];
  const seen = new Map();        // avsändare -> {set, list}
  const listeners = new Set();
  M.onChange = fn => { listeners.add(fn); return () => listeners.delete(fn); };
  const changed = () => listeners.forEach(fn => { try { fn(M.connected()); } catch (e) { console.error(e); } });

  class Conn {
    constructor(url) { this.url = url; this.ws = null; this.state = 'off'; this.pid = 1; this.buf = new Uint8Array(0); this.retry = 0; this.timer = 0; this.ping = 0; this.lastRx = 0; }
    open() {
      if (this.state === 'connecting' || this.state === 'on') return;
      this.state = 'connecting';
      let ws;
      try { ws = new WebSocket(this.url, ['mqtt']); } catch (e) { this.fail(); return; }
      this.ws = ws; ws.binaryType = 'arraybuffer';
      const guard = setTimeout(() => { if (this.state === 'connecting') { try { ws.close(); } catch (e) { /* stängd */ } this.fail(); } }, 9000);
      ws.onopen = () => {
        const flags = 0x02 | (will ? 0x04 : 0);
        const body = [...str('MQTT'), 4, flags, ...u16(40), ...str(M.cid + this.url.length.toString(36))];
        if (will) body.push(...str(will.topic), ...str(will.payload));
        ws.send(packet(0x10, body));
      };
      ws.onmessage = ev => { this.lastRx = Date.now(); this.read(new Uint8Array(ev.data)); };
      ws.onerror = () => {};
      ws.onclose = () => { clearTimeout(guard); if (this.ws === ws) this.fail(); };
      this.connGuard = guard;
    }
    fail() {
      const was = this.state;
      this.state = 'off'; this.ws = null;
      clearInterval(this.ping);
      if (was === 'on') changed();
      if (this.closing) return;
      const delay = [1500, 3000, 6000, 12000, 20000][Math.min(4, this.retry++)];
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.open(), delay);
    }
    read(d) {
      const nb = new Uint8Array(this.buf.length + d.length); nb.set(this.buf); nb.set(d, this.buf.length); this.buf = nb;
      for (;;) {
        if (this.buf.length < 2) return;
        let mul = 1, len = 0, i = 1, byte;
        do { if (i >= this.buf.length) return; byte = this.buf[i++]; len += (byte & 127) * mul; mul *= 128; } while (byte & 128);
        if (this.buf.length < i + len) return;
        const first = this.buf[0], type = first >> 4, qos = (first >> 1) & 3, body = this.buf.slice(i, i + len);
        this.buf = this.buf.slice(i + len);
        if (type === 2) {
          clearTimeout(this.connGuard);
          if (body[1] !== 0) { try { this.ws.close(); } catch (e) { /* stängd */ } return; }
          this.state = 'on'; this.retry = 0; this.lastRx = Date.now();
          for (const t of subs.keys()) this.sub(t);
          clearInterval(this.ping);
          this.ping = setInterval(() => {
            if (this.state !== 'on') return;
            if (Date.now() - this.lastRx > 50000) { try { this.ws.close(); } catch (e) { /* stängd */ } return; }
            this.send(new Uint8Array([0xC0, 0]));
          }, 15000);
          changed();
        } else if (type === 3) {
          const tl = (body[0] << 8) | body[1];
          const topic = dec.decode(body.subarray(2, 2 + tl));
          const payload = dec.decode(body.subarray(2 + tl + (qos ? 2 : 0)));
          deliver(topic, payload);
        }
      }
    }
    send(p) { try { if (this.ws && this.ws.readyState === 1) this.ws.send(p); } catch (e) { /* tappad */ } }
    sub(topic) { if (this.state === 'on') this.send(packet(0x82, [...u16(this.pid++ & 0xffff || 1), ...str(topic), 0])); }
    unsub(topic) { if (this.state === 'on') this.send(packet(0xA2, [...u16(this.pid++ & 0xffff || 1), ...str(topic)])); }
    pub(topic, payload, retain = false) { if (this.state === 'on') this.send(packet(retain ? 0x31 : 0x30, [...str(topic), ...enc.encode(payload)])); }
    close() { this.closing = true; clearTimeout(this.timer); clearInterval(this.ping); try { this.send(new Uint8Array([0xE0, 0])); this.ws && this.ws.close(); } catch (e) { /* stängd */ } this.state = 'off'; }
  }

  function deliver(topic, payload) {
    let msg;
    try { msg = JSON.parse(payload); } catch (e) { return; }
    if (!msg || typeof msg !== 'object' || typeof msg.f !== 'string') return;
    if (msg.f === M.cid) return;           // egna meddelanden
    // samma meddelande kommer från flera servrar: släpp bara igenom det första
    if (msg.n) {
      let s = seen.get(msg.f);
      if (!s) { s = {set: new Set(), list: []}; seen.set(msg.f, s); }
      if (s.set.has(msg.n)) return;
      s.set.add(msg.n); s.list.push(msg.n);
      if (s.list.length > 400) s.set.delete(s.list.shift());
    }
    const call = hs => hs.forEach(fn => { try { fn(msg, topic); } catch (e) { console.error(e); } });
    const hs = subs.get(topic);
    if (hs) call(hs);
    // prenumerationer med + (en nivå) och # (resten)
    for (const [pat, set] of subs) if (pat !== topic && /[+#]/.test(pat) && matches(pat, topic)) call(set);
  }
  function matches(pat, topic) {
    const a = pat.split('/'), b = topic.split('/');
    for (let i = 0; i < a.length; i++) { if (a[i] === '#') return true; if (i >= b.length || (a[i] !== '+' && a[i] !== b[i])) return false; }
    return a.length === b.length;
  }

  M.start = () => {
    if (conns.length) { conns.forEach(c => { if (c.state === 'off') { c.retry = 0; c.open(); } }); return; }
    M.BROKERS.forEach(u => { const c = new Conn(u); conns.push(c); c.open(); });
  };
  M.setWill = (topic, obj) => { will = {topic, payload: JSON.stringify(Object.assign({f: M.cid, n: 0}, obj))}; };
  M.connected = () => conns.filter(c => c.state === 'on').length;
  M.started = () => conns.length > 0;
  // Väntar tills minst en server är ansluten
  M.ready = (ms = 10000) => new Promise(res => {
    if (M.connected()) return res(true);
    M.start();
    const off = M.onChange(n => { if (n) { off(); clearTimeout(t); res(true); } });
    const t = setTimeout(() => { off(); res(M.connected() > 0); }, ms);
  });
  M.sub = (topic, fn) => {
    let hs = subs.get(topic);
    if (!hs) { hs = new Set(); subs.set(topic, hs); conns.forEach(c => c.sub(topic)); }
    hs.add(fn);
    return () => { hs.delete(fn); if (!hs.size) { subs.delete(topic); conns.forEach(c => c.unsub(topic)); } };
  };
  M.pub = (topic, obj, retain = false) => {
    const payload = JSON.stringify(Object.assign({f: M.cid, n: ++seq}, obj));
    conns.forEach(c => c.pub(topic, payload, retain));
    return payload.length;
  };
  M.clearRetained = topic => { conns.forEach(c => c.pub(topic, '', true)); };
  M.stop = () => { conns.forEach(c => c.close()); conns.length = 0; };
  // Tillbaka från bakgrunden: se till att anslutningarna lever
  if (typeof document !== 'undefined' && document.addEventListener) document.addEventListener('visibilitychange', () => { if (!document.hidden && conns.length) conns.forEach(c => { if (c.state === 'off') { c.retry = 0; clearTimeout(c.timer); c.open(); } }); });
  return M;
})();

/* ---- 11-net.js ---- */
/* ================= Lobbyn och borden över nätet ================= */
// Lobbyn: alla som är inne på "Spela online" syns för varandra (namn, figur och vad de gör) och publika bord
// som väntar på spelare listas. Man kan gå med i ett bord, bjuda in någon eller snabbmatcha.
// Ett bord: den som skapar bordet är värd och bestämmer (räknar kasten och håller ställningen). Alla kör samma
// deterministiska fysik, så kastet skickas bara som fart och riktning och ser likadant ut på alla skärmar.
// Samma gränssnitt (Session) används för spel på en skärm: LocalSession, HostSession och ClientSession.
const GAME_VER = typeof BUILD_VER !== 'undefined' ? BUILD_VER : 'dev';
const Net = (() => {
  const N = {};
  const PRE = 'shuffleklubben/v1/', T_LOBBY = PRE + 'lobby';
  const tRoom = code => PRE + 'r/' + code;
  const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  N.newCode = () => Array.from(crypto.getRandomValues(new Uint8Array(4)), b => ALPHA[b % ALPHA.length]).join('');
  N.cleanCode = s => String(s || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  const plain = (s, n = 16) => String(s || '').replace(/[<>&"'`]/g, '').replace(/\s+/g, ' ').trim().slice(0, n);
  // Enhetens id är nyckeln för att komma tillbaka till sin plats. Det skickas aldrig ut till alla, bara en
  // kontrollsumma (cyrb53) som mobilen kan känna igen sig själv på.
  N.devHash = (str, seed = 7) => {
    let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  };
  const myHash = () => N.devHash(Profile.dev);
  // Ett läge i jämförbar form (för att se om gästens läge skiljer sig från värdens)
  const sig = m => JSON.stringify([m.k, m.n, m.frame, m.scores, m.pucks, m.order, m.over, m.winner]);
  const AVATARS = ['🦊', '🐻', '🐼', '🐨', '🦁', '🐯', '🐸', '🐵', '🐧', '🦉', '🐙', '🦄', '🐺', '🐮', '🐷', '🐰', '🦝', '🐲', '🤖', '🎩', '👑', '🌟', '🍀', '🎸'];
  N.AVATARS = AVATARS;
  const cleanAv = a => AVATARS.includes(a) ? a : '🙂';

  /* ---------- Veckans topplista (dagens utmaning) ---------- */
  // Varje enhet lägger sina poäng för veckan som ett sparat meddelande på servrarna (.../vecka/<vecka>/<enhet>),
  // så den som öppnar listan får allas senaste direkt. Bara om man syns i lobbyn (inställningen).
  N.weekTag = '';
  const tWeek = key => PRE + 'vecka/' + (N.weekTag ? N.weekTag + '-' : '') + key;
  const cleanWeek = msg => {
    if (!msg || !Array.isArray(msg.d) || msg.d.length !== 7) return null;
    const d = msg.d.map(x => (typeof x === 'number' && isFinite(x) ? clamp(Math.round(x), -12, 12) : null));
    const days = d.filter(x => x != null).length;
    if (!days) return null;
    return {name: plain(msg.nm) || 'Spelare', av: cleanAv(msg.av), color: Rules.COLORS[msg.c] ? msg.c : 'red', d, days, tot: Challenges.weekTotal(d), t: +msg.t || 0};
  };
  N.weekMine = () => {
    const e = Challenges.weekEntry();
    return e.days ? {name: plain(Profile.name) || 'Du', av: cleanAv(Profile.avatar), color: Profile.color || 'red', d: e.d, days: e.days, tot: e.tot, t: Date.now(), dh: myHash(), me: true} : null;
  };
  N.weekPublish = async () => {
    const online = typeof Main === 'undefined' || Main.onlineOk();
    const e = Challenges.weekEntry();
    if (!online || Settings.visible === false || !e.days) return false;
    if (!(await Mqtt.ready(9000))) return false;
    const send = () => {
      if (e.prev) Mqtt.clearRetained(tWeek(e.prev) + '/' + myHash());
      Mqtt.pub(tWeek(e.key) + '/' + myHash(), {nm: plain(Profile.name) || 'Spelare', av: cleanAv(Profile.avatar), c: Profile.color, d: e.d, t: Date.now()}, true);
    };
    // (en gång till en stund senare: servrarna som ansluter efter den första ska också få det)
    send(); setTimeout(send, 4000);
    return true;
  };
  // Tar bort min rad från listan (när jag slutar synas)
  N.weekClear = async () => {
    const e = Challenges.weekEntry();
    if (!(await Mqtt.ready(9000))) return false;
    const clear = () => Mqtt.clearRetained(tWeek(e.key) + '/' + myHash());
    clear(); setTimeout(clear, 4000);
    return true;
  };
  // Följer veckans lista: fn(lista) med den högsta summan först, eller fn(null) utan anslutning
  N.weekWatch = fn => {
    const key = Challenges.week().key, got = new Map(), mine = myHash();
    let unsub = null, dead = false;
    const emit = () => { if (!dead) fn([...got.values()].sort((a, b) => b.tot - a.tot || b.days - a.days || a.t - b.t)); };
    Mqtt.ready(9000).then(ok => {
      if (dead) return;
      if (!ok) { fn(null); return; }
      unsub = Mqtt.sub(tWeek(key) + '/+', (msg, topic) => {
        const dh = String(topic.split('/').pop()).slice(0, 16), e = cleanWeek(msg);
        if (!e || dh === mine) return;
        const old = got.get(dh);
        if (old && old.t >= e.t) return;
        got.set(dh, Object.assign(e, {dh}));
        emit();
      });
      emit();
    });
    return () => { dead = true; if (unsub) unsub(); };
  };

  /* ---------- Lobbyn ---------- */
  const members = new Map();
  let inLobby = false, hiTimer = 0, sweepTimer = 0, unsubLobby = null, status = {st: 'menu', tb: null};
  const lobbyListeners = new Set();
  N.onLobby = fn => { lobbyListeners.add(fn); return () => lobbyListeners.delete(fn); };
  let lobbyT = 0;
  const lobbyChanged = () => { clearTimeout(lobbyT); lobbyT = setTimeout(() => lobbyListeners.forEach(fn => { try { fn(); } catch (e) { console.error(e); } }), 120); };
  const me = () => ({name: plain(Profile.name) || 'Spelare', av: cleanAv(Profile.avatar), color: Profile.color, st: status.st, tb: status.tb, ver: GAME_VER});
  function hi() { if (inLobby && Settings.visible !== false) Mqtt.pub(T_LOBBY, Object.assign({t: 'hi'}, me())); }
  function onLobby(msg) {
    if (msg.t === 'hi') {
      const known = members.has(msg.f);
      members.set(msg.f, {cid: msg.f, name: plain(msg.name) || 'Spelare', av: cleanAv(msg.av), color: Rules.COLORS[msg.color] ? msg.color : 'red', st: String(msg.st || 'menu').slice(0, 10),
        tb: msg.tb && typeof msg.tb === 'object' ? {code: N.cleanCode(msg.tb.code), n: +msg.tb.n || 1, max: clamp(+msg.tb.max || 2, 2, 4), st: msg.tb.st === 'play' ? 'play' : 'wait', pub: !!msg.tb.pub, quick: !!msg.tb.quick, lag: !!msg.tb.lag, target: +msg.tb.target || 15} : null,
        ver: String(msg.ver || ''), seen: Date.now()});
      if (!known) Bus.emit('lobby-join', members.get(msg.f));
      lobbyChanged();
    } else if (msg.t === 'who') { if (inLobby) setTimeout(hi, 200 + Math.random() * 900); }
    else if (msg.t === 'bye') { if (members.delete(msg.f)) lobbyChanged(); }
    else if (msg.t === 'inv' && msg.to === Mqtt.cid) Bus.emit('invite', {from: plain(msg.name) || 'Någon', av: cleanAv(msg.av), code: N.cleanCode(msg.code), cid: msg.f});
  }
  N.lobbyOn = async () => {
    if (inLobby) return true;
    Mqtt.setWill(T_LOBBY, {t: 'bye'});
    const ok = await Mqtt.ready(9000);
    if (!ok) return false;
    if (inLobby) return true;
    inLobby = true;
    unsubLobby = Mqtt.sub(T_LOBBY, onLobby);
    setTimeout(() => { Mqtt.pub(T_LOBBY, {t: 'who'}); hi(); }, 600);
    clearInterval(hiTimer); hiTimer = setInterval(hi, 20000);
    clearInterval(sweepTimer);
    sweepTimer = setInterval(() => { const now = Date.now(); let ch = false; members.forEach((m, k) => { if (now - m.seen > 50000) { members.delete(k); ch = true; } }); if (ch) lobbyChanged(); }, 5000);
    lobbyChanged();   // t.ex. startskärmens "● 1 online" även när ingen annan är där
    return true;
  };
  N.lobbyOff = () => {
    if (!inLobby) return;
    Mqtt.pub(T_LOBBY, {t: 'bye'});
    inLobby = false; clearInterval(hiTimer); clearInterval(sweepTimer);
    if (unsubLobby) unsubLobby();
    members.clear(); lobbyChanged();
  };
  N.inLobby = () => inLobby;
  N.status = (st, tb = null) => { status = {st, tb}; hi(); };
  N.members = () => [...members.values()].sort((a, b) => a.name.localeCompare(b.name, 'sv'));
  N.tables = () => N.members().filter(m => m.tb && m.tb.pub && m.tb.code).map(m => Object.assign({host: m.name, av: m.av, cid: m.cid, ver: m.ver}, m.tb));
  N.invite = (cid, code) => Mqtt.pub(T_LOBBY, {t: 'inv', to: cid, code, name: plain(Profile.name), av: cleanAv(Profile.avatar)});
  // Snabbmatch: ett bord som väntar, med plats kvar och samma version (flest spelare först)
  N.quickTable = () => N.tables().filter(t => t.st === 'wait' && t.n < t.max && t.ver === GAME_VER).sort((a, b) => b.n - a.n)[0] || null;

  /* ---------- Gemensam grund för sessionerna ---------- */
  class Session {
    constructor(role) { this.role = role; this.ls = {}; this.m = null; this.seats = []; }
    on(ev, fn) { (this.ls[ev] = this.ls[ev] || []).push(fn); return this; }
    removeListener(ev, fn) { if (this.ls[ev]) this.ls[ev] = this.ls[ev].filter(f => f !== fn); }
    emit(ev, ...a) { (this.ls[ev] || []).forEach(fn => { try { fn(...a); } catch (e) { console.error(e); } }); }
    off() { this.ls = {}; }
    mySeat() { return -1; }
    isMine(s) { return s === this.mySeat(); }
    cpuHere() { return false; }
    sendAim() {}
    sendEmote() {}
    leave() {}
    online() { return false; }
  }

  // Alla på samma skärm (mot datorn, flera spelare eller träning)
  class LocalSession extends Session {
    constructor(seats, opts) {
      super('local');
      this.seats = seats;
      this.m = Rules.create(Object.assign({seats, id: randId(8)}, opts));
      this.opts = opts;
    }
    isMine(s) { return this.seats[s] && this.seats[s].kind !== 'cpu'; }
    cpuHere(s) { return this.seats[s] && this.seats[s].kind === 'cpu'; }
    submit(input) {
      if (!this.m || this.m.over) return;
      const pre = this.m, seat = Rules.current(pre), r = Rules.apply(pre, input);
      this.m = r.m;
      this.emit('throw', {k: r.m.k, seat, input: r.sum.input, pre, post: r.m, sum: r.sum});
      return true;
    }
    rematch() { this.m = Rules.create(Object.assign({seats: this.seats, id: randId(8)}, this.opts)); this.emit('state', this.m, 'new'); }
  }

  // En utmaning: jag kastar, "huset" har bara sina puckar på bordet
  class ChallengeSession extends LocalSession {
    constructor(level, me) {
      const m = Challenges.create(level, me);
      super(m.seats, {});
      this.level = level; this.me = me;
      this.m = m; this.seats = m.seats;
    }
    rematch() { this.m = Challenges.create(this.level, this.me); this.seats = this.m.seats; this.emit('state', this.m, 'new'); }
  }

  // Pubturnén: jag mot en stamgäst på pubens bord
  class TourSession extends LocalSession {
    constructor(pi, oi, me) {
      const m = Tour.create(pi, oi, me);
      super(m.seats, {});
      this.pi = pi; this.oi = oi; this.me = me;
      this.m = m; this.seats = m.seats;
    }
    rematch() { this.m = Tour.create(this.pi, this.oi, this.me); this.seats = this.m.seats; this.emit('state', this.m, 'new'); }
  }

  // Värden för ett bord över nätet
  class HostSession extends Session {
    constructor(opts) {
      super('host');
      const saved = opts.restore || null;
      this.opts = Object.assign({pub: true, max: 2, target: 15, mode: null, quick: false, teams: false, tv: false, cup: false}, saved ? saved.opts : opts);
      // turneringen (pubkvällen): träd, vilken match som pågår och vinnaren
      this.cup = saved ? saved.cup || null : null;
      // Pubkväll på TV: TV:n är värd utan egen plats, spelarna är telefonerna
      this.tv = !!this.opts.tv;
      this.code = saved ? saved.code : (opts.code || N.newCode());
      this.topic = tRoom(this.code);
      this.seats = saved ? saved.seats : this.tv ? [] : [{cid: Mqtt.cid, dev: Profile.dev, name: plain(Profile.name) || 'Värd', av: cleanAv(Profile.avatar), color: Profile.color || 'red', kind: 'human', online: true, host: true, team: 0, cos: Badges.seatCos()}];
      if (saved) { const me = this.seats.find(s => s.host); if (me) me.cid = Mqtt.cid; }
      this.watchers = new Map();
      this.state = saved ? saved.state : 'lobby';
      this.m = saved ? saved.m : null;
      this.seen = new Map();
      // efter en omladdning: ge gästerna en stund att höras av innan de räknas som borta
      if (saved) this.seats.forEach(s => { if (s.kind === 'human' && !s.host && !s.left) this.seen.set(s.cid, Date.now()); });
      this.v = saved ? saved.v + 10 : 1;
      this.unsub = Mqtt.sub(this.topic, msg => this.onMsg(msg));
      this.hb = setInterval(() => this.tick(), 2000);
      this.announce();
    }
    online() { return true; }
    mySeat() { return this.seats.findIndex(s => s.cid === Mqtt.cid); }
    isMine(s) { return s === this.mySeat(); }
    cpuHere(s) { return this.seats[s] && this.seats[s].kind === 'cpu'; }
    info() { return {code: this.code, pub: this.opts.pub, max: this.opts.max, target: this.opts.target, mode: this.opts.mode, quick: this.opts.quick, teams: !!this.opts.teams, tv: this.tv, cup: !!this.opts.cup, name: this.tv ? 'TV' : this.seats[0] ? this.seats[0].name : ''}; }
    publicSeats() { return this.seats.map(s => { const o = Object.assign({}, s); delete o.dev; if (s.dev) o.dh = N.devHash(s.dev); return o; }); }
    roomMsg() { return {t: 'room', hd: N.devHash(Profile.dev, 11), v: ++this.v, ver: GAME_VER, info: this.info(), seats: this.publicSeats(), state: this.state, m: this.m, w: this.watchers.size, cup: this.publicCup()}; }
    // turneringen som alla får se (spelarnas enheter bara som kontrollsumma)
    publicCup() {
      const c = this.cup;
      if (!c) return null;
      return {players: c.players.map(p => ({pid: p.pid, name: p.name, av: p.av, color: p.color, kind: p.kind, dh: p.dev ? N.devHash(p.dev) : null})), rounds: c.rounds, cur: c.cur, champ: c.champ, target: c.target};
    }
    // sparas i fliken efter varje förändring (så att en omladdning inte tappar ett kast)
    save() { if (this.left) return; TabStore.set('host', {code: this.code, opts: this.opts, seats: this.seats, state: this.state, m: this.m, v: this.v, cup: this.cup, t: Date.now()}); }
    announce() {
      if (this.left) return;
      Mqtt.pub(this.topic, this.roomMsg());
      this.save();
      const humans = this.seats.filter(s => s.kind === 'human').length;
      N.status('host', {code: this.code, n: this.cup ? this.cup.players.length : this.seats.length, max: this.opts.max, st: this.state === 'lobby' ? 'wait' : 'play', pub: this.opts.pub, quick: this.opts.quick, lag: !!this.opts.teams, target: this.opts.target, h: humans});
      this.emit('seats');
    }
    tick() {
      const now = Date.now();
      let ch = false;
      this.seats.forEach(s => {
        if (s.kind !== 'human' || s.cid === Mqtt.cid || s.left) return;
        const on = now - (this.seen.get(s.cid) || 0) < 16000;
        if (on !== s.online) { s.online = on; ch = true; this.emit(on ? 'back' : 'gone', s); }
      });
      this.watchers.forEach((w, cid) => { if (now - w.seen > 20000) { this.watchers.delete(cid); ch = true; } });
      if (ch || now - (this.lastAnn || 0) > 4000) { this.lastAnn = now; this.announce(); }
      // Snabbmatch: tryckte två på samma gång skapades två tomma bord. Den med den senare koden (i bokstavsordning)
      // flyttar till den andras bord, så att de möts.
      if (this.opts.quick && this.state === 'lobby' && this.seats.length === 1 && !this.merging) {
        const other = N.tables().filter(t => t.quick && t.st === 'wait' && t.n < t.max && t.ver === GAME_VER && t.code !== this.code).sort((a, b) => (a.code < b.code ? -1 : 1))[0];
        if (other && other.code > this.code) return;
        if (other) { this.merging = true; this.emit('merge', other.code); }
      }
    }
    seatOf(cid) { return this.seats.findIndex(s => s.cid === cid); }
    onMsg(msg) {
      if (msg.t !== 'leave') this.seen.set(msg.f, Date.now());
      const si = this.seatOf(msg.f);
      switch (msg.t) {
        case 'join': {
          if (String(msg.ver) !== GAME_VER) { Mqtt.pub(this.topic, {t: 'nope', to: msg.f, why: 'ver', hd: N.devHash(Profile.dev, 11)}); return; }
          const dev = plain(msg.dev, 32);
          const cp = this.cup && this.cup.players.find(p => p.kind === 'human' && p.dev === dev);
          if (cp) { cp.cid = msg.f; cp.online = true; }
          let i = this.seats.findIndex(s => s.kind === 'human' && s.dev === dev);
          if (i >= 0) { Object.assign(this.seats[i], {cid: msg.f, online: true}); delete this.seats[i].left; this.emit('back', this.seats[i]); }
          else if (this.state === 'lobby' && this.seats.length < this.opts.max) {
            const taken = new Set(this.seats.map(s => s.color));
            let color = Rules.COLORS[msg.color] && !taken.has(msg.color) ? msg.color : Rules.COLOR_KEYS.find(c => !taken.has(c));
            this.seats.push({cid: msg.f, dev, name: plain(msg.name) || 'Spelare', av: cleanAv(msg.av), color, kind: 'human', online: true, team: this.smallTeam(), cos: Badges.cleanCos(msg.cos)});
            Sound.play('join');
            this.emit('joined', this.seats[this.seats.length - 1]);
          } else this.watchers.set(msg.f, {name: plain(msg.name) || 'Någon', seen: Date.now()});
          this.announce();
          break;
        }
        case 'hb': { const w = this.watchers.get(msg.f); if (w) w.seen = Date.now(); break; }
        case 'leave':
          if (si >= 0 && !this.seats[si].host) {
            if (this.state === 'lobby') { this.seats.splice(si, 1); Sound.play('leave'); }
            else { this.seats[si].online = false; this.seats[si].left = true; this.seen.delete(msg.f); this.emit('gone', this.seats[si]); }
            this.announce();
          } else this.watchers.delete(msg.f);
          break;
        case 'color':
          if (si >= 0 && !this.seats[si].host && this.state === 'lobby' && Rules.COLORS[msg.color] && !this.seats.some(s => s.color === msg.color)) { this.seats[si].color = msg.color; this.announce(); }
          break;
        // Vid ett TV-bord styr telefonerna: inställningar, datorspelare, start, revansch och tillbaka till bordet
        case 'opts': if (this.tv && si >= 0 && msg.o && typeof msg.o === 'object') this.setOpts(N.cleanOpts(msg.o)); break;
        case 'cpu':
          if (!this.tv || si < 0) break;
          if (msg.rm != null) { const i = msg.rm | 0; if (this.seats[i] && this.seats[i].kind === 'cpu') this.removeSeat(i); }
          else this.addCpu(AI.LEVELS[msg.level] ? msg.level : 'medel');
          break;
        case 'start': {
          // (i en turnering får alla turneringens spelare trycka vidare, även de som tittar)
          const inCup = this.cup && this.cup.players.some(p => p.cid === msg.f);
          if (!this.tv || (si < 0 && !inCup)) break;
          if (this.state === 'lobby') this.start();
          else if (this.state === 'over') { if (this.cup) this.cupNext(); else this.rematch(); }
          break;
        }
        case 'lobby': if (this.tv && (si >= 0 || (this.cup && this.cup.players.some(p => p.cid === msg.f))) && (this.state === 'over' || this.state === 'cupover')) this.backToLobby(); break;
        case 'team': if (si >= 0) this.setTeam(si); break;
        case 'thr':
          // avvisat kast (fel tur eller gammalt): skicka läget så att gästen rättar sig direkt
          if (si >= 0 && !this.apply(si, msg.input, msg.k) && Date.now() - (this.lastFix || 0) > 400) { this.lastFix = Date.now(); Mqtt.pub(this.topic, this.roomMsg()); }
          break;
        case 'turn': if (si >= 0) this.emit('turnStart', si, msg.k); break;
        case 'aim': if (si >= 0) this.emit('aim', si, msg); break;
        case 'emo': if (si >= 0 || this.watchers.has(msg.f)) this.emit('emo', si, plain(msg.e, 40)); break;
        case 'resync': Mqtt.pub(this.topic, this.roomMsg()); break;
      }
    }
    // Värden räknar kastet (eget, datorns eller en gästs) och skickar resultatet till alla
    apply(seat, input, k) {
      const m = this.m;
      if (!m || m.over || Rules.current(m) !== seat) return false;
      if (k != null && k !== m.k) return false;
      const r = Rules.apply(m, Phys.cleanInput(input || {}));
      this.m = r.m;
      if (r.m.over) {
        this.state = 'over';
        if (this.cup && this.cup.cur) { const mt = this.cup.rounds[this.cup.cur.r][this.cup.cur.k]; mt.w = this.seats[r.m.winner].pid; mt.sc = r.m.scores.slice(); }
      }
      Mqtt.pub(this.topic, {t: 'thr', hd: N.devHash(Profile.dev, 11), v: ++this.v, k: r.m.k, seat, m: r.m});
      this.save();
      this.emit('throw', {k: r.m.k, seat, input: r.sum.input, pre: m, post: r.m, sum: r.sum});
      if (r.m.over || r.sum.frameEnd) this.announce();
      return true;
    }
    submit(input, seat = this.mySeat(), k = null) { return this.apply(seat, input, k); }
    addCpu(level = 'medel') {
      if (this.state !== 'lobby' || this.seats.length >= this.opts.max) return;
      const taken = new Set(this.seats.map(s => s.color)), used = new Set(this.seats.map(s => s.name));
      const name = AI.NAMES.find(n => !used.has(n)) || 'Datorn';
      this.seats.push({cid: 'cpu' + randId(4), name, av: '🤖', color: Rules.COLOR_KEYS.find(c => !taken.has(c)), kind: 'cpu', level, online: true, team: this.smallTeam()});
      this.announce();
    }
    removeSeat(i) {
      if (this.state !== 'lobby' || !this.seats[i] || this.seats[i].host) return;
      const s = this.seats[i];
      if (s.kind === 'human') Mqtt.pub(this.topic, {t: 'kick', to: s.cid, hd: N.devHash(Profile.dev, 11)});
      this.seats.splice(i, 1);
      this.announce();
    }
    setOpts(o) {
      if (this.state !== 'lobby') return;
      if (this.opts.cup && o.cup === false && this.seats.length > 4) return;
      Object.assign(this.opts, o);
      // turnering: upp till åtta spelare, en mot en
      if (this.opts.cup && this.tv) { this.opts.max = 8; this.opts.teams = false; }
      else { this.opts.cup = false; this.opts.max = clamp(Math.max(Math.min(this.opts.max, 4), Math.min(this.seats.length, 4)), 2, 4); }
      if (this.opts.max !== 4) this.opts.teams = false;
      this.announce();
    }
    // Lag: nya spelare hamnar i det mindre laget, och en plats kan byta lag i väntrummet
    smallTeam() { const t1 = this.seats.filter(s => s.team === 1).length; return t1 < this.seats.length - t1 ? 1 : 0; }
    setTeam(i) { if (this.state !== 'lobby' || !this.seats[i]) return; this.seats[i].team = this.seats[i].team === 1 ? 0 : 1; this.announce(); }
    // lagen när matchen startar: två och två (blev det ojämnt flyttas de sista över)
    teamsFor() {
      if (!this.opts.teams || this.seats.length !== 4) return null;
      const t0 = [], t1 = [];
      this.seats.forEach((s, i) => (s.team === 1 ? t1 : t0).push(i));
      while (t0.length > 2) t1.push(t0.pop());
      while (t1.length > 2) t0.push(t1.pop());
      return [t0, t1];
    }
    setColor(c) { const i = this.mySeat(); if (this.state === 'lobby' && Rules.COLORS[c] && !this.seats.some((s, j) => j !== i && s.color === c)) { this.seats[i].color = c; Profile.color = c; saveProfile(); this.announce(); } }
    start() {
      if (this.opts.cup) return this.cupStart();
      if (this.seats.length < 2 || this.starting || (this.opts.teams && this.seats.length !== 4)) return false;
      this.starting = true;
      setTimeout(() => { this.starting = false; }, 0);
      this.state = 'game';
      this.m = Rules.create({seats: this.seats.map(s => ({name: s.name, color: s.color, avatar: s.av, kind: s.kind, level: s.level, cos: s.cos || null})), target: this.opts.target, mode: this.opts.mode, teams: this.teamsFor(), id: randId(8)});
      this.announce();
      this.emit('state', this.m, 'new');
      return true;
    }
    rematch() {
      // de som har gått lämnar sina platser (om det finns minst två kvar)
      const stay = this.seats.filter(s => s.kind === 'cpu' || (s.online && !s.left));
      if (stay.length >= 2) this.seats = stay;
      return this.start();
    }
    backToLobby() {
      // efter en turnering: alla turneringens spelare tillbaka i väntrummet
      if (this.cup) { this.seats = this.cup.players.map(p => ({cid: p.cid, dev: p.dev, name: p.name, av: p.av, color: p.color, kind: p.kind, level: p.level, online: p.online !== false, cos: p.cos, team: 0})); this.cup = null; }
      this.state = 'lobby'; this.m = null; this.seats = this.seats.filter(s => s.kind === 'cpu' || (s.online && !s.left)); this.announce(); this.emit('state', null, 'lobby');
    }

    /* ---------- Turneringen: utslag en mot en för 3–8 spelare (på TV:n) ---------- */
    cupStart() {
      if (this.seats.length < 3 || this.starting) return false;
      this.starting = true;
      setTimeout(() => { this.starting = false; }, 0);
      const players = this.seats.map((s, i) => ({pid: i, cid: s.cid, dev: s.dev, name: s.name, av: s.av, color: s.color, kind: s.kind, level: s.level, cos: s.cos || null, online: s.online}));
      const order = shuffle(players.slice(), seeded((Date.now() % 1e9) | 0));
      // trädet: 4 eller 8 platser; de första i lottningen får frilott om platserna inte räcker
      const size = players.length <= 4 ? 4 : 8, byes = size - players.length, round = [];
      for (let k = 0; k < size / 2; k++) { const a = order.shift(), b = k < byes ? null : order.pop(); round.push({a: a.pid, b: b ? b.pid : null, w: b ? null : a.pid, sc: null}); }
      this.cup = {players, rounds: [round], cur: null, champ: null, target: this.opts.target || 7, mode: this.opts.mode || 'classic', n: 0};
      return this.cupNext();
    }
    // nästa match i trädet (eller nästa runda, eller vinnaren)
    cupNext() {
      const c = this.cup;
      if (!c || c.champ != null) return false;
      for (;;) {
        const r = c.rounds.length - 1, round = c.rounds[r];
        const k = round.findIndex(x => x.w == null && x.a != null && x.b != null);
        if (k >= 0) return this.cupPlay(r, k);
        if (round.length === 1) {
          c.champ = round[0].w; c.cur = null;
          this.state = 'cupover'; this.m = null;
          this.announce();
          this.emit('state', null, 'cupover');
          return true;
        }
        const next = [];
        for (let i = 0; i < round.length; i += 2) next.push({a: round[i].w, b: round[i + 1].w, w: null, sc: null});
        c.rounds.push(next);
      }
    }
    cupPlay(r, k) {
      const c = this.cup, mt = c.rounds[r][k], A = c.players[mt.a], B = c.players[mt.b];
      const colorB = B.color !== A.color ? B.color : Rules.COLOR_KEYS.find(x => x !== A.color);
      // matchens två platser; de andra i turneringen tittar på
      this.seats = [A, B].map((p, i) => ({cid: p.cid, dev: p.dev, name: p.name, av: p.av, color: i ? colorB : p.color, kind: p.kind, level: p.level, online: p.online !== false, cos: p.cos, pid: p.pid, team: 0}));
      c.players.forEach(p => { if (p.kind === 'human' && p.pid !== A.pid && p.pid !== B.pid && p.cid) this.watchers.set(p.cid, {name: p.name, seen: Date.now()}); });
      [A, B].forEach(p => { if (p.cid) this.watchers.delete(p.cid); });

      this.announce();
      this.emit('state', this.m, 'new');
      return true;
    }
    sendAim(a) { Mqtt.pub(this.topic, Object.assign({t: 'aim'}, a)); }
    sendEmote(e) { Mqtt.pub(this.topic, {t: 'emo', e}); }
    leave() {
      if (this.left) return;
      this.left = true;
      TabStore.del('host');
      Mqtt.pub(this.topic, {t: 'closed', hd: N.devHash(Profile.dev, 11)});
      clearInterval(this.hb);
      if (this.unsub) this.unsub();
      N.status('menu');
      this.off();
    }
  }

  // En gäst vid någon annans bord (spelare eller åskådare)
  class ClientSession extends Session {
    constructor(code) {
      super('client');
      this.code = N.cleanCode(code);
      this.topic = tRoom(this.code);
      this.hostCid = null; this.info = null; this.state = 'lobby'; this.lastHost = 0; this.hostLost = false; this.pending = null;

    join(timeout = 9000) {
      return new Promise((res, rej) => {

        const send = () => Mqtt.pub(this.topic, {t: 'join', ver: GAME_VER, dev: Profile.dev, name: plain(Profile.name) || 'Spelare', av: cleanAv(Profile.avatar), color: Profile.color, cos: Badges.seatCos()});
        send();

      }).then(s => {
        TabStore.set('room', {code: this.code, t: Date.now()});

    }
    mySeat() { const hh = this.me || myHash(); return this.seats.findIndex(s => s.dh === hh && s.kind === 'human'); }
    isMine(s) { return s >= 0 && s === this.mySeat(); }
    watching() { return this.mySeat() < 0; }
    onMsg(msg) {
      // nej och utkastning gäller bara från värden
      const fromHost = !this.hostDev || msg.hd === this.hostDev;
      if (msg.t === 'nope' && msg.to === Mqtt.cid && fromHost) { if (this.joinWait) { const e = new Error(msg.why === 'ver' ? 'Bordet kör en annan version av spelet. Ladda om sidan och försök igen.' : 'Kunde inte gå med.'); e.ver = msg.why === 'ver'; this.joinWait(e); } return; }
      if (msg.t === 'kick' && msg.to === Mqtt.cid && fromHost && this.hostDev) { this.emit('kicked'); return; }
      if (msg.t === 'aim' || msg.t === 'emo') {
        const si = this.seats.findIndex(s => s.cid === msg.f);
        if (msg.t === 'aim' && si >= 0) this.emit('aim', si, msg);
        if (msg.t === 'emo') this.emit('emo', si, plain(msg.e, 40));
        return;
      }
      if (msg.t === 'room' || msg.t === 'thr' || msg.t === 'closed') {
        // värden känns igen på sin enhet (inte anslutningen), så att den kan ladda om sidan och fortsätta
        if (!this.hostDev && msg.t === 'room') this.hostDev = msg.hd;
        if (!msg.hd || msg.hd !== this.hostDev) return;
        this.hostCid = msg.f;
        this.lastHost = Date.now();
        if (this.hostLost) { this.hostLost = false; this.emit('hostback'); }
      }
      if (this.closed) return;
      if (msg.t === 'closed') { this.closed = true; this.emit('closed'); return; }
      if (msg.t === 'room') {
        // äldre ögonblicksbild (kom sent via en långsammare server): hoppa över
        if (this.v && msg.v <= this.v) return;
        this.v = msg.v;
        this.info = msg.info; this.watchers = msg.w || 0;
        const prevState = this.state;
        this.seats = Array.isArray(msg.seats) ? msg.seats : [];
        this.state = msg.state;
        this.cup = msg.cup && typeof msg.cup === 'object' ? msg.cup : null;
        if (this.joinWait) this.joinWait(null);
        this.emit('seats');
        if (msg.state === 'cupover' && prevState !== 'cupover') { this.m = null; this.emit('state', null, 'cupover'); return; }
        this.take(msg.m, prevState);
      } else if (msg.t === 'thr') {

        if (msg.v) this.v = msg.v;
        this.take(msg.m, this.state);
      }
    }
    // Ett nytt läge från värden. Värden bestämmer alltid: är det nästa kast animeras det, annars hoppar vi dit.
    // Bara vårt eget kast som värden ännu inte har hunnit ta emot får ligga före värdens läge.
    take(m) {

      const cur = this.m, pend = this.pending;
      if (!cur || cur.id !== m.id) { this.m = m; this.pending = null; this.emit('state', m, 'new'); return; }
      if (pend && m.k >= pend.k) this.pending = null;
      if (m.k === cur.k + 1 && m.last && m.last.input) {
        this.m = m;
        this.emit('throw', {k: m.k, seat: m.last.seat, input: m.last.input, pre: cur, post: m, sum: m.last});
      } else if (m.k > cur.k + 1) {
        this.m = m; this.emit('state', m, 'jump');
      } else if (m.k === cur.k) {
        if (sig(m) !== sig(cur)) { this.m = m; this.emit('state', m, 'jump'); }
      } else {
        // värden ligger efter: väntar den bara på vårt kast gör vi ingenting, annars (omladdning, avvisat kast) gäller värdens läge
        if (pend && m.k === pend.k - 1 && m.k === cur.k - 1) return;
        this.pending = null; this.m = m; this.emit('state', m, 'jump');
      }
    }
    submit(input) {
      const m = this.m, seat = this.mySeat();
      if (!m || m.over || Rules.current(m) !== seat) return false;
      const msg = {t: 'thr', k: m.k, input: Phys.cleanInput(input)};
      Mqtt.pub(this.topic, msg);
      this.pending = {k: m.k + 1, msg, at: Date.now(), n: 0};
      // visa kastet direkt: värden räknar fram exakt samma sak
      const r = Rules.apply(m, msg.input);
      this.m = r.m;
      this.emit('throw', {k: r.m.k, seat, input: r.sum.input, pre: m, post: r.m, sum: r.sum, local: true});
      return true;
    }
    setColor(c) { Mqtt.pub(this.topic, {t: 'color', color: c}); Profile.color = c; saveProfile(); }
    switchTeam() { Mqtt.pub(this.topic, {t: 'team'}); }
    // vid ett TV-bord: be TV:n göra något (opts, cpu, start, lobby)
    request(t, o = {}) { Mqtt.pub(this.topic, Object.assign({}, o, {t})); }
    atTv() { return !!(this.info && this.info.tv); }
    sendAim(a) { Mqtt.pub(this.topic, Object.assign({t: 'aim'}, a)); }
    sendEmote(e) { Mqtt.pub(this.topic, {t: 'emo', e}); }
    // min tur har börjat (värden räknar tidsgränsen härifrån)
    sendTurn(k) { Mqtt.pub(this.topic, {t: 'turn', k}); }
    resync() { Mqtt.pub(this.topic, {t: 'resync'}); }
    leave() { if (this.left) return; this.left = true; TabStore.del('room'); Mqtt.pub(this.topic, {t: 'leave'}); clearInterval(this.hb); if (this.unsub) this.unsub(); N.status('menu'); this.off(); }
  }
  // Rundans namn i turneringen (efter hur många matcher den har)
  N.cupLabel = (c, r) => { const n = c.rounds[0].length / Math.pow(2, r); return n === 1 ? 'Final' : n === 2 ? 'Semifinal' : n === 4 ? 'Kvartsfinal' : 'Omgång ' + (r + 1); };
  // Tillåtna inställningar som en telefon kan skicka till ett TV-bord
  N.cleanOpts = o => {
    const out = {};
    if ([2, 3, 4].includes(o.max)) out.max = o.max;
    if (typeof o.cup === 'boolean') out.cup = o.cup;
    if ([7, 11, 15, 21].includes(o.target)) { out.target = o.target; out.userTarget = true; }
    if (o.mode === null || Object.prototype.hasOwnProperty.call(Rules.MODES, o.mode)) out.mode = o.mode;
    if (typeof o.teams === 'boolean') out.teams = o.teams;
    return out;
  };
  N.LocalSession = LocalSession;
  N.ChallengeSession = ChallengeSession;
  N.TourSession = TourSession;
  N.HostSession = HostSession;
  N.ClientSession = ClientSession;
  N.host = opts => new HostSession(opts);
  // Efter en omladdning: fortsätt som värd eller gå tillbaka till bordet man satt vid (inom två timmar)
  N.saved = () => {
    const h = TabStore.get('host'), r = TabStore.get('room'), fresh = x => x && Date.now() - x.t < 2 * 3600e3;
    if (fresh(h)) return {host: h};
    if (fresh(r)) return {room: r.code};
    return null;
  };
  N.join = async code => { const s = new ClientSession(code); try { await s.join(); } catch (e) { s.leave(); throw e; } return s; };
  return N;
})();

/* ================= Spelets HUD: ställning, minikarta, meddelanden och pratbubblor ================= */

  const sideAvs = (mm, side) => h('span', {class: 'avs'}, ...Rules.sideSeats(mm, side).map(si => {

    a.style.setProperty('--pc', Rules.sideColor(mm, side).hex);

  }));

  /* ---------- Spelarbrickorna (en per sida: spelare eller lag) ---------- */
  H.update = (mm, opts = {}) => {
    m = mm;
    if (!m) return;
    const chips = $('chips');
    const nS = Rules.sides(m);
    chips.className = nS > 2 ? 'chips4' : '';
    document.body.classList.toggle('four', nS > 2);
    document.body.classList.toggle('teams', !!m.teams);
    const key = nS + (m.teams ? 'lag' : '');
    if (chips.children.length !== nS || chips.dataset.key !== key) {
      chips.dataset.key = key;
      chips.innerHTML = '';
      for (let i = 0; i < nS; i++) chips.append(h('div', {class: 'chip' + (m.teams ? ' team' : ''), 'data-i': i},
        h('span', {class: 'avs'}, ...Rules.sideSeats(m, i).map(() => h('span', {class: 'av'}))), h('div', {class: 'who'}, h('div', {class: 'nm'}), h('div', {class: 'pk'})), h('div', {class: 'sc'})));
    }
    const cur = opts.turn != null ? opts.turn : Rules.current(m);
    const curSide = cur >= 0 ? Rules.side(m, cur) : -1;
    const standings = Rules.standings(m), top = m.scores[standings[0]];
    for (let i = 0; i < nS; i++) {
      const c = chips.children[i], seats = Rules.sideSeats(m, i), col = Rules.sideColor(m, i).hex;
      c.style.setProperty('--pc', col);
      const avs = c.querySelectorAll('.av');
      seats.forEach((si, k) => {
        const s = m.seats[si], a = avs[k];
        if (!a || !s) return;
        a.textContent = s.avatar || s.av || '🙂';
        a.style.setProperty('--pc', col);
        a.classList.toggle('cur', !!m.teams && si === cur && !m.over);
      });
      c.querySelector('.nm').textContent = Rules.sideName(m, i);
      const sc = c.querySelector('.sc');
      if (sc.textContent !== String(m.scores[i])) { sc.textContent = m.scores[i]; if (opts.bump) { sc.classList.remove('bump'); void sc.offsetWidth; sc.classList.add('bump'); } }
      const per = m.per * seats.length, left = Rules.sideLeft(m, i), pk = c.querySelector('.pk');
      if (pk.children.length !== per) { pk.innerHTML = ''; for (let k = 0; k < per; k++) pk.append(h('i')); }
      [...pk.children].forEach((d, k) => d.classList.toggle('used', k >= left));
      c.classList.toggle('turn', i === curSide && !m.over);
      c.classList.toggle('lead', m.scores[i] === top && top > 0);
      const off = seats.some(si => { const info = session && session.seats && session.seats[si]; return !!(info && info.kind === 'human' && info.online === false); });
      c.classList.toggle('off', off);
    }
    document.body.classList.toggle('challenge', !!m.challenge);
    const lv = m.challenge ? Challenges.level(m) : null;
    $('frameInfo').textContent = lv ? `${lv.name} · ${m.frame > 1 ? 0 : Math.max(0, Rules.left(m, 0))} kast kvar` : m.practice ? `${m.intro ? 'Lär dig spela' : 'Träning'} · ${Rules.left(m, 0)} puckar kvar` : `${m.cup ? m.cup.label + ' · ' : ''}${m.mode === 'hang' || m.mode === 'last' ? Rules.MODES[m.mode] + ' · ' : ''}Omgång ${m.frame} · först till ${m.target}`;
    H.mini();
  };
  // brickan för en spelare (i lag: lagets bricka)
  H.chipPos = seat => { const i = m ? Rules.side(m, seat) : seat; const c = $('chips').children[i]; if (!c) return null; const r = c.getBoundingClientRect(); return {x: r.left + r.width / 2, y: r.bottom}; };

  /* ---------- Vems tur ---------- */
  let bannerT = 0;
  // ms: göm skylten efter en stund (för egna turer, så att bordet syns)

      b.append(av);
      b.style.setProperty('--pc', colorOf(m, seat));

    b.append(h('span', null, text));
    b.classList.add('show');
  };

  /* ---------- Meddelanden mitt på skärmen ---------- */
  H.toast = (text, cls = '', ms = 1700) => {

  };
  // Text som svävar upp från en punkt på bordet
  H.float = (x, y, text, color, big = false) => {
    const p = Cam.toScreen(x, y, 0.03);

    f.style.left = p.x + 'px'; f.style.top = p.y + 'px'; f.style.setProperty('--pc', color || '#fff');

  /* ---------- Tips överst (blockerar inte siktet: tryck går rakt igenom) ---------- */

  let tipHide = null;

    if (tipHide) tipHide();

    document.body.classList.add('tipping');

    const hide = () => { if (done) return; done = true; if (tipHide === hide) tipHide = null; t.classList.add('out'); setTimeout(() => t.remove(), 400); document.body.classList.remove('tipping'); document.removeEventListener('pointerdown', early); };
    tipHide = hide;

  /* ---------- TV:n: hur man går med (i hörnet under matchen) ---------- */
  H.tvCode = code => {
    let t = $('tvCode');

    const site = (typeof SITE_URL !== 'undefined' ? SITE_URL : location.origin + location.pathname).replace(/^https?:\/\//, '').replace(/\/$/, '');
    t.innerHTML = '';

  };

  /* ---------- Repris ---------- */
  H.replayTag = on => {
    let t = $('replayTag');
    if (!t) { t = h('div', {id: 'replayTag'}, h('b', null, '● REPRIS'), h('span', null, 'tryck för att hoppa över')); $('hud').append(t); }
    t.classList.toggle('show', on);
    document.body.classList.toggle('replaying', on);
  };

  /* ---------- Tidsgräns (över nätet) ---------- */
  H.clock = sec => {
    const c = $('clock');
    if (sec == null) { c.classList.remove('show'); return; }
    c.classList.add('show');
    c.classList.toggle('low', sec <= 10);
    c.textContent = `0:${String(Math.max(0, Math.ceil(sec))).padStart(2, '0')}`;
  };

  /* ---------- Minikartan: poängzonerna ovanifrån ---------- */
  let live = null;     // puckar under ett kast: [{x, y, owner, id}]
  let leadIds = [];
  H.setLive = list => { live = list; H.mini(); };
  H.setLead = ids => { leadIds = ids || []; };
  // Zon 1 är lång men intressant bara vid linjerna: den trycks ihop (SQ) så att kartan blir kort och inte skymmer
  // figurerna vid bortre änden. Övriga delar i skala.
  const y0 = FOUL - 0.12, y1 = L + TABLE.END, SQ = 0.4, DZ = y1 - Z2;
  const mapD = y => { const d = y1 - y; return d <= DZ ? d : d <= y1 - FOUL ? DZ + (d - DZ) * SQ : DZ + (Z2 - FOUL) * SQ + (d - (y1 - FOUL)); };
  H.mini = () => {

    const dpr = Math.min(2, window.devicePixelRatio || 1);

    const g = cv.getContext('2d'), w = cv.width, hh = cv.height, s = w / (W + 0.06);

    const grad = g.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0, '#caa06a'); grad.addColorStop(.5, '#e3c08b'); grad.addColorStop(1, '#caa06a');
    g.fillStyle = grad; g.fillRect(X(-W / 2), Y(L), W * s, Y(y0) - Y(L));
    // zonerna
    g.fillStyle = 'rgba(255,90,130,.14)'; g.fillRect(X(-W / 2), Y(L), W * s, Y(Z3) - Y(L));
    g.fillStyle = 'rgba(255,200,90,.1)'; g.fillRect(X(-W / 2), Y(Z3), W * s, Y(Z2) - Y(Z3));
    g.fillStyle = 'rgba(30,18,8,.85)';
    [[Z3, 1.2], [Z2, 1.2], [FOUL, 2]].forEach(([yy, lw]) => g.fillRect(X(-W / 2), Y(yy) - lw * dpr / 2, W * s, lw * dpr));
    g.font = `700 ${Math.round(9 * dpr)}px Oswald, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = 'rgba(30,18,8,.6)';
    g.fillText('3', X(0), Y((L + Z3) / 2)); g.fillText('2', X(0), Y((Z3 + Z2) / 2)); g.fillText('1', X(0), Y((Z2 + FOUL) / 2));

  /* ---------- Pratbubblor och snabbmeddelanden ---------- */
  const EMOTES = ['👏', '😮', '😂', '🔥', '😅', '👍', '🎯', '😎'];
  const PHRASES = ['Snyggt!', 'Oj då!', 'Lycka till!', 'Bra match!', 'Hoppsan!', 'Nu kör vi!', 'Tur!', 'Tack för matchen!'];
  let emoteT = 0;
  H.initEmotes = () => {
    const p = $('emotePanel');
    p.innerHTML = '';
    EMOTES.forEach(e => p.append(h('button', {class: 'emo', onclick: () => sendEmote(e)}, e)));
    PHRASES.forEach(e => p.append(h('button', {onclick: () => sendEmote(e)}, e)));
    $('emoteBtn').onclick = () => { Sound.play('soft'); p.classList.toggle('show'); };
  };
  function closeEmotes() { const p = $('emotePanel'); if (p) p.classList.remove('show'); }
  function sendEmote(e) {
    closeEmotes();
    if (Date.now() - emoteT < 900) return;
    emoteT = Date.now();
    const seat = session ? session.mySeat() : -1;
    H.bubble(seat >= 0 ? seat : Rules.current(m), e);
    if (session) session.sendEmote(e);
  }
  H.bubble = (seat, text) => {
    const pos = seat >= 0 ? H.chipPos(seat) : {x: Scene.w / 2, y: Scene.h * .3};
    if (!pos) return;
    const isEmo = EMOTES.includes(text);
    const b = h('div', {class: 'bubble' + (isEmo ? ' emo' : '')}, text);
    // långa repliker bryts och hålls inom skärmen
    const edge = isEmo ? 50 : Math.min(Scene.w / 2, 140);
    b.style.left = clamp(pos.x, edge, Scene.w - edge) + 'px'; b.style.top = (pos.y + 8) + 'px';
    $('bubbles').append(b);
    Sound.play('emote');
    setTimeout(() => b.remove(), 3300);
  };
  document.addEventListener('pointerdown', e => { const p = $('emotePanel'); if (p && p.classList.contains('show') && !p.contains(e.target) && e.target !== $('emoteBtn')) closeEmotes(); });

  /* ---------- Omgångens resultat ---------- */
  H.frameResult = (mm, fe) => new Promise(res => {
    const pts = fe.points, order = Rules.standings(mm).sort((a, b) => mm.scores[b] - mm.scores[a] || pts[b] - pts[a]);
    const card = h('div', {class: 'card'},
      h('h2', null, `Omgång ${fe.frame} klar`),
      h('div', {class: 'big toast big', style: {animation: 'none', position: 'static'}}, fe.leader >= 0 ? `${Rules.sideName(mm, fe.leader)} +${pts[fe.leader]}` : 'Inga poäng'),
      h('div', {class: 'standings'}, order.map((i, k) => {
        const row = h('div', {class: 'row' + (k === 0 && mm.scores[i] > 0 ? ' win' : ''), style: {animationDelay: (k * 70) + 'ms'}},
          h('span', {class: 'pos'}, k + 1), sideAvs(mm, i),
          h('span', {class: 'nm'}, Rules.sideName(mm, i)), h('span', {class: 'plus'}, pts[i] ? `+${pts[i]}` : ''), h('span', {class: 'sc'}, mm.scores[i]));
        return row;
      })),
      h('p', {style: {margin: '12px 0 0', color: 'var(--ink3)', fontSize: '13px'}}, mm.over ? '' : mm.practice ? `Bästa träningsomgång: ${Math.max(Stats.practiceBest, pts[0] || 0)} poäng. Tryck för att fortsätta.` : `Först till ${mm.target}. Tryck för att fortsätta.`));
    const wrap = h('div', {class: 'result', onclick: () => close()}, card);
    $('ui').append(wrap);
    let done = false;
    const close = () => { if (done) return; done = true; wrap.classList.add('leaving'); wrap.style.animation = 'fadeOut .25s both'; setTimeout(() => wrap.remove(), 260); res(); };
    setTimeout(close, (mm.over ? 1800 : 3600) * Math.max(Time.scale, .05));
  });

  /* ---------- Konfetti ---------- */
  H.confetti = (colors) => {
    if (reduceMotion) return;
    const cv = h('canvas', {id: 'confetti'});
    document.body.append(cv);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    const g = cv.getContext('2d');
    const parts = Array.from({length: 160}, () => ({x: Math.random() * cv.width, y: -Math.random() * cv.height * .6, vx: (Math.random() - .5) * 2 * dpr, vy: (2 + Math.random() * 3) * dpr,
      r: Math.random() * 6.28, vr: (Math.random() - .5) * .3, s: (5 + Math.random() * 7) * dpr, c: pick(colors.concat(['#f5d693', '#ffffff', '#ff5a82']))}));
    const t0 = performance.now();
    const step = () => {
      const t = performance.now() - t0;
      g.clearRect(0, 0, cv.width, cv.height);
      parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .03 * dpr; p.r += p.vr; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.globalAlpha = Math.max(0, 1 - t / 5200); g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore(); });
      if (t < 5400) requestAnimationFrame(step); else cv.remove();
    };
    step();
  };
  return H;
})();

// Märken för det man gör i spelet (första hängaren, trippelträff, vinster i pubarna …). Vissa märken låser upp saker:

// i rad, trippelträff …) ges med event().
const Badges = (() => {
  const B = {};
  const got = () => Store.get('badges', {});
  const tourWon = pub => { const d = Tour.done(); return Object.keys(d).some(k => k.startsWith(pub + ':') && d[k]); };
  B.LIST = [
    {id: 'forsta', icon: '🥌', name: 'Första kastet', desc: 'Kasta din första puck.', test: () => Stats.throws >= 1},
    {id: 'intro', icon: '🎓', name: 'Elev', desc: 'Klara Lär dig spela.', test: () => !!Store.get('introDone')},
    {id: 'hangare', icon: '🎯', name: 'Första hängaren', desc: 'Häng en puck över kanten.', test: () => Stats.hangers >= 1},
    {id: 'hangrad', icon: '🔥', name: 'Två i rad', desc: 'Två hängare i rad.'},
    {id: 'hangare10', icon: '👑', name: 'Hängarkungen', desc: 'Tio hängare.', test: () => Stats.hangers >= 10},
    {id: 'trippel', icon: '💥', name: 'Trippelträff', desc: 'Slå ut tre puckar med ett kast.'},
    {id: 'utslag25', icon: '🥊', name: 'Utslagaren', desc: 'Slå ut 25 puckar.', test: () => Stats.knockouts >= 25},
    {id: 'storomg', icon: '🌋', name: 'Storomgång', desc: 'Ta åtta poäng eller mer i en omgång.'},
    {id: 'seger', icon: '🏆', name: 'Första segern', desc: 'Vinn en match.', test: () => Stats.wins >= 1},
    {id: 'comeback', icon: '🔄', name: 'Comeback', desc: 'Vinn efter att ha legat fem poäng efter.'},
    {id: 'stammis', icon: '🍻', name: 'Stammis', desc: 'Vinn tio matcher.', test: () => Stats.wins >= 10},
    {id: 'online', icon: '🌍', name: 'Världsvan', desc: 'Vinn en match online.', test: () => Stats.onlineWins >= 1},
    {id: 'hangjakt', icon: '🪝', name: 'Hängarjägaren', desc: 'Vinn en match i Hängarjakt.'},
    {id: 'sistkvar', icon: '🛡️', name: 'Sist kvar', desc: 'Vinn en match i Sist kvar.'},
    {id: 'austin', icon: '🤠', name: 'Yee-haw', desc: 'Slå en stamgäst i Austin.', test: () => tourWon('austin')},
    {id: 'dublin', icon: '🍀', name: 'Tur i Dublin', desc: 'Slå en stamgäst i Dublin.', test: () => tourWon('dublin')},
    {id: 'tokyo', icon: '🏮', name: 'Neon', desc: 'Slå en stamgäst i Tokyo.', test: () => tourWon('tokyo')},
    {id: 'mastare', icon: '🥇', name: 'Mästaren', desc: 'Slå Mästaren i pubturnén.', test: () => tourWon('final')},
    {id: 'stjarnor', icon: '⭐', name: 'Stjärnsamlaren', desc: 'Samla 20 stjärnor i utmaningarna.', test: () => Challenges.total() >= 20},
    {id: 'daglig', icon: '📅', name: 'Varje dag', desc: 'Dagens utmaning tre dagar i rad.', test: () => Challenges.streak() >= 3},
    {id: 'turnering', icon: '🏅', name: 'Kvällens vinnare', desc: 'Vinn en turnering på pubkvällen.'},
    {id: 'samlare', icon: '💎', name: 'Samlaren', desc: 'Ta tolv andra märken.', test: () => Object.keys(got()).filter(k => k !== 'samlare').length >= 12}
  ];
  // Det som går att låsa upp (badge = märket som behövs). puck och hat syns för alla, bord bara för en själv.
  B.ITEMS = {
    puck: [{id: 'klassisk', icon: '🥌', name: 'Klassisk'}, {id: 'figur', icon: '🙂', name: 'Din figur', badge: 'seger'}, {id: 'rander', icon: '🏁', name: 'Ränder', badge: 'online'},
      {id: 'svart', icon: '⚫', name: 'Svart krom', badge: 'utslag25'}, {id: 'guld', icon: '🟡', name: 'Guld', badge: 'hangare10'}, {id: 'stjarna', icon: '⭐', name: 'Stjärna', badge: 'stjarnor'}],
    hat: [{id: '', icon: '➖', name: 'Ingen'}, {id: 'x_hatt', icon: '🎩', name: 'Hög hatt', badge: 'stammis'}, {id: 'x_cowboy', icon: '🤠', name: 'Cowboyhatt', badge: 'austin'},
      {id: 'x_gronhatt', icon: '☘️', name: 'Grön hatt', badge: 'dublin'}, {id: 'x_krona', icon: '👑', name: 'Krona', badge: 'mastare'}, {id: 'x_medalj', icon: '🏅', name: 'Medalj', badge: 'turnering'}],
    bord: [{id: 'lonn', icon: '🪵', name: 'Lönn'}, {id: 'valnot', icon: '🟤', name: 'Valnöt', badge: 'intro'}, {id: 'korsbar', icon: '🍒', name: 'Körsbär', badge: 'tokyo'}, {id: 'ebenholts', icon: '⬛', name: 'Ebenholts', badge: 'samlare'}]
  };
  B.has = id => !!got()[id];
  B.count = () => Object.keys(got()).length;
  B.get = id => B.LIST.find(b => b.id === id);
  B.open = item => !item.badge || B.has(item.badge);
  // spelarens val (bara det som är upplåst gäller)
  B.cos = () => {
    const c = Object.assign({puck: 'klassisk', hat: '', bord: 'lonn'}, Profile.cos || {});
    for (const k of ['puck', 'hat', 'bord']) { const it = B.ITEMS[k].find(i => i.id === c[k]); if (!it || !B.open(it)) c[k] = B.ITEMS[k][0].id; }
    return c;
  };
  B.seatCos = () => { const c = B.cos(); return {puck: c.puck, hat: c.hat}; };
  // (det en annan spelare skickar över nätet: bara kända saker)
  B.cleanCos = c => c && typeof c === 'object' ? {puck: B.ITEMS.puck.some(i => i.id === c.puck) ? c.puck : 'klassisk', hat: B.ITEMS.hat.some(i => i.id === c.hat) ? c.hat : ''} : null;
  B.setCos = (kind, id) => { Profile.cos = Object.assign({}, Profile.cos || {}, {[kind]: id}); saveProfile(); Bus.emit('cos'); };

  /* ---------- Ett nytt märke: en ruta överst, klockan och speakern ---------- */
  const queue = [];
  let showing = false;
  B.unlock = (id, quiet = false) => {
    const b = B.get(id);
    if (!b || B.has(id)) return false;
    const g = got(); g[id] = Date.now(); Store.set('badges', g);
    if (!quiet) { queue.push(b); pump(); }
    if (id !== 'samlare') setTimeout(() => B.check(quiet), 60);
    return true;
  };
  const rewardOf = id => [].concat(...Object.values(B.ITEMS)).find(i => i.badge === id);
  function pump() {
    if (showing || !queue.length) return;
    showing = true;
    const b = queue.shift(), r = rewardOf(b.id);
    const el = h('div', {class: 'badgetoast'}, h('span', {class: 'bicon'}, b.icon),
      h('div', null, h('small', null, 'Nytt märke'), h('b', null, b.name), r ? h('span', {class: 'reward'}, 'Upplåst: ' + r.name) : null));
    document.body.append(el);
    Sound.play('bell');
    Sound.announce(['marke'], 1);
    setTimeout(() => el.classList.add('out'), 3400);
    setTimeout(() => { el.remove(); showing = false; pump(); }, 3900);
  }
  // Märken som hänger på statistiken. quiet: utan rutor (t.ex. vid starten efter en uppdatering); returnerar antalet nya.
  B.check = (quiet = false) => {
    let n = 0;
    for (const b of B.LIST) if (b.test && !B.has(b.id)) { try { if (b.test() && B.unlock(b.id, quiet)) n++; } catch (e) { /* hoppa över */ } }
    return n;
  };
  B.event = id => B.unlock(id);
  return B;
})();

// Renderad bakgrund på startskärmen (av: den levande 3D-puben är snyggare och neonskylten krockar med loggan)

const Menu = (() => {

  // Bordet man sitter vid just nu (väntrummet). Lämnas innan man går med i eller skapar ett annat.
  let current = null;
  function leaveCurrent() {
    const s = current || Game.session();
    current = null;
    joinSeq++;
    if (Game.running()) Game.stop(false);
    if (s && s.role !== 'local') { try { s.leave(); } catch (e) { /* ok */ } }
  }
  M.leaveCurrent = leaveCurrent;
  M.forget = s => { if (current === s) current = null; };
  let joinSeq = 0;
  const ui = () => $('ui');
  const SITE = typeof SITE_URL !== 'undefined' ? SITE_URL : location.origin + location.pathname;

  /* ---------- Byggstenar ---------- */
  function show(el) {
    closeSheets();
    if (roomCleanup) { roomCleanup(); roomCleanup = null; }
    if (onlineCleanup) { onlineCleanup(); onlineCleanup = null; }
    const old = screen;
    screen = el;

    Scene.paused = !!(el && (el.classList.contains('has-hero') || el.classList.contains('full')));
