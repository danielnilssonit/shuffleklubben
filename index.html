      baked = true;
    } else if (m.ao != null) {
      const ao = new Uint8Array(bin, m.ao, vc);
      for (let i = 0; i < vc; i++) { const a = ao[i] / 255; col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = a; }
    } else col.fill(1);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    if (m.uv != null) {
      const qu = new Uint16Array(bin, m.uv, vc * 2), uv = new Float32Array(vc * 2);
      for (let i = 0; i < vc * 2; i++) uv[i] = qu[i] / 65535;
      g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    }
    const idx = m.i16 ? new Uint16Array(new Uint16Array(bin, m.idx, m.ic)) : new Uint32Array(new Uint32Array(bin, m.idx, m.ic));
    g.setIndex(new THREE.BufferAttribute(idx, 1));
    const local = {}, order = [];
    m.g.forEach(([start, count, mat]) => {
      if (!(mat in local)) { local[mat] = order.length; order.push(mat); }
      g.addGroup(start, count, local[mat]);
    });
    g.userData.mats = order;
    g.userData.baked = baked;
    g.computeBoundingSphere();
    return (geoCache[mi] = g);
  }

  const matCache = {};
  // Standardmaterial: inbakat ljus ritas utan ljuskällor (färgen i hörnen är det färdiga ljuset), lysande delar
  // lyser, och resten (pucken) får riktiga material som reagerar på lamporna.
  function material(i, baked, opts) {
    const d = data.materials[i];
    if (opts.material) { const m = opts.material(d, baked); if (m) return m; }
    const recolor = d.rc && opts.colors && opts.colors[d.rc];
    const key = i + '|' + baked + '|' + (recolor || '');
    if (matCache[key]) return matCache[key];
    let m;
    if (d.e && d.ei > 0) {
      m = new THREE.MeshBasicMaterial({color: new THREE.Color(d.e).multiplyScalar(Math.max(1, d.ei)), toneMapped: true});
    } else if (baked) {
      m = new THREE.MeshBasicMaterial({vertexColors: true});
    } else {
      const P = {color: recolor || d.c, roughness: d.r, metalness: d.m, vertexColors: true, envMapIntensity: d.m > .5 ? 1 : .6};
      m = d.cc > 0 ? new THREE.MeshPhysicalMaterial(Object.assign(P, {clearcoat: d.cc, clearcoatRoughness: .15})) : new THREE.MeshStandardMaterial(P);
    }
    if (d.op < 1) { m.transparent = true; m.opacity = d.op; m.depthWrite = false; }
    if (d.ds) m.side = THREE.DoubleSide;
    m.name = d.n;
    return (matCache[key] = m);
  }

  // Inbakade delar ritas alla med samma material (färgen och ljuset ligger i hörnen). De slås ihop till en enda
  // grupp per mesh, så att puben ritas med få anrop (viktigt i telefoner). Lysande, genomskinliga och speciella
  // delar (spelytan, tavlan, neon) behåller egna grupper.
  const SPECIAL = /^(Spelyta|Tavla|Lampa)/;
  const plainBaked = d => !(d.e && d.ei > 0) && !(d.op < 1) && !d.ds && !SPECIAL.test(d.n);
  const mergedCache = {};
  let sharedBaked = null;
  function merged(mi) {
    if (mergedCache[mi]) return mergedCache[mi];
    const src = geometry(mi);
    const m = data.meshes[mi];
    const idx = src.index.array, plain = [], rest = [];
    m.g.forEach(([start, count, mat]) => (plainBaked(data.materials[mat]) ? plain : rest).push({start, count, mat}));
    if (plain.length < 2) return (mergedCache[mi] = src);
    const out = new (idx.constructor)(idx.length);
    let o = 0;
    const g = new THREE.BufferGeometry();
    ['position', 'normal', 'color', 'uv'].forEach(k => { if (src.attributes[k]) g.setAttribute(k, src.attributes[k]); });
    const mats = [null];
    plain.forEach(p => { out.set(idx.subarray(p.start, p.start + p.count), o); o += p.count; });
    g.addGroup(0, o, 0);
    rest.forEach(p => { const s0 = o; out.set(idx.subarray(p.start, p.start + p.count), o); o += p.count; g.addGroup(s0, p.count, mats.length); mats.push(p.mat); });
    g.setIndex(new THREE.BufferAttribute(out, 1));
    g.userData.mats = mats;
    g.userData.baked = true;
    g.boundingSphere = src.boundingSphere;
    return (mergedCache[mi] = g);
  }

  // Skapar en modell. opts.material(info, baked) kan ge egna material för vissa delar (t.ex. spelytan).
  // Noderna nås via root.userData.nodes[namn].
  L.create = (name, opts = {}) => {
    const nodes = data && data.models[name];
    if (!nodes) return null;
    const objs = [];
    nodes.forEach(n => {
      const o = new THREE.Group();
      o.name = n.n;
      o.position.fromArray(n.t);
      o.quaternion.fromArray(n.q);
      o.scale.fromArray(n.s);
      if (n.m >= 0) {
        const g0 = geometry(n.m);
        const g = g0.userData.baked ? merged(n.m) : g0;
        const mats = g.userData.mats.map(mi => mi === null ? (sharedBaked || (sharedBaked = Object.assign(new THREE.MeshBasicMaterial({vertexColors: true}), {name: 'Bakad'}))) : material(mi, g.userData.baked, opts));
        const mesh = new THREE.Mesh(g, mats.length === 1 ? mats[0] : mats);
        mesh.name = n.n + '_mesh';
        o.add(mesh);
      }
      if (n.p >= 0) objs[n.p].add(o);
      objs.push(o);
    });
    const root = objs[0];
    root.userData.nodes = {};
    objs.forEach(o => { root.userData.nodes[o.name] = o; });
    return root;
  };
  L.meshesWith = (root, test) => {
    const out = [];
    root.traverse(o => { if (o.isMesh) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if (test(m.name || '')) out.push(o); }); });
    return out;
  };
  return L;
})();

/* ---- 06-scene.js ---- */
/* ================= 3D-scenen: puben, bordet och lamporna ================= */
// Världen: X åt sidan, Y uppåt (golvet = 0), Z = -y (bordet sträcker sig bort från kameran mot -Z).
// Puben och bordets skåp kommer från Blender med inbakat ljus. Spelytan byggs här: blankt lönnträ med
// linjer och siffror, riktiga lampor för puckarna och speglingar av puckarna i lacken.
const Scene = (() => {
  const S = {};
  const {L, W, TOP, R} = TABLE;
  let renderer, scene, camera, pmrem = null, envMap = null;
  S.quality = 'high';
  S.lamps = [0.9, 2.6, 4.3, 6.0];
  S.LAMP_I = 1.25;
  S.LAMP_H = 1.78;
  S.world = (x, y, h = 0) => new THREE.Vector3(x, TOP + h, -y);

  S.init = canvas => {
    const q = Settings.quality;
    const weak = /Android [4-8]\b/.test(navigator.userAgent) || (navigator.deviceMemory && navigator.deviceMemory < 3);
    S.quality = q === 'low' ? 'low' : q === 'high' ? 'high' : (weak ? 'low' : 'high');
    renderer = new THREE.WebGLRenderer({canvas, antialias: false, alpha: false, stencil: true, powerPreference: 'high-performance', preserveDrawingBuffer: false});
    renderer.physicallyCorrectLights = true;
    renderer.setClearColor(0x0b0806, 1);
    S.dpr = Math.min(window.devicePixelRatio || 1, S.quality === 'low' ? 1.25 : 2);
    renderer.setPixelRatio(S.dpr);
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0806);
    scene.fog = new THREE.Fog(0x0e0a07, 10, 26);
    camera = new THREE.PerspectiveCamera(50, 1, 0.02, 60);
    S.renderer = renderer; S.scene = scene; S.camera = camera;
    S.post = S.quality !== 'low' && Post.init(renderer);
    if (!S.post) { renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0; renderer.outputEncoding = THREE.sRGBEncoding; }
    buildLights();
    const hasModels = ModelLib.init() && ModelLib.has('room') && ModelLib.has('table');
    if (hasModels) buildFromModels(); else buildFallback();
    buildPlayfield();
    buildLampFx();
    S.resize();
    window.addEventListener('resize', () => S.resize());
    // Miljön för speglingarna (krom och lack) fotograferas från bordet när allt är på plats
    setTimeout(() => S.captureEnv(), 30);
  };

  S.resize = () => {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    if (S.post) Post.setSize(Math.round(w * S.dpr), Math.round(h * S.dpr));
    S.w = w; S.h = h;
  };
  S.setDpr = d => { S.dpr = d; renderer.setPixelRatio(d); S.resize(); };

  /* ---------- Ljus ---------- */
  S.lights = [];
  function buildLights() {
    const hemi = new THREE.HemisphereLight(0xffd9b0, 0x1a1008, 0.18);
    scene.add(hemi);
    S.lamps.forEach(y => {
      const p = new THREE.PointLight(0xffc98f, S.LAMP_I, 0, 2);
      p.position.set(0, S.LAMP_H, -y);
      scene.add(p);
      S.lights.push(p);
    });
    // svagt kallt ljus från fönstren på höger sida
    const d = new THREE.DirectionalLight(0x6f8cff, 0.12);
    d.position.set(4, 3, -3);
    scene.add(d);
  }

  /* ---------- Miljökarta för speglingar ---------- */
  S.captureEnv = () => {
    try {
      // halvflyttal bara om det går att rita till dem (annars blir miljökartan svart i vissa äldre telefoner)
      const gl = renderer.getContext();
      const half = renderer.capabilities.isWebGL2 ? !!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float'))
        : !!(renderer.extensions.get('OES_texture_half_float') && renderer.extensions.get('EXT_color_buffer_half_float'));
      const rt = new THREE.WebGLCubeRenderTarget(S.quality === 'low' ? 128 : 256, {format: THREE.RGBAFormat, type: half ? THREE.HalfFloatType : THREE.UnsignedByteType, generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter});
      const cc = new THREE.CubeCamera(0.05, 40, rt);
      cc.position.set(0, TOP + 0.25, -L * 0.62);
      scene.add(cc);
      const hidden = [];
      scene.traverse(o => { if (o.userData.noEnv && o.visible) { hidden.push(o); o.visible = false; } });
      const oldTM = renderer.toneMapping, oldEnc = renderer.outputEncoding;
      renderer.toneMapping = THREE.NoToneMapping; renderer.outputEncoding = THREE.LinearEncoding;
      cc.update(renderer, scene);
      renderer.toneMapping = oldTM; renderer.outputEncoding = oldEnc;
      hidden.forEach(o => { o.visible = true; });
      scene.remove(cc);
      pmrem = pmrem || new THREE.PMREMGenerator(renderer);
      const env = pmrem.fromCubemap(rt.texture).texture;
      rt.dispose();
      envMap = env;
      scene.traverse(o => { if (o.isMesh) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if (m.isMeshStandardMaterial && m.userData.env !== false) { m.envMap = env; m.needsUpdate = true; } }); });
      Bus.emit('env', env);
    } catch (e) { console.warn('Ingen miljökarta:', e); }
  };
  S.env = () => envMap;
  // Neonskyltens bokstäver i en annan färg (pubturnén), null = den vanliga rosa
  S.setNeon = hex => {
    S.neon.forEach(m => {
      if (m.name !== 'NeonRosa') return;
      m.userData.base = hex ? new THREE.Color(hex).convertSRGBToLinear().multiplyScalar(m.userData.ei * 1.25) : m.userData.orig.clone();
      m.color.copy(m.userData.base);
    });
  };

  /* ---------- Puben från Blender ---------- */
  S.neon = [];
  // Glas och lysande kupor ritas utan ljuskällor, men med en enkel fresnel: flaskorna får mörk mättad kropp,
  // ljusa kanter och en reflex (läses som glas i stället för platta färgytor) och lampkuporna blir runda glober.
  const GLASS = {
    glass: 'diffuseColor.rgb = diffuseColor.rgb * (0.3 + 0.38 * gF + 0.85 * gRim) + vec3(1., .93, .82) * gHi * 0.26;',
    clear: 'diffuseColor.rgb = diffuseColor.rgb * (0.07 + 0.1 * gF + 0.95 * gRim) + vec3(1., .95, .88) * gHi * 0.36;',
    glow: 'diffuseColor.rgb *= 0.35 + 0.85 * pow(gF, 1.2);',
  };
  const glassCache = {};
  function glassMat(d, kind, gain) {
    if (glassCache[d.n]) return glassCache[d.n];
    const m = new THREE.MeshBasicMaterial({color: new THREE.Color(d.e || d.c).convertSRGBToLinear().multiplyScalar(gain)});
    m.onBeforeCompile = sh => {
      const decl = '#include <common>\nvarying vec3 vNv;\nvarying vec3 vVp;';
      sh.vertexShader = sh.vertexShader.replace('#include <common>', decl)
        .replace('#include <project_vertex>', '#include <project_vertex>\n  vNv = normalize(normalMatrix * normal);\n  vVp = -mvPosition.xyz;');
      sh.fragmentShader = sh.fragmentShader.replace('#include <common>', decl)
        .replace('#include <color_fragment>', `#include <color_fragment>
  {
    vec3 gN = normalize(vNv), gV = normalize(vVp);
    float gF = clamp(abs(dot(gN, gV)), 0., 1.);
    float gRim = pow(1. - gF, 2.5);
    float gHi = (1. - smoothstep(.03, .15, abs(gN.x - .38)) + .45 * (1. - smoothstep(.02, .1, abs(gN.x + .56)))) * gF;
    ${GLASS[kind]}
  }`);
    };
    m.customProgramCacheKey = () => 'sk-glass-' + kind;
    m.name = d.n;
    return (glassCache[d.n] = m);
  }
  function buildFromModels() {
    const special = (d, baked) => {
      if (/^Flaska/.test(d.n)) return glassMat(d, /Klar/.test(d.n) ? 'clear' : 'glass', /Klar/.test(d.n) ? 0.9 : /Brun/.test(d.n) ? 0.75 : 1.4);
      if (d.n === 'Öl') return glassMat(d, 'glass', 3.2);
      if (d.n === 'Barkupa') return glassMat(d, 'glow', Math.max(1, d.ei) * 0.8);
      if (d.n === 'Spelyta') return new THREE.MeshBasicMaterial({visible: false});
      if (d.n === 'Tavla') return S.board.material;
      // neonrören (inte den mörka plåten bakom dem, den är vanlig bakad yta): mättad färg som blommar ut
      if (/^Neon/.test(d.n) && d.e && d.ei > 0) { const m = new THREE.MeshBasicMaterial({color: new THREE.Color(d.e).convertSRGBToLinear().multiplyScalar(d.ei * 1.25)}); m.name = d.n; m.userData.base = m.color.clone(); m.userData.orig = m.color.clone(); m.userData.ei = d.ei; S.neon.push(m); return m; }
      if (d.n === 'Lampa') return new THREE.MeshBasicMaterial({color: new THREE.Color(d.e || '#ffd9a0').multiplyScalar(Math.max(4, d.ei || 8))});
      return null;
    };
    makeBoard();
    const room = ModelLib.create('room', {material: special});
    const table = ModelLib.create('table', {material: special});
    [room, table].forEach(o => { o.traverse(c => { if (c.isMesh) { c.matrixAutoUpdate = false; c.updateMatrix(); } }); scene.add(o); });
    const sp = table.userData.nodes.spelyta;
    if (sp) sp.visible = false;
    S.room = room; S.table = table;
  }

  /* ---------- Reserv: en enkel pub byggd i koden ---------- */
  function buildFallback() {
    makeBoard();
    const std = (c, r = .6, m = 0) => new THREE.MeshStandardMaterial({color: c, roughness: r, metalness: m});
    const walnut = std(0x4a2a17, .45), dark = std(0x16110d, .9), brass = std(0xc79a4a, .3, 1);
    const add = (geo, mat, x, y, z) => { const o = new THREE.Mesh(geo, mat); o.position.set(x, y, z); scene.add(o); return o; };
    const floorMat = std(0x2b1a10, .8);
    add(new THREE.PlaneGeometry(9, 14).rotateX(-Math.PI / 2), floorMat, 0.2, 0, -L / 2);
    const wallMat = std(0x1f3a2c, .85), brick = std(0x5a2a1c, .9);
    add(new THREE.PlaneGeometry(9, 3.2), brick, 0.2, 1.6, -9.4);
    add(new THREE.PlaneGeometry(14, 3.2).rotateY(Math.PI / 2), wallMat, -3.2, 1.6, -L / 2);
    add(new THREE.PlaneGeometry(14, 3.2).rotateY(-Math.PI / 2), wallMat, 3.6, 1.6, -L / 2);
    // bordet
    const len = L + 0.42, zc = -L / 2;
    add(new THREE.BoxGeometry(0.788, 0.22, len), walnut, 0, 0.63, zc);
    [-1, 1].forEach(s => {
      add(new THREE.BoxGeometry(0.095, 0.01, len), dark, s * 0.3015, TOP - TABLE.DROP, zc);
      add(new THREE.BoxGeometry(0.045, 0.1, len), walnut, s * 0.3715, TOP - 0.03, zc);
      [0.35, 2.35, 4.35, 6.35].forEach(y => add(new THREE.BoxGeometry(0.075, 0.52, 0.075), walnut, s * 0.32, 0.26, -y));
    });
    add(new THREE.BoxGeometry(W, 0.075, L), std(0xd8b27a, .5), 0, TOP - 0.0376, zc);
    [[-0.08, 0.05], [L + 0.08, 0.05]].forEach(([y]) => add(new THREE.BoxGeometry(W + 0.19, 0.01, 0.16), dark, 0, TOP - TABLE.DROP, -y));
    [-0.185, L + 0.185].forEach(y => add(new THREE.BoxGeometry(0.788, 0.13, 0.05), walnut, 0, TOP + 0.01, -y));
    // tavlan på bortre väggen
    const b = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.7), S.board.material);
    b.position.set(0, 1.62, -9.38); scene.add(b);
    const frame = add(new THREE.BoxGeometry(1.52, 0.82, 0.04), walnut, 0, 1.62, -9.41);
    frame.renderOrder = -1;
    // lampor
    S.lamps.forEach(y => {
      const shade = add(new THREE.ConeGeometry(0.18, 0.2, 24, 1, true), std(0x1d5a3a, .4), 0, S.LAMP_H + 0.08, -y);
      shade.material.side = THREE.DoubleSide;
      add(new THREE.SphereGeometry(0.04, 12, 8), new THREE.MeshBasicMaterial({color: new THREE.Color(0xffe0b0).multiplyScalar(6)}), 0, S.LAMP_H + 0.02, -y);
      add(new THREE.CylinderGeometry(0.004, 0.004, 1.2, 6), dark, 0, S.LAMP_H + 0.75, -y);
    });
    add(new THREE.BoxGeometry(0.02, 0.02, 0.02), brass, 0, 0, 0);
  }

  /* ---------- Poängtavlan på väggen ---------- */
  function makeBoard() {
    if (S.board) return;
    const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = 4;
    const material = new THREE.MeshBasicMaterial({map: tex, color: new THREE.Color(1.6, 1.6, 1.6)});
    S.board = {canvas: c, ctx: c.getContext('2d'), tex, material};
    S.drawBoard(null);
  }
  // Tavlan visar ställningen (och "Shuffleklubben" när ingen match pågår)
  S.drawBoard = m => {
    const B = S.board;
    if (!B) return;
    const g = B.ctx, w = B.canvas.width, hh = B.canvas.height;
    g.fillStyle = '#0d1411'; g.fillRect(0, 0, w, hh);
    const grad = g.createRadialGradient(w / 2, hh / 2, 50, w / 2, hh / 2, w * .7);
    grad.addColorStop(0, 'rgba(40,70,55,.55)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad; g.fillRect(0, 0, w, hh);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    if (!m) {
      // i menyerna ligger loggan framför tavlan: bara en tom resultattavla med svaga rader
      const keys = ['red', 'blue', 'gold', 'green'];
      g.strokeStyle = 'rgba(243,223,184,.14)'; g.lineWidth = 3;
      g.beginPath(); g.moveTo(90, 86); g.lineTo(w - 90, 86); g.stroke();
      keys.forEach((k, i) => {
        const y = 86 + (i + 0.5) * ((hh - 120) / 4);
        g.globalAlpha = .45; g.fillStyle = Rules.COLORS[k].hex;
        g.beginPath(); g.arc(120, y, 16, 0, Math.PI * 2); g.fill();
        g.globalAlpha = 1; g.fillStyle = 'rgba(243,223,184,.10)'; g.fillRect(160, y - 4, w - 360, 8);
        g.fillStyle = 'rgba(243,223,184,.18)'; g.fillRect(w - 170, y - 22, 60, 44);
      });
    } else {
      // en rad per sida (spelare eller lag)
      const n = Rules.sides(m), rowH = Math.min(110, (hh - 90) / n);
      g.fillStyle = 'rgba(243,223,184,.75)'; g.font = '600 42px Georgia, serif';
      const pub = m.tour ? Tour.PUBS[m.tour.pub] : null;
      g.fillText(m.practice ? 'Träning' : pub ? `${pub.name}  ·  omgång ${m.frame}` : `Omgång ${m.frame}  ·  först till ${m.target}`, w / 2, 50);
      for (let i = 0; i < n; i++) {
        const y = 110 + i * rowH + rowH / 2, col = Rules.sideColor(m, i).hex;
        g.fillStyle = col; g.beginPath(); g.arc(120, y, 26, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#f3dfb8'; g.textAlign = 'left';
        const name = Rules.sideName(m, i).slice(0, 28);
        let fs = 58;
        g.font = `700 ${fs}px Georgia, serif`;
        while (fs > 34 && g.measureText(name).width > w - 400) { fs -= 4; g.font = `700 ${fs}px Georgia, serif`; }
        g.fillText(name, 175, y + 2);
        g.textAlign = 'right'; g.font = '700 78px Georgia, serif';
        g.fillText(String(m.scores[i]), w - 90, y + 4);
        g.textAlign = 'center';
      }
    }
    B.tex.needsUpdate = true;
  };

  /* ---------- Spelytan: lönn med linjer ---------- */
  // Tre delar: närmsta änden (där man kastar), mitten och bortre änden (zonerna). Varje del har sin egen bild.
  // Bordsytan kan bytas (upplåsta ytor, Badges.ITEMS.bord): träets ton, ådringen och linjernas färg.
  S.play = null;
  const FINISH = {
    lonn: {base: [226, 190, 136], grain: [110, 64, 28], mark: [22, 14, 8], logo: 'rgba(90,50,20,.22)', lip: 0xd9b47e, warm: 1},
    valnot: {base: [128, 86, 56], grain: [48, 26, 12], mark: [246, 228, 196], logo: 'rgba(250,230,200,.16)', lip: 0x7a5236, warm: .6},
    korsbar: {base: [184, 104, 70], grain: [92, 38, 20], mark: [30, 12, 6], logo: 'rgba(70,24,10,.24)', lip: 0xb0633f, warm: .8},
    ebenholts: {base: [46, 40, 38], grain: [14, 10, 10], mark: [236, 196, 120], logo: 'rgba(236,196,120,.2)', lip: 0x322a27, warm: .3}
  };
  let fin = FINISH.lonn, finId = 'lonn';
  function woodCanvas(cw, ch, lenM, seed, marks) {
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    const g = c.getContext('2d');
    const rnd = seeded(seed);
    const pxPerM = ch / lenM, strips = 10, sw = cw / strips;
    // limmade lönnlameller med lite olika ton
    const [br, bg, bb] = fin.base, [gr0, gg0, gb0] = fin.grain;
    for (let s = 0; s < strips; s++) {
      const t = 0.93 + rnd() * 0.12, warm = rnd() * 10 * fin.warm;
      g.fillStyle = `rgb(${Math.round(br * t)},${Math.round((bg - warm) * t)},${Math.round((bb - warm * 1.5) * t)})`;
      g.fillRect(Math.floor(s * sw), 0, Math.ceil(sw) + 1, ch);
      // ådring längs bordet
      const lines = 16 + Math.floor(rnd() * 10);
      for (let i = 0; i < lines; i++) {
        const x0 = s * sw + rnd() * sw, amp = (0.4 + rnd() * 2.2) * cw / 512, per = (0.25 + rnd() * 0.9) * pxPerM, ph = rnd() * 6.28;
        const a = 0.025 + rnd() * 0.08, lw = (0.5 + rnd() * 1.6) * cw / 512;
        g.strokeStyle = `rgba(${gr0 + rnd() * 40 | 0},${gg0 + rnd() * 30 | 0},${gb0 + rnd() * 20 | 0},${a})`;
        g.lineWidth = lw;
        g.beginPath();
        for (let y = 0; y <= ch; y += 24) {
          const x = Math.min(s * sw + sw - 1, Math.max(s * sw + 1, x0 + Math.sin(y / per + ph) * amp + Math.sin(y / (per * 0.31) + ph * 2) * amp * 0.3));
          if (y === 0) g.moveTo(x, y); else g.lineTo(x, y);
        }
        g.stroke();
      }
      // små porer
      g.fillStyle = 'rgba(90,50,20,.09)';
      for (let i = 0; i < ch / 6; i++) g.fillRect(s * sw + rnd() * sw, rnd() * ch, Math.max(1, cw / 900), (2 + rnd() * 6) * ch / 4096);
      // skarven mellan lamellerna
      g.fillStyle = 'rgba(70,40,15,.12)';
      g.fillRect(Math.floor(s * sw), 0, Math.max(1, cw / 700), ch);
    }
    // lockig lönn: svaga tvärgående band
    for (let i = 0; i < ch / 18; i++) {
      const y = rnd() * ch, hgt = (2 + rnd() * 7) * ch / 4096;
      g.fillStyle = rnd() < .5 ? `rgba(255,240,210,${0.02 + rnd() * .035})` : `rgba(120,70,30,${0.015 + rnd() * .03})`;
      g.fillRect(0, y, cw, hgt);
    }
    // silikonpulver: små ljusa korn, mest i ändarna
    for (let i = 0; i < ch * 1.2; i++) {
      g.fillStyle = `rgba(255,255,255,${0.04 + rnd() * .1})`;
      const s2 = Math.max(1, cw / 600);
      g.fillRect(rnd() * cw, rnd() * ch, s2, s2);
    }

  // Linjer och siffror. yTop = bordets y vid bildens överkant (bortre änden av delen).
  function drawMarks(g, cw, ch, pxPerM, yTop, flip) {
    const row = y => (yTop - y) * pxPerM;
    const mk = a => `rgba(${fin.mark[0]},${fin.mark[1]},${fin.mark[2]},${a})`;
    const line = (y, wMM, alpha = .88) => { const r = row(y), lw = wMM / 1000 * pxPerM; g.fillStyle = mk(alpha); g.fillRect(0, r - lw / 2, cw, lw); };

      g.font = `700 ${Math.round(px)}px Georgia, "Times New Roman", serif`;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = px * 0.06; g.strokeStyle = mk(.9); g.fillStyle = mk(.82);
      g.fillText(txt, 0, px * 0.04);
      g.restore();
    };
    const E = flip ? 0 : L, dir = flip ? 1 : -1;
    line(E + dir * 0.1524, 4);
    line(E + dir * 0.3048, 4);
    line(E + dir * 1.8288, 6);
    // tunn linje precis vid kanten
    g.fillStyle = mk(.35); g.fillRect(0, row(E - dir * 0.001) - 1, cw, 2);

    num('2', E + dir * 0.2286, 0.085);
    num('1', E + dir * 0.62, 0.11);
    // små pärlemorprickar vid foul-linjen att sikta med

      const cx = (x / W + 0.5) * cw, cy = row(E + dir * 1.95), rr = 0.006 * pxPerM;
      const gr = g.createRadialGradient(cx, cy, 0, cx, cy, rr);
      gr.addColorStop(0, 'rgba(255,255,250,.95)'); gr.addColorStop(.7, 'rgba(220,225,235,.8)'); gr.addColorStop(1, 'rgba(120,110,100,.6)');

    });
  }
  const endLen = 2.2, midLen = L - 2 * endLen;
  // bilderna för de tre delarna (närmst, mitten, bortre)
  function playCanvases() {
    const hq = S.quality !== 'low';
    const farC = woodCanvas(hq ? 1024 : 512, hq ? 4096 : 2048, endLen, 11, (g, cw, ch, ppm) => drawMarks(g, cw, ch, ppm, L, false));
    const nearC = woodCanvas(hq ? 1024 : 512, hq ? 4096 : 2048, endLen, 23, (g, cw, ch, ppm) => drawMarks(g, cw, ch, ppm, endLen, true));
    const midC = woodCanvas(512, 2048, midLen, 37, (g, cw, ch, ppm) => {
      // klubbens märke mitt på bordet, svagt inbränt
      g.save(); g.translate(cw / 2, ch / 2); g.rotate(-Math.PI / 2);
      g.font = `italic 700 ${Math.round(0.11 * ppm)}px Georgia, serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = fin.logo; g.fillText('Shuffleklubben', 0, 0);
      g.restore();
    });
    return [nearC, midC, farC];
  }
  function woodTex(canvas) {
    const tex = new THREE.CanvasTexture(canvas);
    tex.encoding = THREE.sRGBEncoding; tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    tex.minFilter = THREE.LinearMipmapLinearFilter;

  }

    if (!FINISH[id]) id = 'lonn';
    if (id === finId || !S.play) { fin = FINISH[id]; finId = id; return; }
    fin = FINISH[id]; finId = id;
    playCanvases().forEach((c, i) => { const mat = S.play[i].material, old = mat.map; mat.map = woodTex(c); mat.needsUpdate = true; if (old) old.dispose(); });
    if (lipMat) lipMat.color.set(fin.lip).convertSRGBToLinear();
  };
  S.finish = () => finId;
  function buildPlayfield() {
    const [nearC, midC, farC] = playCanvases();

    // lampornas ljus mjukt i stället för en skarp skarv. Pucken ramlar när dess mitt passerar listens topp.
    const lipR = 0.008;
    lipMat = new THREE.MeshStandardMaterial({color: new THREE.Color(fin.lip).convertSRGBToLinear(), roughness: 0.3, metalness: 0, envMapIntensity: 0.32});
    [-1, 1].forEach(sd => {
      const geo = new THREE.CylinderGeometry(lipR, lipR, L, 12, 1, false, sd > 0 ? 0 : Math.PI, Math.PI);
      geo.rotateX(-Math.PI / 2);
      const lip = new THREE.Mesh(geo, lipMat);
      lip.name = 'kantlist';
      lip.position.set(sd * W / 2, TOP - lipR, -L / 2);
      lip.matrixAutoUpdate = false; lip.updateMatrix();
      scene.add(lip);

  /* ---------- Ljuskäglor och damm i lampornas ljus ---------- */
  let dust = null;
  function buildLampFx() {
    if (S.quality === 'low') return;
    const coneMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
      uniforms: {k: {value: 0.05}},
      vertexShader: 'varying float vH; varying vec3 vN; varying vec3 vV; void main(){ vH = uv.y; vec4 wp = modelViewMatrix * vec4(position,1.); vN = normalize(normalMatrix * normal); vV = normalize(-wp.xyz); gl_Position = projectionMatrix * wp; }',
      fragmentShader: 'uniform float k; varying float vH; varying vec3 vN; varying vec3 vV; void main(){ float rim = pow(abs(dot(vN, vV)), 1.6); float a = k * rim * smoothstep(0., .9, vH) * (0.35 + 0.65 * vH); gl_FragColor = vec4(vec3(1.0, .82, .6) * a, 1.); }'
    });
    S.lamps.forEach(y => {
      const cone = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.52, S.LAMP_H - TOP - 0.02, 32, 1, true), coneMat);
      cone.position.set(0, (S.LAMP_H + TOP) / 2 - 0.01, -y);
      cone.userData.noEnv = true;
      scene.add(cone);

    // dammkorn som svävar i ljuset
    const n = 420, pos = new Float32Array(n * 3), seed = new Float32Array(n);
    const rnd = seeded(5);
    for (let i = 0; i < n; i++) {
      const lamp = S.lamps[i % S.lamps.length];
      pos[i * 3] = (rnd() - .5) * 0.8; pos[i * 3 + 1] = TOP + 0.05 + rnd() * (S.LAMP_H - TOP - 0.1); pos[i * 3 + 2] = -lamp + (rnd() - .5) * 0.8;

      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: {t: {value: 0}, px: {value: 1}},
      vertexShader: `attribute float seed; uniform float t; uniform float px; varying float vA;
        void main(){ vec3 p = position; p.x += sin(t * .13 + seed) * .06; p.y += sin(t * .09 + seed * 1.7) * .05; p.z += cos(t * .11 + seed * .7) * .06;
          vec4 mv = modelViewMatrix * vec4(p, 1.); gl_Position = projectionMatrix * mv; gl_PointSize = px * (1.4 + fract(seed) * 1.8) / max(.3, -mv.z) * 2.;

      fragmentShader: 'varying float vA; void main(){ vec2 d = gl_PointCoord - .5; float a = (1. - smoothstep(0., .5, length(d))) * vA * .5; gl_FragColor = vec4(vec3(1.,.85,.62) * a, 1.); }'

  /* ---------- Rita ---------- */
  let t0 = performance.now(), flick = 0;
  S.render = (opts = {}) => {
    const t = (performance.now() - t0) / 1000;
    if (dust) { dust.material.uniforms.t.value = t; dust.material.uniforms.px.value = S.dpr * (S.h || 800) / 900; }

    if (S.neon.length) {
      flick = Math.max(0, flick - 0.05);
      if (Math.random() < 0.004) flick = 0.6 + Math.random() * 0.4;
      const k = 1 - (flick > 0 ? (Math.sin(t * 90) > 0 ? flick * 0.35 : 0) : 0);

    renderer.setViewport(rect.x, rect.y, rect.w, rect.h);
    renderer.render(scene, cam);
    renderer.setScissorTest(false);
    renderer.setViewport(0, 0, S.w, S.h);
  };
  return S;
})();

/* ================= Efterbehandling: glöd, tonkurva och färg ================= */
// Scenen ritas i hög dynamik (HDR) till en bild i minnet. Sedan får starka ljus (lampor, neon, reflexer i kromet)
// en mjuk glöd, och bilden får filmisk tonkurva (ACES), varm färgton, vinjett och ett svagt filmkorn.

    void main(){
      vec3 c = texture2D(tDiffuse, vUv + texel * vec2(-.5,-.5)).rgb + texture2D(tDiffuse, vUv + texel * vec2(.5,-.5)).rgb
             + texture2D(tDiffuse, vUv + texel * vec2(-.5,.5)).rgb + texture2D(tDiffuse, vUv + texel * vec2(.5,.5)).rgb;

    }`, {tDiffuse: {value: null}, texel: {value: new THREE.Vector2()}});

      c += texture2D(tDiffuse, vUv - dir * 1.3846153846).rgb * .3162162162;

  };

/* ---- 07-pucks.js ---- */
/* ================= Puckarna (vikterna) ================= */
// Varje puck: kromad stålkropp med färgad keps (med klubbens monogram), en mjuk skugga, en spegelbild i den
// blanka lacken (ritas bara där spelytan syns, med stencilbufferten) och en ring när den leder omgången.
// Spelarna kan låsa upp andra puckar (Badges.ITEMS.puck): figuren på kepsen, ränder, svart krom, guld och stjärna.
// När pucken åker över kanten tippar den ner i rännan och glider klart där.
const Pucks = (() => {
  const P = {};
  const {L, HALF, TOP, R, DROP} = TABLE;
  const objs = new Map();     // id -> {g, body, mirror, shadow, ring, owner, color, st}
  let chrome, chromeMirror, shadowTex, ringTex, geoBody = null, geoParts = null, shadowGeo = null, ringGeo = null;
  const capMats = {}, capMirrorMats = {}, bodyMats = {};

  function capTexture(colorKey, look = {}) {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d'), col = Rules.COLORS[colorKey] || Rules.COLORS.red;
    const base = new THREE.Color(col.hex);
    const css = (k, a = 1) => { const x = base.clone().multiplyScalar(k); return `rgba(${Math.min(255, x.r * 255) | 0},${Math.min(255, x.g * 255) | 0},${Math.min(255, x.b * 255) | 0},${a})`; };
    const gr = g.createRadialGradient(118, 110, 10, 128, 128, 130);
    gr.addColorStop(0, css(1.18)); gr.addColorStop(.7, css(1)); gr.addColorStop(1, css(.78));
    g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
    const design = look.puck || 'klassisk', gold = '#f3d38a';
    // ränder: två breda band tvärs över
    if (design === 'rander') { g.fillStyle = css(1.45, .75); [-34, 34].forEach(dx => g.fillRect(128 + dx - 15, 0, 30, 256)); }
    // ingraverad ring (i guld på guldpucken)
    g.strokeStyle = design === 'guld' ? gold : css(.62, .9); g.lineWidth = design === 'guld' ? 7 : 5; g.beginPath(); g.arc(128, 128, 98, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = css(1.35, .45); g.lineWidth = 2; g.beginPath(); g.arc(128, 126, 96, Math.PI * 1.05, Math.PI * 1.95); g.stroke();
    g.textAlign = 'center'; g.textBaseline = 'middle';
    if (design === 'figur' && look.av) {
      // spelarens figur mitt på kepsen
      g.font = '118px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
      g.fillText(look.av, 128, 136);
    } else if (design === 'stjarna') {
      g.beginPath();
      for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? 36 : 84; g[k ? 'lineTo' : 'moveTo'](128 + r * Math.cos(a), 132 + r * Math.sin(a)); }
      g.closePath(); g.fillStyle = gold; g.fill(); g.lineWidth = 4; g.strokeStyle = 'rgba(120,80,20,.7)'; g.stroke();
    } else {
      g.font = 'italic 700 104px Georgia, serif';
      g.fillStyle = design === 'guld' ? 'rgba(90,60,10,.8)' : css(.6, .85); g.fillText('S', 131, 139);
      g.fillStyle = design === 'guld' ? gold : css(1.3, .55); g.fillText('S', 127, 134);
    }
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
    return t;
  }
  const capKey = (colorKey, look = {}) => colorKey + '|' + (look.puck || 'klassisk') + (look.puck === 'figur' ? '|' + (look.av || '') : '');
  function capMat(colorKey, look = {}) {
    const key = capKey(colorKey, look);
    if (capMats[key]) return capMats[key];
    const col = Rules.COLORS[colorKey] || Rules.COLORS.red;
    const m = new THREE.MeshPhysicalMaterial({color: 0xffffff, map: capTexture(colorKey, look), roughness: .32, metalness: 0, clearcoat: .9, clearcoatRoughness: .12, envMapIntensity: .7});
    if (Scene.env()) m.envMap = Scene.env();
    m.userData.hex = col.hex;
    return (capMats[key] = m);
  }
  // kroppen: krom, guld eller svart krom
  function bodyMat(look = {}) {
    const d = look.puck === 'guld' ? 'guld' : look.puck === 'svart' ? 'svart' : 'krom';
    if (d === 'krom') return chrome;
    if (bodyMats[d]) return bodyMats[d];
    const m = new THREE.MeshStandardMaterial(d === 'guld' ? {color: 0xe2b457, metalness: 1, roughness: .18, envMapIntensity: 1.2} : {color: 0x2c2f35, metalness: 1, roughness: .22, envMapIntensity: 1.1});
    if (Scene.env()) m.envMap = Scene.env();
    return (bodyMats[d] = m);
  }
  function capMirror(colorKey) {
    if (capMirrorMats[colorKey]) return capMirrorMats[colorKey];

  }
  // Spegelbilden i lacken: stark närmast bordet och bleknar snabbt uppåt (som en riktig reflex i blank lack)

    };

  function softTex(inner, outer, stops) {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, inner, 64, 64, outer);

  // Pucken i reserv (om Blender-modellen saknas): svarvad profil + keps

    const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({map: ringTex, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, color: new THREE.Color((Rules.COLORS[colorKey] || Rules.COLORS.red).hex).multiplyScalar(2.2)}));

    objs.set(id, o);

    o.g.position.set(wx, y, wz);
    o.g.rotation.set(0, o.spin, 0);
    if (o.tilt) { o.g.rotation.x = o.tiltAxis === 'z' ? 0 : o.tilt; o.g.rotation.z = o.tiltAxis === 'z' ? o.tilt : 0; }

    o.mirror.visible = onTable && o.fade > .05;

    o.mirror.rotation.copy(o.g.rotation);

  }
  P.set = (id, x, y, h = 0) => { const o = objs.get(id); if (!o) return; o.x = x; o.y = y; o.h = h; if (o.st !== 'fall') place(o); };

  P.addSpin = (id, da) => { const o = objs.get(id); if (o) { o.spin += da; if (o.st !== 'fall') place(o); } };

    });

  }

    }
  };
  function stepDust(dt) {

    dust.pts.visible = true;

      pos.setXYZ(i, q.x, TOP + q.y, q.z);

  }

  // Ner i rännan: fortsätter i sin fart, tippar över kanten och faller DROP meter

  };

  // Lägger puckarna precis som i ett läge (efter återanslutning eller när en animation hoppas över)
  P.sync = (m, animatedRemove = false) => {

    const colorOf = owner => (m.seats[owner] && m.seats[owner].color) || 'red';
    m.pucks.forEach(q => { const o = P.ensure(q.id, q.owner, colorOf(q.owner), P.lookOf(m, q.owner)); o.st = 'table'; o.h = 0; o.tilt = 0; o.fade = 1; P.set(q.id, q.x, q.y); keep.add(q.id); });

      keep.add(q.id);

      const side = q.e === 1 ? -1 : q.e === 2 ? 1 : 0;
      o.x = side ? side * (HALF + TABLE.GUTTER / 2) : clamp(q.x, -HALF, HALF);
      o.y = side ? clamp(q.y, 0, L) : (q.e === 3 ? L + TABLE.END - R - 0.004 : -TABLE.END + R + 0.004);

  };
  // Puckar som har ramlat ner i samma ränna knuffas isär så att de inte ligger i varandra
  P.spreadGutter = () => {
    const lying = [...objs.values()].filter(o => o.st === 'gutter');
    for (let it = 0; it < 6; it++) {
      let moved = false;
      for (let i = 0; i < lying.length; i++) for (let j = i + 1; j < lying.length; j++) {
        const a = lying[i], b = lying[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
        if (d >= 2 * R + 0.002) continue;
        const endA = Math.abs(a.x) <= HALF, endB = Math.abs(b.x) <= HALF;
        // i ändrännan flyttas de i sidled, i sidorännorna längs bordet
        const push = (2 * R + 0.003 - d) / 2;
        if (endA && endB) { const s = dx >= 0 ? 1 : -1; a.x -= s * push; b.x += s * push; a.x = clamp(a.x, -HALF - 0.04, HALF + 0.04); b.x = clamp(b.x, -HALF - 0.04, HALF + 0.04); }
        else { const s = dy >= 0 ? 1 : -1; a.y -= s * push; b.y += s * push; }
        moved = true;
      }
      if (!moved) break;
    }
    lying.forEach(place);
  };
  P.activeId = null;
  // Några puckar som ligger på bordet medan menyerna visas
  P.demo = on => {
    if (!on) { [...objs.values()].filter(o => String(o.id).startsWith('demo')).forEach(dispose); return; }
    const list = [['demo1', 'red', 0.08, L - 0.07], ['demo2', 'blue', -0.1, L - 0.2], ['demo3', 'red', -0.02, L - 0.45], ['demo4', 'blue', 0.13, L - 0.9], ['demo5', 'gold', -0.16, L - 0.6], ['demo6', 'red', 0.02, 1.6]];
    list.forEach(([id, c, x, y], i) => { const o = P.ensure(id, 0, c); o.st = 'table'; o.spin = i * 1.3; P.set(id, x, y); });
  };

  // Ringar under puckar (ledande puck, eller den som ska kastas)
  P.rings = (ids, on = true) => { objs.forEach(o => { o.ringOn = on && ids.includes(o.id) ? 1 : 0; }); };
  P.pulse = id => { const o = objs.get(id); if (o) o.ringK = 1.6; };

  P.update = dt => {
    const t = performance.now() / 1000;
    stepDust(dt);
    objs.forEach(o => {
      if (o.st === 'fall') { stepFall(o, dt); place(o); }
      const target = o.ringOn ? .75 + Math.sin(t * 3.2) * .2 : 0;
      o.ringK = Math.max(0, o.ringK - dt * 1.5);
      o.ring.material.opacity += ((target + o.ringK * .6) * o.fade - o.ring.material.opacity) * Math.min(1, dt * 8);
      o.ring.visible = o.ring.material.opacity > .01;
      const s = 1 + o.ringK * .25;
      o.ring.scale.set(s, 1, s);
    });
  };
  return P;
})();

/* ---- 07b-figures.js ---- */
/* ================= Figurerna vid bordet ================= */
// Tecknade pubgäster (modellen 'figur' från Blender) står vid bortre änden och tittar på: tröjan i spelarens (lagets)
// färg och huvudet efter den figur spelaren har valt (LOOKS i 07a-looks.js: räv, ko, robot ... eller en människa med
// hatt, krona eller glasögon; människor får frisyr, hudton och hårfärg efter namnet). De följer pucken med blicken och
// reagerar: jublar när den egna sidan lyckas, applåderar snygga kast och tar sig för pannan när en egen puck åker av.
// Var och en har en egen plats; den som ska kasta går därifrån (bort till den närmsta änden, där kameran är) och
// kommer tillbaka när turen är slut.
const Figures = (() => {
  const F = {};
  const {L} = TABLE;
  let list = [], throwerSeat = -1, look = null;
  // platserna bredvid bortre änden (x, y i bordets mått), vända mot bordet och den som kastar; utanför
  // kamerorna över zonerna men synliga från kastlinjen och på TV:n
  const SLOTS = [{x: -0.98, y: L - 0.15, yaw: 0.62}, {x: 0.98, y: L - 0.15, yaw: -0.62}, {x: -1.26, y: L - 0.58, yaw: 0.72}, {x: 1.26, y: L - 0.58, yaw: -0.72}];
  const SIZE = 1.1;
  const SKIN = ['#f0c3a0', '#e7b48c', '#c98d63', '#8d5a3c', '#f5d0b5', '#a86b45'];
  const HAIR = ['#3b2416', '#1c1411', '#c8902c', '#8a3b1c', '#5a3a22', '#e0c07a'];
  const STYLES = ['har_kort', 'har_page', 'har_knut', 'har_keps'];
  // noder som bara ibland syns: huvudena (h_*), tillbehören (x_*), frisyrerna (har_*), skägget och mustaschen;
  // alla göms utom de som hör till figuren
  const VARIANTS = new Set(['skagg', 'mustasch']);
  const isVariant = k => VARIANTS.has(k) || /^(h|x|har)_/.test(k);
  const hash = s => { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.codePointAt(0), 16777619); return h >>> 0; };
  // Upplåsta hattar (Badges.ITEMS.hat) sitter på alla huvuden: hattarna är gjorda för människohuvudet och flyttas
  // upp eller ner till huvudets topp (meter i modellen)
  const HEADWEAR = ['x_hatt', 'x_krona', 'x_cowboy', 'x_gronhatt'];
  const HAT_DZ = {h_rav: -.02, h_varg: -.02, h_tvatt: -.02, h_bjorn: -.005, h_panda: -.005, h_koala: -.015, h_lejon: -.015, h_tiger: -.005,
    h_groda: -.035, h_apa: -.005, h_pingvin: .002, h_blackfisk: .06, h_enhorning: .01, h_ko: .002, h_gris: -.008, h_kanin: -.02, h_robot: -.035, h_stjarna: .07};
  // Figurens utseende: vilka noder som syns och färgerna (samma varje gång för samma namn och figur)
  F.lookFor = s => {
    const av = s.avatar || s.av || '', h = hash((s.name || '') + '|' + av), o = LOOKS[av] || LOOKS['🙂'];
    const colors = Object.assign({}, o.c || {});
    let show = [o.head, ...(o.x || [])];
    if (o.head === 'h_person') {
      colors.skin = colors.skin || SKIN[(h >>> 8) % SKIN.length];
      colors.fur = colors.skin;       // halsen
      colors.hair = colors.hair || HAIR[(h >>> 12) % HAIR.length];
      show.push(o.hair || STYLES[h % STYLES.length]);
      if (!o.hair && !o.x && (h >>> 5) % 9 === 0) show.push('skagg', 'mustasch');
    }
    // spelarens upplåsta hatt (eller medalj): en hatt ersätter figurens egen huvudbonad (och kepsen)
    const hat = s.cos && s.cos.hat;
    if (hat && (HEADWEAR.includes(hat) || hat === 'x_medalj')) {
      if (HEADWEAR.includes(hat)) show = show.filter(k => !HEADWEAR.includes(k)).map(k => (k === 'har_keps' ? 'har_kort' : k));
      if (!show.includes(hat)) show.push(hat);
    }
    return {show, colors, hatDz: HAT_DZ[o.head] || 0};
  };

  function make(seat, s) {
    if (!ModelLib.ok() || !ModelLib.has('figur')) return null;
    const lk = F.lookFor(s), shirt = (Rules.COLORS[s.color] || Rules.COLORS.red).hex;
    const colors = Object.assign({shirt}, lk.colors);
    const root = ModelLib.create('figur', {colors});
    if (!root) return null;
    const N = root.userData.nodes;
    Object.keys(N).forEach(k => { if (isVariant(k)) N[k].visible = lk.show.includes(k); });
    if (lk.hatDz) HEADWEAR.forEach(k => { if (N[k] && N[k].visible) N[k].position.y += lk.hatDz; });
    // egna material (figuren tonas bort när den går iväg); bakom sista lampan är det mörkt, så materialen lyser
    // en aning av sig själva och ansiktena syns; guldet speglar rummet
    const own = new Map(), mats = [], env = Scene.env && Scene.env();
    const mine = mt => {
      if (!own.has(mt)) {
        const c = mt.clone();
        if (c.emissive) c.emissive.copy(c.color).multiplyScalar(c.metalness > 0.5 ? 0.08 : 0.2);
        if (c.metalness > 0.5 && env) c.envMap = env;
        c.userData.op = c.opacity; c.userData.tr = c.transparent;
        own.set(mt, c); mats.push(c);
      }
      return own.get(mt);
    };
    root.traverse(o => {
      if (!o.isMesh) return;
      o.userData.noEnv = true;
      o.material = Array.isArray(o.material) ? o.material.map(mine) : mine(o.material);
    });
    // en egen plats vid bordet efter platsnumret (den ändras inte när turen går över)
    const slot = Math.min(seat, SLOTS.length - 1);
    const g = new THREE.Group();
    g.add(root);
    g.visible = false;
    g.rotation.y = SLOTS[slot].yaw;
    Scene.scene.add(g);
    return {seat, g, mats, N, show: lk.show, head: N.huvud, armL: N.armV, armR: N.armH, legL: N.benV, legR: N.benH, slot, away: 1, alpha: 1, walk: 0, wa: 0,
      react: null, t0: 0, phase: (hash(s.name || '') % 628) / 100};
  }
  // genomskinlighet när figuren går iväg (bara när den ändras)
  function setAlpha(f, a) {
    if (a === f.alpha) return;
    f.alpha = a;
    f.mats.forEach(mt => { mt.transparent = a < 1 || mt.userData.tr; mt.opacity = mt.userData.op * a; });
  }

  // Figurer för matchens spelare (byts om spelarna eller deras färger ändras)
  F.sync = m => {
    // (inte på låg grafik: svaga telefoner slipper figurerna)
    if (!m || m.practice || !Scene.scene || Scene.quality === 'low') { F.clear(); return; }
    const key = m.seats.map(s => (s.name || '') + s.color + (s.avatar || s.av || '') + (s.cos ? s.cos.hat || '' : '')).join('|');
    if (list.length && list.key === key) return;
    F.clear();
    list = m.seats.map((s, i) => make(i, s)).filter(Boolean);
    list.key = key;
    // en ny match: alla utom den som kastar står redan på sina platser
    throwerSeat = Rules.current(m);
    list.forEach(f => { f.away = f.seat === throwerSeat ? 1 : 0; });
  };
  F.clear = () => { list.forEach(f => { Scene.scene.remove(f.g); f.mats.forEach(mt => mt.dispose()); }); list = []; throwerSeat = -1; look = null; };
  // Den som kastar går från sin plats, den som just kastade kommer tillbaka (-1: alla kommer fram)
  F.setTurn = seat => { throwerSeat = seat; };
  // Vart tittar de? (pucken som rör sig; null = mot den som kastar)
  F.lookAt = (x, y) => { look = x == null ? null : {x, y}; };
  F.looks = LOOKS;
  // för testerna: figurerna, deras platser och vilka huvuden och tillbehör som syns
  F.debug = () => list.map(f => ({seat: f.seat, slot: f.slot, away: +f.away.toFixed(2), visible: f.g.visible, show: f.show,
    shown: Object.keys(f.N).filter(k => isVariant(k) && f.N[k].visible)}));
  // kind: 'cheer' (jubel), 'dismay' (för pannan), 'clap' (applåd)
  F.react = (seat, kind, delay = 0) => {
    const f = list.find(x => x.seat === seat);
    if (!f) return;
    setTimeout(() => { if (list.includes(f)) { f.react = kind; f.t0 = performance.now(); } }, delay);
  };
  F.reactSide = (m, side, kind, delay = 0) => list.forEach(f => { if (Rules.side(m, f.seat) === side && f.seat !== throwerSeat) F.react(f.seat, kind, delay + Math.random() * 180); });

  const ease = (cur, want, k) => cur + (want - cur) * k;
  // vägen bort från platsen: utåt från bordet och lite bakåt (i bordets mått); gången tar knappt en sekund
  const OUT = {x: 0.62, y: 0.42}, WALK = 1.15;
  F.update = dt => {
    if (!list.length) return;
    const now = performance.now(), t = now / 1000, k = Math.min(1, dt * 7);
    for (const f of list) {
      // den som kastar går iväg och tonas bort på vägen; när turen är slut kommer den tillbaka samma väg
      const want = f.seat === throwerSeat ? 1 : 0, before = f.away;
      f.away = clamp(f.away + Math.sign(want - f.away) * dt * WALK, 0, 1);
      const moving = f.away !== before;
      setAlpha(f, 1 - smooth(0.55, 0.97, f.away));
      f.g.visible = f.alpha > 0.01;
      if (!f.g.visible) { f.wa = 0; continue; }
      const sl = SLOTS[f.slot], side = sl.x < 0 ? -1 : 1, e = smooth(0, 1, f.away);
      f.px = sl.x + side * OUT.x * e; f.py = sl.y + OUT.y * e;
      // på väg: vänd åt det håll man går, annars mot bordet
      f.yaw = !moving ? sl.yaw : want ? Math.atan2(side * OUT.x, -OUT.y) : Math.atan2(-side * OUT.x, OUT.y);
      f.wa = ease(f.wa, moving ? 1 : 0, Math.min(1, dt * 6));
      if (f.wa > 0.01) f.walk += dt * 9.5; else f.walk = 0;
      const step = Math.sin(f.walk) * f.wa;
      const rt = f.react ? (now - f.t0) / 1000 : 9;
      const dur = f.react === 'clap' ? 1.6 : 1.9;
      if (rt > dur) f.react = null;
      const w = f.react ? Math.sin(Math.min(1, rt / dur) * Math.PI) : 0;       // reaktionens styrka (in och ut)
      const ph = t * 1.6 + f.phase;
      // vila: andas lite, armarna svajar, blicken mot pucken (eller den som kastar)
      let jump = 0, lean = 0, aL = {x: Math.sin(ph) * 0.04, z: -0.07}, aR = {x: Math.sin(ph + 1.3) * 0.04, z: 0.07}, headPitch = 0.08;
      if (f.react === 'cheer') {
        jump = Math.abs(Math.sin(rt * 7.2)) * 0.13 * w;
        aL = {x: -0.15, z: -2.55 + Math.sin(rt * 14) * 0.12}; aR = {x: -0.15, z: 2.55 + Math.cos(rt * 14) * 0.12};
        headPitch = -0.12;
      } else if (f.react === 'clap') {
        const c = Math.abs(Math.sin(rt * 10));
        aL = {x: -1.25, z: 0.12 + c * 0.18}; aR = {x: -1.25, z: -0.12 - c * 0.18};
      } else if (f.react === 'dismay') {
        lean = 0.06;
        aR = {x: -2.45, z: -0.32};
        headPitch = 0.3;
      }
      const m2 = f.react ? Math.min(1, w * 2.2) : 0;
      // vila, eller gång: armarna pendlar i otakt med benen
      const idleL = {x: Math.sin(ph) * 0.04 + step * 0.5, z: -0.07}, idleR = {x: Math.sin(ph + 1.3) * 0.04 - step * 0.5, z: 0.07};
      const tl = {x: idleL.x + (aL.x - idleL.x) * m2, z: idleL.z + (aL.z - idleL.z) * m2};
      const tr = {x: idleR.x + (aR.x - idleR.x) * m2, z: idleR.z + (aR.z - idleR.z) * m2};
      if (f.armL) { f.armL.rotation.x = ease(f.armL.rotation.x, tl.x, k); f.armL.rotation.z = ease(f.armL.rotation.z, tl.z, k); }
      if (f.armR) { f.armR.rotation.x = ease(f.armR.rotation.x, tr.x, k); f.armR.rotation.z = ease(f.armR.rotation.z, tr.z, k); }
      if (f.legL) f.legL.rotation.x = -step * 0.5;
      if (f.legR) f.legR.rotation.x = step * 0.5;
      f.g.scale.setScalar(SIZE);
      f.g.position.set(f.px, jump + Math.sin(ph * 0.5) * 0.004 + Math.abs(step) * 0.025, -f.py);
      const cur = f.g.rotation.y, turn = Math.atan2(Math.sin(f.yaw - cur), Math.cos(f.yaw - cur));
      f.g.rotation.set(lean, cur + turn * Math.min(1, dt * 9), Math.sin(t * 0.7 + f.phase) * 0.012 + step * 0.05);
      if (f.head) {
        const body = f.g.rotation.y;
        let yaw = -body * 0.5, pitch = headPitch;
        if (look) {
          const dx = look.x - f.px, dz = f.py - look.y, a = Math.atan2(dx, dz) - body;
          yaw = clamp(Math.atan2(Math.sin(a), Math.cos(a)), -0.85, 0.85);
          pitch = clamp(0.14 + 0.5 / Math.max(0.6, f.py - look.y), 0.1, 0.45);
        }
        if (f.react === 'dismay') pitch = 0.32;
        // den som går tittar framåt
        if (f.wa > 0.3) { yaw = 0; pitch = 0.1; }
        f.head.rotation.y = ease(f.head.rotation.y, yaw, Math.min(1, dt * 4));
        f.head.rotation.x = ease(f.head.rotation.x, pitch, Math.min(1, dt * 4));

})();

/* ---- 08-camera.js ---- */
/* ================= Kameran ================= */
// Lägen: 'aim' (bakom den som kastar, hela bordet syns), 'follow' (följer pucken längs bordet), 'far' (över
// poängzonerna), 'score' (rakt ovanifrån zonerna när poängen räknas), 'table' (hela bordet ovanifrån) och 'menu'
// (långsam filmisk åkning i menyerna). Kameran glider mjukt mellan lägena och anpassar sig efter skärmens form.
const Cam = (() => {
  const C = {};
  const {L, TOP, Y0} = TABLE;
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const pos = V(0, 1.6, 2), look = V(0, TOP, -3), tPos = V(0, 1.6, 2), tLook = V(0, TOP, -3);
  let fov = 50, tFov = 50, rate = 3, mode = 'menu', shakeK = 0, t = 0;
  let follow = null;      // () => {x, y, v} för pucken som följs
  let aimX = 0;
  C.mode = () => mode;

  // Hur "stående" skärmen är: 0 = liggande (bred), 1 = stående (smal)
  const portrait = () => { const a = Scene.w / Scene.h; return clamp((1.45 - a) / (1.45 - 0.55), 0, 1); };

  function aimPose() {
    const p = portrait();
    const back = lerp(1.2, 1.32, p), height = lerp(0.62, 0.72, p), f = lerp(42, 56, p);
    const zRel = -Y0;
    return {pos: V(aimX * 0.55, TOP + height, zRel + back), look: V(aimX * 0.3, TOP - 0.02, -lerp(1.7, 2.35, p)), fov: f};
  }
  // Över zonerna: kameran står lägre än lamporna (annars skymmer lampan över bortre änden)
  function farPose(zoomed) {
    const p = portrait();
    const ty = L - (zoomed ? 0.32 : 0.42);
    const height = lerp(zoomed ? 0.62 : 0.74, zoomed ? 0.7 : 0.84, p), back = lerp(zoomed ? 1.05 : 1.3, zoomed ? 1.25 : 1.55, p);
    return {pos: V(0, TOP + height, -(ty - back)), look: V(0, TOP - 0.02, -ty), fov: lerp(40, 50, p)};
  }
  function scorePose() {
    const p = portrait();
    const ty = L - 0.36;
    return {pos: V(0, TOP + lerp(0.64, 0.74, p), -(ty - lerp(0.95, 1.2, p))), look: V(0, TOP - 0.03, -ty), fov: lerp(38, 46, p)};
  }
  function tablePose() {
    const p = portrait();
    return {pos: V(0, TOP + lerp(3.2, 5.6, p), -(L * 0.52 - lerp(2.6, 0.9, p))), look: V(0, TOP, -L * 0.56), fov: lerp(42, 58, p)};
  }

  // Kurvan för menyerna: lågt längs bordet, ut mot båsen, förbi baren och fram mot neonskylten
  const MENU_PATH = [
    {p: [0.34, TOP + 0.1, -0.5], l: [0, TOP + 0.03, -(L - 0.3)]},
    {p: [0.3, TOP + 0.14, -2.4], l: [0, TOP + 0.02, -(L - 0.2)]},
    {p: [1.1, TOP + 0.55, -4.2], l: [0, TOP + 0.05, -(L - 0.4)]},
    {p: [1.7, TOP + 0.8, -4.4], l: [-2.4, TOP + 0.35, -3.6]},
    {p: [1.6, TOP + 0.75, -0.6], l: [-1.2, TOP + 0.25, -3.4]},
    {p: [0.9, TOP + 0.45, 0.6], l: [0, TOP + 0.3, -(L - 0.5)]}
  ];
  const cr = (a, b, c, d, t) => { const t2 = t * t, t3 = t2 * t; return 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3); };
  function menuPose(time) {
    const n = MENU_PATH.length, u = (time / 13) % n, i = Math.floor(u), f = u - i;
    const P = k => MENU_PATH[(i + k + n) % n];
    const pick3 = (key, j) => cr(P(-1)[key][j], P(0)[key][j], P(1)[key][j], P(2)[key][j], f);
    return {pos: V(pick3('p', 0), pick3('p', 1), pick3('p', 2)), look: V(pick3('l', 0), pick3('l', 1), pick3('l', 2)), fov: 46};
  }

  C.set = (m, opts = {}) => {
    mode = m;
    if (opts.aimX != null) aimX = opts.aimX;
    follow = opts.follow || null;
    rate = opts.rate || (m === 'follow' ? 5 : m === 'replay' ? 7 : m === 'menu' ? 1.2 : 2.6);
    C.update(0);
    if (opts.snap) { pos.copy(tPos); look.copy(tLook); fov = tFov; }
  };
  C.aimAt = x => { aimX = x; };
  // för tester: hoppa till en viss tid i menyåkningen
  C.menuTime = time => { t = time; if (mode === 'menu') C.snap(); };

  function targets(dt) {
    let pose;
    if (mode === 'aim') pose = aimPose();
    else if (mode === 'far') pose = farPose(false);
    else if (mode === 'farZoom') pose = farPose(true);
    else if (mode === 'score') pose = scorePose();
    else if (mode === 'table') pose = tablePose();
    else if (mode === 'replay' && follow) {
      // lågt från höger sida, strax bakom pucken; stannar vid bortre änden så att kanten syns
      const f = follow(), p = portrait();
      const y = Math.min(f.y, L - 0.12);
      pose = {pos: V(lerp(0.62, 0.5, p), TOP + lerp(0.13, 0.17, p), -(y - lerp(0.55, 0.7, p))), look: V(f.x * 0.5 - 0.02, TOP + 0.01, -(Math.min(L - 0.05, y + 0.45))), fov: lerp(36, 48, p)};
    }
    else if (mode === 'follow' && follow) {
      const f = follow(), p = portrait();
      const endK = smooth(L - 2.4, L - 0.9, f.y) * smooth(1.6, 0.35, f.v);
      const back = lerp(0.85, 1.25, p) + f.v * 0.18, height = lerp(0.3, 0.46, p) + f.v * 0.05;
      const chase = {pos: V(f.x * 0.55, TOP + height, -(f.y - back)), look: V(f.x * 0.45, TOP - 0.01, -(f.y + lerp(1.1, 1.4, p))), fov: lerp(46, 58, p)};
      const far = farPose(false);
      pose = {pos: chase.pos.lerp(far.pos, endK), look: chase.look.lerp(far.look, endK), fov: lerp(chase.fov, far.fov, endK)};
      // kameran får aldrig åka förbi bortre änden
      pose.pos.z = Math.max(pose.pos.z, -(L - 0.55));
    } else {
      // meny: långsam filmisk åkning genom puben (en sluten kurva)
      t += dt;
      pose = menuPose(t);
    }
    tPos.copy(pose.pos); tLook.copy(pose.look); tFov = pose.fov;
  }

  C.update = dt => {
    targets(dt);
    const k = 1 - Math.exp(-rate * dt);
    pos.lerp(tPos, dt ? k : 1); look.lerp(tLook, dt ? k : 1); fov += (tFov - fov) * (dt ? k : 1);
    const cam = Scene.camera;
    cam.position.copy(pos);
    if (shakeK > 0.0005) {
      shakeK *= Math.exp(-dt * 7);
      cam.position.x += (Math.random() - .5) * shakeK; cam.position.y += (Math.random() - .5) * shakeK;
    }
    cam.lookAt(look);
    if (Math.abs(cam.fov - fov) > 0.01) { cam.fov = fov; cam.updateProjectionMatrix(); }
  };
  C.shake = k => { if (!reduceMotion) shakeK = Math.max(shakeK, k); };
  C.snap = () => { targets(0); pos.copy(tPos); look.copy(tLook); fov = tFov; C.update(0); };
  // Skärmpunkt -> punkt på bordets yta (x, y i bordets koordinater)
  const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -TOP), hit = new THREE.Vector3();
  C.toTable = (sx, sy) => {
    const ndc = new THREE.Vector2(sx / Scene.w * 2 - 1, -(sy / Scene.h) * 2 + 1);
    ray.setFromCamera(ndc, Scene.camera);
    if (!ray.ray.intersectPlane(plane, hit)) return null;
    return {x: hit.x, y: -hit.z};
  };
  // Punkt på bordet -> skärmpunkt
  const tmp = new THREE.Vector3();
  C.toScreen = (x, y, hgt = 0) => {
    tmp.set(x, TOP + hgt, -y).project(Scene.camera);
    return {x: (tmp.x + 1) / 2 * Scene.w, y: (1 - tmp.y) / 2 * Scene.h, behind: tmp.z > 1};
  };
  return C;
})();

/* ---- 09-aim.js ---- */
/* ================= Sikta och kasta ================= */
// Tryck var som helst på den nedre delen av skärmen: dra åt sidan för att flytta pucken, dra bakåt (nedåt) för
// att spänna kastet, och släpp. Ju längre bakåt desto hårdare; drar man snett blir kastet snett (som en slangbella).
// Kraftmätaren visar hur hårt: upp till markeringen glider pucken som längst till bortre kanten, över den blir det
// hårda slag för att slå ut andras puckar. Skruven (knapparna) ger en svag kurva. Tangentbordet fungerar också.
const Aim = (() => {
  const A = {};
  const {HALF, R, Y0, L, TOP} = TABLE;
  const A_MAX = 0.065, GAIN = 0.1;
  let active = null;          // pågående siktning
  let line = null, lineMat = null;
  let lastPower = {};         // seat -> senaste kraften (visas som ett streck i mätaren)

  // Hur långt man drar för full kraft. Alltid samma för en skärm, så att samma drag ger samma kast.
  function refLen() { return clamp(Scene.h * 0.3, 170, 400); }

  // Siktlinjen: prickar på bordet från pucken och framåt
  function makeLine() {

    const c = document.createElement('canvas'); c.width = 32; c.height = 64;
    const g = c.getContext('2d');
    g.fillStyle = 'rgba(20,10,4,.55)'; g.beginPath(); g.arc(16, 32, 11, 0, 7); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(16, 32, 7, 0, 7); g.fill();
    const tex = new THREE.CanvasTexture(c); tex.wrapT = THREE.RepeatWrapping;
    lineMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false,
      uniforms: {map: {value: tex}, rep: {value: 20}, color: {value: new THREE.Color(1, .9, .7)}, alpha: {value: .95}},
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
      fragmentShader: 'uniform sampler2D map; uniform float rep; uniform vec3 color; uniform float alpha; varying vec2 vUv; void main(){ vec4 t = texture2D(map, vec2(vUv.x, vUv.y * rep)); float f = (1. - smoothstep(.5, 1., vUv.y)) * smoothstep(0., .03, vUv.y); gl_FragColor = vec4(mix(vec3(.02), color, t.r), t.a * f * alpha); }'
    });
    const geo = new THREE.PlaneGeometry(0.022, 1, 1, 1);
    geo.translate(0, 0.5, 0); geo.rotateX(-Math.PI / 2);
    line = new THREE.Mesh(geo, lineMat);
    line.renderOrder = 2; line.userData.noEnv = true; line.visible = false;
    Scene.scene.add(line);
  }
  function showLine(x, y, a, len, color) {
    if (!line) makeLine();
    if (Settings.aim === 'av' || len <= 0) { line.visible = false; return; }
    line.visible = true;
    line.position.set(x, TOP + 0.0012, -y - R * 1.3);
    line.rotation.set(0, -a, 0);
    line.scale.set(1, 1, len);
    lineMat.uniforms.rep.value = len / 0.042;
    if (color) { const c = lineMat.uniforms.color.value.set(color); c.lerp(new THREE.Color(1, 1, 1), 0.25).multiplyScalar(1.6); }
  }
  A.hideLine = () => { if (line) line.visible = false; };

  /* ---------- Handkontrollen: hela bordet ovanifrån i 2D (telefonen vid ett TV-bord) ---------- */
  // Bordet trycks ihop på längden, så att siktlinjen visar var i sidled pucken hamnar längst bort. Puckarna ritas
  // där de är just nu (även under ett kast), så att man kan följa spelet på telefonen också.
  const isPad = () => document.body.classList.contains('controller');
  let padAim = null, padRaf = 0;
  function padGeom() {
    const cv = $('padCanvas');
    if (!cv) return null;
    const w = cv.clientWidth || innerWidth, hh = cv.clientHeight || innerHeight;
    const top = Math.min(hh * 0.2, 150), bottom = hh - Math.max(150, hh * 0.19);
    const tw = Math.min(w * 0.56, 300);
    return {cv, w, hh, top, bottom, tw, cx: w / 2, xs: tw / TABLE.W, ys: (bottom - top) / (L - Y0)};
  }
  function drawPad() {
    padRaf = 0;
    if (!isPad()) return;
    padRaf = requestAnimationFrame(drawPad);
    const P = padGeom();
    if (!P) return;
    const {cv, w, hh, top, bottom, tw, cx, xs, ys} = P;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(hh * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(hh * dpr); }
    const g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, hh);
    const X = x => cx + x * xs, Yp = y => bottom - (y - Y0) * ys;
    const yEnd = Yp(L), yNear = Yp(0), gut = TABLE.GUTTER * xs;
    // rännorna och bordet
    g.fillStyle = '#1a110b';
    g.beginPath();
    if (g.roundRect) g.roundRect(X(-TABLE.W / 2) - gut - 6, yEnd - 26, tw + 2 * gut + 12, yNear - yEnd + 34, 16); else g.rect(X(-TABLE.W / 2) - gut - 6, yEnd - 26, tw + 2 * gut + 12, yNear - yEnd + 34);
    g.fill();
    g.fillStyle = '#7a4a26';
    g.fillRect(X(-TABLE.W / 2) - gut - 6, yEnd - 26, 6, yNear - yEnd + 34); g.fillRect(X(TABLE.W / 2) + gut, yEnd - 26, 6, yNear - yEnd + 34);
    const wood = g.createLinearGradient(X(-TABLE.W / 2), 0, X(TABLE.W / 2), 0);
    wood.addColorStop(0, '#c99a62'); wood.addColorStop(.5, '#e6c38e'); wood.addColorStop(1, '#c99a62');
    g.fillStyle = wood; g.fillRect(X(-TABLE.W / 2), yEnd, tw, yNear - yEnd);
    // zonerna och linjerna
    g.fillStyle = 'rgba(255,90,130,.16)'; g.fillRect(X(-TABLE.W / 2), yEnd, tw, Yp(TABLE.Z3) - yEnd);
    g.fillStyle = 'rgba(255,200,90,.12)'; g.fillRect(X(-TABLE.W / 2), Yp(TABLE.Z3), tw, Yp(TABLE.Z2) - Yp(TABLE.Z3));
    g.fillStyle = 'rgba(40,24,10,.85)';
    [[TABLE.Z3, 1.5], [TABLE.Z2, 1.5], [TABLE.FOUL, 2.5]].forEach(([y, lw]) => g.fillRect(X(-TABLE.W / 2), Yp(y) - lw / 2, tw, lw));
    g.fillStyle = 'rgba(40,24,10,.35)'; g.fillRect(X(-TABLE.W / 2), Yp(Y0) - 0.75, tw, 1.5);
    g.font = '700 13px Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = 'rgba(40,24,10,.55)';
    g.fillText('3', X(0), (yEnd + Yp(TABLE.Z3)) / 2 + 1); g.fillText('2', X(0), (Yp(TABLE.Z3) + Yp(TABLE.Z2)) / 2 + 1); g.fillText('1', X(0), (Yp(TABLE.Z2) + Yp(TABLE.FOUL)) / 2);
    // siktlinjen ända bort till kanten
    if (padAim && Settings.aim !== 'av') {

      g.save();
      g.setLineDash([5, 6]); g.lineWidth = 2.5; g.strokeStyle = padAim.color || '#fff'; g.globalAlpha = .9;
      g.beginPath(); g.moveTo(X(x0), Yp(Y0)); g.lineTo(X(x0 + Math.tan(a) * reach), Yp(Y0 + reach)); g.stroke();
      g.restore();
    }

    for (const o of Pucks.all()) {
      if (o.st !== 'table' || o.y < -0.05 || String(o.id).startsWith('demo')) continue;
      const px = X(o.x), py = Yp(Math.min(o.y, L + R));
      if (o.ringOn) { g.beginPath(); g.arc(px, py, rr + 5, 0, 7); g.fillStyle = 'rgba(255,240,200,.45)'; g.fill(); }
      g.beginPath(); g.arc(px, py, rr, 0, 7);
      g.fillStyle = (Rules.COLORS[o.color] || Rules.COLORS.red).hex; g.fill();
      g.lineWidth = 2; g.strokeStyle = 'rgba(255,255,255,.9)'; g.stroke();
    }
    // påminnelse överst
    g.font = '600 13px Inter, sans-serif'; g.fillStyle = 'rgba(247,236,214,.55)';
    g.fillText('📺 Bordet syns stort på TV:n', cx, Math.max(yEnd - 44, top - 40));
  }
  A.padOn = on => { if (on && !padRaf) padRaf = requestAnimationFrame(drawPad); if (!on) { padAim = null; if (padRaf) cancelAnimationFrame(padRaf); padRaf = 0; } };

  // Hjälpmedel (kraften i siffror, förra kastets kraft och siktlinjen ända bort): alltid i träning, som val
  // (Nybörjarhjälp) mot datorn och på samma skärm, aldrig över nätet. Utan dem gäller det att känna kastet.
  A.help = () => {
    const m = Game.state(), s = Game.session();
    if (m && m.practice) return true;
    if (!s || s.online()) return false;
    return !!Settings.help;
  };

  /* ---------- Kraftmätaren och skruven (HTML) ---------- */
  const meter = () => $('meter'), fill = () => $('meterFill');
  function drawMeter(p, seat) {
    const m = meter(); if (!m) return;
    m.classList.toggle('on', p > 0.001);
    fill().style.height = (Math.min(1, p) * 100) + '%';
    const pct = $('meterPct');
    // strecket vid bordets bortre kant (och att färgen skiftar där) bara med hjälp: annars gäller det att känna kastet
    const help = A.help(), edge = $('meterEdge');
    if (edge) edge.style.display = help ? '' : 'none';
    if (pct) { pct.textContent = p > 0.001 && help ? Math.round(p * 100) : ''; pct.style.bottom = (Math.min(1, p) * 100) + '%'; pct.classList.toggle('hard', help && p > Phys.POWER_EDGE); }
    fill().classList.toggle('hard', help && p > Phys.POWER_EDGE);
    const last = $('meterLast'), lp = A.help() ? lastPower[seat] : null;
    if (last) { last.style.display = lp != null ? '' : 'none'; if (lp != null) last.style.bottom = (lp * 100) + '%'; }
  }

  function guardMini() {
    const mi = $('mini'), me = $('meter');
    if (!mi || !me) return;
    const a = mi.getBoundingClientRect(), b = me.getBoundingClientRect(), gap = 24;
    mi.classList.toggle('dodge', !!(a.width && b.width && a.left < b.right + gap && b.left < a.right + gap && a.top < b.bottom + gap && b.top < a.bottom + gap));
  }
  A.spin = 0;   // -2..2
  function drawSpin() {
    const s = $('spinCtl'); if (!s) return;
    s.dataset.v = A.spin;
    s.querySelectorAll('[data-dir]').forEach(b => {
      const dir = +b.dataset.dir, on = Math.sign(A.spin) === dir;
      b.classList.toggle('on', on);
