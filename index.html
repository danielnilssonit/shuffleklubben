#turnBanner { position: absolute; left: 50%; top: calc(var(--safe-t) + 92px); transform: translate(-50%, -8px); display: flex; align-items: center; gap: 9px; padding: 8px 16px 8px 8px; border-radius: 40px;
  background: var(--panel2); border: 1px solid var(--pc, var(--line)); font-weight: 700; font-size: 15px; opacity: 0; transition: opacity .3s, transform .3s; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
#turnBanner.show { opacity: 1; transform: translate(-50%, 0); }
#turnBanner .av { width: 28px; height: 28px; font-size: 16px; }
#meter { position: absolute; right: calc(var(--safe-r) + 16px); bottom: calc(var(--safe-b) + 142px); height: min(40vh, 330px); width: 26px; display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: 0; transition: opacity .25s; }
#meter.on, body.aiming #meter { opacity: 1; }
body.lefty #meter { right: auto; left: calc(var(--safe-l) + 16px); }
#meterTrack { position: relative; flex: 1; width: 14px; border-radius: 10px; background: linear-gradient(0deg, rgba(0,0,0,.55), rgba(0,0,0,.35)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 6px 16px rgba(0,0,0,.45); overflow: visible; }
#meterFill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; border-radius: 10px; background: linear-gradient(0deg, #6ed1a0 0%, #f3d18d 60%, #ffb35c 80%); box-shadow: 0 0 12px rgba(243,209,141,.6); }
#meterFill.hard { background: linear-gradient(0deg, #6ed1a0 0%, #f3d18d 55%, #ffb35c 75%, #ff4e5e 100%); box-shadow: 0 0 16px rgba(255,80,90,.7); }
#meterEdge { position: absolute; left: -5px; right: -5px; bottom: 80%; height: 2px; background: #fff; opacity: .7; border-radius: 2px; }
#meterEdge::after { content: ''; position: absolute; left: -3px; right: -3px; top: -1px; bottom: calc(-100% * 0); }
#meterLast { position: absolute; left: -7px; right: -7px; height: 0; border-top: 2px dashed rgba(255,255,255,.55); }
#meterPct { position: absolute; right: 22px; transform: translateY(50%); font: 700 13px/1 Oswald; color: var(--ink); text-shadow: 0 1px 3px rgba(0,0,0,.9); white-space: nowrap; }
#meterPct.hard { color: #ff8f8f; }
body.lefty #meterPct { right: auto; left: 22px; }
#finger { position: absolute; width: 0; height: 0; opacity: 0; transition: opacity .3s; pointer-events: none; }
#finger.show { opacity: 1; }
#finger i { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.95) 0 30%, rgba(255,255,255,.35) 32% 60%, rgba(255,255,255,0) 62%); box-shadow: 0 0 18px rgba(255,255,255,.5); animation: fingerPull 2.2s cubic-bezier(.45,0,.3,1) infinite; }
@keyframes fingerPull { 0% { transform: translateY(0) scale(.7); opacity: 0; } 12% { transform: translateY(0) scale(1); opacity: 1; } 62% { transform: translateY(var(--pull, 170px)) scale(1); opacity: 1; } 72% { transform: translateY(var(--pull, 170px)) scale(1.25); opacity: 0; } 100% { opacity: 0; } }
#meterLbl { font: 600 9px/1 Oswald; letter-spacing: 2px; color: var(--ink3); }
#aimTools { position: absolute; left: 50%; bottom: calc(var(--safe-b) + 18px); transform: translateX(-50%); display: none; }
body.aiming #aimTools { display: block; }
#spinCtl { display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 40px; background: var(--panel2); border: 1px solid var(--line); box-shadow: 0 8px 22px rgba(0,0,0,.45); pointer-events: auto; }
#spinCtl button { width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.04); display: grid; place-items: center; padding: 0; position: relative; }
#spinCtl button.on { background: linear-gradient(180deg, #f3d18d, #c9964a); color: #2a1706; }
#spinCtl button[data-lv="2"]::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--brass2); }
#spinLbl { min-width: 104px; text-align: center; font: 600 12.5px/1.1 Inter; color: var(--ink2); }
#aimHint { position: absolute; left: 50%; bottom: calc(var(--safe-b) + 92px); transform: translateX(-50%); padding: 10px 16px; border-radius: 30px; background: rgba(10,6,4,.72); border: 1px solid var(--line); color: var(--ink);
  font-weight: 600; font-size: 14.5px; opacity: 0; transition: opacity .3s; white-space: nowrap; text-align: center; }
#aimHint.show { opacity: 1; animation: hintPulse 2.4s ease-in-out infinite; }
@keyframes hintPulse { 50% { transform: translate(-50%, 4px); } }
#clock { position: absolute; left: 50%; top: calc(var(--safe-t) + 128px); transform: translateX(-50%); font: 700 15px Oswald; letter-spacing: 1px; padding: 5px 12px; border-radius: 20px; background: rgba(0,0,0,.45); opacity: 0; transition: opacity .3s; }
#clock.show { opacity: 1; }
#clock.low { color: #ffb4b4; background: rgba(120,20,20,.55); }
#emoteBtn { position: absolute; left: calc(var(--safe-l) + 12px); bottom: calc(var(--safe-b) + 18px); font-size: 22px; }
body.lefty #emoteBtn { left: auto; right: calc(var(--safe-r) + 12px); }
#emotePanel { position: absolute; left: calc(var(--safe-l) + 12px); bottom: calc(var(--safe-b) + 72px); width: min(320px, calc(100% - 24px)); padding: 10px; border-radius: 18px; background: var(--panel2); border: 1px solid var(--line);
  display: none; flex-wrap: wrap; gap: 6px; box-shadow: 0 12px 30px rgba(0,0,0,.5); z-index: 3; }
#emotePanel.show { display: flex; animation: sheetUp .2s ease both; }
#emotePanel button { border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.05); border-radius: 12px; padding: 8px 10px; font-size: 14px; font-weight: 700; min-height: 42px; }
#emotePanel button.emo { font-size: 24px; padding: 4px 8px; }
#toasts { position: absolute; left: 0; right: 0; top: 36%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.toast { padding: 10px 20px; border-radius: 40px; background: rgba(12,8,5,.78); border: 1px solid var(--line); font: 700 19px/1.2 Inter; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: toastIn .4s cubic-bezier(.2,1.4,.4,1) both; max-width: 88vw; }
.toast.big { font: 400 50px/1 Yellowtail, cursive; color: #ffe3ea; background: none; border: 0; box-shadow: none; text-shadow: 0 0 6px var(--neon), 0 0 20px var(--neon), 0 0 44px rgba(255,90,130,.6), 0 3px 8px rgba(0,0,0,.8); padding: 0 10px; }
.toast.gold { font: 700 30px/1.1 Oswald; letter-spacing: 1px; color: var(--brass2); background: none; border: 0; box-shadow: none; text-shadow: 0 0 20px rgba(216,170,92,.6), 0 3px 8px rgba(0,0,0,.9); }
.toast.out { animation: toastOut .35s ease both; }
@keyframes toastIn { from { opacity: 0; transform: scale(.6) translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-14px) scale(.96); } }
#floats, #bubbles { position: absolute; inset: 0; }
.float { position: absolute; transform: translate(-50%, -100%); font: 700 22px/1 Oswald; color: #fff; text-shadow: 0 0 10px var(--pc), 0 0 22px var(--pc), 0 2px 4px rgba(0,0,0,.9); animation: floatUp 1.9s ease-out both; white-space: nowrap; }
.float.big { font-size: 30px; }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, -60%) scale(.5); } 15% { opacity: 1; transform: translate(-50%, -100%) scale(1.15); } 30% { transform: translate(-50%, -100%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -170%); } }
.bubble { position: absolute; padding: 7px 13px; border-radius: 16px; background: #fff7ea; color: #24160b; font-weight: 700; font-size: 15px; box-shadow: 0 8px 20px rgba(0,0,0,.45); animation: bubble 3.2s ease both; transform: translateX(-50%); width: max-content; max-width: min(62vw, 260px); text-align: center; line-height: 1.25; }
.bubble.emo { font-size: 30px; padding: 2px 8px; background: none; box-shadow: none; }
.bubble::before { content: ''; position: absolute; top: -6px; left: 50%; margin-left: -6px; border: 6px solid transparent; border-top: 0; border-bottom-color: #fff7ea; }
.bubble.emo::before { display: none; }
@keyframes bubble { 0% { opacity: 0; transform: translate(-50%, -6px) scale(.7); } 10% { opacity: 1; transform: translate(-50%, 0) scale(1.05); } 16% { transform: translate(-50%, 0) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, 8px); } }

#hudTip { position: absolute; left: 0; right: 0; margin-inline: auto; top: calc(var(--safe-t) + 132px); width: min(420px, calc(100% - 110px)); padding: 12px 16px; border-radius: 16px;
  background: rgba(16,10,6,.86); border: 1px solid var(--line2); box-shadow: 0 12px 30px rgba(0,0,0,.5); pointer-events: none; animation: sheetUp .35s both; font-size: 14px; line-height: 1.4; }
#hudTip b { display: block; font: 700 11px/1 Oswald; letter-spacing: 2px; text-transform: uppercase; color: var(--brass2); margin-bottom: 6px; }
#hudTip.out { animation: fadeOut .35s both; }
body.four #hudTip { top: calc(var(--safe-t) + 170px); }
body.tipping #aimHint { opacity: 0 !important; }
@media (orientation: landscape) and (max-height: 520px) { #hudTip { top: calc(var(--safe-t) + 120px); width: min(460px, calc(100% - 240px)); } }
#replayTag { position: absolute; left: 50%; top: calc(var(--safe-t) + 96px); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 18px; border-radius: 14px;
  background: rgba(10,6,4,.7); border: 1px solid rgba(255,90,130,.5); opacity: 0; transition: opacity .3s; pointer-events: none; }
#replayTag.show { opacity: 1; }
#replayTag b { font: 700 15px/1 Oswald; letter-spacing: 3px; color: #ff8fa8; animation: recBlink 1.2s steps(2) infinite; }
#replayTag span { font-size: 11.5px; color: var(--ink3); }
@keyframes recBlink { 50% { opacity: .35; } }
body.replaying #mini, body.replaying #turnBanner, body.replaying #frameInfo { opacity: 0; }
body.replaying::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9; box-shadow: inset 0 0 0 100vmax rgba(0,0,0,0), inset 0 60px 60px -30px rgba(0,0,0,.6), inset 0 -60px 60px -30px rgba(0,0,0,.6); }

/* ---------- Omgångens resultat och slutet ---------- */
.result { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(ellipse at center, rgba(10,6,4,.55), rgba(10,6,4,.85)); animation: fadeIn .3s both; }
.result .card { width: min(440px, 100%); padding: 22px 18px 18px; border-radius: 24px; background: linear-gradient(180deg, rgba(44,31,21,.96), rgba(24,16,11,.98)); border: 1px solid var(--line2); box-shadow: 0 30px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(255,235,200,.06) inset; text-align: center; }
.result h2 { margin: 0; font: 700 13px/1 Oswald; letter-spacing: 3px; text-transform: uppercase; color: var(--brass2); }
.result .big { margin: 10px 0 14px; }
.standings { display: flex; flex-direction: column; gap: 7px; margin: 12px 0 4px; text-align: left; }
.standings .row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 13px; background: rgba(255,255,255,.05); animation: fadeIn .4s both; }
.standings .row.win { background: linear-gradient(90deg, rgba(216,170,92,.28), rgba(216,170,92,.06)); border: 1px solid var(--line2); }
.standings .pos { font: 700 18px Oswald; width: 20px; color: var(--ink3); }
.standings .nm { flex: 1; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.standings .plus { font: 700 16px Oswald; color: var(--good); min-width: 36px; text-align: right; }
.standings .sc { font: 700 24px Oswald; min-width: 36px; text-align: right; }
.trophy { font-size: 64px; line-height: 1; filter: drop-shadow(0 6px 18px rgba(216,170,92,.5)); animation: trophy 1s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes trophy { from { transform: scale(.2) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }
.statline { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin: 10px 0 4px; font-size: 13px; color: var(--ink2); }
.statline b { color: var(--ink); font: 700 17px Oswald; display: block; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
#notice { position: fixed; left: 50%; bottom: calc(var(--safe-b) + 90px); transform: translateX(-50%); z-index: 40; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(460px, calc(100% - 24px)); }
.note { pointer-events: auto; width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; border-radius: 16px; background: linear-gradient(180deg, rgba(48,34,23,.98), rgba(28,19,13,.98)); border: 1px solid var(--line2); box-shadow: 0 16px 40px rgba(0,0,0,.6); animation: sheetUp .3s both; }
.note .grow { flex: 1; font-weight: 600; font-size: 14.5px; }
.note.out { animation: fadeOut .25s both; }

/* ---------- Regler ---------- */
.rules .diagram svg { width: 100%; height: auto; stroke: none; }
.rules ol, .rules ul { padding-left: 20px; margin: 8px 0; color: var(--ink2); }
.rules li { margin: 6px 0; }
.rules b { color: var(--ink); }

/* ---------- Liggande och små skärmar ---------- */
@media (orientation: landscape) and (max-height: 520px) {
  .title .brand { margin-top: 0; }
  .logo.big { font-size: clamp(40px, 9vh, 70px); }
  .title { flex-direction: row; align-items: center; justify-content: space-between; }
  .title .top { position: absolute; top: calc(var(--safe-t) + 10px); left: calc(var(--safe-l) + 16px); right: calc(var(--safe-r) + 16px); width: auto; }
  .title .brand { flex: 1; }
  .title .menu { width: min(400px, 48%); gap: 8px; }
  .btn.big { min-height: 50px; }
  .btn { min-height: 46px; }
  #frameInfo { top: calc(var(--safe-t) + 60px); }
  #mini { top: calc(var(--safe-t) + 64px); width: 48px; }
  #turnBanner { top: calc(var(--safe-t) + 84px); }
  #meter { bottom: calc(var(--safe-b) + 24px); height: 62vh; }
  #aimTools { left: calc(var(--safe-l) + 72px); transform: none; bottom: calc(var(--safe-b) + 12px); }
  #aimHint { bottom: calc(var(--safe-b) + 120px); font-size: 13.5px; }
  #emoteBtn { bottom: calc(var(--safe-b) + 12px); }
  body.four #chips.chips4 { display: flex; }
  #clock { top: calc(var(--safe-t) + 60px); left: auto; right: calc(var(--safe-r) + 70px); transform: none; }
  .chip { max-width: 190px; }
}
@media (max-width: 370px) { .chip .sc { font-size: 22px; } .chip .nm { font-size: 12px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ---------- Pubkväll: telefonen som handkontroll ---------- */
#padCanvas { display: none; position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
body.controller #padCanvas { display: block; }
body.controller #gl { visibility: hidden; }
body.controller { background: radial-gradient(ellipse at 50% 40%, #3a2415 0%, #140c07 70%); }
body.controller #floats, body.controller #mini, body.controller #viewBtn, body.controller #replayTag { display: none !important; }
body.controller #turnBanner { top: 40%; }
body.controller #toasts { top: 32%; }

/* ---------- Pubkväll: TV:n ---------- */
#tvCode { position: absolute; left: calc(var(--safe-l) + 18px); bottom: calc(var(--safe-b) + 16px); display: flex; align-items: baseline; gap: 6px; padding: 10px 16px; border-radius: 14px;
  background: rgba(10,6,4,.72); border: 1px solid var(--line); font: 600 16px Inter, sans-serif; color: var(--ink2); }
#tvCode b { font: 700 24px Oswald; letter-spacing: 3px; color: var(--brass2); }
#tvCode small { margin-left: 8px; font-size: 13px; color: var(--ink3); }
body.tv #emoteBtn, body.tv #emotePanel, body.tv #aimTools, body.tv #aimHint, body.tv #finger { display: none !important; }
body.tv #meter { right: auto; left: calc(var(--safe-l) + 20px); bottom: calc(var(--safe-b) + 120px); }
/* TV:n ses på avstånd: allt i HUD:en förstoras på stora skärmar */
@media (min-width: 1100px) {
  body.tv #topbar, body.tv #frameInfo, body.tv #turnBanner, body.tv #toasts, body.tv #mini, body.tv #meter, body.tv #tvCode, body.tv #clock { zoom: 1.45; }
  body.tv .chip { max-width: 260px; }
}
@media (min-width: 1700px) {
  body.tv #topbar, body.tv #frameInfo, body.tv #turnBanner, body.tv #toasts, body.tv #mini, body.tv #meter, body.tv #tvCode, body.tv #clock { zoom: 1.8; }
}

/* TV:ns väntrum: koden och QR-koden stort till vänster, spelarna till höger */
.tvroom .tvjoin { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; }
.tvroom .tvjoin .qr { display: grid !important; width: auto; height: auto; padding: 14px; background: #fff; border-radius: 16px; }
.tvroom .tvjoin .qr img { width: min(32vh, 300px); height: auto; image-rendering: pixelated; }
.tvroom .code-big { font-size: min(16vh, 120px); }
.tvroom .tvjoin p { font-size: 18px; }
@media (min-width: 900px) {
  .tvroom .sheet { display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; align-items: start; }
  .tvroom .sheet > .head { grid-column: 1 / -1; }
  .tvroom .tvjoin { grid-template-columns: 1fr; justify-items: center; text-align: center; }
}

/* ---------- Utmaningar ---------- */
.stars { display: inline-flex; gap: 2px; font-size: 15px; letter-spacing: 0; }
.stars i { font-style: normal; color: rgba(255,255,255,.18); }
.stars i.on { color: var(--brass2); text-shadow: 0 0 8px rgba(245,214,147,.55); }
.chgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chcard { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 12px 6px 10px; border-radius: 14px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(58,40,26,.92), rgba(30,21,14,.92)); color: var(--ink); font: 600 13px/1.2 Inter, sans-serif; text-align: center; }
.chcard .num { font: 700 22px/1 Oswald; color: var(--brass2); }
.chcard .nm { min-height: 2.4em; display: flex; align-items: center; }
.chcard.locked { opacity: .45; }
.chcard:active { transform: scale(.97); }
.daily { display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 16px; margin: 12px 0 4px; border-radius: 16px; border: 1px solid var(--line2); background: linear-gradient(90deg, rgba(216,170,92,.22), rgba(216,170,92,.05)); }
.daily b { display: block; font-size: 16px; }
.daily small { display: block; color: var(--ink2); font-size: 12.5px; margin-top: 2px; }
.chresult .stars { font-size: 44px; gap: 8px; margin: 6px 0 2px; }
.chresult .stars i.on { animation: starPop .5s cubic-bezier(.3,1.6,.5,1) both; }
.chresult .stars i:nth-child(2) { animation-delay: .18s; }
.chresult .stars i:nth-child(3) { animation-delay: .36s; }
@keyframes starPop { from { transform: scale(.2) rotate(-40deg); opacity: 0; } }
body.challenge #chips { visibility: hidden; }

/* ---------- Pubturnén ---------- */
.pubcard { padding: 14px; margin: 0 0 12px; border-radius: 18px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(40,26,16,.9), rgba(22,14,9,.92)); }
.pubcard.locked { opacity: .5; }
.pubcard .pubhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.pubcard .neon { font: 400 30px/1.1 Yellowtail, cursive; }
.pubcard .city { font: 600 11px Oswald; letter-spacing: 2px; text-transform: uppercase; color: var(--ink3); }
.pubcard p { margin: 6px 0 8px; color: var(--ink2); font-size: 13.5px; }
.pubcard .traits { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }

/* ---------- Startskärmen före första trycket (ljudet) ---------- */
.title .menu, .title .top { transition: opacity .55s ease, transform .55s cubic-bezier(.2,.8,.2,1); }
.title.gate .menu, .title.gate .top { opacity: 0; transform: translateY(24px); pointer-events: none; }
.title .gatehint { position: absolute; left: 50%; bottom: calc(var(--safe-b) + 14vh); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
  transition: opacity .45s ease; }
.title .gatehint span { font: 700 21px/1 Inter, sans-serif; letter-spacing: .3px; color: var(--ink); padding: 16px 30px; border-radius: 40px; border: 1px solid rgba(245,214,147,.45);
  background: rgba(20,12,7,.55); box-shadow: 0 0 0 1px rgba(255,235,200,.06) inset, 0 0 34px rgba(245,214,147,.18); animation: gatePulse 2.2s ease-in-out infinite; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.title .gatehint small { font: 600 12px/1 Inter, sans-serif; color: var(--ink3); letter-spacing: .4px; }
.title:not(.gate) .gatehint { opacity: 0; }
@keyframes gatePulse { 50% { box-shadow: 0 0 0 1px rgba(255,235,200,.1) inset, 0 0 46px rgba(245,214,147,.34); transform: scale(1.03); } }
#soundHint { position: fixed; z-index: 60; left: 50%; top: calc(var(--safe-t) + 64px); transform: translateX(-50%); padding: 8px 14px; border-radius: 20px; border: 1px solid var(--line);
  background: rgba(10,6,4,.8); color: var(--ink2); font: 600 13px Inter, sans-serif; transition: opacity .35s; }
#soundHint.out { opacity: 0; }

/* ---------- Märken och upplåsningar ---------- */
.picks { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.08);
  background: rgba(0,0,0,.3); color: var(--ink2); font-weight: 600; font-size: 14px; }
.pick .pico { font-size: 17px; line-height: 1; }
.pick.on { background: linear-gradient(180deg, #f3d18d, #cf9d50); color: #2a1706; border-color: transparent; }
.pick.locked { opacity: .55; }
.mbadges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }

.mbadge small.reward { grid-area: r; color: var(--brass2); }
.badgetoast { position: fixed; z-index: 80; left: 50%; top: calc(var(--safe-t) + 14px); transform: translateX(-50%); display: flex; align-items: center; gap: 12px;

// Skapar HTML-element: h('button', {class: 'btn', onclick: fn}, 'Text', h('span', ...))
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(e.dataset, v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}

// Animationer som går på skärmens bilduppdatering (med en reserv om fliken inte ritas)
const Anim = {
  list: new Set(),
  tween(ms, fn, ease = t => t) {
    return new Promise(res => {
      ms *= Time.scale;
      if (ms <= 1) { fn(1); res(); return; }
      const a = {t0: performance.now(), ms, fn, ease, res};
      this.list.add(a);
      a.guard = setTimeout(() => { if (this.list.has(a)) { this.list.delete(a); try { fn(1); } catch (e) { console.error(e); } res(); } }, ms + 500);
    });
  },
  tick(now) {
    for (const a of [...this.list]) {
      const t = Math.min(1, (now - a.t0) / a.ms);
      try { a.fn(a.ease(t)); } catch (e) { console.error(e); }
      if (t >= 1) { this.list.delete(a); clearTimeout(a.guard); a.res(); }
    }
  }
};

const libLoading = {};
function loadLib(name, urls, test) {
  if (test()) return Promise.resolve();
  if (libLoading[name]) return libLoading[name];
  return (libLoading[name] = (async () => {
    for (const src of urls) {
      try {
        await new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = res; s.onerror = rej; document.head.append(s); setTimeout(rej, 15000); });
        if (test()) return;
      } catch (e) { /* prova nästa adress */ }
    }
    libLoading[name] = null;
    throw new Error('Kunde inte ladda ' + name);
  })());
}

// Måtten följer ett riktigt turneringsbord (22 fot). Koordinater i meter: x åt sidan (0 = mitten),
// y längs bordet från den närmsta kanten (0) till den bortre kanten (L). 3D-världen har X = x, Z = -y.
//
// Simuleringen är deterministisk: den använder bara + - * / och Math.sqrt (som ger exakt samma resultat i alla
// webbläsare), ett fast tidssteg och en fast ordning. Samma kast på samma bord blir därför exakt samma resultat
// på alla telefoner i en match över nätet. Vinklar (sin och cos) räknas bara ut en gång, av den som kastar,
// och skickas som färdiga hastigheter.
const TABLE = (() => {
  const L = 6.7056, W = 0.508, R = 0.02935;
  return {
    L, W, R,
    HALF: W / 2,
    H: 0.025,              // puckens höjd
    TOP: 0.80,             // spelytans höjd över golvet
    Y0: 0.30,              // kastlinjen (puckens mitt när den släpps)
    FOUL: L - 1.8288,      // bortre foul-linjen: hela pucken måste förbi den för att vara med
    Z2: L - 0.3048,        // 2-poängslinjen
    Z3: L - 0.1524,        // 3-poängslinjen
    GUTTER: 0.095,         // rännornas bredd
    DROP: 0.055,           // rännornas djup
    END: 0.16              // rännan bakom bordets ändar
  };
})();

const Phys = (() => {
  const P = {};
  const {L, HALF, R} = TABLE;
  const D2 = 4 * R * R;
  P.DT = 1 / 240;
  P.DECEL = 0.50;          // inbromsning från friktionen (m/s²), bordet är pudrat med silikonpärlor
  // Bordet är välvt som ett riktigt bord: lite överallt (CROWN_LIN) och tydligt mot kanterna (CROWN, växer som
  // (x/halva bredden)³). Mitt på går pucken rakt, en bit ut glider den några centimeter utåt, och ett rakt kast
  // längs kanten glider ner i rännan när det saktar in. Sidokraft i m/s² vid kanten; kanterna ligger ungefär en
  // halv millimeter lägre än mitten.
  P.CROWN = 0.045;
  P.CROWN_LIN = 0.010;
  // Bordets egenskaper (pubturnén): friktionen och hur välvt det är. Kraftmätaren räknar alltid med ett vanligt
  // bord (DECEL_REF), så på ett snabbare bord glider samma drag längre. setTable(null) = vanligt bord.
  P.DECEL_REF = 0.50;
  P.setTable = t => {
    P.DECEL = t && t.decel > 0 ? t.decel : P.DECEL_REF;
    const k = t && t.crown != null ? t.crown : 1;
    P.CROWN = 0.045 * k; P.CROWN_LIN = 0.010 * k;
  };
  P.CURL = 0.0020;         // skruv ger en svag kurva (m/s² per rad/s)
  P.SPIN_DECAY = 1.0;      // skruven avtar (rad/s²)
  P.E = 0.86;              // studsighet mellan två puckar (stål mot stål)
  P.VMAX = 4.4;
  P.SPIN_MAX = 7;
  P.MAX_T = 40;

  // Håller ett kast inom det tillåtna (det som kommer över nätet kontrolleras också här)
  P.cleanInput = inp => {
    const num = v => (typeof v === 'number' && isFinite(v)) ? v : 0;
    let x = num(inp.x), vx = num(inp.vx), vy = num(inp.vy), w = num(inp.w);
    x = Math.max(-HALF + R, Math.min(HALF - R, x));
    vy = Math.max(0.05, Math.min(P.VMAX, vy));
    const lim = vy * 0.12;
    vx = Math.max(-lim, Math.min(lim, vx));
    w = Math.max(-P.SPIN_MAX, Math.min(P.SPIN_MAX, w));
    return {x, vx, vy, w};
  };

  // pucks: [{id, owner, x, y}] (liggande puckar). Returnerar en simulering som kan stegas eller köras klart.
  P.create = (pucks, launch) => {
    const S = {t: 0, steps: 0, done: false, events: [], moving: 0};
    S.p = pucks.map(q => ({id: q.id, owner: q.owner, x: q.x, y: q.y, vx: 0, vy: 0, w: 0, out: 0, fx: 0, fy: 0}));
    if (launch) {
      const i = P.cleanInput(launch.input);
      S.p.push({id: launch.id, owner: launch.owner, x: i.x, y: TABLE.Y0, vx: i.vx, vy: i.vy, w: i.w, out: 0, fx: 0, fy: 0});
      S.shot = launch.id;
    }
    return S;
  };

  // Ett tidssteg. Returnerar true så länge något rör sig.
  P.step = S => {
    if (S.done) return false;
    const dt = P.DT, ps = S.p, n = ps.length, dv = P.DECEL * dt;
    let moving = 0;
    for (let i = 0; i < n; i++) {
      const q = ps[i];
      if (q.out || (q.vx === 0 && q.vy === 0)) continue;
      const sp = Math.sqrt(q.vx * q.vx + q.vy * q.vy);
      if (sp <= dv) { q.vx = 0; q.vy = 0; q.w = 0; S.events.push({t: S.t, k: 'stop', a: q.id}); continue; }
      const ux = q.vx / sp, uy = q.vy / sp;
      const u = q.x / HALF;
      let ax = -P.DECEL * ux + (P.CROWN_LIN + P.CROWN * u * u) * u + P.CURL * q.w * uy;
      let ay = -P.DECEL * uy - P.CURL * q.w * ux;
      q.vx += ax * dt; q.vy += ay * dt;
      if (q.w > 0) { q.w -= P.SPIN_DECAY * dt; if (q.w < 0) q.w = 0; }
      else if (q.w < 0) { q.w += P.SPIN_DECAY * dt; if (q.w > 0) q.w = 0; }
      q.x += q.vx * dt; q.y += q.vy * dt;
      moving++;
    }
    // Krockar mellan puckar (i fast ordning)
    for (let i = 0; i < n; i++) {
      const a = ps[i];
      if (a.out) continue;
      for (let j = i + 1; j < n; j++) {
        const b = ps[j];
        if (b.out) continue;
        const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
        if (d2 >= D2) continue;
        let d = Math.sqrt(d2), nx, ny;
        if (d > 1e-9) { nx = dx / d; ny = dy / d; } else { d = 0; nx = 0; ny = 1; }
        const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rv < 0) {
          const jm = -(1 + P.E) * rv / 2;
          a.vx -= jm * nx; a.vy -= jm * ny;
          b.vx += jm * nx; b.vy += jm * ny;
          a.w *= 0.7; b.w *= 0.7;
          S.events.push({t: S.t, k: 'hit', a: a.id, b: b.id, v: -rv, x: (a.x + b.x) / 2, y: (a.y + b.y) / 2});
          moving++;
        }
        const push = (2 * R - d) / 2;
        a.x -= nx * push; a.y -= ny * push;
        b.x += nx * push; b.y += ny * push;
      }
    }
    // Över kanten: mitten av pucken är utanför spelytan
    for (let i = 0; i < n; i++) {
      const q = ps[i];
      if (q.out) continue;
      let edge = 0;
      if (q.y > L) edge = 3; else if (q.x > HALF) edge = 2; else if (q.x < -HALF) edge = 1; else if (q.y < 0) edge = 4;
      if (edge) {
        q.out = edge; q.fx = q.vx; q.fy = q.vy;
        S.events.push({t: S.t, k: 'fall', a: q.id, e: edge, x: q.x, y: q.y, vx: q.vx, vy: q.vy});
        q.vx = 0; q.vy = 0; q.w = 0;
      }
    }
    S.t += dt; S.steps++;
    S.moving = moving;
    if (!moving || S.t > P.MAX_T) {
      S.done = true;
      for (const q of ps) { q.vx = 0; q.vy = 0; q.w = 0; }
    }
    return !S.done;
  };

  P.run = S => { while (!S.done) P.step(S); return S; };

  // Kastar och kör klart: {pucks (på bordet efter kastet, även döda), fell (ids), events, t}
  P.simulate = (pucks, launch) => {
    const S = P.run(P.create(pucks, launch));
    return {S, t: S.t, events: S.events};
  };

  // Styrkan i kastet (0..1 från kraftmätaren) till fart. De första 20 % tar pucken fram till foul-linjen (där
  // ligger inga poäng, så den delen är kort), 20–80 % är poängområdet fram till bortre kanten (rakt mot längden, så
  // varje pixel betyder lika mycket där) och över 80 % blir det hårda slag för att slå ut andras puckar.
  P.POWER_EDGE = 0.8;
  P.POWER_FOUL = 0.2;
  P.D_MIN = 2.0;
  const dEnd = L - TABLE.Y0, dFoul = TABLE.FOUL + R - TABLE.Y0 + 0.02;
  // Fart som ger en viss glidsträcka. Med tidsstegen stannar pucken v*dt/2 tidigare än formeln v^2/(2a)
  // säger: d = v^2/(2a) - v*dt/2, alltså v = (a*dt + sqrt((a*dt)^2 + 8*a*d)) / 2.
  const vFor = d => { const adt = P.DECEL_REF * P.DT; return (adt + Math.sqrt(adt * adt + 8 * P.DECEL_REF * d)) / 2; };
  const dFor = v => v * v / (2 * P.DECEL_REF) - v * P.DT / 2;
  P.distFor = p => p <= P.POWER_FOUL ? P.D_MIN + (dFoul - P.D_MIN) * Math.max(0, p) / P.POWER_FOUL
    : dFoul + (dEnd - dFoul) * (Math.min(p, P.POWER_EDGE) - P.POWER_FOUL) / (P.POWER_EDGE - P.POWER_FOUL);
  P.powerForDist = d => d <= dFoul ? Math.max(0, (d - P.D_MIN) / (dFoul - P.D_MIN) * P.POWER_FOUL)
    : P.POWER_FOUL + (d - dFoul) / (dEnd - dFoul) * (P.POWER_EDGE - P.POWER_FOUL);
  P.speedFor = p => {
    if (p <= P.POWER_EDGE) return vFor(P.distFor(p));
    const vEnd = vFor(dEnd);
    return vEnd + (P.VMAX - vEnd) * Math.min(1, (p - P.POWER_EDGE) / (1 - P.POWER_EDGE));
  };
  P.powerFor = v => {
    const vEnd = vFor(dEnd);
    if (v <= vEnd) return P.powerForDist(dFor(v));
    return P.POWER_EDGE + (1 - P.POWER_EDGE) * Math.min(1, (v - vEnd) / (P.VMAX - vEnd));
  };
  P.travelFor = v => dFor(v);
  // Vinkel (radianer) och fart till hastighet. Används bara av den som kastar; resultatet skickas som tal.
  P.inputFrom = (x, angle, speed, spin) => P.cleanInput({x, vx: speed * Math.sin(angle), vy: speed * Math.cos(angle), w: spin});

  // Zonen för en puck som ligger på bordet: 4 hängare, 3, 2, 1, 0 = död (inte helt förbi foul-linjen)
  P.zone = q => {
    if (q.y + R > L) return 4;
    const back = q.y - R;
    if (back >= TABLE.Z3) return 3;
    if (back >= TABLE.Z2) return 2;
    if (back > TABLE.FOUL) return 1;
    return 0;
  };
  return P;
})();

/* ---- 02-rules.js ---- */
/* ================= Reglerna ================= */
// En match: spelarna turas om att kasta sina puckar (vikter) i en omgång (en "ram"). När alla har kastat räknas poängen.
//   Klassisk räkning: bara den som har puck längst bort får poäng, för varje egen puck som ligger längre bort än
//   motståndarnas bästa. 1, 2 eller 3 poäng efter zonen, 4 för en hängare (sticker ut över kanten).
//   Alla räknar: varje spelare får poäng för alla sina puckar som ligger kvar (bra när man är tre eller fyra).
//   Hängarjakt: alla räknar, och en hängare ger 10 poäng (i stället för 4).
//   Sist kvar: zonerna spelar ingen roll; den som har flest puckar kvar får en poäng för varje egen puck på bordet.
// En puck som inte helt har passerat bortre foul-linjen är död och tas bort. Först till målet vinner.
// Två spelare: den som fick poäng kastar först i nästa omgång (den andra får sista kastet, "hammaren").
// Tre eller fyra: den som leder kastar först och den som ligger sist kastar sist.
// Lag (2 mot 2): poängen räknas per lag (en "sida"), lagen kastar vartannat och kamraterna varannan gång, två puckar
// var. Utan lag är varje spelare en egen sida. Turerna och puckarna hör alltid till spelarna (platserna).
const Rules = (() => {
  const RU = {};
  RU.COLORS = {
    red: {name: 'Röd', hex: '#d62d3a', dark: '#8f1622'},
    blue: {name: 'Blå', hex: '#2a6fe0', dark: '#173f86'},
    gold: {name: 'Guld', hex: '#f0b429', dark: '#9c6c08'},
    green: {name: 'Grön', hex: '#25a55f', dark: '#11623a'},
    purple: {name: 'Lila', hex: '#8f4fd6', dark: '#552a8a'},
    white: {name: 'Vit', hex: '#eef0f3', dark: '#9aa1ab'}
  };
  RU.COLOR_KEYS = Object.keys(RU.COLORS);
  // lagens färger och namn (puckarna får lagets färg)
  RU.TEAM_COLORS = ['red', 'blue'];
  RU.TEAM_NAMES = ['Röda laget', 'Blå laget'];
  RU.perPlayer = n => n <= 2 ? 4 : 3;

  const clone = o => JSON.parse(JSON.stringify(o));
  // lag: exakt två lag med två spelare var (platsnummer), annars inga lag
  const validTeams = (teams, n) => Array.isArray(teams) && teams.length === 2 && teams.every(t => Array.isArray(t) && t.length === 2)
    && n === 4 && [...teams[0], ...teams[1]].sort().join() === '0,1,2,3';

  // seats: [{name, color, avatar, kind: 'human'|'cpu', level, cid, dev}], teams: [[0, 2], [1, 3]] eller null
  RU.create = ({seats, target = 15, mode = null, seed = (Math.random() * 1e9) | 0, per = null, practice = false, id = null, teams = null}) => {
    const n = seats.length;
    const rnd = seeded(seed);
    const T = validTeams(teams, n) ? teams.map(t => t.slice()) : null;
    let order;
    if (T) {
      // lagen kastar vartannat och kamraterna varannan gång: A1, B1, A2, B2 (två varv per omgång)
      const [ta, tb] = rnd() < .5 ? [T[0], T[1]] : [T[1], T[0]];
      const a = rnd() < .5 ? ta : [ta[1], ta[0]], b = rnd() < .5 ? tb : [tb[1], tb[0]];
      order = [a[0], b[0], a[1], b[1]];
    } else {
      order = seats.map((s, i) => i);
      if (n > 1) shuffle(order, rnd);
    }
    const nSides = T ? T.length : n;
    const sc = clone(seats);
    if (T) T.forEach((t, k) => t.forEach(i => { sc[i].color = RU.TEAM_COLORS[k]; sc[i].team = k; }));
    return {
      v: 1, seed, practice, id: id || String(seed),
      mode: mode || (nSides <= 2 ? 'classic' : 'all'),
      target, per: per || (practice ? 8 : T ? 2 : RU.perPlayer(n)),
      seats: sc, teams: T,
      scores: Array.from({length: nSides}, () => 0),
      frame: 1, order, n: 0, k: 0,
      pucks: [], gutter: [], nextId: 1,
      last: null, frames: [], over: false, winner: -1
    };
  };

  /* ---------- Sidor (en spelare eller ett lag) ---------- */
  RU.sides = m => m.teams ? m.teams.length : m.seats.length;
  RU.side = (m, seat) => {
    if (!m.teams) return seat;
    for (let i = 0; i < m.teams.length; i++) if (m.teams[i].indexOf(seat) >= 0) return i;
    return -1;
  };
  RU.sideSeats = (m, side) => m.teams ? (m.teams[side] || []) : [side];
  RU.sideName = (m, side) => RU.sideSeats(m, side).map(i => m.seats[i] ? m.seats[i].name : '?').join(' & ');
  RU.sideColor = (m, side) => RU.colorOf(m, RU.sideSeats(m, side)[0]);
  RU.sameSide = (m, a, b) => RU.side(m, a) === RU.side(m, b);

  // (i utmaningarna kastar bara en av platserna)
  RU.throwsPerFrame = m => m.per * m.order.length;
  RU.current = m => m.over ? -1 : m.order[m.n % m.order.length];
  RU.thrown = (m, seat) => { let c = 0; for (let i = 0; i < m.n; i++) if (m.order[i % m.order.length] === seat) c++; return c; };
  RU.left = (m, seat) => m.per - RU.thrown(m, seat);
  RU.sideLeft = (m, side) => RU.sideSeats(m, side).reduce((a, i) => a + RU.left(m, i), 0);

  // Poängen på bordet just nu, per sida. counted: [{id, owner, side, pts}]
  // Anrop: RU.score(puckar, m) eller (äldre) RU.score(puckar, antal, läge) där varje ägare är en egen sida.
  RU.score = (pucks, a, b) => {
    const mm = a && typeof a === 'object' ? a : null;
    const nSides = mm ? RU.sides(mm) : a, mode = mm ? mm.mode : b;
    const sideOf = mm && mm.teams ? (o => RU.side(mm, o)) : (o => o);
    const points = Array.from({length: nSides}, () => 0), counted = [];
    const alive = pucks.filter(q => Phys.zone(q) > 0);
    if (!alive.length) return {points, leader: -1, counted};
    const topOf = arr => { let best = -1, leader = -1, tie = false; arr.forEach((p, i) => { if (p > best) { best = p; leader = i; tie = false; } else if (p === best) tie = true; }); return tie || best <= 0 ? -1 : leader; };
    if (mode === 'all' || mode === 'hang') {
      for (const q of alive) {
        const z = Phys.zone(q), pts = mode === 'hang' && z === 4 ? 10 : z;
        if (!pts) continue;
        const sd = sideOf(q.owner); points[sd] += pts; counted.push({id: q.id, owner: q.owner, side: sd, pts});
      }
      return {points, leader: topOf(points), counted};
    }
    if (mode === 'last') {
      // flest puckar kvar vinner omgången; har flera lika många avgör den som ligger längst bort
      const cnt = Array.from({length: nSides}, () => 0), far = Array.from({length: nSides}, () => -1);
      for (const q of alive) { const sd = sideOf(q.owner); cnt[sd]++; if (q.y > far[sd]) far[sd] = q.y; }
      const most = Math.max(...cnt);
      let leader = -1, fy = -1, tie = false;
      cnt.forEach((c, i) => { if (c !== most) return; if (far[i] > fy) { fy = far[i]; leader = i; tie = false; } else if (far[i] === fy) tie = true; });
      if (leader < 0 || tie || most <= 0) return {points, leader: -1, counted};
      points[leader] = cnt[leader];
      alive.filter(q => sideOf(q.owner) === leader).forEach(q => counted.push({id: q.id, owner: q.owner, side: leader, pts: 1}));
      return {points, leader, counted};
    }
    // klassisk: längst bort vinner omgången
    const best = Array.from({length: nSides}, () => -1);
    for (const q of alive) { const sd = sideOf(q.owner); if (q.y > best[sd]) best[sd] = q.y; }
    let top = -1, leader = -1, tie = false;
    best.forEach((y, i) => { if (y > top) { top = y; leader = i; tie = false; } else if (y === top && y >= 0) tie = true; });
    if (leader < 0 || tie) return {points, leader: -1, counted};
    let second = -1;
    best.forEach((y, i) => { if (i !== leader && y > second) second = y; });
    for (const q of alive) if (sideOf(q.owner) === leader && q.y > second) { const pts = Phys.zone(q); points[leader] += pts; counted.push({id: q.id, owner: q.owner, side: leader, pts}); }
    return {points, leader, counted};
  };

  function nextOrder(m, framePoints) {
    if (m.teams) {
      // laget som fick poäng börjar (det andra får hammaren), och kamraterna byter plats inom laget
      const prev = m.order, first = RU.side(m, prev[0]);
      const scorer = framePoints.findIndex(p => p > 0);
      const lead = scorer >= 0 ? scorer : first, other = 1 - lead;
      const swap = side => { const s = prev.filter(x => RU.side(m, x) === side); return [s[1], s[0]]; };
      const a = swap(lead), b = swap(other);
      return [a[0], b[0], a[1], b[1]];
    }
    const n = m.seats.length;
    if (n === 1) return m.order.slice();
    if (n === 2) {
      const scorer = framePoints.findIndex(p => p > 0);
      if (scorer < 0) return m.order.slice();
      return [scorer, 1 - scorer];
    }
    const prev = m.order.slice();
    return prev.slice().sort((a, b) => (m.scores[b] - m.scores[a]) || (prev.indexOf(a) - prev.indexOf(b)));
  }

  // Ett kast. input = {x, vx, vy, w}. Returnerar det nya läget (m ändras inte) och vad som hände.
  RU.apply = (m0, input) => {
    const m = clone(m0);
    const seat = RU.current(m);
    if (seat < 0) throw new Error('Matchen är slut');
    const side = RU.side(m, seat);
    const id = m.nextId++;
    const before = RU.score(m.pucks, m);
    const res = Phys.simulate(m.pucks, {id, owner: seat, input});
    const S = res.S, fell = [], dead = [];
    const kept = [];
    for (const q of S.p) {
      if (q.out) { fell.push({id: q.id, owner: q.owner, e: q.out}); m.gutter.push({id: q.id, owner: q.owner, x: q.x, y: q.y, e: q.out}); continue; }
      const z = Phys.zone(q);
      if (z === 0) { dead.push({id: q.id, owner: q.owner}); continue; }
      kept.push({id: q.id, owner: q.owner, x: q.x, y: q.y});
    }
    m.pucks = kept;
    const shot = S.p.find(q => q.id === id);
    const shotZone = shot.out ? 0 : Phys.zone(shot);
    const knocked = fell.concat(dead).filter(q => q.id !== id && RU.side(m, q.owner) !== side).length;
    const own = fell.concat(dead).filter(q => q.id !== id && RU.side(m, q.owner) === side).length;
    const hits = res.events.filter(e => e.k === 'hit').length;
    m.n++; m.k++; m.v++;
    const after = RU.score(m.pucks, m);
    const sum = {k: m.k, seat, side, id, input: {x: input.x, vx: input.vx, vy: input.vy, w: input.w}, shotZone, fell: fell.map(q => q.id), dead: dead.map(q => q.id), knocked, own, hits,
      leaderBefore: before.leader, leader: after.leader, t: res.t, frameEnd: null, win: -1};
    if (m.n >= RU.throwsPerFrame(m)) {
      const fp = after.points;
      fp.forEach((p, i) => { m.scores[i] += p; });
      m.frames.push({frame: m.frame, points: fp, leader: after.leader, counted: after.counted});
      sum.frameEnd = {frame: m.frame, points: fp, leader: after.leader, counted: after.counted, pucks: m.pucks.slice(), gutter: m.gutter.slice()};
      // vinnare (en sida)?
      const top = Math.max(...m.scores);
      if (!m.practice && top >= m.target && m.scores.filter(s => s === top).length === 1) {
        m.over = true; m.winner = m.scores.indexOf(top); sum.win = m.winner;
      } else {
        m.order = nextOrder(m, fp);
        m.frame++; m.n = 0; m.pucks = []; m.gutter = [];
      }
    }
    m.last = sum;
    return {m, S, sum};
  };

  // Hoppar över ett kast (t.ex. när tiden tar slut och ingen kan kasta): räknas som en död puck
  RU.skip = m0 => RU.apply(m0, {x: 0, vx: 0, vy: 0.05, w: 0});

  // Tabellen: sidorna sorterade efter poäng
  RU.standings = m => Array.from({length: RU.sides(m)}, (x, i) => i).sort((a, b) => m.scores[b] - m.scores[a] || a - b);
  RU.colorOf = (m, seat) => RU.COLORS[m.seats[seat] && m.seats[seat].color] || RU.COLORS.red;
  // Poängräkningarna (namn och standardmål)
  RU.MODES = {classic: 'Klassisk', all: 'Alla räknar', hang: 'Hängarjakt', last: 'Sist kvar'};
  RU.modeTarget = (mode, sides) => mode === 'hang' ? 21 : mode === 'last' ? 7 : sides <= 2 ? 15 : 11;
  return RU;
})();

/* ---- 02b-challenges.js ---- */
/* ================= Utmaningar och dagens utmaning ================= */
// Banor för en spelare: en uppställning på bordet, några kast och ett mål. Stjärnorna (1-3) beror på hur bra
// eller hur snabbt målet nåddes. Dagens utmaning byggs av datumet, så att den är likadan för alla samma dag.
// Egna puckar ägs av plats 0 (röd), "husets" av plats 1 (blå, kastar aldrig).
const Challenges = (() => {
  const C = {};
  const {L, R, FOUL, Z2, Z3} = TABLE;
  const zone = q => Phys.zone(q);
  const mine = ps => ps.filter(q => q.owner === 0), theirs = ps => ps.filter(q => q.owner === 1);
  // stjärnor efter vilket kast som lyckades (1:a = 3, 2:a = 2, annars 1)
  const byTry = (n, fast = 1) => (n <= fast ? 3 : n <= fast + 1 ? 2 : 1);
  // skyddad: en egen puck ligger framför (närmare) och i samma fil
  const guarded = (q, ps) => ps.some(g => g !== q && g.owner === q.owner && g.y < q.y - 2 * R && Math.abs(g.x - q.x) < 2.1 * R);
  // Varje bana: id, namn, text (målet), kast, puckar [[ägare, x, y]], läge ('all'/'classic') och check.
  // check({pucks, sum, n, left, sums}) -> {stars} när målet är nått, {fail: true} när det inte längre går, annars null
  C.LEVELS = [
    {id: 'trean', name: 'Första trean', text: 'Lägg en puck i 3-zonen längst bort.', throws: 3, pucks: [],
      check: ({pucks, n}) => mine(pucks).some(q => zone(q) >= 3) ? {stars: byTry(n)} : null},
    {id: 'tvaan', name: 'Mitt i tvåan', text: 'Stanna i 2-zonen, varken längre eller kortare.', throws: 3, pucks: [],
      check: ({sum, pucks, n}) => { const q = pucks.find(p => p.id === sum.id); return q && zone(q) === 2 ? {stars: byTry(n)} : null; }},
    {id: 'hangaren', name: 'Hängaren', text: 'Låt pucken hänga ut över kanten (4 poäng).', throws: 4, pucks: [],
      check: ({pucks, n}) => mine(pucks).some(q => zone(q) === 4) ? {stars: byTry(n, 2)} : null},
    {id: 'utslaget', name: 'Utslaget', text: 'Slå ner den blå pucken. Stannar din kvar i 3-zonen blir det tre stjärnor.', throws: 2, pucks: [[1, 0.02, L - 0.55]],
      check: ({pucks, sum}) => {
        if (theirs(pucks).length) return null;
        const q = pucks.find(p => p.id === sum.id);
        return {stars: q && zone(q) >= 3 ? 3 : q ? 2 : 1};
      }},
    {id: 'kanten', name: 'Längs kanten', text: 'Lägg en puck i 2- eller 3-zonen nära kanten. Bordet lutar utåt där!', throws: 3, pucks: [],
      check: ({pucks, n}) => mine(pucks).some(q => zone(q) >= 2 && Math.abs(q.x) > 0.15) ? {stars: byTry(n)} : null},
    {id: 'dubbel', name: 'Dubbelträffen', text: 'Slå ner båda blå puckarna med ett enda kast.', throws: 2, pucks: [[1, -0.035, L - 0.4], [1, 0.04, L - 0.33]],
      check: ({sum, pucks, n}) => {
        if (sum.knocked >= 2) return {stars: n === 1 ? (pucks.some(p => p.id === sum.id) ? 3 : 2) : 1};
        return null;
      }},
    {id: 'garden', name: 'Bakom garden', text: 'Din röda garde står i mitten. Lägg en puck i 3-zonen gömd bakom den.', throws: 3, pucks: [[0, 0.0, FOUL + 0.35]],
      check: ({pucks, n}) => mine(pucks).some(q => zone(q) >= 3 && guarded(q, pucks)) ? {stars: byTry(n)} : null},
    {id: 'skruven', name: 'Runt hindret', text: 'Två blå puckar blockerar mitten. Ta dig förbi till 3-zonen, med skruv eller snett kast.', throws: 3, pucks: [[1, -0.035, L - 1.1], [1, 0.035, L - 1.1]],
      check: ({pucks, n}) => mine(pucks).some(q => zone(q) >= 3) ? {stars: byTry(n)} : null},
    {id: 'poang', name: 'Poängjakten', text: 'Samla så många poäng du kan med fyra puckar. 7, 9 och 11 poäng ger stjärnor.', throws: 4, pucks: [],
      check: ({pucks, left}) => {
        const pts = mine(pucks).reduce((a, q) => a + zone(q), 0);
        if (left > 0) return pts >= 11 ? {stars: 3, pts} : null;
        return pts >= 7 ? {stars: pts >= 11 ? 3 : pts >= 9 ? 2 : 1, pts} : {fail: true, pts};
      }},
    {id: 'rensa', name: 'Rensa bordet', text: 'Slå ner alla tre blå puckar. Klarar du det på tre kast blir det tre stjärnor.', throws: 4, pucks: [[1, -0.11, L - 0.2], [1, 0.06, L - 0.5], [1, 0.13, L - 1.2]],
      check: ({pucks, n}) => theirs(pucks).length ? null : {stars: n <= 3 ? 3 : 2}},
    {id: 'hammaren', name: 'Hammaren', text: 'Sista kastet i omgången och blå ligger bra till. Vinn omgången (klassisk räkning)!', throws: 1, mode: 'classic', pucks: [[1, 0.06, L - 0.14], [1, -0.07, L - 0.32], [1, 0.0, L - 1.3]],
      check: ({pucks}) => {
        const sc = Rules.score(pucks, 2, 'classic');
        if (sc.leader !== 0) return {fail: true};
        return {stars: sc.points[0] >= 4 ? 3 : sc.points[0] >= 3 ? 2 : 1, pts: sc.points[0]};
      }},
    {id: 'mastaren', name: 'Mästarprovet', text: 'Tre puckar, alla i 3-zonen. En i trean ger en stjärna, alla tre ger tre.', throws: 3, pucks: [],
      check: ({pucks, left}) => {
        const k = mine(pucks).filter(q => zone(q) >= 3).length;
        if (k >= 3) return {stars: 3};
        if (left > 0) return null;
        return k ? {stars: k} : {fail: true};
      }}
  ];
  C.get = id => C.LEVELS.find(l => l.id === id) || null;

  /* ---------- Dagens utmaning ---------- */
  const dayKey = (d = new Date()) => d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  C.today = () => dayKey();
  // 2-4 blå puckar i poängområdet (på olika ställen varje dag), tre egna kast. Poängen: dina puckars zoner
  // minus de blå som ligger kvar.
  C.daily = (key = dayKey()) => {
    const rnd = seeded(key * 7 + 3);
    const n = 2 + Math.floor(rnd() * 3), pucks = [];
    for (let i = 0; i < n && pucks.length < n; i++) {
      for (let tries = 0; tries < 20; tries++) {
        const x = (rnd() - 0.5) * 0.36, y = L - 0.12 - rnd() * 1.4;
        if (pucks.every(([, px, py]) => Math.hypot(px - x, py - y) > 2.6 * R)) { pucks.push([1, +x.toFixed(3), +y.toFixed(3)]); break; }
      }
    }
    return {id: 'dagens', daily: key, name: 'Dagens utmaning', text: 'Tre kast: så många poäng som möjligt. Blå puckar som ligger kvar drar av sina poäng.', throws: 3, pucks,
      check: ({pucks, left}) => {
        const pts = mine(pucks).reduce((a, q) => a + zone(q), 0) - theirs(pucks).reduce((a, q) => a + zone(q), 0);
        if (left > 0) return null;
        return {stars: pts >= 9 ? 3 : pts >= 5 ? 2 : pts >= 1 ? 1 : 0, pts, score: true};
      }};
  };

  // Ett läge för en bana: jag (plats 0) kastar, huset (plats 1) har bara puckarna
  C.create = (level, me) => {
    const seats = [me, {name: 'Huset', avatar: '🏠', color: me.color === 'blue' ? 'gold' : 'blue', kind: 'cpu', level: 'medel'}];
    const m = Rules.create({seats, target: 999, mode: level.mode || 'all', practice: true, per: level.throws, id: 'ch-' + level.id + '-' + randId(4)});
    m.order = [0];
    m.challenge = level.daily ? {id: 'dagens', daily: level.daily} : {id: level.id};
    m.pucks = level.pucks.map(([o, x, y], i) => ({id: 900 + i, owner: o, x, y}));
    m.nextId = 1;
    return m;
  };
  C.level = m => (m.challenge && m.challenge.daily ? C.daily(m.challenge.daily) : C.get(m.challenge && m.challenge.id));

  // Resultatet efter ett kast (anropas med läget efter kastet)
  C.check = (m, sum, sums) => {
    const lv = C.level(m);
    if (!lv) return null;
    const pucks = sum.frameEnd ? sum.frameEnd.pucks : m.pucks;
    const n = sums.length, left = lv.throws - n;
    const r = lv.check({pucks, sum, n, left, sums});
    if (r) return Object.assign({done: true}, r);
    if (left <= 0) return {done: true, fail: true};
    return null;
  };

  /* ---------- Framsteg (sparas på enheten) ---------- */
  C.stars = () => Store.get('chStars') || {};
  C.unlocked = i => i === 0 || (C.stars()[C.LEVELS[i - 1].id] || 0) > 0;
  C.save = (id, stars) => { const s = C.stars(); if ((s[id] || 0) < stars) { s[id] = stars; Store.set('chStars', s); return true; } return false; };
  C.total = () => Object.values(C.stars()).reduce((a, b) => a + b, 0);
  C.dailyBest = () => { const d = Store.get('chDaily') || {}; return d.key === dayKey() ? d.best : null; };
  C.saveDaily = pts => {
    const d = Store.get('chDaily') || {}, key = dayKey();
    // svit: spelat varje dag i rad
    const y = new Date(); y.setDate(y.getDate() - 1);
    const streak = d.key === key ? d.streak : d.key === dayKey(y) ? (d.streak || 0) + 1 : 1;
    const best = d.key === key ? Math.max(d.best, pts) : pts;
    Store.set('chDaily', {key, best, streak});
    // veckans topplista: dagens bästa för varje dag i veckan
    const wk = C.week(), w = Store.get('chWeek') || {};
    const days = w.key === wk.key && Array.isArray(w.d) && w.d.length === 7 ? w.d.slice() : [null, null, null, null, null, null, null];
    days[wk.day] = days[wk.day] == null ? pts : Math.max(days[wk.day], pts);
    Store.set('chWeek', {key: wk.key, d: days, prev: w.key && w.key !== wk.key ? w.key : (w.prev || null)});
    return {best, streak, record: d.key !== key || pts > d.best, week: {tot: C.weekTotal(days), days: days.filter(x => x != null).length}};
  };
  /* ---------- Veckans topplista: dagens bästa varje dag, måndag till söndag ---------- */
  // ISO-veckan: {key: '2026-39', day: 0 (måndag) … 6 (söndag), n: 39}
  C.week = (date = new Date()) => {
    const t = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const day = (t.getUTCDay() + 6) % 7;
    t.setUTCDate(t.getUTCDate() - day + 3);
    // (veckans torsdag ligger alltid i veckans år, och den första torsdagen i vecka 1)
    const y = t.getUTCFullYear(), n = 1 + Math.floor((t - Date.UTC(y, 0, 1)) / 6048e5);
    return {key: y + '-' + String(n).padStart(2, '0'), day, n};
  };
  // veckans poäng: dagarnas bästa (en dålig dag drar inte av)
  C.weekTotal = d => d.reduce((a, x) => a + (typeof x === 'number' && x > 0 ? x : 0), 0);
  C.weekEntry = () => {
    const w = Store.get('chWeek') || {}, wk = C.week();
    const d = w.key === wk.key && Array.isArray(w.d) && w.d.length === 7 ? w.d : [null, null, null, null, null, null, null];
    return {key: wk.key, n: wk.n, day: wk.day, d, tot: C.weekTotal(d), days: d.filter(x => x != null).length, prev: w.key !== wk.key ? w.key || null : w.prev || null};
  };
  C.streak = () => { const d = Store.get('chDaily') || {}; const y = new Date(); y.setDate(y.getDate() - 1); return d.key === dayKey() || d.key === dayKey(y) ? (d.streak || 0) : 0; };
  return C;
})();

    const m = Rules.create({seats, target: T.TARGET, mode: 'classic', id: 'tour-' + pub.id + '-' + oi + '-' + randId(4)});
    m.table = pub.table;
    m.tour = {pub: pi, opp: oi};
    return m;
  };
  return T;
})();

/* ---- 03-ai.js ---- */
/* ================= Datorspelaren ================= */
// Datorn provar många tänkbara kast i samma fysik som spelet (läggen mot zonerna, utslag på andras puckar,
// skydd framför egna) och värderar läget efteråt. De bästa kasten provas igen med darr på handen så att den
// väljer säkra kast framför chansningar. Nivån bestämmer hur mycket handen darrar när kastet väl görs.
const AI = (() => {
  const A = {};
  const {L, R, HALF, Y0, FOUL} = TABLE;
  A.LEVELS = {
    latt: {name: 'Lätt', v: 0.030, a: 0.011, spin: 0.9, blunder: 0.3, cands: .45},
    medel: {name: 'Medel', v: 0.013, a: 0.0055, spin: 0.5, blunder: 0.08, cands: .8},
    svar: {name: 'Svår', v: 0.0065, a: 0.0026, spin: 0.25, blunder: 0, cands: 1}
  };
  A.NAMES = ['Greta', 'Sixten', 'Majken', 'Bosse', 'Tyra', 'Nisse', 'Ingrid', 'Folke', 'Svea', 'Kjell'];
  A.AVATARS = ['🤖', '🎩', '🦉', '🐙'];

  // Enkel slump med frö (datorns darr blir samma på alla enheter om värden räknar)
  function gauss(rnd) { let u = 0, v = 0; while (u === 0) u = rnd(); while (v === 0) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

  // Kast från (x0, Y0) mot (tx, ty) på tomt bord, rättat för bordets välvning och skruven
  const drawCache = new Map();
  function draw(x0, tx, ty, spin) {
    const key = [x0, tx, ty, spin].map(v => v.toFixed(4)).join();
    if (drawCache.has(key)) return drawCache.get(key);
    let ax = tx, ay = ty, inp = null;
    for (let it = 0; it < 3; it++) {
      const dx = ax - x0, dy = ay - Y0, d = Math.sqrt(dx * dx + dy * dy);
      const ang = Math.atan2(dx, dy), sp = Math.sqrt(2 * Phys.DECEL * Math.max(0.2, d));
      inp = Phys.inputFrom(x0, ang, sp, spin);
      const S = Phys.run(Phys.create([], {id: 1, owner: 0, input: inp}));
      const q = S.p[0];
      if (q.out) { ay -= 0.12; continue; }
      const ex = q.x - tx, ey = q.y - ty;
      if (Math.abs(ex) < 0.004 && Math.abs(ey) < 0.004) break;
      ax -= ex; ay -= ey;
    }
    if (drawCache.size > 4000) drawCache.clear();
    drawCache.set(key, inp);
    return inp;
  }
  // Rakt slag mot en puck med en viss fart
  function hit(x0, q, speed, offset) {
    const tx = q.x + offset * R, ty = q.y;
    const ang = Math.atan2(tx - x0, ty - Y0);
    return Phys.inputFrom(x0, ang, speed, 0);
  }

  // egna puckar = den egna sidans (i lag även kamratens)
  function candidates(m, seat, lv) {
    const out = [], pucks = m.pucks, mine = pucks.filter(q => Rules.sameSide(m, q.owner, seat)), theirs = pucks.filter(q => !Rules.sameSide(m, q.owner, seat));
    const xs = [-0.16, -0.08, 0, 0.08, 0.16];
    const starts = [-0.12, 0, 0.12];
    const ys = [L - 0.07, L - 0.04, L - 0.12, L - 0.22, L - 0.5, L - 1.0];
    for (const ty of ys) for (const tx of xs) {
      const x0 = clamp(tx * 0.6, -HALF + R, HALF - R);
      out.push({kind: 'draw', inp: draw(x0, tx, ty, 0)});
    }
    // skruv runt hinder
    for (const s of [-4, 4]) for (const tx of [-0.1, 0, 0.1]) for (const x0 of starts) out.push({kind: 'curl', inp: draw(x0, tx, L - 0.08, s)});
    // utslag
    const vHard = Phys.speedFor(0.93), vFirm = Phys.speedFor(0.84);
    for (const q of theirs) for (const x0 of [q.x * 0.5, q.x, clamp(q.x + (q.x > 0 ? -0.1 : 0.1), -HALF + R, HALF - R)]) {
      for (const off of [0, -0.35, 0.35]) { out.push({kind: 'hit', inp: hit(x0, q, vHard, off)}); out.push({kind: 'hit', inp: hit(x0, q, vFirm, off)}); }
    }
    // skydd framför den egna ledande pucken
    if (mine.length) {
      const lead = mine.reduce((a, b) => (b.y > a.y ? b : a));
      for (const d of [0.35, 0.6, 0.9]) {
        const ty = Math.max(FOUL + R + 0.06, lead.y - d);
        for (const dx of [-0.02, 0, 0.02]) out.push({kind: 'guard', inp: draw(clamp(lead.x * 0.7, -HALF + R, HALF - R), lead.x + dx, ty, 0)});
      }
      // lägg bakom/bredvid egna puckar (in i 3-zonen bakom ett skydd)
      for (const q of mine) for (const dx of [-0.07, 0.07]) out.push({kind: 'draw', inp: draw(clamp(q.x * 0.5, -HALF + R, HALF - R), clamp(q.x + dx, -HALF + 1.5 * R, HALF - 1.5 * R), L - 0.06, 0)});
    }
    // Lätta datorn tänker inte igenom allt
    if (lv.cands < 1) { const rnd = seeded(m.k * 7919 + seat); return out.filter(() => rnd() < lv.cands); }
    return out;
  }

  // Hur bra är läget för spelarens sida? (poäng nu, hur utsatta de är och hur djupt puckarna ligger)
  function value(m, pucks, seat, leftMe, leftOthers) {
    const side = Rules.side(m, seat), sc = Rules.score(pucks, m);
    let v;
    if (m.mode === 'all' || m.mode === 'hang') {
      const others = sc.points.filter((p, i) => i !== side);
      v = sc.points[side] - (others.length ? (Math.max(...others) * 0.5 + others.reduce((a, b) => a + b, 0) / others.length * 0.5) : 0);
    } else v = sc.points[side] - Math.max(0, ...sc.points.filter((p, i) => i !== side));
    // sist kvar: varje puck på bordet är värd något (egna att behålla, andras att slå ut)
    if (m.mode === 'last') for (const q of pucks) v += Rules.side(m, q.owner) === side ? 0.45 : -0.45;
    // utsatthet: hur fritt ligger de räknande puckarna om andra har kast kvar?
    if (leftOthers > 0) {
      for (const c of sc.counted) {
        const q = pucks.find(p => p.id === c.id);
