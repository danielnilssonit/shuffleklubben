<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#140d09">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shuffleklubben">
<meta name="description" content="Bordsshuffleboard i 3D. Spela mot vänner och andra över internet, mot datorn eller flera på samma skärm.">
<title>Shuffleklubben</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-32.png">
<style>
:root {
  --bg: #120c08; --ink: #f7ecd6; --ink2: rgba(247,236,214,.72); --ink3: rgba(247,236,214,.5);
  --brass: #d8aa5c; --brass2: #f5d693; --brassd: #8d6329;
  --panel: rgba(22,15,10,.82); --panel2: rgba(34,24,16,.9); --line: rgba(216,170,92,.32); --line2: rgba(216,170,92,.6);
  --neon: #ff5a82; --neon2: #ffc1d0; --felt: #1d5a3c; --good: #69d693; --bad: #ff7272;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
  --r: 16px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 500 16px/1.4 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
input, button, select { -webkit-appearance: none; appearance: none; }
.hidden { display: none !important; }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#aimLayer { position: fixed; inset: 0; z-index: 5; display: none; touch-action: none; }
#aimLayer.on { display: block; cursor: grab; }
#aimLayer.on:active { cursor: grabbing; }

/* ---------- Logga ---------- */
.logo { font-family: Yellowtail, cursive; font-weight: 400; color: #ffe3ea; letter-spacing: .5px; line-height: 1;
  text-shadow: 0 0 2px #fff, 0 0 8px var(--neon), 0 0 18px var(--neon), 0 0 38px rgba(255,90,130,.55), 0 0 70px rgba(255,90,130,.35); }
.logo.big { font-size: clamp(48px, 13vw, 104px); }
.logo.flicker { animation: flicker 7s infinite; }
@keyframes flicker { 0%, 91%, 93.5%, 100% { opacity: 1; } 92% { opacity: .55; } 93% { opacity: .9; } 92.5% { opacity: .4; } }
.tagline { font: 600 13px/1.3 Oswald, sans-serif; letter-spacing: 3.5px; text-transform: uppercase; color: var(--brass2); opacity: .9; }

/* ---------- Laddning ---------- */
#loading { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  background: radial-gradient(ellipse at 50% 40%, #2a1a10 0%, #120c08 60%, #0b0705 100%); transition: opacity .6s; }
#loading.done { opacity: 0; pointer-events: none; }
#loadText { color: var(--ink2); font-size: 14px; letter-spacing: .3px; }
.loadbar { width: min(260px, 60vw); height: 4px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; }
.loadbar i { display: block; height: 100%; width: 8%; background: linear-gradient(90deg, var(--brassd), var(--brass2)); border-radius: 4px; transition: width .35s; }

/* ---------- Knappar ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 12px 20px; border-radius: 14px;
  border: 1px solid var(--line); background: linear-gradient(180deg, rgba(58,40,26,.92), rgba(30,21,14,.92)); color: var(--ink);
  font: 700 17px/1.15 Inter, sans-serif; letter-spacing: .2px; box-shadow: 0 1px 0 rgba(255,235,200,.08) inset, 0 8px 22px rgba(0,0,0,.35); transition: transform .12s, filter .12s, border-color .2s; text-align: center; }
.btn:active { transform: translateY(1px) scale(.985); filter: brightness(1.12); }
.btn:focus-visible, .iconbtn:focus-visible, .seg button:focus-visible { outline: 2px solid var(--brass2); outline-offset: 2px; }
.btn.primary { background: linear-gradient(180deg, #f9dc9c 0%, #dcad5f 48%, #b8863d 100%); color: #2a1706; border-color: #ffe7b0; text-shadow: 0 1px 0 rgba(255,245,220,.5);
  box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 -2px 0 rgba(120,70,20,.35) inset, 0 10px 26px rgba(216,170,92,.28), 0 2px 6px rgba(0,0,0,.4); }
.btn.neon { background: linear-gradient(180deg, #ff7a9a, #e2406a); border-color: #ffc4d3; color: #fff; text-shadow: 0 1px 2px rgba(120,0,40,.5); box-shadow: 0 0 22px rgba(255,90,130,.45), 0 1px 0 rgba(255,255,255,.4) inset; }
.btn.big { min-height: 60px; font-size: 19px; border-radius: 16px; }
.btn.small { min-height: 40px; padding: 8px 14px; font-size: 14px; border-radius: 11px; }
.btn.ghost { background: rgba(255,255,255,.04); box-shadow: none; }
.btn.danger { border-color: rgba(255,114,114,.5); color: #ffc9c9; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn .sub { display: block; font-weight: 500; font-size: 12.5px; opacity: .75; margin-top: 2px; }
.btn .ico { font-size: 22px; line-height: 1; }
.btn .badge { font: 700 11px/1 Inter; padding: 4px 7px; border-radius: 20px; background: rgba(0,0,0,.3); color: #fff; }
.btn.primary .badge { background: rgba(60,30,5,.2); color: #3a1f07; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); }
.dot.off { background: #7d6b5b; box-shadow: none; }
.iconbtn { width: 44px; height: 44px; border-radius: 13px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; color: var(--ink); padding: 0; flex: none; box-shadow: 0 6px 16px rgba(0,0,0,.35); }
.iconbtn:active { transform: scale(.94); }

/* ---------- Skärmar och ark ---------- */
#ui { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
#ui > * { pointer-events: auto; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding: calc(var(--safe-t) + 14px) calc(var(--safe-r) + 16px) calc(var(--safe-b) + 16px) calc(var(--safe-l) + 16px); overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
  animation: fadeIn .35s ease both; }
.screen.leaving { animation: fadeOut .25s ease both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadeOut { to { opacity: 0; transform: translateY(6px); } }
.shade { background: linear-gradient(0deg, rgba(10,6,4,.96) 0%, rgba(10,6,4,.8) 38%, rgba(10,6,4,.25) 70%, rgba(10,6,4,.45) 100%); }
.shade.full { background: linear-gradient(180deg, rgba(12,8,5,.9), rgba(12,8,5,.96)); }

.title { justify-content: space-between; align-items: center; text-align: center; }
.title .top { width: 100%; display: flex; justify-content: space-between; align-items: center; }
.title .brand { margin-top: 5vh; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.title .menu { width: min(440px, 100%); display: flex; flex-direction: column; gap: 11px; }
.title .menu .row { display: flex; gap: 10px; }
.title .menu .row > * { flex: 1; }
.profile-chip { display: flex; align-items: center; gap: 9px; padding: 6px 14px 6px 6px; border-radius: 40px; background: var(--panel); border: 1px solid var(--line); font-weight: 700; font-size: 15px; max-width: 60vw; }
.profile-chip .av { width: 34px; height: 34px; }
.profile-chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.online-pill { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink2); padding: 6px 12px; border-radius: 30px; background: var(--panel); border: 1px solid var(--line); }
.av { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; font-size: 18px; line-height: 1; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.25), rgba(0,0,0,.1)); box-shadow: 0 0 0 2.5px var(--pc, var(--brass)), 0 2px 6px rgba(0,0,0,.4); flex: none; }

.sheet-wrap { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; background: rgba(6,4,2,.55); animation: fadeIn .25s ease both; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.sheet-wrap.leaving { animation: fadeOut .2s ease both; }
.sheet { width: min(560px, 100%); max-height: calc(100% - var(--safe-t) - 18px); overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
  background: linear-gradient(180deg, rgba(40,28,19,.97), rgba(22,15,10,.98)); border: 1px solid var(--line); border-bottom: 0; border-radius: 24px 24px 0 0;
  padding: 18px 18px calc(var(--safe-b) + 18px); box-shadow: 0 -20px 60px rgba(0,0,0,.6), 0 1px 0 rgba(255,230,190,.12) inset; animation: sheetUp .32s cubic-bezier(.2,.9,.25,1) both; }
@keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (min-width: 700px) and (min-height: 600px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 24px; border-bottom: 1px solid var(--line); } }
.sheet h2 { margin: 0 0 4px; font: 700 23px/1.2 Inter; letter-spacing: -.2px; }
.sheet h3 { margin: 18px 0 8px; font: 700 12px/1 Oswald, sans-serif; letter-spacing: 2.2px; text-transform: uppercase; color: var(--brass2); opacity: .9; }
.sheet p { margin: 6px 0; color: var(--ink2); font-size: 15px; }
.sheet .head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.sheet .head h2 { flex: 1; }
.sheet .actions { display: flex; gap: 10px; margin-top: 18px; }
.sheet .actions > * { flex: 1; }
.grab { width: 44px; height: 5px; border-radius: 5px; background: rgba(255,255,255,.18); margin: -6px auto 12px; }

.seg { display: flex; gap: 4px; padding: 4px; border-radius: 13px; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.06); }
.seg button { flex: 1; min-height: 42px; border: 0; border-radius: 10px; background: transparent; color: var(--ink2); font-weight: 700; font-size: 15px; }
.seg button.on { background: linear-gradient(180deg, #f3d18d, #cf9d50); color: #2a1706; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
.field { width: 100%; min-height: 50px; padding: 12px 14px; border-radius: 13px; border: 1px solid var(--line); background: rgba(0,0,0,.35); color: var(--ink); font: 600 17px Inter; -webkit-user-select: text; user-select: text; }
.field:focus { outline: none; border-color: var(--brass2); box-shadow: 0 0 0 3px rgba(216,170,92,.2); }
.codebox { display: flex; gap: 10px; justify-content: center; }
.codebox input { width: 60px; height: 72px; text-align: center; font: 700 34px Oswald; text-transform: uppercase; border-radius: 14px; border: 1px solid var(--line2); background: rgba(0,0,0,.4); color: var(--ink); -webkit-user-select: text; user-select: text; }
.codebox input:focus { outline: none; border-color: var(--brass2); box-shadow: 0 0 0 3px rgba(216,170,92,.25); }
.avgrid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.avgrid button { aspect-ratio: 1; border-radius: 12px; border: 1px solid transparent; background: rgba(255,255,255,.05); font-size: 24px; padding: 0; }
.avgrid button.on { border-color: var(--brass2); background: rgba(216,170,92,.2); box-shadow: 0 0 12px rgba(216,170,92,.3); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatches button { width: 44px; height: 44px; border-radius: 50%; border: 3px solid rgba(0,0,0,.35); padding: 0; background: var(--c); box-shadow: 0 0 0 2px transparent, 0 3px 8px rgba(0,0,0,.4) , inset 0 3px 6px rgba(255,255,255,.35); }
.swatches button.on { box-shadow: 0 0 0 3px var(--brass2), 0 0 16px var(--c); }
.swatches button[disabled] { opacity: .25; }
.setrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
.setrow > label { flex: 1; font-weight: 600; }
.setrow small { display: block; font-weight: 500; color: var(--ink3); font-size: 13px; }
.setrow input[type=range] { width: 46%; accent-color: var(--brass); -webkit-appearance: auto; appearance: auto; }
.switch { width: 52px; height: 30px; border-radius: 30px; border: 1px solid var(--line); background: rgba(0,0,0,.4); position: relative; padding: 0; flex: none; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #8d7a67; transition: left .18s, background .18s; }
.switch.on { background: rgba(216,170,92,.35); border-color: var(--brass); }
.switch.on::after { left: 25px; background: var(--brass2); }

.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 14px; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.06); min-height: 60px; }
.item .grow { flex: 1; min-width: 0; }
.item .name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .meta { font-size: 13px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item.me { border-color: var(--line2); background: rgba(216,170,92,.08); }
.item.empty { border-style: dashed; border-color: rgba(255,255,255,.14); background: transparent; color: var(--ink3); justify-content: space-between; }
.emptytext { padding: 14px; text-align: center; color: var(--ink3); font-size: 14px; border: 1px dashed rgba(255,255,255,.12); border-radius: 14px; }
.code-big { font: 700 58px/1 Oswald; letter-spacing: 12px; text-align: center; color: var(--brass2); text-shadow: 0 0 22px rgba(216,170,92,.35); padding-left: 12px; }
.qr { display: grid; place-items: center; padding: 10px; background: #f7ecd6; border-radius: 14px; width: 164px; height: 164px; margin: 0 auto; }
.qr img, .qr canvas { width: 144px; height: 144px; image-rendering: pixelated; }
.countdown { text-align: center; font: 700 15px Inter; color: var(--brass2); margin-top: 10px; }
.tag { font: 700 11px/1 Inter; padding: 4px 8px; border-radius: 20px; background: rgba(255,255,255,.08); color: var(--ink2); white-space: nowrap; }
.tag.host { background: rgba(216,170,92,.2); color: var(--brass2); }
.tag.off { background: rgba(255,114,114,.15); color: #ffb4b4; }
.tag.cpu { background: rgba(120,160,255,.15); color: #c4d4ff; }
.xbtn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid rgba(255,255,255,.1); background: rgba(0,0,0,.3); color: var(--ink2); padding: 0; font-size: 18px; }

/* ---------- Spelets HUD ---------- */
#hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
#hud button, #hud #mini, #hud #emotePanel { pointer-events: auto; }
#topbar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: flex-start; gap: 8px; padding: calc(var(--safe-t) + 8px) calc(var(--safe-r) + 10px) 0 calc(var(--safe-l) + 10px); }
#chips { flex: 1; display: flex; gap: 6px; min-width: 0; justify-content: center; }
.chip { position: relative; flex: 1 1 0; min-width: 0; max-width: 210px; display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 15px; background: var(--panel); border: 1px solid rgba(255,255,255,.07);
  box-shadow: 0 6px 18px rgba(0,0,0,.35); transition: border-color .3s, box-shadow .3s, transform .3s; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.chip .who { flex: 1; min-width: 0; }
.chip .nm { font-weight: 700; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.15; }
.chip .pk { display: flex; gap: 3px; margin-top: 4px; height: 7px; }
.chip .pk i { width: 7px; height: 7px; border-radius: 50%; background: var(--pc); box-shadow: 0 0 4px var(--pc); }
.chip .pk i.used { background: transparent; box-shadow: inset 0 0 0 1.3px rgba(255,255,255,.25); }
.chip .sc { font: 700 27px/1 Oswald; min-width: 26px; text-align: right; font-variant-numeric: tabular-nums; }
.chip.turn { border-color: var(--pc); box-shadow: 0 0 0 1px var(--pc), 0 0 22px color-mix(in srgb, var(--pc) 45%, transparent), 0 6px 18px rgba(0,0,0,.35); transform: translateY(1px); }
.chip.off .nm::after { content: ' · borta'; color: var(--bad); font-weight: 600; }
.chip.lead .sc { color: var(--brass2); }
.chip .bump { animation: bump .5s ease; }
@keyframes bump { 30% { transform: scale(1.45); color: #fff; } }
.chips4 .chip { padding: 5px 7px 5px 5px; gap: 6px; }
@media (max-width: 560px) {
  #chips.chips4 { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  #chips.chips4 .chip { max-width: none; }
  body.four #frameInfo { top: calc(var(--safe-t) + 100px); }
  body.four #mini { top: calc(var(--safe-t) + 128px); }
  body.four #turnBanner { top: calc(var(--safe-t) + 128px); }
  body.four #clock { top: calc(var(--safe-t) + 164px); }
}
.chips4 .chip .av { width: 24px; height: 24px; font-size: 14px; }
.chips4 .chip .sc { font-size: 22px; min-width: 18px; }
.chips4 .chip .nm { font-size: 12px; }
#frameInfo { position: absolute; top: calc(var(--safe-t) + 64px); left: 50%; transform: translateX(-50%); font: 600 11.5px/1 Oswald; letter-spacing: 2px; text-transform: uppercase; color: var(--ink2);
  padding: 5px 11px; border-radius: 20px; background: rgba(0,0,0,.35); white-space: nowrap; }
#mini { position: absolute; right: calc(var(--safe-r) + 10px); top: calc(var(--safe-t) + 92px); width: 66px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.55), 0 0 0 1px rgba(255,235,200,.15); background: #3a2616; }
body.aiming #mini { opacity: .95; }
#turnBanner { position: absolute; left: 50%; top: calc(var(--safe-t) + 92px); transform: translate(-50%, -8px); display: flex; align-items: center; gap: 9px; padding: 8px 16px 8px 8px; border-radius: 40px;
  background: var(--panel2); border: 1px solid var(--pc, var(--line)); font-weight: 700; font-size: 15px; opacity: 0; transition: opacity .3s, transform .3s; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
#turnBanner.show { opacity: 1; transform: translate(-50%, 0); }
#turnBanner .av { width: 28px; height: 28px; font-size: 16px; }
#meter { position: absolute; right: calc(var(--safe-r) + 16px); bottom: calc(var(--safe-b) + 110px); height: min(40vh, 330px); width: 26px; display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: 0; transition: opacity .25s; }
#meter.on, body.aiming #meter { opacity: 1; }
body.lefty #meter { right: auto; left: calc(var(--safe-l) + 16px); }
#meterTrack { position: relative; flex: 1; width: 14px; border-radius: 10px; background: linear-gradient(0deg, rgba(0,0,0,.55), rgba(0,0,0,.35)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 6px 16px rgba(0,0,0,.45); overflow: visible; }
#meterFill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; border-radius: 10px; background: linear-gradient(0deg, #6ed1a0 0%, #f3d18d 60%, #ffb35c 80%); box-shadow: 0 0 12px rgba(243,209,141,.6); }
#meterFill.hard { background: linear-gradient(0deg, #6ed1a0 0%, #f3d18d 55%, #ffb35c 75%, #ff4e5e 100%); box-shadow: 0 0 16px rgba(255,80,90,.7); }
#meterEdge { position: absolute; left: -5px; right: -5px; bottom: 80%; height: 2px; background: #fff; opacity: .7; border-radius: 2px; }
#meterEdge::after { content: ''; position: absolute; left: -3px; right: -3px; top: -1px; bottom: calc(-100% * 0); }
#meterLast { position: absolute; left: -7px; right: -7px; height: 0; border-top: 2px dashed rgba(255,255,255,.55); }
#meterLbl { font: 600 9px/1 Oswald; letter-spacing: 2px; color: var(--ink3); }
#aimTools { position: absolute; left: 50%; bottom: calc(var(--safe-b) + 18px); transform: translateX(-50%); display: none; }
body.aiming #aimTools { display: block; }
#spinCtl { display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 40px; background: var(--panel2); border: 1px solid var(--line); box-shadow: 0 8px 22px rgba(0,0,0,.45); pointer-events: auto; }
#spinCtl button { width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.04); display: grid; place-items: center; padding: 0; position: relative; }
#spinCtl button.on { background: linear-gradient(180deg, #f3d18d, #c9964a); color: #2a1706; }
#spinCtl button[data-lv="2"]::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--brass2); }
#spinLbl { min-width: 104px; text-align: center; font: 600 12.5px/1.1 Inter; color: var(--ink2); }
#aimHint { position: absolute; left: 50%; bottom: calc(var(--safe-b) + 92px); transform: translateX(-50%); padding: 10px 16px; border-radius: 30px; background: rgba(10,6,4,.72); border: 1px solid var(--line); color: var(--ink);
  font-weight: 600; font-size: 14.5px; opacity: 0; transition: opacity .3s; white-space: nowrap; text-align: center; }
#aimHint.show { opacity: 1; animation: hintPulse 2.4s ease-in-out infinite; }
@keyframes hintPulse { 50% { transform: translate(-50%, 4px); } }

<script>
(() => {
'use strict';
if (!window.THREE) { document.getElementById('loadText').textContent = 'Spelet behöver internet första gången för att hämta 3D-grafiken. Kontrollera anslutningen och ladda om sidan.'; return; }
const SITE_URL = "https://danielnilssonit.github.io/shuffleklubben/";
const BUILD_VER = "136720b1";
const MODEL_ASSETS = null;
const MUSIC_FILES = ["final.mp3","match.mp3","meny.mp3"];
const ARTIFACT = false;
/* ---- 00-core.js ---- */
/* ================= Grund: hjälpfunktioner, lagring och inställningar ================= */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const shuffle = (a, rnd = Math.random) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, rnd = Math.random) => a[Math.floor(rnd() * a.length)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
// Slumptal med frö (samma följd på alla enheter)
function seeded(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const randId = (n = 10) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => 'abcdefghijkmnopqrstuvwxyz23456789'[b % 33]).join('');

// Skapar HTML-element: h('button', {class: 'btn', onclick: fn}, 'Text', h('span', ...))
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(e.dataset, v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}

// Lagring som tål att webbläsaren säger nej (privat läge, förhandsvisning)
const Store = {
  mem: {},
  get(key, def) {
    try { const v = localStorage.getItem('sk.' + key); if (v != null) return JSON.parse(v); } catch (e) { /* ingen lagring */ }
    return key in this.mem ? this.mem[key] : def;
  },
  set(key, val) {
    this.mem[key] = val;
    try { localStorage.setItem('sk.' + key, JSON.stringify(val)); } catch (e) { /* ingen lagring */ }
  },
  del(key) { delete this.mem[key]; try { localStorage.removeItem('sk.' + key); } catch (e) { /* ingen lagring */ } }
};
// Kortlivad lagring för fliken (återansluta efter omladdning)
const TabStore = {
  get(key, def) { try { const v = sessionStorage.getItem('sk.' + key); if (v != null) return JSON.parse(v); } catch (e) { /* ingen lagring */ } return def; },
  set(key, val) { try { sessionStorage.setItem('sk.' + key, JSON.stringify(val)); } catch (e) { /* ingen lagring */ } },
  del(key) { try { sessionStorage.removeItem('sk.' + key); } catch (e) { /* ingen lagring */ } }
};

// aim: siktlinjens längd ('lang', 'kort', 'av'). visible: synas i lobbyn. quality: 'auto', 'high', 'low'.
const Settings = Object.assign({
  music: .45, sfx: .85, ambience: .5, quality: 'auto', aim: 'lang', haptics: true, visible: true, slowmo: true, lefty: false
}, Store.get('settings', {}));
function saveSettings() { Store.set('settings', Settings); }

// Spelarens profil: namn, figur och favoritfärg. dev = enhetens id (för att känna igen samma spelare vid återanslutning).
const Profile = Object.assign({name: '', avatar: '', color: 'red', dev: ''}, Store.get('profile', {}));
if (!Profile.dev) { Profile.dev = randId(12); Store.set('profile', Profile); }
function saveProfile() { Store.set('profile', Profile); }

// Statistik på den här enheten
const Stats = Object.assign({games: 0, wins: 0, online: 0, onlineWins: 0, hangers: 0, knockouts: 0, best: 0, threes: 0, throws: 0, practiceBest: 0}, Store.get('stats', {}));
function saveStats() { Store.set('stats', Stats); }

// Liten händelsebuss mellan modulerna
const Bus = {
  map: {},
  on(ev, fn) { (this.map[ev] = this.map[ev] || []).push(fn); return () => { this.map[ev] = (this.map[ev] || []).filter(f => f !== fn); }; },
  emit(ev, ...a) { (this.map[ev] || []).slice().forEach(fn => { try { fn(...a); } catch (e) { console.error(e); } }); }
};

// Tidsskala för automatiska tester (1 = vanlig fart, 0 = direkt)
const Time = {scale: 1};

// Animationer som går på skärmens bilduppdatering (med en reserv om fliken inte ritas)
const Anim = {
  list: new Set(),
  tween(ms, fn, ease = t => t) {
    return new Promise(res => {
      ms *= Time.scale;
      if (ms <= 1) { fn(1); res(); return; }
      const a = {t0: performance.now(), ms, fn, ease, res};
      this.list.add(a);
      a.guard = setTimeout(() => { if (this.list.has(a)) { this.list.delete(a); try { fn(1); } catch (e) { console.error(e); } res(); } }, ms + 500);
    });
  },
  tick(now) {
    for (const a of [...this.list]) {
      const t = Math.min(1, (now - a.t0) / a.ms);
      try { a.fn(a.ease(t)); } catch (e) { console.error(e); }
      if (t >= 1) { this.list.delete(a); clearTimeout(a.guard); a.res(); }
    }
  }
};
const wait = ms => new Promise(r => setTimeout(r, ms * Time.scale));

function loadImage(src) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = src; });
}

// Skript från nätet med reservadress
const libLoading = {};
function loadLib(name, urls, test) {
  if (test()) return Promise.resolve();
  if (libLoading[name]) return libLoading[name];
  return (libLoading[name] = (async () => {
    for (const src of urls) {
      try {
        await new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = res; s.onerror = rej; document.head.append(s); setTimeout(rej, 15000); });
        if (test()) return;
      } catch (e) { /* prova nästa adress */ }
    }
    libLoading[name] = null;
    throw new Error('Kunde inte ladda ' + name);
  })());
}

/* ---- 01-physics.js ---- */
/* ================= Bordet och fysiken ================= */
// Måtten följer ett riktigt turneringsbord (22 fot). Koordinater i meter: x åt sidan (0 = mitten),
// y längs bordet från den närmsta kanten (0) till den bortre kanten (L). 3D-världen har X = x, Z = -y.
//
// Simuleringen är deterministisk: den använder bara + - * / och Math.sqrt (som ger exakt samma resultat i alla
// webbläsare), ett fast tidssteg och en fast ordning. Samma kast på samma bord blir därför exakt samma resultat
// på alla telefoner i en match över nätet. Vinklar (sin och cos) räknas bara ut en gång, av den som kastar,
// och skickas som färdiga hastigheter.
const TABLE = (() => {
  const L = 6.7056, W = 0.508, R = 0.02935;
  return {
    L, W, R,
    HALF: W / 2,
    H: 0.025,              // puckens höjd
    TOP: 0.80,             // spelytans höjd över golvet
    Y0: 0.30,              // kastlinjen (puckens mitt när den släpps)
    FOUL: L - 1.8288,      // bortre foul-linjen: hela pucken måste förbi den för att vara med
    Z2: L - 0.3048,        // 2-poängslinjen
    Z3: L - 0.1524,        // 3-poängslinjen
    GUTTER: 0.095,         // rännornas bredd
    DROP: 0.055,           // rännornas djup
    END: 0.16              // rännan bakom bordets ändar
  };
})();

const Phys = (() => {
  const P = {};
  const {L, HALF, R} = TABLE;
  const D2 = 4 * R * R;
  P.DT = 1 / 240;
  P.DECEL = 0.50;          // inbromsning från friktionen (m/s²), bordet är pudrat med silikonpärlor
  P.CROWN = 0.030;         // bordet är lite välvt: pucken glider utåt mot kanterna (1/s²)
  P.CURL = 0.0020;         // skruv ger en svag kurva (m/s² per rad/s)
  P.SPIN_DECAY = 1.0;      // skruven avtar (rad/s²)
  P.E = 0.86;              // studsighet mellan två puckar (stål mot stål)
  P.VMAX = 4.4;
  P.SPIN_MAX = 7;
  P.MAX_T = 40;

  // Håller ett kast inom det tillåtna (det som kommer över nätet kontrolleras också här)
  P.cleanInput = inp => {
    const num = v => (typeof v === 'number' && isFinite(v)) ? v : 0;
    let x = num(inp.x), vx = num(inp.vx), vy = num(inp.vy), w = num(inp.w);
    x = Math.max(-HALF + R, Math.min(HALF - R, x));
    vy = Math.max(0.05, Math.min(P.VMAX, vy));
    const lim = vy * 0.12;
    vx = Math.max(-lim, Math.min(lim, vx));
    w = Math.max(-P.SPIN_MAX, Math.min(P.SPIN_MAX, w));
    return {x, vx, vy, w};
  };

  // pucks: [{id, owner, x, y}] (liggande puckar). Returnerar en simulering som kan stegas eller köras klart.
  P.create = (pucks, launch) => {
    const S = {t: 0, steps: 0, done: false, events: [], moving: 0};
    S.p = pucks.map(q => ({id: q.id, owner: q.owner, x: q.x, y: q.y, vx: 0, vy: 0, w: 0, out: 0, fx: 0, fy: 0}));
    if (launch) {
      const i = P.cleanInput(launch.input);
      S.p.push({id: launch.id, owner: launch.owner, x: i.x, y: TABLE.Y0, vx: i.vx, vy: i.vy, w: i.w, out: 0, fx: 0, fy: 0});
      S.shot = launch.id;
    }
    return S;
  };

  // Ett tidssteg. Returnerar true så länge något rör sig.
  P.step = S => {
    if (S.done) return false;
    const dt = P.DT, ps = S.p, n = ps.length, dv = P.DECEL * dt;
    let moving = 0;
    for (let i = 0; i < n; i++) {
      const q = ps[i];
      if (q.out || (q.vx === 0 && q.vy === 0)) continue;
      const sp = Math.sqrt(q.vx * q.vx + q.vy * q.vy);
      if (sp <= dv) { q.vx = 0; q.vy = 0; q.w = 0; S.events.push({t: S.t, k: 'stop', a: q.id}); continue; }
      const ux = q.vx / sp, uy = q.vy / sp;
      let ax = -P.DECEL * ux + P.CROWN * q.x + P.CURL * q.w * uy;
      let ay = -P.DECEL * uy - P.CURL * q.w * ux;
      q.vx += ax * dt; q.vy += ay * dt;
      if (q.w > 0) { q.w -= P.SPIN_DECAY * dt; if (q.w < 0) q.w = 0; }
      else if (q.w < 0) { q.w += P.SPIN_DECAY * dt; if (q.w > 0) q.w = 0; }
      q.x += q.vx * dt; q.y += q.vy * dt;
      moving++;
    }
    // Krockar mellan puckar (i fast ordning)
    for (let i = 0; i < n; i++) {
      const a = ps[i];
      if (a.out) continue;
      for (let j = i + 1; j < n; j++) {
        const b = ps[j];
        if (b.out) continue;
        const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
        if (d2 >= D2) continue;
        let d = Math.sqrt(d2), nx, ny;
        if (d > 1e-9) { nx = dx / d; ny = dy / d; } else { d = 0; nx = 0; ny = 1; }
        const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rv < 0) {
          const jm = -(1 + P.E) * rv / 2;
          a.vx -= jm * nx; a.vy -= jm * ny;
          b.vx += jm * nx; b.vy += jm * ny;
          a.w *= 0.7; b.w *= 0.7;
          S.events.push({t: S.t, k: 'hit', a: a.id, b: b.id, v: -rv, x: (a.x + b.x) / 2, y: (a.y + b.y) / 2});
          moving++;
        }
        const push = (2 * R - d) / 2;
        a.x -= nx * push; a.y -= ny * push;
        b.x += nx * push; b.y += ny * push;
      }
    }
    // Över kanten: mitten av pucken är utanför spelytan
    for (let i = 0; i < n; i++) {
      const q = ps[i];
      if (q.out) continue;
      let edge = 0;
      if (q.y > L) edge = 3; else if (q.x > HALF) edge = 2; else if (q.x < -HALF) edge = 1; else if (q.y < 0) edge = 4;
      if (edge) {
        q.out = edge; q.fx = q.vx; q.fy = q.vy;
        S.events.push({t: S.t, k: 'fall', a: q.id, e: edge, x: q.x, y: q.y, vx: q.vx, vy: q.vy});
        q.vx = 0; q.vy = 0; q.w = 0;
      }
    }
    S.t += dt; S.steps++;
    S.moving = moving;
    if (!moving || S.t > P.MAX_T) {
      S.done = true;
      for (const q of ps) { q.vx = 0; q.vy = 0; q.w = 0; }
    }
    return !S.done;
  };

  P.run = S => { while (!S.done) P.step(S); return S; };

  // Kastar och kör klart: {pucks (på bordet efter kastet, även döda), fell (ids), events, t}
  P.simulate = (pucks, launch) => {
    const S = P.run(P.create(pucks, launch));
    return {S, t: S.t, events: S.events};
  };

  // Styrkan i kastet (0..1 från kraftmätaren) till fart. Upp till 0.8 är det rakt mot längden på bordet
  // (så att varje pixel betyder lika mycket överallt), därefter hårdare slag för att slå ut andras puckar.
  P.POWER_EDGE = 0.8;
  P.D_MIN = 3.2;           // kortare än så är ändå dött (foul-linjen ligger 4,9 m bort)
  // Fart som ger en viss glidsträcka. Med tidsstegen stannar pucken v*dt/2 tidigare än formeln v^2/(2a)
  // säger: d = v^2/(2a) - v*dt/2, alltså v = (a*dt + sqrt((a*dt)^2 + 8*a*d)) / 2.
  const vFor = d => { const adt = P.DECEL * P.DT; return (adt + Math.sqrt(adt * adt + 8 * P.DECEL * d)) / 2; };
  const dFor = v => v * v / (2 * P.DECEL) - v * P.DT / 2;
  P.speedFor = p => {
    const dEnd = L - TABLE.Y0;
    if (p <= P.POWER_EDGE) return vFor(P.D_MIN + (dEnd - P.D_MIN) * Math.max(0, p) / P.POWER_EDGE);
    const vEnd = vFor(dEnd);
    return vEnd + (P.VMAX - vEnd) * Math.min(1, (p - P.POWER_EDGE) / (1 - P.POWER_EDGE));
  };
  P.powerFor = v => {
    const dEnd = L - TABLE.Y0, vEnd = vFor(dEnd);
    if (v <= vEnd) return Math.max(0, (dFor(v) - P.D_MIN) / (dEnd - P.D_MIN) * P.POWER_EDGE);
    return P.POWER_EDGE + (1 - P.POWER_EDGE) * Math.min(1, (v - vEnd) / (P.VMAX - vEnd));
  };
  P.travelFor = v => dFor(v);
  // Vinkel (radianer) och fart till hastighet. Används bara av den som kastar; resultatet skickas som tal.
  P.inputFrom = (x, angle, speed, spin) => P.cleanInput({x, vx: speed * Math.sin(angle), vy: speed * Math.cos(angle), w: spin});

  // Zonen för en puck som ligger på bordet: 4 hängare, 3, 2, 1, 0 = död (inte helt förbi foul-linjen)
  P.zone = q => {
    if (q.y + R > L) return 4;
    const back = q.y - R;
    if (back >= TABLE.Z3) return 3;
    if (back >= TABLE.Z2) return 2;
    if (back > TABLE.FOUL) return 1;
    return 0;
  };
  return P;
})();

/* ---- 02-rules.js ---- */
/* ================= Reglerna ================= */
// En match: spelarna turas om att kasta sina puckar (vikter) i en omgång (en "ram"). När alla har kastat räknas poängen.
//   Klassisk räkning: bara den som har puck längst bort får poäng, för varje egen puck som ligger längre bort än
//   motståndarnas bästa. 1, 2 eller 3 poäng efter zonen, 4 för en hängare (sticker ut över kanten).
//   Alla räknar: varje spelare får poäng för alla sina puckar som ligger kvar (bra när man är tre eller fyra).
// En puck som inte helt har passerat bortre foul-linjen är död och tas bort. Först till målet vinner.
// Två spelare: den som fick poäng kastar först i nästa omgång (den andra får sista kastet, "hammaren").
// Tre eller fyra: den som leder kastar först och den som ligger sist kastar sist.
const Rules = (() => {
  const RU = {};
  RU.COLORS = {
    red: {name: 'Röd', hex: '#d62d3a', dark: '#8f1622'},
    blue: {name: 'Blå', hex: '#2a6fe0', dark: '#173f86'},
    gold: {name: 'Guld', hex: '#f0b429', dark: '#9c6c08'},
    green: {name: 'Grön', hex: '#25a55f', dark: '#11623a'},
    purple: {name: 'Lila', hex: '#8f4fd6', dark: '#552a8a'},
    white: {name: 'Vit', hex: '#eef0f3', dark: '#9aa1ab'}
  };
  RU.COLOR_KEYS = Object.keys(RU.COLORS);
  RU.perPlayer = n => n <= 2 ? 4 : 3;

  const clone = o => JSON.parse(JSON.stringify(o));

  // seats: [{name, color, avatar, kind: 'human'|'cpu', level, cid, dev}]
  RU.create = ({seats, target = 15, mode = null, seed = (Math.random() * 1e9) | 0, per = null, practice = false, id = null}) => {
    const n = seats.length;
    const rnd = seeded(seed);
    const order = seats.map((s, i) => i);
    if (n > 1) shuffle(order, rnd);
    return {
      v: 1, seed, practice, id: id || String(seed),
      mode: mode || (n <= 2 ? 'classic' : 'all'),
      target, per: per || (practice ? 8 : RU.perPlayer(n)),
      seats: clone(seats),
      scores: seats.map(() => 0),
      frame: 1, order, n: 0, k: 0,
      pucks: [], gutter: [], nextId: 1,
      last: null, frames: [], over: false, winner: -1
    };
  };

  RU.throwsPerFrame = m => m.per * m.seats.length;
  RU.current = m => m.over ? -1 : m.order[m.n % m.order.length];
  RU.thrown = (m, seat) => { let c = 0; for (let i = 0; i < m.n; i++) if (m.order[i % m.order.length] === seat) c++; return c; };
  RU.left = (m, seat) => m.per - RU.thrown(m, seat);

  // Poängen på bordet just nu. counted: [{id, owner, pts}]
  RU.score = (pucks, nSeats, mode) => {
    const points = Array.from({length: nSeats}, () => 0), counted = [];
    const alive = pucks.filter(q => Phys.zone(q) > 0);
    if (!alive.length) return {points, leader: -1, counted};
    if (mode === 'all') {
      for (const q of alive) { const pts = Phys.zone(q); points[q.owner] += pts; counted.push({id: q.id, owner: q.owner, pts}); }
      let best = -1, leader = -1, tie = false;
      points.forEach((p, i) => { if (p > best) { best = p; leader = i; tie = false; } else if (p === best) tie = true; });
      return {points, leader: tie || best <= 0 ? -1 : leader, counted};
    }
    // klassisk: längst bort vinner omgången
    const best = Array.from({length: nSeats}, () => -1);
    for (const q of alive) if (q.y > best[q.owner]) best[q.owner] = q.y;
    let top = -1, leader = -1, tie = false;
    best.forEach((y, i) => { if (y > top) { top = y; leader = i; tie = false; } else if (y === top && y >= 0) tie = true; });
    if (leader < 0 || tie) return {points, leader: -1, counted};
    let second = -1;
    best.forEach((y, i) => { if (i !== leader && y > second) second = y; });
    for (const q of alive) if (q.owner === leader && q.y > second) { const pts = Phys.zone(q); points[leader] += pts; counted.push({id: q.id, owner: leader, pts}); }
    return {points, leader, counted};
  };

  function nextOrder(m, framePoints) {
    const n = m.seats.length;
    if (n === 1) return m.order.slice();
    if (n === 2) {
      const scorer = framePoints.findIndex(p => p > 0);
      if (scorer < 0) return m.order.slice();
      return [scorer, 1 - scorer];
    }
    const prev = m.order.slice();
    return prev.slice().sort((a, b) => (m.scores[b] - m.scores[a]) || (prev.indexOf(a) - prev.indexOf(b)));
  }

  // Ett kast. input = {x, vx, vy, w}. Returnerar det nya läget (m ändras inte) och vad som hände.
  RU.apply = (m0, input) => {
    const m = clone(m0);
    const seat = RU.current(m);
    if (seat < 0) throw new Error('Matchen är slut');
    const id = m.nextId++;
    const before = RU.score(m.pucks, m.seats.length, m.mode);
    const res = Phys.simulate(m.pucks, {id, owner: seat, input});
    const S = res.S, fell = [], dead = [];
    const kept = [];
    for (const q of S.p) {
      if (q.out) { fell.push({id: q.id, owner: q.owner, e: q.out}); m.gutter.push({id: q.id, owner: q.owner, x: q.x, y: q.y, e: q.out}); continue; }
      const z = Phys.zone(q);
      if (z === 0) { dead.push({id: q.id, owner: q.owner}); continue; }
      kept.push({id: q.id, owner: q.owner, x: q.x, y: q.y});
    }
    m.pucks = kept;
    const shot = S.p.find(q => q.id === id);
    const shotZone = shot.out ? 0 : Phys.zone(shot);
    const knocked = fell.concat(dead).filter(q => q.id !== id && q.owner !== seat).length;
    const own = fell.concat(dead).filter(q => q.id !== id && q.owner === seat).length;
    const hits = res.events.filter(e => e.k === 'hit').length;
    m.n++; m.k++; m.v++;
    const after = RU.score(m.pucks, m.seats.length, m.mode);
    const sum = {k: m.k, seat, id, input: {x: input.x, vx: input.vx, vy: input.vy, w: input.w}, shotZone, fell: fell.map(q => q.id), dead: dead.map(q => q.id), knocked, own, hits,
      leaderBefore: before.leader, leader: after.leader, t: res.t, frameEnd: null, win: -1};
    if (m.n >= RU.throwsPerFrame(m)) {
      const fp = after.points;
      fp.forEach((p, i) => { m.scores[i] += p; });
      m.frames.push({frame: m.frame, points: fp, leader: after.leader, counted: after.counted});
      sum.frameEnd = {frame: m.frame, points: fp, leader: after.leader, counted: after.counted, pucks: m.pucks.slice(), gutter: m.gutter.slice()};
      // vinnare?
      const top = Math.max(...m.scores);
      if (!m.practice && top >= m.target && m.scores.filter(s => s === top).length === 1) {
        m.over = true; m.winner = m.scores.indexOf(top); sum.win = m.winner;
      } else {
        m.order = nextOrder(m, fp);
        m.frame++; m.n = 0; m.pucks = []; m.gutter = [];
      }
    }
    m.last = sum;
    return {m, S, sum};
  };

  // Hoppar över ett kast (t.ex. när tiden tar slut och ingen kan kasta): räknas som en död puck
  RU.skip = m0 => RU.apply(m0, {x: 0, vx: 0, vy: 0.05, w: 0});

  // Tabellen: platser sorterade efter poäng
  RU.standings = m => m.seats.map((s, i) => i).sort((a, b) => m.scores[b] - m.scores[a] || a - b);
  RU.colorOf = (m, seat) => RU.COLORS[m.seats[seat] && m.seats[seat].color] || RU.COLORS.red;
  return RU;
})();

/* ---- 03-ai.js ---- */
/* ================= Datorspelaren ================= */
// Datorn provar många tänkbara kast i samma fysik som spelet (läggen mot zonerna, utslag på andras puckar,
// skydd framför egna) och värderar läget efteråt. De bästa kasten provas igen med darr på handen så att den
// väljer säkra kast framför chansningar. Nivån bestämmer hur mycket handen darrar när kastet väl görs.
const AI = (() => {
  const A = {};
  const {L, R, HALF, Y0, FOUL} = TABLE;
  A.LEVELS = {
    latt: {name: 'Lätt', v: 0.030, a: 0.011, spin: 0.9, blunder: 0.3, cands: .45},
    medel: {name: 'Medel', v: 0.013, a: 0.0055, spin: 0.5, blunder: 0.08, cands: .8},
    svar: {name: 'Svår', v: 0.0065, a: 0.0026, spin: 0.25, blunder: 0, cands: 1}
  };
  A.NAMES = ['Greta', 'Sixten', 'Majken', 'Bosse', 'Tyra', 'Nisse', 'Ingrid', 'Folke', 'Svea', 'Kjell'];
  A.AVATARS = ['🤖', '🎩', '🦉', '🐙'];

  // Enkel slump med frö (datorns darr blir samma på alla enheter om värden räknar)
  function gauss(rnd) { let u = 0, v = 0; while (u === 0) u = rnd(); while (v === 0) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

  // Kast från (x0, Y0) mot (tx, ty) på tomt bord, rättat för bordets välvning och skruven
  const drawCache = new Map();
  function draw(x0, tx, ty, spin) {
    const key = [x0, tx, ty, spin].map(v => v.toFixed(4)).join();
    if (drawCache.has(key)) return drawCache.get(key);
    let ax = tx, ay = ty, inp = null;
    for (let it = 0; it < 3; it++) {
      const dx = ax - x0, dy = ay - Y0, d = Math.sqrt(dx * dx + dy * dy);
      const ang = Math.atan2(dx, dy), sp = Math.sqrt(2 * Phys.DECEL * Math.max(0.2, d));
      inp = Phys.inputFrom(x0, ang, sp, spin);
      const S = Phys.run(Phys.create([], {id: 1, owner: 0, input: inp}));
      const q = S.p[0];
      if (q.out) { ay -= 0.12; continue; }
      const ex = q.x - tx, ey = q.y - ty;
      if (Math.abs(ex) < 0.004 && Math.abs(ey) < 0.004) break;
      ax -= ex; ay -= ey;
    }
    if (drawCache.size > 4000) drawCache.clear();
    drawCache.set(key, inp);
    return inp;
  }
  // Rakt slag mot en puck med en viss fart
  function hit(x0, q, speed, offset) {
    const tx = q.x + offset * R, ty = q.y;
    const ang = Math.atan2(tx - x0, ty - Y0);
    return Phys.inputFrom(x0, ang, speed, 0);
  }

  function candidates(m, seat, lv) {
    const out = [], pucks = m.pucks, mine = pucks.filter(q => q.owner === seat), theirs = pucks.filter(q => q.owner !== seat);
    const xs = [-0.16, -0.08, 0, 0.08, 0.16];
    const starts = [-0.12, 0, 0.12];
    const ys = [L - 0.07, L - 0.04, L - 0.12, L - 0.22, L - 0.5, L - 1.0];
    for (const ty of ys) for (const tx of xs) {
      const x0 = clamp(tx * 0.6, -HALF + R, HALF - R);
      out.push({kind: 'draw', inp: draw(x0, tx, ty, 0)});
    }
    // skruv runt hinder
    for (const s of [-4, 4]) for (const tx of [-0.1, 0, 0.1]) for (const x0 of starts) out.push({kind: 'curl', inp: draw(x0, tx, L - 0.08, s)});
    // utslag
    const vHard = Phys.speedFor(0.93), vFirm = Phys.speedFor(0.84);
    for (const q of theirs) for (const x0 of [q.x * 0.5, q.x, clamp(q.x + (q.x > 0 ? -0.1 : 0.1), -HALF + R, HALF - R)]) {
      for (const off of [0, -0.35, 0.35]) { out.push({kind: 'hit', inp: hit(x0, q, vHard, off)}); out.push({kind: 'hit', inp: hit(x0, q, vFirm, off)}); }
    }
    // skydd framför den egna ledande pucken
    if (mine.length) {
      const lead = mine.reduce((a, b) => (b.y > a.y ? b : a));
      for (const d of [0.35, 0.6, 0.9]) {
        const ty = Math.max(FOUL + R + 0.06, lead.y - d);
        for (const dx of [-0.02, 0, 0.02]) out.push({kind: 'guard', inp: draw(clamp(lead.x * 0.7, -HALF + R, HALF - R), lead.x + dx, ty, 0)});
      }
      // lägg bakom/bredvid egna puckar (in i 3-zonen bakom ett skydd)
      for (const q of mine) for (const dx of [-0.07, 0.07]) out.push({kind: 'draw', inp: draw(clamp(q.x * 0.5, -HALF + R, HALF - R), clamp(q.x + dx, -HALF + 1.5 * R, HALF - 1.5 * R), L - 0.06, 0)});
    }
    // Lätta datorn tänker inte igenom allt
    if (lv.cands < 1) { const rnd = seeded(m.k * 7919 + seat); return out.filter(() => rnd() < lv.cands); }
    return out;
  }

  // Hur bra är läget för spelaren? (poäng nu, hur utsatta de är och hur djupt puckarna ligger)
  function value(m, pucks, seat, leftMe, leftOthers) {
    const n = m.seats.length, sc = Rules.score(pucks, n, m.mode);
    let v;
    if (m.mode === 'all') {
      const others = sc.points.filter((p, i) => i !== seat);
      v = sc.points[seat] - (others.length ? (Math.max(...others) * 0.5 + others.reduce((a, b) => a + b, 0) / others.length * 0.5) : 0);
    } else v = sc.points[seat] - Math.max(0, ...sc.points.filter((p, i) => i !== seat));
    // utsatthet: hur fritt ligger de räknande puckarna om andra har kast kvar?
    if (leftOthers > 0) {
      for (const c of sc.counted) {
        const q = pucks.find(p => p.id === c.id);
        if (!q) continue;
        const guarded = pucks.some(g => g !== q && g.y < q.y - 2 * R && Math.abs(g.x - q.x) < 2.1 * R);
        const risk = (guarded ? 0.18 : 0.42) * Math.min(1, leftOthers / 3);
        v -= (c.owner === seat ? 1 : -1) * c.pts * risk;
      }
    }
    // djupare är bättre, och egna puckar på bordet är material inför resten av omgången
    for (const q of pucks) {
      const z = Phys.zone(q);
      const depth = (q.y - FOUL) / (L - FOUL);
      const w = q.owner === seat ? 1 : -0.6;
      v += w * (0.12 * z + 0.25 * depth) * (leftMe + leftOthers > 0 ? 1 : 0.2);
    }
    return v;
  }

  function evalInput(m, seat, inp, leftMe, leftOthers) {
    const res = Phys.simulate(m.pucks, {id: 99999, owner: seat, input: inp});
    const after = res.S.p.filter(q => !q.out && Phys.zone(q) > 0).map(q => ({id: q.id, owner: q.owner, x: q.x, y: q.y}));
    return value(m, after, seat, leftMe - 1, leftOthers);
  }

  function jitter(inp, lv, rnd, k = 1) {
    const sp = Math.sqrt(inp.vx * inp.vx + inp.vy * inp.vy) * (1 + gauss(rnd) * lv.v * k);
    const ang = Math.atan2(inp.vx, inp.vy) + gauss(rnd) * lv.a * k;
    return Phys.inputFrom(inp.x, ang, sp, inp.w + gauss(rnd) * lv.spin * k);
  }

  // Väljer ett kast. rnd: slump (med frö när värden räknar över nätet). Asynkron så att bilden inte hackar.
  A.choose = async (m, seat, levelKey = 'medel', rnd = Math.random) => {
    const lv = A.LEVELS[levelKey] || A.LEVELS.medel;
    const leftMe = Rules.left(m, seat);
    let leftOthers = 0;
    m.seats.forEach((s, i) => { if (i !== seat) leftOthers += Rules.left(m, i); });
    const cands = candidates(m, seat, lv);
    let t0 = performance.now();
    const yieldIfSlow = async () => { if (performance.now() - t0 > 12) { await new Promise(r => setTimeout(r, 0)); t0 = performance.now(); } };
    for (const c of cands) { c.v = evalInput(m, seat, c.inp, leftMe, leftOthers); await yieldIfSlow(); }
    cands.sort((a, b) => b.v - a.v);
    // de bästa provas med darr: välj det som håller bäst i genomsnitt
    const top = cands.slice(0, 8), mc = seeded((m.k + 1) * 104729 + seat * 31 + (m.seed | 0));
    for (const c of top) {
      let sum = 0;
      for (let i = 0; i < 6; i++) sum += evalInput(m, seat, jitter(c.inp, lv, mc, 1), leftMe, leftOthers);
      c.mv = sum / 6 * 0.75 + c.v * 0.25;
      await yieldIfSlow();
    }
    top.sort((a, b) => b.mv - a.mv);
    let choice = top[0] || {inp: draw(0, 0, L - 0.08, 0), kind: 'draw'};

    if (m.lm != null) {
      // inbakat ljus: byte = 255 * sqrt(v / 2) -> v = (byte / 255)^2 * 2 (linjärt)
      const lm = new Uint8Array(bin, m.lm, vc * 3);
      for (let i = 0; i < vc * 3; i++) { const b = lm[i] / 255; col[i] = b * b * 2; }
      baked = true;
    } else if (m.ao != null) {
      const ao = new Uint8Array(bin, m.ao, vc);
      for (let i = 0; i < vc; i++) { const a = ao[i] / 255; col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = a; }
    } else col.fill(1);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    if (m.uv != null) {
      const qu = new Uint16Array(bin, m.uv, vc * 2), uv = new Float32Array(vc * 2);
      for (let i = 0; i < vc * 2; i++) uv[i] = qu[i] / 65535;
      g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    }
    const idx = m.i16 ? new Uint16Array(new Uint16Array(bin, m.idx, m.ic)) : new Uint32Array(new Uint32Array(bin, m.idx, m.ic));
    g.setIndex(new THREE.BufferAttribute(idx, 1));
    const local = {}, order = [];
    m.g.forEach(([start, count, mat]) => {
      if (!(mat in local)) { local[mat] = order.length; order.push(mat); }
      g.addGroup(start, count, local[mat]);
    });
    g.userData.mats = order;
    g.userData.baked = baked;
    g.computeBoundingSphere();
    return (geoCache[mi] = g);
  }

  const matCache = {};
  // Standardmaterial: inbakat ljus ritas utan ljuskällor (färgen i hörnen är det färdiga ljuset), lysande delar
  // lyser, och resten (pucken) får riktiga material som reagerar på lamporna.
  function material(i, baked, opts) {
    const d = data.materials[i];
    if (opts.material) { const m = opts.material(d, baked); if (m) return m; }
    const recolor = d.rc && opts.colors && opts.colors[d.rc];
    const key = i + '|' + baked + '|' + (recolor || '');
    if (matCache[key]) return matCache[key];
    let m;
    if (d.e && d.ei > 0) {
      m = new THREE.MeshBasicMaterial({color: new THREE.Color(d.e).multiplyScalar(Math.max(1, d.ei)), toneMapped: true});
    } else if (baked) {
      m = new THREE.MeshBasicMaterial({vertexColors: true});
    } else {
      const P = {color: recolor || d.c, roughness: d.r, metalness: d.m, vertexColors: true, envMapIntensity: d.m > .5 ? 1 : .6};
      m = d.cc > 0 ? new THREE.MeshPhysicalMaterial(Object.assign(P, {clearcoat: d.cc, clearcoatRoughness: .15})) : new THREE.MeshStandardMaterial(P);
    }
    if (d.op < 1) { m.transparent = true; m.opacity = d.op; m.depthWrite = false; }
    if (d.ds) m.side = THREE.DoubleSide;
    m.name = d.n;
    return (matCache[key] = m);
  }

  // Skapar en modell. opts.material(info, baked) kan ge egna material för vissa delar (t.ex. spelytan).
  // Noderna nås via root.userData.nodes[namn].
  L.create = (name, opts = {}) => {
    const nodes = data && data.models[name];
    if (!nodes) return null;
    const objs = [];
    nodes.forEach(n => {
      const o = new THREE.Group();
      o.name = n.n;
      o.position.fromArray(n.t);
      o.quaternion.fromArray(n.q);
      o.scale.fromArray(n.s);
      if (n.m >= 0) {
        const g = geometry(n.m);
        const mats = g.userData.mats.map(mi => material(mi, g.userData.baked, opts));
        const mesh = new THREE.Mesh(g, mats.length === 1 ? mats[0] : mats);
        mesh.name = n.n + '_mesh';
        o.add(mesh);
      }
      if (n.p >= 0) objs[n.p].add(o);
      objs.push(o);
    });
    const root = objs[0];
    root.userData.nodes = {};
    objs.forEach(o => { root.userData.nodes[o.name] = o; });
    return root;
  };
  L.meshesWith = (root, test) => {
    const out = [];
    root.traverse(o => { if (o.isMesh) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if (test(m.name || '')) out.push(o); }); });
    return out;
  };
  return L;
})();

/* ---- 06-scene.js ---- */
/* ================= 3D-scenen: puben, bordet och lamporna ================= */
// Världen: X åt sidan, Y uppåt (golvet = 0), Z = -y (bordet sträcker sig bort från kameran mot -Z).
// Puben och bordets skåp kommer från Blender med inbakat ljus. Spelytan byggs här: blankt lönnträ med
// linjer och siffror, riktiga lampor för puckarna och speglingar av puckarna i lacken.
const Scene = (() => {
  const S = {};
  const {L, W, TOP, R} = TABLE;
  let renderer, scene, camera, pmrem = null, envMap = null;
  S.quality = 'high';
  S.lamps = [0.9, 2.6, 4.3, 6.0];
  S.LAMP_I = 1.25;
  S.LAMP_H = 1.72;
  S.world = (x, y, h = 0) => new THREE.Vector3(x, TOP + h, -y);

  S.init = canvas => {
    const q = Settings.quality;
    const weak = /Android [4-8]\b/.test(navigator.userAgent) || (navigator.deviceMemory && navigator.deviceMemory < 3);
    S.quality = q === 'low' ? 'low' : q === 'high' ? 'high' : (weak ? 'low' : 'high');
    renderer = new THREE.WebGLRenderer({canvas, antialias: false, alpha: false, stencil: true, powerPreference: 'high-performance', preserveDrawingBuffer: false});
    renderer.physicallyCorrectLights = true;
    renderer.setClearColor(0x0b0806, 1);
    S.dpr = Math.min(window.devicePixelRatio || 1, S.quality === 'low' ? 1.25 : 2);
    renderer.setPixelRatio(S.dpr);
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0806);
    scene.fog = new THREE.Fog(0x0e0a07, 10, 26);
    camera = new THREE.PerspectiveCamera(50, 1, 0.02, 60);
    S.renderer = renderer; S.scene = scene; S.camera = camera;
    S.post = S.quality !== 'low' && Post.init(renderer);
    if (!S.post) { renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0; renderer.outputEncoding = THREE.sRGBEncoding; }
    buildLights();
    const hasModels = ModelLib.init() && ModelLib.has('room') && ModelLib.has('table');
    if (hasModels) buildFromModels(); else buildFallback();
    buildPlayfield();
    buildLampFx();
    S.resize();
    window.addEventListener('resize', () => S.resize());
    // Miljön för speglingarna (krom och lack) fotograferas från bordet när allt är på plats
    setTimeout(() => S.captureEnv(), 30);
  };

  S.resize = () => {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    if (S.post) Post.setSize(Math.round(w * S.dpr), Math.round(h * S.dpr));
    S.w = w; S.h = h;
  };
  S.setDpr = d => { S.dpr = d; renderer.setPixelRatio(d); S.resize(); };

  /* ---------- Ljus ---------- */
  S.lights = [];
  function buildLights() {
    const hemi = new THREE.HemisphereLight(0xffd9b0, 0x1a1008, 0.18);
    scene.add(hemi);
    S.lamps.forEach(y => {
      const p = new THREE.PointLight(0xffc98f, S.LAMP_I, 0, 2);
      p.position.set(0, S.LAMP_H, -y);
      scene.add(p);
      S.lights.push(p);
    });
    // svagt kallt ljus från fönstren på höger sida
    const d = new THREE.DirectionalLight(0x6f8cff, 0.12);
    d.position.set(4, 3, -3);
    scene.add(d);
  }

  /* ---------- Miljökarta för speglingar ---------- */
  S.captureEnv = () => {
    try {
      const half = renderer.capabilities.isWebGL2 || renderer.extensions.get('OES_texture_half_float');
      const rt = new THREE.WebGLCubeRenderTarget(S.quality === 'low' ? 128 : 256, {format: THREE.RGBAFormat, type: half ? THREE.HalfFloatType : THREE.UnsignedByteType, generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter});
      const cc = new THREE.CubeCamera(0.05, 40, rt);
      cc.position.set(0, TOP + 0.25, -L * 0.62);
      scene.add(cc);
      const hidden = [];
      scene.traverse(o => { if (o.userData.noEnv && o.visible) { hidden.push(o); o.visible = false; } });
      const oldTM = renderer.toneMapping, oldEnc = renderer.outputEncoding;
      renderer.toneMapping = THREE.NoToneMapping; renderer.outputEncoding = THREE.LinearEncoding;
      cc.update(renderer, scene);
      renderer.toneMapping = oldTM; renderer.outputEncoding = oldEnc;
      hidden.forEach(o => { o.visible = true; });
      scene.remove(cc);
      pmrem = pmrem || new THREE.PMREMGenerator(renderer);
      const env = pmrem.fromCubemap(rt.texture).texture;
      rt.dispose();
      envMap = env;
      scene.traverse(o => { if (o.isMesh) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if (m.isMeshStandardMaterial && m.userData.env !== false) { m.envMap = env; m.needsUpdate = true; } }); });
      Bus.emit('env', env);
    } catch (e) { console.warn('Ingen miljökarta:', e); }
  };
  S.env = () => envMap;

  /* ---------- Puben från Blender ---------- */
  S.neon = [];
  function buildFromModels() {
    const special = (d, baked) => {
      if (d.n === 'Spelyta') return new THREE.MeshBasicMaterial({visible: false});
      if (d.n === 'Tavla') return S.board.material;
      if (/^Neon/.test(d.n)) { const m = new THREE.MeshBasicMaterial({color: new THREE.Color(d.e || d.c).multiplyScalar(Math.max(1.5, d.ei || 3))}); m.userData.base = m.color.clone(); S.neon.push(m); return m; }
      if (d.n === 'Lampa') return new THREE.MeshBasicMaterial({color: new THREE.Color(d.e || '#ffd9a0').multiplyScalar(Math.max(4, d.ei || 8))});
      return null;
    };
    makeBoard();
    const room = ModelLib.create('room', {material: special});
    const table = ModelLib.create('table', {material: special});
    [room, table].forEach(o => { o.traverse(c => { if (c.isMesh) { c.matrixAutoUpdate = false; c.updateMatrix(); } }); scene.add(o); });
    const sp = table.userData.nodes.spelyta;
    if (sp) sp.visible = false;
    S.room = room; S.table = table;
  }

  /* ---------- Reserv: en enkel pub byggd i koden ---------- */
  function buildFallback() {
    makeBoard();
    const std = (c, r = .6, m = 0) => new THREE.MeshStandardMaterial({color: c, roughness: r, metalness: m});
    const walnut = std(0x4a2a17, .45), dark = std(0x16110d, .9), brass = std(0xc79a4a, .3, 1);
    const add = (geo, mat, x, y, z) => { const o = new THREE.Mesh(geo, mat); o.position.set(x, y, z); scene.add(o); return o; };
    const floorMat = std(0x2b1a10, .8);
    add(new THREE.PlaneGeometry(9, 14).rotateX(-Math.PI / 2), floorMat, 0.2, 0, -L / 2);
    const wallMat = std(0x1f3a2c, .85), brick = std(0x5a2a1c, .9);
    add(new THREE.PlaneGeometry(9, 3.2), brick, 0.2, 1.6, -9.4);
    add(new THREE.PlaneGeometry(14, 3.2).rotateY(Math.PI / 2), wallMat, -3.2, 1.6, -L / 2);
    add(new THREE.PlaneGeometry(14, 3.2).rotateY(-Math.PI / 2), wallMat, 3.6, 1.6, -L / 2);
    // bordet
    const len = L + 0.42, zc = -L / 2;
    add(new THREE.BoxGeometry(0.788, 0.22, len), walnut, 0, 0.63, zc);
    [-1, 1].forEach(s => {
      add(new THREE.BoxGeometry(0.095, 0.01, len), dark, s * 0.3015, TOP - TABLE.DROP, zc);
      add(new THREE.BoxGeometry(0.045, 0.1, len), walnut, s * 0.3715, TOP - 0.03, zc);
      [0.35, 2.35, 4.35, 6.35].forEach(y => add(new THREE.BoxGeometry(0.075, 0.52, 0.075), walnut, s * 0.32, 0.26, -y));
    });
    add(new THREE.BoxGeometry(W, 0.075, L), std(0xd8b27a, .5), 0, TOP - 0.0376, zc);
    [[-0.08, 0.05], [L + 0.08, 0.05]].forEach(([y]) => add(new THREE.BoxGeometry(W + 0.19, 0.01, 0.16), dark, 0, TOP - TABLE.DROP, -y));
    [-0.185, L + 0.185].forEach(y => add(new THREE.BoxGeometry(0.788, 0.13, 0.05), walnut, 0, TOP + 0.01, -y));
    // tavlan på bortre väggen
    const b = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.7), S.board.material);
    b.position.set(0, 1.62, -9.38); scene.add(b);
    const frame = add(new THREE.BoxGeometry(1.52, 0.82, 0.04), walnut, 0, 1.62, -9.41);
    frame.renderOrder = -1;
    // lampor
    S.lamps.forEach(y => {
      const shade = add(new THREE.ConeGeometry(0.18, 0.2, 24, 1, true), std(0x1d5a3a, .4), 0, S.LAMP_H + 0.08, -y);
      shade.material.side = THREE.DoubleSide;
      add(new THREE.SphereGeometry(0.04, 12, 8), new THREE.MeshBasicMaterial({color: new THREE.Color(0xffe0b0).multiplyScalar(6)}), 0, S.LAMP_H + 0.02, -y);
      add(new THREE.CylinderGeometry(0.004, 0.004, 1.2, 6), dark, 0, S.LAMP_H + 0.75, -y);
    });
    add(new THREE.BoxGeometry(0.02, 0.02, 0.02), brass, 0, 0, 0);
  }

  /* ---------- Poängtavlan på väggen ---------- */
  function makeBoard() {
    if (S.board) return;
    const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = 4;
    const material = new THREE.MeshBasicMaterial({map: tex, color: new THREE.Color(1.6, 1.6, 1.6)});
    S.board = {canvas: c, ctx: c.getContext('2d'), tex, material};
    S.drawBoard(null);
  }
  // Tavlan visar ställningen (och "Shuffleklubben" när ingen match pågår)
  S.drawBoard = m => {
    const B = S.board;
    if (!B) return;
    const g = B.ctx, w = B.canvas.width, hh = B.canvas.height;
    g.fillStyle = '#0d1411'; g.fillRect(0, 0, w, hh);
    const grad = g.createRadialGradient(w / 2, hh / 2, 50, w / 2, hh / 2, w * .7);
    grad.addColorStop(0, 'rgba(40,70,55,.55)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad; g.fillRect(0, 0, w, hh);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    if (!m) {
      g.fillStyle = '#f3dfb8'; g.font = '700 110px Georgia, serif';
      g.fillText('Shuffleklubben', w / 2, hh / 2 - 30);
      g.fillStyle = 'rgba(243,223,184,.6)'; g.font = '600 44px Georgia, serif';
      g.fillText('— sedan i kväll —', w / 2, hh / 2 + 70);
    } else {
      const n = m.seats.length, rowH = Math.min(110, (hh - 90) / n);
      g.fillStyle = 'rgba(243,223,184,.75)'; g.font = '600 42px Georgia, serif';
      g.fillText(m.practice ? 'Träning' : `Omgång ${m.frame}  ·  först till ${m.target}`, w / 2, 50);
      m.seats.forEach((s, i) => {
        const y = 110 + i * rowH + rowH / 2, col = (Rules.COLORS[s.color] || Rules.COLORS.red).hex;
        g.fillStyle = col; g.beginPath(); g.arc(120, y, 26, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#f3dfb8'; g.textAlign = 'left'; g.font = '700 58px Georgia, serif';
        g.fillText(String(s.name || '').slice(0, 14), 175, y + 2);
        g.textAlign = 'right'; g.font = '700 78px Georgia, serif';
        g.fillText(String(m.scores[i]), w - 90, y + 4);
        g.textAlign = 'center';
      });
    }
    B.tex.needsUpdate = true;
  };

  /* ---------- Spelytan: lönn med linjer ---------- */
  // Tre delar: närmsta änden (där man kastar), mitten och bortre änden (zonerna). Varje del har sin egen bild.
  S.play = null;
  function woodCanvas(cw, ch, lenM, seed, marks) {
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    const g = c.getContext('2d');
    const rnd = seeded(seed);
    const pxPerM = ch / lenM, strips = 10, sw = cw / strips;
    // limmade lönnlameller med lite olika ton
    for (let s = 0; s < strips; s++) {
      const t = 0.93 + rnd() * 0.12, warm = rnd() * 10;
      g.fillStyle = `rgb(${Math.round(226 * t)},${Math.round((190 - warm) * t)},${Math.round((136 - warm * 1.5) * t)})`;
      g.fillRect(Math.floor(s * sw), 0, Math.ceil(sw) + 1, ch);
      // ådring längs bordet
      const lines = 16 + Math.floor(rnd() * 10);
      for (let i = 0; i < lines; i++) {
        const x0 = s * sw + rnd() * sw, amp = (0.4 + rnd() * 2.2) * cw / 512, per = (0.25 + rnd() * 0.9) * pxPerM, ph = rnd() * 6.28;
        const a = 0.025 + rnd() * 0.08, lw = (0.5 + rnd() * 1.6) * cw / 512;
        g.strokeStyle = `rgba(${110 + rnd() * 40 | 0},${64 + rnd() * 30 | 0},${28 + rnd() * 20 | 0},${a})`;
        g.lineWidth = lw;
        g.beginPath();
        for (let y = 0; y <= ch; y += 24) {
          const x = Math.min(s * sw + sw - 1, Math.max(s * sw + 1, x0 + Math.sin(y / per + ph) * amp + Math.sin(y / (per * 0.31) + ph * 2) * amp * 0.3));
          if (y === 0) g.moveTo(x, y); else g.lineTo(x, y);
        }
        g.stroke();
      }
      // små porer
      g.fillStyle = 'rgba(90,50,20,.09)';
      for (let i = 0; i < ch / 6; i++) g.fillRect(s * sw + rnd() * sw, rnd() * ch, Math.max(1, cw / 900), (2 + rnd() * 6) * ch / 4096);
      // skarven mellan lamellerna
      g.fillStyle = 'rgba(70,40,15,.12)';
      g.fillRect(Math.floor(s * sw), 0, Math.max(1, cw / 700), ch);
    }
    // lockig lönn: svaga tvärgående band
    for (let i = 0; i < ch / 18; i++) {
      const y = rnd() * ch, hgt = (2 + rnd() * 7) * ch / 4096;
      g.fillStyle = rnd() < .5 ? `rgba(255,240,210,${0.02 + rnd() * .035})` : `rgba(120,70,30,${0.015 + rnd() * .03})`;
      g.fillRect(0, y, cw, hgt);
    }
    // silikonpulver: små ljusa korn, mest i ändarna
    for (let i = 0; i < ch * 1.2; i++) {
      g.fillStyle = `rgba(255,255,255,${0.04 + rnd() * .1})`;
      const s2 = Math.max(1, cw / 600);
      g.fillRect(rnd() * cw, rnd() * ch, s2, s2);
    }
    if (marks) marks(g, cw, ch, pxPerM);
    return c;
  }
  // Linjer och siffror. yTop = bordets y vid bildens överkant (bortre änden av delen).
  function drawMarks(g, cw, ch, pxPerM, yTop, flip) {
    const row = y => (yTop - y) * pxPerM;
    const line = (y, wMM, alpha = .88) => { const r = row(y), lw = wMM / 1000 * pxPerM; g.fillStyle = `rgba(22,14,8,${alpha})`; g.fillRect(0, r - lw / 2, cw, lw); };
    const num = (txt, y, sizeM) => {
      const r = row(y), px = sizeM * pxPerM;
      g.save(); g.translate(cw / 2, r); if (flip) g.rotate(Math.PI);
      g.font = `700 ${Math.round(px)}px Georgia, "Times New Roman", serif`;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = px * 0.06; g.strokeStyle = 'rgba(22,14,8,.9)'; g.fillStyle = 'rgba(22,14,8,.82)';
      g.fillText(txt, 0, px * 0.04);
      g.restore();
    };
    const E = flip ? 0 : L, dir = flip ? 1 : -1;
    line(E + dir * 0.1524, 4);
    line(E + dir * 0.3048, 4);
    line(E + dir * 1.8288, 6);
    // tunn linje precis vid kanten
    g.fillStyle = 'rgba(22,14,8,.35)'; g.fillRect(0, row(E - dir * 0.001) - 1, cw, 2);
    num('3', E + dir * 0.0762, 0.085);
    num('2', E + dir * 0.2286, 0.085);
    num('1', E + dir * 0.62, 0.11);
    // små pärlemorprickar vid foul-linjen att sikta med
    [-0.19, -0.095, 0, 0.095, 0.19].forEach(x => {
      const cx = (x / W + 0.5) * cw, cy = row(E + dir * 1.95), rr = 0.006 * pxPerM;
      const gr = g.createRadialGradient(cx, cy, 0, cx, cy, rr);
      gr.addColorStop(0, 'rgba(255,255,250,.95)'); gr.addColorStop(.7, 'rgba(220,225,235,.8)'); gr.addColorStop(1, 'rgba(120,110,100,.6)');
      g.fillStyle = gr; g.beginPath(); g.ellipse(cx, cy, rr, rr, 0, 0, Math.PI * 2); g.fill();
    });
  }
  function buildPlayfield() {
    const hq = S.quality !== 'low';
    const endLen = 2.2, midLen = L - 2 * endLen;
    const farC = woodCanvas(hq ? 1024 : 512, hq ? 4096 : 2048, endLen, 11, (g, cw, ch, ppm) => drawMarks(g, cw, ch, ppm, L, false));
    const nearC = woodCanvas(hq ? 1024 : 512, hq ? 4096 : 2048, endLen, 23, (g, cw, ch, ppm) => drawMarks(g, cw, ch, ppm, endLen, true));
    const midC = woodCanvas(512, 2048, midLen, 37, (g, cw, ch, ppm) => {
      // klubbens märke mitt på bordet, svagt inbränt
      g.save(); g.translate(cw / 2, ch / 2); g.rotate(-Math.PI / 2);
      g.font = `italic 700 ${Math.round(0.11 * ppm)}px Georgia, serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = 'rgba(90,50,20,.22)'; g.fillText('Shuffleklubben', 0, 0);
      g.restore();
    });
    const maxAniso = renderer.capabilities.getMaxAnisotropy();
    const mk = (canvas, y0, len) => {
      const tex = new THREE.CanvasTexture(canvas);
      tex.encoding = THREE.sRGBEncoding; tex.anisotropy = Math.min(8, maxAniso);
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      const mat = new THREE.MeshStandardMaterial({map: tex, roughness: 0.34, metalness: 0, envMapIntensity: 0.32});
      mat.stencilWrite = true; mat.stencilRef = 1; mat.stencilFunc = THREE.AlwaysStencilFunc; mat.stencilZPass = THREE.ReplaceStencilOp;
      const geo = new THREE.PlaneGeometry(W, len, 8, Math.max(8, Math.round(len * 10)));
      geo.rotateX(-Math.PI / 2);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(0, TOP, -(y0 + len / 2));
      mesh.renderOrder = -5;
      mesh.userData.noEnv = true;
      scene.add(mesh);
      return mesh;
    };
    S.play = [mk(nearC, 0, endLen), mk(midC, endLen, midLen), mk(farC, L - endLen, endLen)];
    // lackens glans: en svag reflex av lamporna i ytan (utöver miljökartan)
    S.playMats = S.play.map(p => p.material);
  }

  /* ---------- Ljuskäglor och damm i lampornas ljus ---------- */
  let dust = null;
  function buildLampFx() {
    if (S.quality === 'low') return;
    const coneMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
      uniforms: {k: {value: 0.05}},
      vertexShader: 'varying float vH; varying vec3 vN; varying vec3 vV; void main(){ vH = uv.y; vec4 wp = modelViewMatrix * vec4(position,1.); vN = normalize(normalMatrix * normal); vV = normalize(-wp.xyz); gl_Position = projectionMatrix * wp; }',
      fragmentShader: 'uniform float k; varying float vH; varying vec3 vN; varying vec3 vV; void main(){ float rim = pow(abs(dot(vN, vV)), 1.6); float a = k * rim * smoothstep(0., .9, vH) * (0.35 + 0.65 * vH); gl_FragColor = vec4(vec3(1.0, .82, .6) * a, 1.); }'
    });
    S.lamps.forEach(y => {
      const cone = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.52, S.LAMP_H - TOP - 0.02, 32, 1, true), coneMat);
      cone.position.set(0, (S.LAMP_H + TOP) / 2 - 0.01, -y);
      cone.userData.noEnv = true;
      scene.add(cone);
    });
    // dammkorn som svävar i ljuset
    const n = 420, pos = new Float32Array(n * 3), seed = new Float32Array(n);
    const rnd = seeded(5);
    for (let i = 0; i < n; i++) {
      const lamp = S.lamps[i % S.lamps.length];
      pos[i * 3] = (rnd() - .5) * 0.8; pos[i * 3 + 1] = TOP + 0.05 + rnd() * (S.LAMP_H - TOP - 0.1); pos[i * 3 + 2] = -lamp + (rnd() - .5) * 0.8;
      seed[i] = rnd() * 100;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('seed', new THREE.BufferAttribute(seed, 1));
    const mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: {t: {value: 0}, px: {value: 1}},
      vertexShader: `attribute float seed; uniform float t; uniform float px; varying float vA;
        void main(){ vec3 p = position; p.x += sin(t * .13 + seed) * .06; p.y += sin(t * .09 + seed * 1.7) * .05; p.z += cos(t * .11 + seed * .7) * .06;
          vec4 mv = modelViewMatrix * vec4(p, 1.); gl_Position = projectionMatrix * mv; gl_PointSize = px * (1.4 + fract(seed) * 1.8) / max(.3, -mv.z) * 2.;
          vA = (.35 + .65 * fract(seed * 3.7)) * (.6 + .4 * sin(t * .7 + seed * 5.)); }`,
      fragmentShader: 'varying float vA; void main(){ vec2 d = gl_PointCoord - .5; float a = smoothstep(.5, .0, length(d)) * vA * .5; gl_FragColor = vec4(vec3(1.,.85,.62) * a, 1.); }'
    });
    dust = new THREE.Points(geo, mat);
    dust.userData.noEnv = true;
    dust.frustumCulled = false;
    scene.add(dust);
  }

  /* ---------- Rita ---------- */
  let t0 = performance.now(), flick = 0;
  S.render = (opts = {}) => {
    const t = (performance.now() - t0) / 1000;
    if (dust) { dust.material.uniforms.t.value = t; dust.material.uniforms.px.value = S.dpr * (S.h || 800) / 900; }
    // neonskylten flimrar ibland lite
    if (S.neon.length) {
      flick = Math.max(0, flick - 0.05);
      if (Math.random() < 0.004) flick = 0.6 + Math.random() * 0.4;
      const k = 1 - (flick > 0 ? (Math.sin(t * 90) > 0 ? flick * 0.35 : 0) : 0);
      S.neon.forEach(m => m.color.copy(m.userData.base).multiplyScalar(k));
    }
    if (S.post) Post.render(scene, camera, opts);
    else { renderer.setRenderTarget(null); renderer.render(scene, camera); }
  };
  // Liten bild (miniatyr) i ett hörn: ritas som en extra vy med saxning
  S.renderInset = (cam, rect) => {
    if (S.post) return; // med efterbehandling ritar Post insatsen själv
    renderer.setScissorTest(true);
    renderer.setScissor(rect.x, rect.y, rect.w, rect.h);
    renderer.setViewport(rect.x, rect.y, rect.w, rect.h);
    renderer.render(scene, cam);
    renderer.setScissorTest(false);
    renderer.setViewport(0, 0, S.w, S.h);
  };
  return S;
})();

/* ---- 06a-post.js ---- */
/* ================= Efterbehandling: glöd, tonkurva och färg ================= */
// Scenen ritas i hög dynamik (HDR) till en bild i minnet. Sedan får starka ljus (lampor, neon, reflexer i kromet)
// en mjuk glöd, och bilden får filmisk tonkurva (ACES), varm färgton, vinjett och ett svagt filmkorn.
// Klarar grafikkortet inte det ritas scenen direkt (Scene sätter då tonkurvan i renderaren).
const Post = (() => {
  const P = {enabled: false};
  let renderer, rtScene, rtBloom = [], rtTmp = [], quad, qcam, qscene, w = 1, h = 1, msaa = false;
  const LEVELS = 5;
  const VERT = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }';
  const mk = (frag, uniforms) => new THREE.ShaderMaterial({uniforms, vertexShader: VERT, fragmentShader: frag, depthTest: false, depthWrite: false});
  const matBright = mk(`uniform sampler2D tDiffuse; uniform vec2 texel; uniform float threshold; varying vec2 vUv;
    void main(){
      vec3 c = texture2D(tDiffuse, vUv + texel * vec2(-.5,-.5)).rgb + texture2D(tDiffuse, vUv + texel * vec2(.5,-.5)).rgb
             + texture2D(tDiffuse, vUv + texel * vec2(-.5,.5)).rgb + texture2D(tDiffuse, vUv + texel * vec2(.5,.5)).rgb;
      c *= .25;
      float l = max(c.r, max(c.g, c.b));
      float k = clamp((l - threshold) / max(l, 1e-4), 0., 1.);
      gl_FragColor = vec4(min(c * k, vec3(40.)), 1.);
    }`, {tDiffuse: {value: null}, texel: {value: new THREE.Vector2()}, threshold: {value: 1.0}});
  const matDown = mk(`uniform sampler2D tDiffuse; uniform vec2 texel; varying vec2 vUv;
    void main(){
      vec3 c = texture2D(tDiffuse, vUv + texel * vec2(-.5,-.5)).rgb + texture2D(tDiffuse, vUv + texel * vec2(.5,-.5)).rgb
             + texture2D(tDiffuse, vUv + texel * vec2(-.5,.5)).rgb + texture2D(tDiffuse, vUv + texel * vec2(.5,.5)).rgb;
      gl_FragColor = vec4(c * .25, 1.);
    }`, {tDiffuse: {value: null}, texel: {value: new THREE.Vector2()}});
  const matBlur = mk(`uniform sampler2D tDiffuse; uniform vec2 dir; varying vec2 vUv;
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb * .2270270270;
      c += texture2D(tDiffuse, vUv + dir * 1.3846153846).rgb * .3162162162;
      c += texture2D(tDiffuse, vUv - dir * 1.3846153846).rgb * .3162162162;
      c += texture2D(tDiffuse, vUv + dir * 3.2307692308).rgb * .0702702703;
      c += texture2D(tDiffuse, vUv - dir * 3.2307692308).rgb * .0702702703;
      gl_FragColor = vec4(c, 1.);
    }`, {tDiffuse: {value: null}, dir: {value: new THREE.Vector2()}});
  const matAdd = mk(`uniform sampler2D tA; uniform sampler2D tB; uniform float k; varying vec2 vUv;
    void main(){ gl_FragColor = vec4(texture2D(tA, vUv).rgb + texture2D(tB, vUv).rgb * k, 1.); }`, {tA: {value: null}, tB: {value: null}, k: {value: 1}});
  const matFinal = mk(`uniform sampler2D tScene; uniform sampler2D tBloom; uniform float bloom; uniform float exposure; uniform vec2 texel;
    uniform float fxaa; uniform float vignette; uniform float saturation; uniform float grain; uniform float time; uniform vec3 tint; varying vec2 vUv;
    vec3 aces(vec3 color){
      color *= exposure / .6;
      const mat3 m1 = mat3(0.59719, 0.07600, 0.02840, 0.35458, 0.90834, 0.13383, 0.04823, 0.01566, 0.83777);
      const mat3 m2 = mat3(1.60475, -0.10208, -0.00327, -0.53108, 1.10813, -0.07276, -0.07367, -0.00605, 1.07602);
      vec3 v = m1 * color;
      vec3 a = v * (v + 0.0245786) - 0.000090537;
      vec3 b = v * (0.983729 * v + 0.4329510) + 0.238081;
      return clamp(m2 * (a / b), 0.0, 1.0);
    }
    vec3 toSRGB(vec3 c){ return mix(pow(c, vec3(.41666)) * 1.055 - .055, c * 12.92, vec3(lessThanEqual(c, vec3(.0031308)))); }
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    vec3 sharp(vec2 uv){
      vec3 c = texture2D(tScene, uv).rgb;
      if (fxaa < .5) return c;
      vec3 n = texture2D(tScene, uv + vec2(0., texel.y)).rgb, s = texture2D(tScene, uv - vec2(0., texel.y)).rgb;
      vec3 e = texture2D(tScene, uv + vec2(texel.x, 0.)).rgb, w = texture2D(tScene, uv - vec2(texel.x, 0.)).rgb;
      vec3 L = vec3(.299, .587, .114);
      float lc = dot(c, L), ln = dot(n, L), ls = dot(s, L), le = dot(e, L), lw = dot(w, L);
      float range = max(max(max(ln, ls), max(le, lw)), lc) - min(min(min(ln, ls), min(le, lw)), lc);
      float k = smoothstep(.05, .25, range / (lc + .25));
      return mix(c, (c * 4. + n + s + e + w) / 8., k);
    }
    void main(){
      vec3 c = sharp(vUv);
      c += texture2D(tBloom, vUv).rgb * bloom;
      c *= tint;
      c = aces(c);
      float l = dot(c, vec3(.299, .587, .114));
      c = mix(vec3(l), c, saturation);
      vec2 q = vUv - .5;
      c *= 1. - dot(q, q) * vignette;
      c = toSRGB(clamp(c, 0., 1.));
      c += (hash(vUv * vec2(1317., 911.) + time) - .5) * grain;
      gl_FragColor = vec4(c, 1.);
    }`, {tScene: {value: null}, tBloom: {value: null}, bloom: {value: .55}, exposure: {value: 1.0}, texel: {value: new THREE.Vector2()}, fxaa: {value: 0},
    vignette: {value: .7}, saturation: {value: 1.06}, grain: {value: .018}, time: {value: 0}, tint: {value: new THREE.Vector3(1.03, 1.0, .95)}});

  function target(ww, hh, samples) {
    const o = {type: THREE.HalfFloatType, format: THREE.RGBAFormat, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: false, stencilBuffer: false};
