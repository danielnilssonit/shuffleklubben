    if (samples) return new THREE.WebGLMultisampleRenderTarget(ww, hh, Object.assign(o, {depthBuffer: true, stencilBuffer: true, samples}));
    return new THREE.WebGLRenderTarget(ww, hh, o);
  }
  P.init = r => {
    renderer = r;
    try {
      const gl = r.getContext();
      const isGL2 = r.capabilities.isWebGL2;
      const halfOk = isGL2 ? !!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float')) : !!(r.extensions.get('OES_texture_half_float') && r.extensions.get('EXT_color_buffer_half_float'));
      if (!halfOk) return false;
      msaa = isGL2 && !!THREE.WebGLMultisampleRenderTarget;
      rtScene = msaa ? target(4, 4, 4) : (() => { const t = target(4, 4, 0); t.depthBuffer = true; t.stencilBuffer = true; return t; })();
      for (let i = 0; i < LEVELS; i++) { rtBloom.push(target(2, 2)); rtTmp.push(target(2, 2)); }
      qcam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      qscene = new THREE.Scene();
      quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), matFinal);
      quad.frustumCulled = false;
      qscene.add(quad);
      P.enabled = true;
      renderer.toneMapping = THREE.NoToneMapping;
      renderer.outputEncoding = THREE.LinearEncoding;
      return true;
    } catch (e) { console.warn('Efterbehandling avstängd:', e); P.enabled = false; return false; }
  };
  P.setSize = (ww, hh) => {
    if (!P.enabled) return;
    const k = Math.min(1, Math.sqrt(3.2e6 / (ww * hh)));
    w = Math.max(2, Math.round(ww * k)); h = Math.max(2, Math.round(hh * k));
    rtScene.setSize(w, h);
    for (let i = 0; i < LEVELS; i++) { const s = 1 << (i + 1); rtBloom[i].setSize(Math.max(1, Math.round(w / s)), Math.max(1, Math.round(h / s))); rtTmp[i].setSize(rtBloom[i].width, rtBloom[i].height); }
    matFinal.uniforms.texel.value.set(1 / w, 1 / h);
    matFinal.uniforms.fxaa.value = msaa ? 0 : 1;
  };
  function pass(mat, out) { quad.material = mat; renderer.setRenderTarget(out); renderer.render(qscene, qcam); }
  function blur(src, tmp, radius) {
    matBlur.uniforms.tDiffuse.value = src.texture; matBlur.uniforms.dir.value.set(radius / src.width, 0); pass(matBlur, tmp);
    matBlur.uniforms.tDiffuse.value = tmp.texture; matBlur.uniforms.dir.value.set(0, radius / src.height); pass(matBlur, src);
  }
  P.cheap = false;
  const t0 = performance.now();
  P.render = (scene, camera, opts = {}) => {
    renderer.setRenderTarget(rtScene);
    renderer.clear(true, true, true);
    renderer.render(scene, camera);
    const u = matFinal.uniforms;
    u.time.value = ((performance.now() - t0) / 1000) % 100;
    u.exposure.value = opts.exposure || 1.0;
    if (P.cheap) {
      u.tScene.value = rtScene.texture; u.tBloom.value = rtScene.texture; u.bloom.value = 0;
      pass(matFinal, null);
      return;
    }
    matBright.uniforms.tDiffuse.value = rtScene.texture; matBright.uniforms.texel.value.set(1 / w, 1 / h);
    matBright.uniforms.threshold.value = opts.threshold || 1.1;
    pass(matBright, rtBloom[0]);
    blur(rtBloom[0], rtTmp[0], 1);
    for (let i = 1; i < LEVELS; i++) {
      matDown.uniforms.tDiffuse.value = rtBloom[i - 1].texture; matDown.uniforms.texel.value.set(1 / rtBloom[i - 1].width, 1 / rtBloom[i - 1].height);
      pass(matDown, rtBloom[i]);
      blur(rtBloom[i], rtTmp[i], 1.25);
    }
    for (let i = LEVELS - 1; i > 0; i--) {
      matAdd.uniforms.tA.value = rtBloom[i - 1].texture; matAdd.uniforms.tB.value = rtBloom[i].texture; matAdd.uniforms.k.value = .85;
      pass(matAdd, rtTmp[i - 1]);
      [rtBloom[i - 1], rtTmp[i - 1]] = [rtTmp[i - 1], rtBloom[i - 1]];
    }
    u.tScene.value = rtScene.texture; u.tBloom.value = rtBloom[0].texture;
    u.bloom.value = opts.bloom != null ? opts.bloom : .5;
    pass(matFinal, null);
  };
  return P;
})();

/* ---- 07-pucks.js ---- */
/* ================= Puckarna (vikterna) ================= */
// Varje puck: kromad stålkropp med färgad keps (med klubbens monogram), en mjuk skugga, en spegelbild i den
// blanka lacken (ritas bara där spelytan syns, med stencilbufferten) och en ring när den leder omgången.
// När pucken åker över kanten tippar den ner i rännan och glider klart där.
const Pucks = (() => {
  const P = {};
  const {L, HALF, TOP, R, DROP} = TABLE;
  const objs = new Map();     // id -> {g, body, mirror, shadow, ring, owner, color, st}
  let chrome, chromeMirror, shadowTex, ringTex, geoBody = null, geoParts = null;
  const capMats = {}, capMirrorMats = {};

  function capTexture(colorKey) {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d'), col = Rules.COLORS[colorKey] || Rules.COLORS.red;
    const base = new THREE.Color(col.hex);
    const css = (k, a = 1) => { const x = base.clone().multiplyScalar(k); return `rgba(${Math.min(255, x.r * 255) | 0},${Math.min(255, x.g * 255) | 0},${Math.min(255, x.b * 255) | 0},${a})`; };
    const gr = g.createRadialGradient(118, 110, 10, 128, 128, 130);
    gr.addColorStop(0, css(1.18)); gr.addColorStop(.7, css(1)); gr.addColorStop(1, css(.78));
    g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
    // ingraverad ring och monogram
    g.strokeStyle = css(.62, .9); g.lineWidth = 5; g.beginPath(); g.arc(128, 128, 98, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = css(1.35, .45); g.lineWidth = 2; g.beginPath(); g.arc(128, 126, 96, Math.PI * 1.05, Math.PI * 1.95); g.stroke();
    g.font = 'italic 700 104px Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = css(.6, .85); g.fillText('S', 131, 139);
    g.fillStyle = css(1.3, .55); g.fillText('S', 127, 134);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
    return t;
  }
  function capMat(colorKey) {
    if (capMats[colorKey]) return capMats[colorKey];
    const col = Rules.COLORS[colorKey] || Rules.COLORS.red;
    const m = new THREE.MeshPhysicalMaterial({color: 0xffffff, map: capTexture(colorKey), roughness: .32, metalness: 0, clearcoat: .9, clearcoatRoughness: .12, envMapIntensity: .7});
    if (Scene.env()) m.envMap = Scene.env();
    m.userData.hex = col.hex;
    return (capMats[colorKey] = m);
  }
  function capMirror(colorKey) {
    if (capMirrorMats[colorKey]) return capMirrorMats[colorKey];
    const col = new THREE.Color((Rules.COLORS[colorKey] || Rules.COLORS.red).hex).multiplyScalar(.75);
    return (capMirrorMats[colorKey] = mirrorMat(col));
  }
  function mirrorMat(color) {
    const m = new THREE.MeshBasicMaterial({color, transparent: true, opacity: .24, depthTest: false, depthWrite: false});
    m.stencilWrite = true; m.stencilRef = 1; m.stencilFunc = THREE.EqualStencilFunc;
    m.stencilFail = m.stencilZFail = m.stencilZPass = THREE.KeepStencilOp;
    return m;
  }
  function softTex(inner, outer, stops) {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, inner, 64, 64, outer);
    stops.forEach(([o, s]) => gr.addColorStop(o, s));
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }

  // Pucken i reserv (om Blender-modellen saknas): svarvad profil + keps
  function fallbackGeometry() {
    const pts = [[0, 0], [R - 0.0012, 0], [R, 0.0012], [R, 0.0075], [R - 0.0007, 0.0085], [R, 0.0095], [R, 0.0165], [R - 0.0012, 0.0182], [0.0268, 0.0185], [0.0268, 0.019]].map(([x, y]) => new THREE.Vector2(x, y));
    const body = new THREE.LatheGeometry(pts, 48);
    const cap = new THREE.CylinderGeometry(0.0265, 0.0266, 0.0062, 48, 1);
    cap.translate(0, 0.019 + 0.0031, 0);
    // kepsens topp får plana UV-koordinater så att monogrammet hamnar rätt
    const uv = cap.attributes.uv, pos = cap.attributes.position;
    for (let i = 0; i < pos.count; i++) uv.setXY(i, pos.getX(i) / 0.053 + .5, -pos.getZ(i) / 0.053 + .5);
    return {body, cap};
  }

  P.init = () => {
    chrome = new THREE.MeshStandardMaterial({color: 0xe6e9ee, metalness: 1, roughness: .14, envMapIntensity: 1.15});
    chromeMirror = mirrorMat(new THREE.Color(0x8d9299));
    shadowTex = softTex(0, 64, [[0, 'rgba(0,0,0,.75)'], [.45, 'rgba(0,0,0,.45)'], [1, 'rgba(0,0,0,0)']]);
    ringTex = softTex(20, 64, [[0, 'rgba(255,255,255,0)'], [.55, 'rgba(255,255,255,.95)'], [.72, 'rgba(255,255,255,.35)'], [1, 'rgba(255,255,255,0)']]);
    if (ModelLib.ok() && ModelLib.has('puck')) {
      // Blender-modellen: kroppen (Krom) och kepsen (Keps). Vi plockar ut delarna för att kunna byta material per färg.
      const root = ModelLib.create('puck', {});
      root.updateMatrixWorld(true);
      geoParts = [];
      root.traverse(o => {
        if (!o.isMesh) return;
        const g = o.geometry.clone().applyMatrix4(o.matrixWorld);
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        geoParts.push({geo: g, names: mats.map(m => m.name)});
      });
    } else geoBody = fallbackGeometry();
    Bus.on('env', env => { chrome.envMap = env; chrome.needsUpdate = true; Object.values(capMats).forEach(m => { m.envMap = env; m.needsUpdate = true; }); });
  };

  function makeMesh(colorKey, mirror) {
    const g = new THREE.Group();
    const matFor = name => /Keps/i.test(name) ? (mirror ? capMirror(colorKey) : capMat(colorKey)) : (mirror ? chromeMirror : chrome);
    if (geoParts) {
      geoParts.forEach(p => {
        const mats = p.names.map(matFor);
        g.add(new THREE.Mesh(p.geo, mats.length === 1 ? mats[0] : mats));
      });
    } else {
      g.add(new THREE.Mesh(geoBody.body, mirror ? chromeMirror : chrome));
      g.add(new THREE.Mesh(geoBody.cap, mirror ? capMirror(colorKey) : capMat(colorKey)));
    }
    g.traverse(o => { if (o.isMesh) { o.userData.noEnv = true; if (mirror) o.renderOrder = -4; } });
    return g;
  }

  // Skapar (eller återanvänder) en puck
  P.ensure = (id, owner, colorKey) => {
    let o = objs.get(id);
    if (o) return o;
    const g = makeMesh(colorKey, false);
    const mirror = makeMesh(colorKey, true);
    mirror.scale.y = -1;
    const shadow = new THREE.Mesh(new THREE.PlaneGeometry(R * 3.1, R * 3.1).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({map: shadowTex, transparent: true, opacity: .55, depthWrite: false}));
    shadow.renderOrder = -3; shadow.userData.noEnv = true;
    const ring = new THREE.Mesh(new THREE.PlaneGeometry(R * 4.4, R * 4.4).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({map: ringTex, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, color: new THREE.Color((Rules.COLORS[colorKey] || Rules.COLORS.red).hex).multiplyScalar(2.2)}));
    ring.renderOrder = -2; ring.userData.noEnv = true;
    [g, mirror, shadow, ring].forEach(x => Scene.scene.add(x));
    o = {id, owner, color: colorKey, g, mirror, shadow, ring, x: 0, y: 0, h: 0, tilt: 0, tiltAxis: 0, spin: 0, st: 'table', fade: 1, ringOn: 0, ringK: 0, pts: 0};
    objs.set(id, o);
    return o;
  };
  P.get = id => objs.get(id);
  // Pucken man siktade med får sitt riktiga nummer när kastet görs
  P.rename = (from, to) => { const o = objs.get(from); if (!o || from === to) return; objs.delete(from); o.id = to; objs.set(to, o); };
  P.all = () => [...objs.values()];

  function place(o) {
    const wx = o.x, wz = -o.y, y = TOP + o.h;
    o.g.position.set(wx, y, wz);
    o.g.rotation.set(0, o.spin, 0);
    if (o.tilt) { o.g.rotation.x = o.tiltAxis === 'z' ? 0 : o.tilt; o.g.rotation.z = o.tiltAxis === 'z' ? o.tilt : 0; }
    const onTable = o.st === 'table' && Math.abs(o.x) <= HALF + R && o.y >= -R && o.y <= L + R && o.h > -0.004;
    o.mirror.visible = onTable && o.fade > .05;
    o.mirror.position.set(wx, TOP - o.h, wz);
    o.mirror.rotation.copy(o.g.rotation);
    o.shadow.visible = o.st !== 'gone' && o.fade > .05;
    o.shadow.position.set(wx, (o.st === 'table' ? TOP : TOP - DROP) + 0.0004, wz);
    o.shadow.material.opacity = .55 * o.fade * clamp(1 - Math.max(0, o.h) * 25, 0, 1);
    o.ring.position.set(wx, TOP + 0.0007, wz);
  }
  P.set = (id, x, y, h = 0) => { const o = objs.get(id); if (!o) return; o.x = x; o.y = y; o.h = h; if (o.st !== 'fall') place(o); };
  P.setSpin = (id, a) => { const o = objs.get(id); if (o) o.spin = a; };

  // Ner i rännan: fortsätter i sin fart, tippar över kanten och faller DROP meter
  P.fall = (id, ev) => {
    const o = objs.get(id);
    if (!o) return;
    o.st = 'fall';
    const side = ev.e === 1 ? -1 : ev.e === 2 ? 1 : 0;
    o.fall = {t: 0, e: ev.e, side, vx: ev.vx, vy: ev.vy, x: ev.x, y: ev.y, vh: 0};
    if (side) o.fall.vx = side * Math.max(0.25, Math.abs(ev.vx) + 0.15);
    else if (ev.e === 3) o.fall.vy = Math.max(0.25, ev.vy);
    else o.fall.vy = Math.min(-0.2, ev.vy);
    Sound.play('fall', clamp(ev.x / HALF, -1, 1) * .6);
  };
  function stepFall(o, dt) {
    const f = o.fall;
    f.t += dt;
    // gravitationen när tyngdpunkten är utanför kanten
    f.vh -= 9.81 * dt;
    let h = o.h + f.vh * dt;
    const floor = -DROP;
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.side) {
      const lim = HALF + TABLE.GUTTER - R - 0.004;
      if (Math.abs(f.x) > lim) { f.x = f.side * lim; f.vx = -f.vx * 0.2; }
      o.tiltAxis = 'z'; o.tilt = h > floor ? -f.side * clamp((Math.abs(f.x) - HALF) / R, 0, 1) * 0.9 : o.tilt * 0.8;
    } else {
      const back = f.e === 3 ? L + TABLE.END - R - 0.004 : -TABLE.END + R + 0.004;
      if ((f.e === 3 && f.y > back) || (f.e === 4 && f.y < back)) { f.y = back; f.vy = -f.vy * 0.25; }
      o.tiltAxis = 'x'; o.tilt = h > floor ? (f.e === 3 ? -1 : 1) * clamp(((f.e === 3 ? f.y - L : -f.y)) / R, 0, 1) * 0.9 : o.tilt * 0.8;
    }
    if (h <= floor) { h = floor; if (f.vh < -0.3) f.vh = -f.vh * 0.18; else f.vh = 0; }
    // friktion i rännan
    const sp = Math.hypot(f.vx, f.vy);
    if (h <= floor + 1e-4 && sp > 0) { const k = Math.max(0, sp - 2.2 * dt) / sp; f.vx *= k; f.vy *= k; }
    o.x = f.x; o.y = clamp(f.y, -TABLE.END + R, L + TABLE.END - R); o.h = h;
    if (h <= floor + 1e-4 && sp < 0.01 && f.t > 0.3) { o.st = 'gutter'; o.tilt = 0; P.spreadGutter(); }
  }

  // Tar bort en död puck (nådde inte foul-linjen): lyfts och tonas bort
  P.remove = (id, how = 'fade') => {
    const o = objs.get(id);
    if (!o) return Promise.resolve();
    o.st = o.st === 'gutter' ? 'gutter' : o.st;
    const h0 = o.h;
    return Anim.tween(how === 'fast' ? 250 : 650, t => { o.fade = 1 - t; o.h = h0 + (how === 'lift' ? t * 0.05 : t * 0.01); setOpacity(o, o.fade); place(o); }, easeInOut).then(() => dispose(o));
  };
  function setOpacity(o, a) {
    o.g.traverse(m => { if (m.isMesh) { const mats = Array.isArray(m.material) ? m.material : [m.material]; if (a < 1 && !m.userData.own) { m.material = mats.map(x => { const c = x.clone(); c.transparent = true; return c; }); if (m.material.length === 1) m.material = m.material[0]; m.userData.own = true; } (Array.isArray(m.material) ? m.material : [m.material]).forEach(x => { x.opacity = a; }); } });
  }
  function dispose(o) {
    [o.g, o.mirror, o.shadow, o.ring].forEach(x => Scene.scene.remove(x));
    o.g.traverse(m => { if (m.isMesh && m.userData.own) (Array.isArray(m.material) ? m.material : [m.material]).forEach(x => x.dispose()); });
    o.shadow.material.dispose(); o.ring.material.dispose();
    objs.delete(o.id);
  }
  // Tömmer bordet (efter en omgång): puckarna lyfts av i tur och ordning
  P.clear = async (animated = true) => {
    const list = [...objs.values()];
    if (!animated) { list.forEach(dispose); return; }
    await Promise.all(list.map((o, i) => wait(i * 45).then(() => P.remove(o.id, 'lift'))));
  };
  // Lägger puckarna precis som i ett läge (efter återanslutning eller när en animation hoppas över)
  P.sync = (m, animatedRemove = false) => {
    const keep = new Set();
    const colorOf = owner => (m.seats[owner] && m.seats[owner].color) || 'red';
    m.pucks.forEach(q => { const o = P.ensure(q.id, q.owner, colorOf(q.owner)); o.st = 'table'; o.h = 0; o.tilt = 0; o.fade = 1; P.set(q.id, q.x, q.y); keep.add(q.id); });
    (m.gutter || []).forEach(q => {
      const o = P.ensure(q.id, q.owner, colorOf(q.owner));
      keep.add(q.id);
      if (o.st === 'fall') return;
      o.st = 'gutter'; o.h = -DROP; o.tilt = 0;
      const side = q.e === 1 ? -1 : q.e === 2 ? 1 : 0;
      o.x = side ? side * (HALF + TABLE.GUTTER / 2) : clamp(q.x, -HALF, HALF);
      o.y = side ? clamp(q.y, 0, L) : (q.e === 3 ? L + TABLE.END - R - 0.004 : -TABLE.END + R + 0.004);
      place(o);
    });
    for (const o of [...objs.values()]) if (!keep.has(o.id) && o.id !== P.activeId) { if (animatedRemove) P.remove(o.id); else dispose(o); }
    P.spreadGutter();
  };
  // Puckar som har ramlat ner i samma ränna knuffas isär så att de inte ligger i varandra
  P.spreadGutter = () => {
    const lying = [...objs.values()].filter(o => o.st === 'gutter');
    for (let it = 0; it < 6; it++) {
      let moved = false;
      for (let i = 0; i < lying.length; i++) for (let j = i + 1; j < lying.length; j++) {
        const a = lying[i], b = lying[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
        if (d >= 2 * R + 0.002) continue;
        const endA = Math.abs(a.x) <= HALF, endB = Math.abs(b.x) <= HALF;
        // i ändrännan flyttas de i sidled, i sidorännorna längs bordet
        const push = (2 * R + 0.003 - d) / 2;
        if (endA && endB) { const s = dx >= 0 ? 1 : -1; a.x -= s * push; b.x += s * push; a.x = clamp(a.x, -HALF - 0.04, HALF + 0.04); b.x = clamp(b.x, -HALF - 0.04, HALF + 0.04); }
        else { const s = dy >= 0 ? 1 : -1; a.y -= s * push; b.y += s * push; }
        moved = true;
      }
      if (!moved) break;
    }
    lying.forEach(place);
  };
  P.activeId = null;

  // Ringar under puckar (ledande puck, eller den som ska kastas)
  P.rings = (ids, on = true) => { objs.forEach(o => { o.ringOn = on && ids.includes(o.id) ? 1 : 0; }); };
  P.pulse = id => { const o = objs.get(id); if (o) o.ringK = 1.6; };

  P.update = dt => {
    const t = performance.now() / 1000;
    objs.forEach(o => {
      if (o.st === 'fall') { stepFall(o, dt); place(o); }
      const target = o.ringOn ? .75 + Math.sin(t * 3.2) * .2 : 0;
      o.ringK = Math.max(0, o.ringK - dt * 1.5);
      o.ring.material.opacity += ((target + o.ringK * .6) * o.fade - o.ring.material.opacity) * Math.min(1, dt * 8);
      o.ring.visible = o.ring.material.opacity > .01;
      const s = 1 + o.ringK * .25;
      o.ring.scale.set(s, 1, s);
    });
  };
  return P;
})();

/* ---- 08-camera.js ---- */
/* ================= Kameran ================= */
// Lägen: 'aim' (bakom den som kastar, hela bordet syns), 'follow' (följer pucken längs bordet), 'far' (över
// poängzonerna), 'score' (rakt ovanifrån zonerna när poängen räknas), 'table' (hela bordet ovanifrån) och 'menu'
// (långsam filmisk åkning i menyerna). Kameran glider mjukt mellan lägena och anpassar sig efter skärmens form.
const Cam = (() => {
  const C = {};
  const {L, TOP, Y0} = TABLE;
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const pos = V(0, 1.6, 2), look = V(0, TOP, -3), tPos = V(0, 1.6, 2), tLook = V(0, TOP, -3);
  let fov = 50, tFov = 50, rate = 3, mode = 'menu', shakeK = 0, t = 0;
  let follow = null;      // () => {x, y, v} för pucken som följs
  let aimX = 0;
  C.mode = () => mode;

  // Hur "stående" skärmen är: 0 = liggande (bred), 1 = stående (smal)
  const portrait = () => { const a = Scene.w / Scene.h; return clamp((1.45 - a) / (1.45 - 0.55), 0, 1); };

  function aimPose() {
    const p = portrait();
    const back = lerp(1.2, 1.32, p), height = lerp(0.56, 0.66, p), f = lerp(40, 56, p);
    const zRel = -Y0;
    return {pos: V(aimX * 0.55, TOP + height, zRel + back), look: V(aimX * 0.3, TOP - 0.02, -lerp(2.3, 2.9, p)), fov: f};
  }
  // Över zonerna: kameran står lägre än lamporna (annars skymmer lampan över bortre änden)
  function farPose(zoomed) {
    const p = portrait();
    const ty = L - (zoomed ? 0.32 : 0.42);
    const height = lerp(zoomed ? 0.62 : 0.74, zoomed ? 0.7 : 0.84, p), back = lerp(zoomed ? 1.05 : 1.3, zoomed ? 1.25 : 1.55, p);
    return {pos: V(0, TOP + height, -(ty - back)), look: V(0, TOP - 0.02, -ty), fov: lerp(40, 50, p)};
  }
  function scorePose() {
    const p = portrait();
    const ty = L - 0.36;
    return {pos: V(0, TOP + lerp(0.64, 0.74, p), -(ty - lerp(0.95, 1.2, p))), look: V(0, TOP - 0.03, -ty), fov: lerp(38, 46, p)};
  }
  function tablePose() {
    const p = portrait();
    return {pos: V(0, TOP + lerp(3.2, 5.6, p), -(L * 0.52 - lerp(2.6, 0.9, p))), look: V(0, TOP, -L * 0.56), fov: lerp(42, 58, p)};
  }

  C.set = (m, opts = {}) => {
    mode = m;
    if (opts.aimX != null) aimX = opts.aimX;
    follow = opts.follow || null;
    rate = opts.rate || (m === 'follow' ? 5 : m === 'menu' ? 0.6 : 2.6);
    C.update(0);
    if (opts.snap) { pos.copy(tPos); look.copy(tLook); fov = tFov; }
  };
  C.aimAt = x => { aimX = x; };

  function targets(dt) {
    let pose;
    if (mode === 'aim') pose = aimPose();
    else if (mode === 'far') pose = farPose(false);
    else if (mode === 'farZoom') pose = farPose(true);
    else if (mode === 'score') pose = scorePose();
    else if (mode === 'table') pose = tablePose();
    else if (mode === 'follow' && follow) {
      const f = follow(), p = portrait();
      const endK = smooth(L - 2.4, L - 0.9, f.y) * smooth(1.6, 0.35, f.v);
      const back = lerp(0.85, 1.25, p) + f.v * 0.18, height = lerp(0.3, 0.46, p) + f.v * 0.05;
      const chase = {pos: V(f.x * 0.55, TOP + height, -(f.y - back)), look: V(f.x * 0.45, TOP - 0.01, -(f.y + lerp(1.1, 1.4, p))), fov: lerp(46, 58, p)};
      const far = farPose(false);
      pose = {pos: chase.pos.lerp(far.pos, endK), look: chase.look.lerp(far.look, endK), fov: lerp(chase.fov, far.fov, endK)};
      // kameran får aldrig åka förbi bortre änden
      pose.pos.z = Math.max(pose.pos.z, -(L - 0.55));
    } else {
      // meny: långsam åkning längs bordet
      t += dt;
      const s = (Math.sin(t * 0.045) + 1) / 2, sway = Math.sin(t * 0.07);
      pose = {pos: V(0.55 + sway * 0.45, TOP + 0.34 + s * 0.35, -(0.4 + s * 3.4)), look: V(-0.05, TOP + 0.02, -(L - 0.4)), fov: 44};
    }
    tPos.copy(pose.pos); tLook.copy(pose.look); tFov = pose.fov;
  }

  C.update = dt => {
    targets(dt);
    const k = 1 - Math.exp(-rate * dt);
    pos.lerp(tPos, dt ? k : 1); look.lerp(tLook, dt ? k : 1); fov += (tFov - fov) * (dt ? k : 1);
    const cam = Scene.camera;
    cam.position.copy(pos);
    if (shakeK > 0.0005) {
      shakeK *= Math.exp(-dt * 7);
      cam.position.x += (Math.random() - .5) * shakeK; cam.position.y += (Math.random() - .5) * shakeK;
    }
    cam.lookAt(look);
    if (Math.abs(cam.fov - fov) > 0.01) { cam.fov = fov; cam.updateProjectionMatrix(); }
  };
  C.shake = k => { if (!reduceMotion) shakeK = Math.max(shakeK, k); };
  C.snap = () => { targets(0); pos.copy(tPos); look.copy(tLook); fov = tFov; C.update(0); };
  // Skärmpunkt -> punkt på bordets yta (x, y i bordets koordinater)
  const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -TOP), hit = new THREE.Vector3();
  C.toTable = (sx, sy) => {
    const ndc = new THREE.Vector2(sx / Scene.w * 2 - 1, -(sy / Scene.h) * 2 + 1);
    ray.setFromCamera(ndc, Scene.camera);
    if (!ray.ray.intersectPlane(plane, hit)) return null;
    return {x: hit.x, y: -hit.z};
  };
  // Punkt på bordet -> skärmpunkt
  const tmp = new THREE.Vector3();
  C.toScreen = (x, y, hgt = 0) => {
    tmp.set(x, TOP + hgt, -y).project(Scene.camera);
    return {x: (tmp.x + 1) / 2 * Scene.w, y: (1 - tmp.y) / 2 * Scene.h, behind: tmp.z > 1};
  };
  return C;
})();

/* ---- 09-aim.js ---- */
/* ================= Sikta och kasta ================= */
// Tryck var som helst på den nedre delen av skärmen: dra åt sidan för att flytta pucken, dra bakåt (nedåt) för
// att spänna kastet, och släpp. Ju längre bakåt desto hårdare; drar man snett blir kastet snett (som en slangbella).
// Kraftmätaren visar hur hårt: upp till markeringen glider pucken som längst till bortre kanten, över den blir det
// hårda slag för att slå ut andras puckar. Skruven (knapparna) ger en svag kurva. Tangentbordet fungerar också.
const Aim = (() => {
  const A = {};
  const {HALF, R, Y0, L, TOP} = TABLE;
  const A_MAX = 0.065, GAIN = 0.1;
  let active = null;          // pågående siktning
  let line = null, lineMat = null;
  let lastPower = {};         // seat -> senaste kraften (visas som ett streck i mätaren)

  function refLen() { return clamp(Math.min(Scene.h * 0.36, 430), 190, 430); }

  // Siktlinjen: prickar på bordet från pucken och framåt
  function makeLine() {
    // prickar med mörk kant: syns både på ljust trä och i lampornas reflex
    const c = document.createElement('canvas'); c.width = 32; c.height = 64;
    const g = c.getContext('2d');
    g.fillStyle = 'rgba(20,10,4,.55)'; g.beginPath(); g.arc(16, 32, 11, 0, 7); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(16, 32, 7, 0, 7); g.fill();
    const tex = new THREE.CanvasTexture(c); tex.wrapT = THREE.RepeatWrapping;
    lineMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false,
      uniforms: {map: {value: tex}, rep: {value: 20}, color: {value: new THREE.Color(1, .9, .7)}, alpha: {value: .95}},
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
      fragmentShader: 'uniform sampler2D map; uniform float rep; uniform vec3 color; uniform float alpha; varying vec2 vUv; void main(){ vec4 t = texture2D(map, vec2(vUv.x, vUv.y * rep)); float f = (1. - smoothstep(.5, 1., vUv.y)) * smoothstep(0., .03, vUv.y); gl_FragColor = vec4(mix(vec3(.02), color, t.r), t.a * f * alpha); }'
    });
    const geo = new THREE.PlaneGeometry(0.022, 1, 1, 1);
    geo.translate(0, 0.5, 0); geo.rotateX(-Math.PI / 2);
    line = new THREE.Mesh(geo, lineMat);
    line.renderOrder = 2; line.userData.noEnv = true; line.visible = false;
    Scene.scene.add(line);
  }
  function showLine(x, y, a, len, color) {
    if (!line) makeLine();
    if (Settings.aim === 'av' || len <= 0) { line.visible = false; return; }
    line.visible = true;
    line.position.set(x, TOP + 0.0012, -y - R * 1.3);
    line.rotation.set(0, -a, 0);
    line.scale.set(1, 1, len);
    lineMat.uniforms.rep.value = len / 0.042;
    if (color) { const c = lineMat.uniforms.color.value.set(color); c.lerp(new THREE.Color(1, 1, 1), 0.25).multiplyScalar(1.6); }
  }
  A.hideLine = () => { if (line) line.visible = false; };

  /* ---------- Kraftmätaren och skruven (HTML) ---------- */
  const meter = () => $('meter'), fill = () => $('meterFill');
  function drawMeter(p, seat) {
    const m = meter(); if (!m) return;
    m.classList.toggle('on', p > 0.001);
    fill().style.height = (Math.min(1, p) * 100) + '%';
    fill().classList.toggle('hard', p > Phys.POWER_EDGE);
    const last = $('meterLast'), lp = lastPower[seat];
    if (last) { last.style.display = lp != null ? '' : 'none'; if (lp != null) last.style.bottom = (lp * 100) + '%'; }
  }
  A.spin = 0;   // -2..2
  function drawSpin() {
    const s = $('spinCtl'); if (!s) return;
    s.dataset.v = A.spin;
    s.querySelectorAll('[data-dir]').forEach(b => {
      const dir = +b.dataset.dir, on = Math.sign(A.spin) === dir;
      b.classList.toggle('on', on);
      b.dataset.lv = on ? Math.abs(A.spin) : 0;
    });
    const lbl = $('spinLbl');
    if (lbl) lbl.textContent = A.spin === 0 ? 'Ingen skruv' : `Skruv ${A.spin < 0 ? 'vänster' : 'höger'}${Math.abs(A.spin) > 1 ? ' ++' : ''}`;
  }
  A.setSpin = v => { A.spin = clamp(v, -2, 2); drawSpin(); Sound.play('soft'); if (active) active.changed(); };
  A.cycleSpin = dir => { const s = A.spin; A.setSpin(Math.sign(s) === dir ? (Math.abs(s) >= 2 ? 0 : s + dir) : dir); };

  /* ---------- En siktning ---------- */
  // opts: {seat, color, x, id} -> Promise<input> (kastet) eller null om den avbryts
  A.run = opts => {
    A.cancel();
    return new Promise(resolve => {
      const st = {seat: opts.seat, x: clamp(opts.x ?? 0, -HALF + R, HALF - R), a: 0, p: 0, mode: 'idle', resolve, sx: 0, sy: 0, px: 0, py: 0, x0: 0, lastTickP: 0, kb: false};
      active = st;
      const puckId = opts.id;
      const layer = $('aimLayer');
      layer.classList.add('on');
      document.body.classList.add('aiming');
      drawSpin();
      const hint = $('aimHint');
      if (hint) { hint.classList.toggle('show', !!opts.hint); hint.textContent = opts.hint || ''; }
      // meter på rätt sida för vänsterhänta
      document.body.classList.toggle('lefty', !!Settings.lefty);
      const worldPerPx = () => {
        const a = Cam.toTable(Scene.w / 2, Scene.h * 0.75), b = Cam.toTable(Scene.w / 2 + 100, Scene.h * 0.75);
        return a && b ? Math.abs(b.x - a.x) / 100 : 0.002;
      };
      st.changed = () => {
        const pull = st.p * 0.22;
        const vx = st.x - Math.sin(st.a) * pull, vy = Y0 - Math.cos(st.a) * pull;
        Pucks.set(puckId, vx, vy);
        const len = Settings.aim === 'kort' ? 1.3 : Settings.aim === 'av' ? 0 : L - Y0 - 0.1;
        showLine(st.x, Y0, st.a, st.mode === 'pull' || st.kb ? len : Math.min(len, 1.3), opts.color);
        Cam.aimAt(st.x);
        drawMeter(st.p, st.seat);
        if (opts.onAim) opts.onAim({x: st.x, a: st.a, p: st.p, w: A.spin});
      };
      st.changed();

      const down = e => {
        if (e.button > 0 || st.mode !== 'idle') return;
        Sound.unlock();
        st.mode = 'touch'; st.id = e.pointerId; st.sx = e.clientX; st.sy = e.clientY; st.x0 = st.x; st.kb = false;
        st.scale = worldPerPx();
        try { layer.setPointerCapture(e.pointerId); } catch (x) { /* ok */ }
        if (hint) hint.classList.remove('show');
        e.preventDefault();
      };
      const move = e => {
        if (e.pointerId !== st.id || st.mode === 'idle') return;
        const dx = e.clientX - st.sx, dy = e.clientY - st.sy;
        if (st.mode === 'touch' || st.mode === 'place') {
          if (dy > 16 && dy > Math.abs(dx) * 0.55) { st.mode = 'pull'; st.px = e.clientX; st.py = e.clientY - 4; Sound.play('soft'); }
          else if (Math.abs(dx) > 6 || st.mode === 'place') {
            st.mode = 'place';
            st.x = clamp(st.x0 + dx * st.scale, -HALF + R, HALF - R);
            // börja spänna från den nya höjden om fingret har glidit uppåt
            if (dy < 0) st.sy = e.clientY;
            st.changed();
          }
        }
        if (st.mode === 'pull') {
          const len = refLen();
          const pull = Math.max(0, e.clientY - st.py);
          const p = clamp(pull / len, 0, 1);
          st.a = clamp(-(e.clientX - st.px) / len * GAIN, -A_MAX, A_MAX);
          // ticka för varje 5 %, och tydligt vid kanten
          const step = Math.floor(p * 20);
          if (step !== Math.floor(st.p * 20)) { Sound.play('tick', p); if (p > .05) vibrate(4); }
          if ((p > Phys.POWER_EDGE) !== (st.p > Phys.POWER_EDGE)) { Sound.play('edgeTick'); vibrate(18); }
          st.p = p;
          st.changed();
        }
      };
      const up = e => {
        if (e.pointerId !== st.id) return;
        try { layer.releasePointerCapture(e.pointerId); } catch (x) { /* ok */ }
        if (st.mode === 'pull' && st.p > 0.035) { fire(); return; }
        // avbrutet: pucken glider tillbaka till linjen
        st.mode = 'idle'; st.p = 0; st.a = 0; st.changed();
      };
      const cancel = e => { if (e.pointerId === st.id) { st.mode = 'idle'; st.p = 0; st.a = 0; st.changed(); } };
      const key = e => {
        if (!active || active !== st) return;
        const k = e.key;
        const fine = e.altKey ? 0.2 : 1;
        if (k === 'ArrowLeft' || k === 'ArrowRight') {
          const d = k === 'ArrowLeft' ? -1 : 1;
          if (e.shiftKey) st.a = clamp(st.a - d * 0.0015 * fine, -A_MAX, A_MAX); else st.x = clamp(st.x + d * 0.005 * fine, -HALF + R, HALF - R);
        } else if (k === 'a' || k === 'A') st.a = clamp(st.a + 0.0015 * fine, -A_MAX, A_MAX);
        else if (k === 'd' || k === 'D') st.a = clamp(st.a - 0.0015 * fine, -A_MAX, A_MAX);
        else if (k === 'ArrowUp' || k === 'w' || k === 'W') { st.kb = true; st.p = clamp(st.p + 0.005 * fine, 0, 1); Sound.play('tick', st.p); }
        else if (k === 'ArrowDown' || k === 's' || k === 'S') { st.kb = true; st.p = clamp(st.p - 0.005 * fine, 0, 1); Sound.play('tick', st.p); }
        else if (k === 'q' || k === 'Q') { A.cycleSpin(-1); return; }
        else if (k === 'e' || k === 'E') { A.cycleSpin(1); return; }
        else if ((k === ' ' || k === 'Enter') && st.p > 0.035) { e.preventDefault(); fire(); return; }
        else if (k === 'Escape') { st.p = 0; st.a = 0; st.kb = false; }
        else return;
        e.preventDefault();
        st.changed();
      };
      function fire() {
        const speed = Phys.speedFor(st.p);
        const input = Phys.inputFrom(st.x, st.a, speed, A.spin * Phys.SPIN_MAX / 2);
        lastPower[st.seat] = st.p;
        Sound.play('release', st.p);
        vibrate(12);
        cleanup();
        resolve({input, power: st.p});
      }
      function cleanup() {
        layer.classList.remove('on');
        document.body.classList.remove('aiming');
        layer.removeEventListener('pointerdown', down);
        layer.removeEventListener('pointermove', move);
        layer.removeEventListener('pointerup', up);
        layer.removeEventListener('pointercancel', cancel);
        window.removeEventListener('keydown', key);
        if (hint) hint.classList.remove('show');
        drawMeter(0, st.seat);
        A.hideLine();
        if (active === st) active = null;
      }
      st.cleanup = () => { cleanup(); resolve(null); };
      layer.addEventListener('pointerdown', down);
      layer.addEventListener('pointermove', move);
      layer.addEventListener('pointerup', up);
      layer.addEventListener('pointercancel', cancel);
      window.addEventListener('keydown', key);
    });
  };
  A.cancel = () => { if (active) active.cleanup(); };
  A.active = () => !!active;

  // Någon annan siktar (över nätet eller datorn): visa pucken, linjen och mätaren
  A.showRemote = (puckId, s, color) => {
    if (!s) { A.hideLine(); drawMeter(0, -1); return; }
    const pull = (s.p || 0) * 0.22, a = clamp(s.a || 0, -A_MAX, A_MAX), x = clamp(s.x || 0, -HALF + R, HALF - R);
    Pucks.set(puckId, x - Math.sin(a) * pull, Y0 - Math.cos(a) * pull);
    showLine(x, Y0, a, s.p > 0.02 ? 1.6 : 0.8, color);
    Cam.aimAt(x);
    drawMeter(s.p || 0, -1);
  };
  A.lastPower = seat => lastPower[seat];
  A.resetMemory = () => { lastPower = {}; };
  return A;
})();

/* ---- 10-mqtt.js ---- */
/* ================= Meddelanden över internet (MQTT) ================= */
// Spelarna hittar varandra och skickar kasten via öppna MQTT-servrar (publika "brokers") över krypterade
// WebSockets. Det fungerar genom alla hemnätverk och mobilnät utan egen server. För säkerhets skull ansluter
// spelet till flera servrar samtidigt och skickar allt till alla. Dubbletter känns igen och kastas.
// Litet eget MQTT 3.1.1-bibliotek: CONNECT, SUBSCRIBE, PUBLISH (QoS 0), PING och "last will" (ett bye-meddelande
// som servern skickar om anslutningen bryts oväntat).
const Mqtt = (() => {
  const M = {};
  M.BROKERS = [
    'wss://test.mosquitto.org:8081/mqtt',
    'wss://broker.emqx.io:8084/mqtt',
    'wss://broker.hivemq.com:8884/mqtt'
  ];
  M.cid = 'c' + randId(10);
  const enc = new TextEncoder(), dec = new TextDecoder();
  const u16 = n => [n >> 8 & 255, n & 255];
  const str = s => { const b = enc.encode(s); return [...u16(b.length), ...b]; };
  const remLen = n => { const out = []; do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; out.push(d); } while (n > 0); return out; };
  const packet = (type, body) => { const b = body instanceof Uint8Array ? body : new Uint8Array(body); const h = [type, ...remLen(b.length)]; const out = new Uint8Array(h.length + b.length); out.set(h); out.set(b, h.length); return out; };

  let seq = 0, will = null;
  const subs = new Map();        // topic -> Set(handler)
  const conns = [];
  const seen = new Map();        // avsändare -> {set, list}
  const listeners = new Set();
  M.onChange = fn => { listeners.add(fn); return () => listeners.delete(fn); };
  const changed = () => listeners.forEach(fn => { try { fn(M.connected()); } catch (e) { console.error(e); } });

  class Conn {
    constructor(url) { this.url = url; this.ws = null; this.state = 'off'; this.pid = 1; this.buf = new Uint8Array(0); this.retry = 0; this.timer = 0; this.ping = 0; this.lastRx = 0; }
    open() {
      if (this.state === 'connecting' || this.state === 'on') return;
      this.state = 'connecting';
      let ws;
      try { ws = new WebSocket(this.url, ['mqtt']); } catch (e) { this.fail(); return; }
      this.ws = ws; ws.binaryType = 'arraybuffer';
      const guard = setTimeout(() => { if (this.state === 'connecting') { try { ws.close(); } catch (e) { /* stängd */ } this.fail(); } }, 9000);
      ws.onopen = () => {
        const flags = 0x02 | (will ? 0x04 : 0);
        const body = [...str('MQTT'), 4, flags, ...u16(40), ...str(M.cid + this.url.length.toString(36))];
        if (will) body.push(...str(will.topic), ...str(will.payload));
        ws.send(packet(0x10, body));
      };
      ws.onmessage = ev => { this.lastRx = Date.now(); this.read(new Uint8Array(ev.data)); };
      ws.onerror = () => {};
      ws.onclose = () => { clearTimeout(guard); if (this.ws === ws) this.fail(); };
      this.connGuard = guard;
    }
    fail() {
      const was = this.state;
      this.state = 'off'; this.ws = null;
      clearInterval(this.ping);
      if (was === 'on') changed();
      if (this.closing) return;
      const delay = [1500, 3000, 6000, 12000, 20000][Math.min(4, this.retry++)];
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.open(), delay);
    }
    read(d) {
      const nb = new Uint8Array(this.buf.length + d.length); nb.set(this.buf); nb.set(d, this.buf.length); this.buf = nb;
      for (;;) {
        if (this.buf.length < 2) return;
        let mul = 1, len = 0, i = 1, byte;
        do { if (i >= this.buf.length) return; byte = this.buf[i++]; len += (byte & 127) * mul; mul *= 128; } while (byte & 128);
        if (this.buf.length < i + len) return;
        const first = this.buf[0], type = first >> 4, qos = (first >> 1) & 3, body = this.buf.slice(i, i + len);
        this.buf = this.buf.slice(i + len);
        if (type === 2) {
          clearTimeout(this.connGuard);
          if (body[1] !== 0) { try { this.ws.close(); } catch (e) { /* stängd */ } return; }
          this.state = 'on'; this.retry = 0; this.lastRx = Date.now();
          for (const t of subs.keys()) this.sub(t);
          clearInterval(this.ping);
          this.ping = setInterval(() => {
            if (this.state !== 'on') return;
            if (Date.now() - this.lastRx > 50000) { try { this.ws.close(); } catch (e) { /* stängd */ } return; }
            this.send(new Uint8Array([0xC0, 0]));
          }, 15000);
          changed();
        } else if (type === 3) {
          const tl = (body[0] << 8) | body[1];
          const topic = dec.decode(body.subarray(2, 2 + tl));
          const payload = dec.decode(body.subarray(2 + tl + (qos ? 2 : 0)));
          deliver(topic, payload);
        }
      }
    }
    send(p) { try { if (this.ws && this.ws.readyState === 1) this.ws.send(p); } catch (e) { /* tappad */ } }
    sub(topic) { if (this.state === 'on') this.send(packet(0x82, [...u16(this.pid++ & 0xffff || 1), ...str(topic), 0])); }
    unsub(topic) { if (this.state === 'on') this.send(packet(0xA2, [...u16(this.pid++ & 0xffff || 1), ...str(topic)])); }
    pub(topic, payload) { if (this.state === 'on') this.send(packet(0x30, [...str(topic), ...enc.encode(payload)])); }
    close() { this.closing = true; clearTimeout(this.timer); clearInterval(this.ping); try { this.send(new Uint8Array([0xE0, 0])); this.ws && this.ws.close(); } catch (e) { /* stängd */ } this.state = 'off'; }
  }

  function deliver(topic, payload) {
    let msg;
    try { msg = JSON.parse(payload); } catch (e) { return; }
    if (!msg || typeof msg !== 'object' || typeof msg.f !== 'string') return;
    if (msg.f === M.cid) return;           // egna meddelanden
    // samma meddelande kommer från flera servrar: släpp bara igenom det första
    if (msg.n) {
      let s = seen.get(msg.f);
      if (!s) { s = {set: new Set(), list: []}; seen.set(msg.f, s); }
      if (s.set.has(msg.n)) return;
      s.set.add(msg.n); s.list.push(msg.n);
      if (s.list.length > 400) s.set.delete(s.list.shift());
    }
    const hs = subs.get(topic);
    if (hs) hs.forEach(fn => { try { fn(msg, topic); } catch (e) { console.error(e); } });
  }

  M.start = () => {
    if (conns.length) { conns.forEach(c => { if (c.state === 'off') { c.retry = 0; c.open(); } }); return; }
    M.BROKERS.forEach(u => { const c = new Conn(u); conns.push(c); c.open(); });
  };
  M.setWill = (topic, obj) => { will = {topic, payload: JSON.stringify(Object.assign({f: M.cid, n: 0}, obj))}; };
  M.connected = () => conns.filter(c => c.state === 'on').length;
  M.started = () => conns.length > 0;
  // Väntar tills minst en server är ansluten
  M.ready = (ms = 10000) => new Promise(res => {
    if (M.connected()) return res(true);
    M.start();
    const off = M.onChange(n => { if (n) { off(); clearTimeout(t); res(true); } });
    const t = setTimeout(() => { off(); res(M.connected() > 0); }, ms);
  });
  M.sub = (topic, fn) => {
    let hs = subs.get(topic);
    if (!hs) { hs = new Set(); subs.set(topic, hs); conns.forEach(c => c.sub(topic)); }
    hs.add(fn);
    return () => { hs.delete(fn); if (!hs.size) { subs.delete(topic); conns.forEach(c => c.unsub(topic)); } };
  };
  M.pub = (topic, obj) => {
    const payload = JSON.stringify(Object.assign({f: M.cid, n: ++seq}, obj));
    conns.forEach(c => c.pub(topic, payload));
    return payload.length;
  };
  M.stop = () => { conns.forEach(c => c.close()); conns.length = 0; };
  // Tillbaka från bakgrunden: se till att anslutningarna lever
  if (typeof document !== 'undefined' && document.addEventListener) document.addEventListener('visibilitychange', () => { if (!document.hidden && conns.length) conns.forEach(c => { if (c.state === 'off') { c.retry = 0; clearTimeout(c.timer); c.open(); } }); });
  return M;
})();

/* ---- 11-net.js ---- */
/* ================= Lobbyn och borden över nätet ================= */
// Lobbyn: alla som är inne på "Spela online" syns för varandra (namn, figur och vad de gör) och publika bord
// som väntar på spelare listas. Man kan gå med i ett bord, bjuda in någon eller snabbmatcha.
// Ett bord: den som skapar bordet är värd och bestämmer (räknar kasten och håller ställningen). Alla kör samma
// deterministiska fysik, så kastet skickas bara som fart och riktning och ser likadant ut på alla skärmar.
// Samma gränssnitt (Session) används för spel på en skärm: LocalSession, HostSession och ClientSession.
const GAME_VER = typeof BUILD_VER !== 'undefined' ? BUILD_VER : 'dev';
const Net = (() => {
  const N = {};
  const PRE = 'shuffleklubben/v1/', T_LOBBY = PRE + 'lobby';
  const tRoom = code => PRE + 'r/' + code;
  const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  N.newCode = () => Array.from(crypto.getRandomValues(new Uint8Array(4)), b => ALPHA[b % ALPHA.length]).join('');
  N.cleanCode = s => String(s || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  const plain = (s, n = 16) => String(s || '').replace(/[<>&"'`]/g, '').replace(/\s+/g, ' ').trim().slice(0, n);
  const AVATARS = ['🦊', '🐻', '🐼', '🐨', '🦁', '🐯', '🐸', '🐵', '🐧', '🦉', '🐙', '🦄', '🐺', '🐮', '🐷', '🐰', '🦝', '🐲', '🤖', '🎩', '👑', '🌟', '🍀', '🎸'];
  N.AVATARS = AVATARS;
  const cleanAv = a => AVATARS.includes(a) ? a : '🙂';

  /* ---------- Lobbyn ---------- */
  const members = new Map();
  let inLobby = false, hiTimer = 0, sweepTimer = 0, unsubLobby = null, status = {st: 'menu', tb: null};
  const lobbyListeners = new Set();
  N.onLobby = fn => { lobbyListeners.add(fn); return () => lobbyListeners.delete(fn); };
  let lobbyT = 0;
  const lobbyChanged = () => { clearTimeout(lobbyT); lobbyT = setTimeout(() => lobbyListeners.forEach(fn => { try { fn(); } catch (e) { console.error(e); } }), 120); };
  const me = () => ({name: plain(Profile.name) || 'Spelare', av: cleanAv(Profile.avatar), color: Profile.color, st: status.st, tb: status.tb, ver: GAME_VER});
  function hi() { if (inLobby && Settings.visible !== false) Mqtt.pub(T_LOBBY, Object.assign({t: 'hi'}, me())); }
  function onLobby(msg) {
    if (msg.t === 'hi') {
      const known = members.has(msg.f);
      members.set(msg.f, {cid: msg.f, name: plain(msg.name) || 'Spelare', av: cleanAv(msg.av), color: Rules.COLORS[msg.color] ? msg.color : 'red', st: String(msg.st || 'menu').slice(0, 10),
        tb: msg.tb && typeof msg.tb === 'object' ? {code: N.cleanCode(msg.tb.code), n: +msg.tb.n || 1, max: clamp(+msg.tb.max || 2, 2, 4), st: msg.tb.st === 'play' ? 'play' : 'wait', pub: !!msg.tb.pub, quick: !!msg.tb.quick, target: +msg.tb.target || 15} : null,
        ver: String(msg.ver || ''), seen: Date.now()});
      if (!known) Bus.emit('lobby-join', members.get(msg.f));
      lobbyChanged();
    } else if (msg.t === 'who') { if (inLobby) setTimeout(hi, 200 + Math.random() * 900); }
    else if (msg.t === 'bye') { if (members.delete(msg.f)) lobbyChanged(); }
    else if (msg.t === 'inv' && msg.to === Mqtt.cid) Bus.emit('invite', {from: plain(msg.name) || 'Någon', av: cleanAv(msg.av), code: N.cleanCode(msg.code), cid: msg.f});
  }
  N.lobbyOn = async () => {
    if (inLobby) return true;
    Mqtt.setWill(T_LOBBY, {t: 'bye'});
    const ok = await Mqtt.ready(9000);
    if (!ok) return false;
    if (inLobby) return true;
    inLobby = true;
    unsubLobby = Mqtt.sub(T_LOBBY, onLobby);
    setTimeout(() => { Mqtt.pub(T_LOBBY, {t: 'who'}); hi(); }, 600);
    clearInterval(hiTimer); hiTimer = setInterval(hi, 20000);
    clearInterval(sweepTimer);
    sweepTimer = setInterval(() => { const now = Date.now(); let ch = false; members.forEach((m, k) => { if (now - m.seen > 50000) { members.delete(k); ch = true; } }); if (ch) lobbyChanged(); }, 5000);
    return true;
  };
  N.lobbyOff = () => {
    if (!inLobby) return;
    Mqtt.pub(T_LOBBY, {t: 'bye'});
    inLobby = false; clearInterval(hiTimer); clearInterval(sweepTimer);
    if (unsubLobby) unsubLobby();
    members.clear(); lobbyChanged();
  };
  N.inLobby = () => inLobby;
  N.status = (st, tb = null) => { status = {st, tb}; hi(); };
  N.members = () => [...members.values()].sort((a, b) => a.name.localeCompare(b.name, 'sv'));
  N.tables = () => N.members().filter(m => m.tb && m.tb.pub && m.tb.code).map(m => Object.assign({host: m.name, av: m.av, cid: m.cid, ver: m.ver}, m.tb));
  N.invite = (cid, code) => Mqtt.pub(T_LOBBY, {t: 'inv', to: cid, code, name: plain(Profile.name), av: cleanAv(Profile.avatar)});
  // Snabbmatch: ett bord som väntar, med plats kvar och samma version (flest spelare först)
  N.quickTable = () => N.tables().filter(t => t.st === 'wait' && t.n < t.max && t.ver === GAME_VER).sort((a, b) => b.n - a.n)[0] || null;

  /* ---------- Gemensam grund för sessionerna ---------- */
  class Session {
    constructor(role) { this.role = role; this.ls = {}; this.m = null; this.seats = []; }
    on(ev, fn) { (this.ls[ev] = this.ls[ev] || []).push(fn); return this; }
    removeListener(ev, fn) { if (this.ls[ev]) this.ls[ev] = this.ls[ev].filter(f => f !== fn); }
    emit(ev, ...a) { (this.ls[ev] || []).forEach(fn => { try { fn(...a); } catch (e) { console.error(e); } }); }
    off() { this.ls = {}; }
    mySeat() { return -1; }
    isMine(s) { return s === this.mySeat(); }
    cpuHere() { return false; }
    sendAim() {}
    sendEmote() {}
    leave() {}
    online() { return false; }
  }

  // Alla på samma skärm (mot datorn, flera spelare eller träning)
  class LocalSession extends Session {
    constructor(seats, opts) {
      super('local');
      this.seats = seats;
      this.m = Rules.create(Object.assign({seats, id: randId(8)}, opts));
      this.opts = opts;
    }
    isMine(s) { return this.seats[s] && this.seats[s].kind !== 'cpu'; }
    cpuHere(s) { return this.seats[s] && this.seats[s].kind === 'cpu'; }
    submit(input) {
      if (!this.m || this.m.over) return;
      const pre = this.m, seat = Rules.current(pre), r = Rules.apply(pre, input);
      this.m = r.m;
      this.emit('throw', {k: r.m.k, seat, input: r.sum.input, pre, post: r.m, sum: r.sum});
    }
    rematch() { this.m = Rules.create(Object.assign({seats: this.seats, id: randId(8)}, this.opts)); this.emit('state', this.m, 'new'); }
  }

  // Värden för ett bord över nätet
  class HostSession extends Session {
    constructor(opts) {
      super('host');
      const saved = opts.restore || null;
      this.opts = Object.assign({pub: true, max: 2, target: 15, mode: null, quick: false}, saved ? saved.opts : opts);
      this.code = saved ? saved.code : (opts.code || N.newCode());
      this.topic = tRoom(this.code);
      this.seats = saved ? saved.seats : [{cid: Mqtt.cid, dev: Profile.dev, name: plain(Profile.name) || 'Värd', av: cleanAv(Profile.avatar), color: Profile.color || 'red', kind: 'human', online: true, host: true}];
      if (saved) { const me = this.seats.find(s => s.host); if (me) me.cid = Mqtt.cid; this.seats.forEach(s => { if (s.kind === 'human' && !s.host) s.online = false; }); }
      this.watchers = new Map();
      this.state = saved ? saved.state : 'lobby';
      this.m = saved ? saved.m : null;
      this.seen = new Map();
      this.v = saved ? saved.v + 10 : 1;
      this.unsub = Mqtt.sub(this.topic, msg => this.onMsg(msg));
      this.hb = setInterval(() => this.tick(), 2000);
      this.announce();
    }
    online() { return true; }
    mySeat() { return this.seats.findIndex(s => s.cid === Mqtt.cid); }
    isMine(s) { return s === this.mySeat(); }
    cpuHere(s) { return this.seats[s] && this.seats[s].kind === 'cpu'; }
    info() { return {code: this.code, pub: this.opts.pub, max: this.opts.max, target: this.opts.target, mode: this.opts.mode, quick: this.opts.quick, name: this.seats[0].name}; }
    roomMsg() { return {t: 'room', hd: Profile.dev, v: ++this.v, ver: GAME_VER, info: this.info(), seats: this.seats, state: this.state, m: this.m, w: this.watchers.size}; }
    announce() {
      Mqtt.pub(this.topic, this.roomMsg());
      TabStore.set('host', {code: this.code, opts: this.opts, seats: this.seats, state: this.state, m: this.m, v: this.v, t: Date.now()});
      const humans = this.seats.filter(s => s.kind === 'human').length;
      N.status('host', {code: this.code, n: this.seats.length, max: this.opts.max, st: this.state === 'lobby' ? 'wait' : 'play', pub: this.opts.pub, quick: this.opts.quick, target: this.opts.target, h: humans});
      this.emit('seats');
    }
    tick() {
      const now = Date.now();
      let ch = false;
      this.seats.forEach(s => {
        if (s.kind !== 'human' || s.cid === Mqtt.cid) return;
        const on = now - (this.seen.get(s.cid) || 0) < 16000;
        if (on !== s.online) { s.online = on; ch = true; this.emit(on ? 'back' : 'gone', s); }
      });
      this.watchers.forEach((w, cid) => { if (now - w.seen > 20000) { this.watchers.delete(cid); ch = true; } });
      if (ch || now - (this.lastAnn || 0) > 4000) { this.lastAnn = now; this.announce(); }
    }
    seatOf(cid) { return this.seats.findIndex(s => s.cid === cid); }
    onMsg(msg) {
      this.seen.set(msg.f, Date.now());
      const si = this.seatOf(msg.f);
      switch (msg.t) {
        case 'join': {
          if (String(msg.ver) !== GAME_VER) { Mqtt.pub(this.topic, {t: 'nope', to: msg.f, why: 'ver'}); return; }
          const dev = plain(msg.dev, 32);
          let i = this.seats.findIndex(s => s.kind === 'human' && s.dev === dev);
          if (i >= 0) { Object.assign(this.seats[i], {cid: msg.f, online: true}); this.emit('back', this.seats[i]); }
          else if (this.state === 'lobby' && this.seats.length < this.opts.max) {
            const taken = new Set(this.seats.map(s => s.color));
            let color = Rules.COLORS[msg.color] && !taken.has(msg.color) ? msg.color : Rules.COLOR_KEYS.find(c => !taken.has(c));
            this.seats.push({cid: msg.f, dev, name: plain(msg.name) || 'Spelare', av: cleanAv(msg.av), color, kind: 'human', online: true});
            Sound.play('join');
            this.emit('joined', this.seats[this.seats.length - 1]);
          } else this.watchers.set(msg.f, {name: plain(msg.name) || 'Någon', seen: Date.now()});
          this.announce();
          break;
        }
        case 'hb': { const w = this.watchers.get(msg.f); if (w) w.seen = Date.now(); break; }
        case 'leave':
          if (si > 0) {
            if (this.state === 'lobby') { this.seats.splice(si, 1); Sound.play('leave'); }
            else { this.seats[si].online = false; this.seats[si].left = true; this.emit('gone', this.seats[si]); }
            this.announce();
          } else this.watchers.delete(msg.f);
          break;
        case 'color':
          if (si > 0 && this.state === 'lobby' && Rules.COLORS[msg.color] && !this.seats.some(s => s.color === msg.color)) { this.seats[si].color = msg.color; this.announce(); }
          break;
        case 'thr': if (si >= 0) this.apply(si, msg.input, msg.k); break;
        case 'aim': if (si >= 0) this.emit('aim', si, msg); break;
        case 'emo': if (si >= 0 || this.watchers.has(msg.f)) this.emit('emo', si, plain(msg.e, 40)); break;
        case 'resync': Mqtt.pub(this.topic, this.roomMsg()); break;
      }
    }
    // Värden räknar kastet (eget, datorns eller en gästs) och skickar resultatet till alla
    apply(seat, input, k) {
      const m = this.m;
      if (!m || m.over || Rules.current(m) !== seat) return false;
      if (k != null && k !== m.k) { if (k < m.k) Mqtt.pub(this.topic, this.roomMsg()); return false; }
      const r = Rules.apply(m, Phys.cleanInput(input || {}));
      this.m = r.m;
      if (r.m.over) this.state = 'over';
      Mqtt.pub(this.topic, {t: 'thr', hd: Profile.dev, k: r.m.k, seat, m: r.m});
      this.emit('throw', {k: r.m.k, seat, input: r.sum.input, pre: m, post: r.m, sum: r.sum});
      if (r.m.over || r.sum.frameEnd) this.announce();
      return true;
    }
    submit(input, seat = this.mySeat()) { return this.apply(seat, input); }
    addCpu(level = 'medel') {
      if (this.state !== 'lobby' || this.seats.length >= this.opts.max) return;
      const taken = new Set(this.seats.map(s => s.color)), used = new Set(this.seats.map(s => s.name));
      const name = AI.NAMES.find(n => !used.has(n)) || 'Datorn';
      this.seats.push({cid: 'cpu' + randId(4), name, av: '🤖', color: Rules.COLOR_KEYS.find(c => !taken.has(c)), kind: 'cpu', level, online: true});
      this.announce();
    }
    removeSeat(i) {
      if (this.state !== 'lobby' || i <= 0 || !this.seats[i]) return;
      const s = this.seats[i];
      if (s.kind === 'human') Mqtt.pub(this.topic, {t: 'kick', to: s.cid});
      this.seats.splice(i, 1);
      this.announce();
    }
    setOpts(o) { if (this.state !== 'lobby') return; Object.assign(this.opts, o); this.opts.max = clamp(Math.max(this.opts.max, this.seats.length), 2, 4); this.announce(); }
    setColor(c) { const i = this.mySeat(); if (this.state === 'lobby' && Rules.COLORS[c] && !this.seats.some((s, j) => j !== i && s.color === c)) { this.seats[i].color = c; Profile.color = c; saveProfile(); this.announce(); } }
    start() {
      if (this.seats.length < 2) return false;
      this.state = 'game';
      this.m = Rules.create({seats: this.seats.map(s => ({name: s.name, color: s.color, avatar: s.av, kind: s.kind, level: s.level})), target: this.opts.target, mode: this.opts.mode, id: randId(8)});
      this.announce();
      this.emit('state', this.m, 'new');
      return true;
    }
    rematch() {
      // de som har gått lämnar sina platser (om det finns minst två kvar)
      const stay = this.seats.filter(s => s.kind === 'cpu' || (s.online && !s.left));
      if (stay.length >= 2) this.seats = stay;
      return this.start();
    }
    backToLobby() { this.state = 'lobby'; this.m = null; this.seats = this.seats.filter(s => s.kind === 'cpu' || (s.online && !s.left)); this.announce(); this.emit('state', null, 'lobby'); }
    sendAim(a) { Mqtt.pub(this.topic, Object.assign({t: 'aim'}, a)); }
    sendEmote(e) { Mqtt.pub(this.topic, {t: 'emo', e}); }
    leave() {
      TabStore.del('host');
      Mqtt.pub(this.topic, {t: 'closed', hd: Profile.dev});
      clearInterval(this.hb);
      if (this.unsub) this.unsub();
      N.status('menu');
      this.off();
    }
  }

  // En gäst vid någon annans bord (spelare eller åskådare)
  class ClientSession extends Session {
    constructor(code) {
      super('client');
      this.code = N.cleanCode(code);
      this.topic = tRoom(this.code);
      this.hostCid = null; this.info = null; this.state = 'lobby'; this.lastHost = 0; this.hostLost = false; this.pending = null;
      this.unsub = Mqtt.sub(this.topic, msg => this.onMsg(msg));
    }
    online() { return true; }
    join(timeout = 9000) {
      return new Promise((res, rej) => {
        let tries = 0;
        const send = () => Mqtt.pub(this.topic, {t: 'join', ver: GAME_VER, dev: Profile.dev, name: plain(Profile.name) || 'Spelare', av: cleanAv(Profile.avatar), color: Profile.color});
        send();
        const again = setInterval(() => { if (++tries < 4) send(); }, 2200);
        const done = (err) => { clearInterval(again); clearTimeout(t); this.joinWait = null; err ? rej(err) : res(this); };
        const t = setTimeout(() => done(new Error('Hittade inget bord med koden ' + this.code + '.')), timeout);
        this.joinWait = done;
      }).then(s => {
        TabStore.set('room', {code: this.code, t: Date.now()});
        this.hb = setInterval(() => {
          Mqtt.pub(this.topic, {t: 'hb'});
          const lost = Date.now() - this.lastHost > 15000;
          if (lost !== this.hostLost) { this.hostLost = lost; this.emit(lost ? 'hostlost' : 'hostback'); }
          // skickat kast som värden inte har bekräftat: skicka igen
          if (this.pending && Date.now() - this.pending.at > 2500) { this.pending.at = Date.now(); Mqtt.pub(this.topic, this.pending.msg); if (++this.pending.n > 8) this.pending = null; }
        }, 3000);
        return s;
      });
    }
    mySeat() { return this.seats.findIndex(s => s.dev === Profile.dev && s.kind === 'human'); }
    isMine(s) { return s >= 0 && s === this.mySeat(); }
    watching() { return this.mySeat() < 0; }
    onMsg(msg) {
      if (msg.t === 'nope' && msg.to === Mqtt.cid) { if (this.joinWait) this.joinWait(new Error(msg.why === 'ver' ? 'Bordet kör en annan version av spelet. Ladda om sidan (dra nedåt) och försök igen.' : 'Kunde inte gå med.')); return; }
      if (msg.t === 'kick' && msg.to === Mqtt.cid) { this.emit('kicked'); return; }
      if (msg.t === 'aim' || msg.t === 'emo') {
        const si = this.seats.findIndex(s => s.cid === msg.f);
        if (msg.t === 'aim' && si >= 0) this.emit('aim', si, msg);
        if (msg.t === 'emo') this.emit('emo', si, plain(msg.e, 40));
        return;
      }
      if (msg.t === 'room' || msg.t === 'thr' || msg.t === 'closed') {
        // värden känns igen på sin enhet (inte anslutningen), så att den kan ladda om sidan och fortsätta
        if (!this.hostDev && msg.t === 'room') this.hostDev = msg.hd;
        if (!msg.hd || msg.hd !== this.hostDev) return;
        this.hostCid = msg.f;
        this.lastHost = Date.now();
        if (this.hostLost) { this.hostLost = false; this.emit('hostback'); }
      }
      if (msg.t === 'closed') { this.emit('closed'); return; }
      if (msg.t === 'room') {
        if (msg.v <= (this.v || 0) && msg.t === 'room' && this.seats.length) { /* äldre */ } else this.v = msg.v;
        this.info = msg.info; this.watchers = msg.w || 0;
        const prevState = this.state;
        this.seats = Array.isArray(msg.seats) ? msg.seats : [];
        this.state = msg.state;
        if (this.joinWait) this.joinWait(null);
        this.emit('seats');
        this.take(msg.m, prevState);
      } else if (msg.t === 'thr') this.take(msg.m, this.state);
    }
    // Ett nytt läge från värden: animera om det är nästa kast, annars hoppa dit
    take(m, prevState) {
      if (!m) { if (this.m && this.state === 'lobby') { this.m = null; this.emit('state', null, 'lobby'); } return; }
      const cur = this.m;
      if (this.pending && m.k >= this.pending.k) this.pending = null;
      if (!cur || cur.id !== m.id) { this.m = m; this.emit('state', m, 'new'); return; }
      if (m.k === cur.k + 1 && m.last && m.last.input) {
        this.m = m;
        this.emit('throw', {k: m.k, seat: m.last.seat, input: m.last.input, pre: cur, post: m, sum: m.last});
      } else if (m.k > cur.k + 1 || (m.k === cur.k && m.v > cur.v && JSON.stringify(m.pucks) !== JSON.stringify(cur.pucks))) {
        this.m = m; this.emit('state', m, 'jump');
      } else if (m.k === cur.k && m.over !== cur.over) { this.m = m; this.emit('state', m, 'jump'); }
    }
    submit(input) {
      const m = this.m, seat = this.mySeat();
      if (!m || m.over || Rules.current(m) !== seat) return false;
      const msg = {t: 'thr', k: m.k, input: Phys.cleanInput(input)};
      Mqtt.pub(this.topic, msg);
      this.pending = {k: m.k + 1, msg, at: Date.now(), n: 0};
      // visa kastet direkt: värden räknar fram exakt samma sak
      const r = Rules.apply(m, msg.input);
      this.m = r.m;
      this.emit('throw', {k: r.m.k, seat, input: r.sum.input, pre: m, post: r.m, sum: r.sum, local: true});
      return true;
    }
    setColor(c) { Mqtt.pub(this.topic, {t: 'color', color: c}); Profile.color = c; saveProfile(); }
    sendAim(a) { Mqtt.pub(this.topic, Object.assign({t: 'aim'}, a)); }
    sendEmote(e) { Mqtt.pub(this.topic, {t: 'emo', e}); }
    resync() { Mqtt.pub(this.topic, {t: 'resync'}); }
    leave() { TabStore.del('room'); Mqtt.pub(this.topic, {t: 'leave'}); clearInterval(this.hb); if (this.unsub) this.unsub(); N.status('menu'); this.off(); }
  }
  N.LocalSession = LocalSession;
  N.HostSession = HostSession;
  N.ClientSession = ClientSession;
  N.host = opts => new HostSession(opts);
  // Efter en omladdning: fortsätt som värd eller gå tillbaka till bordet man satt vid (inom två timmar)
  N.saved = () => {
    const h = TabStore.get('host'), r = TabStore.get('room'), fresh = x => x && Date.now() - x.t < 2 * 3600e3;
    if (fresh(h)) return {host: h};
    if (fresh(r)) return {room: r.code};
    return null;
  };
  N.join = async code => { const s = new ClientSession(code); try { await s.join(); } catch (e) { s.leave(); throw e; } return s; };
  return N;
})();

/* ---- 12-hud.js ---- */
/* ================= Spelets HUD: ställning, minikarta, meddelanden och pratbubblor ================= */
const HUD = (() => {
  const H = {};
  const {L, R, W, FOUL, Z2, Z3} = TABLE;
  let session = null, m = null, turnSeat = -1;
  const colorOf = (mm, s) => (Rules.COLORS[mm && mm.seats[s] && mm.seats[s].color] || Rules.COLORS.red).hex;

  H.show = on => { $('hud').classList.toggle('hidden', !on); if (!on) { H.clock(null); H.banner(null); closeEmotes(); document.body.classList.remove('four'); } };
  H.bind = s => { session = s; };

  /* ---------- Spelarbrickorna ---------- */
  H.update = (mm, opts = {}) => {
    m = mm;
    if (!m) return;
    const chips = $('chips');
    const n = m.seats.length;
    chips.className = n > 2 ? 'chips4' : '';
    document.body.classList.toggle('four', n > 2);
    if (chips.children.length !== n) {
      chips.innerHTML = '';
      m.seats.forEach((s, i) => chips.append(h('div', {class: 'chip', 'data-i': i},
        h('span', {class: 'av'}), h('div', {class: 'who'}, h('div', {class: 'nm'}), h('div', {class: 'pk'})), h('div', {class: 'sc'}))));
    }
    const cur = opts.turn != null ? opts.turn : Rules.current(m);
    const standings = Rules.standings(m), top = m.scores[standings[0]];
    m.seats.forEach((s, i) => {
      const c = chips.children[i], col = colorOf(m, i);
      c.style.setProperty('--pc', col);
      c.querySelector('.av').textContent = s.avatar || s.av || '🙂';
      c.querySelector('.av').style.setProperty('--pc', col);
      c.querySelector('.nm').textContent = s.name;
      const sc = c.querySelector('.sc');
      if (sc.textContent !== String(m.scores[i])) { sc.textContent = m.scores[i]; if (opts.bump) { sc.classList.remove('bump'); void sc.offsetWidth; sc.classList.add('bump'); } }
      const left = Rules.left(m, i), pk = c.querySelector('.pk');
      if (pk.children.length !== m.per) { pk.innerHTML = ''; for (let k = 0; k < m.per; k++) pk.append(h('i')); }
      [...pk.children].forEach((d, k) => d.classList.toggle('used', k >= left));
      c.classList.toggle('turn', i === cur && !m.over);
      c.classList.toggle('lead', m.scores[i] === top && top > 0);
      const seatInfo = session && session.seats && session.seats[i];
      c.classList.toggle('off', !!(seatInfo && seatInfo.kind === 'human' && seatInfo.online === false));
    });
    $('frameInfo').textContent = m.practice ? `Träning · ${Rules.left(m, 0)} puckar kvar` : `Omgång ${m.frame} · först till ${m.target}`;
    H.mini();
  };
  H.chipPos = i => { const c = $('chips').children[i]; if (!c) return null; const r = c.getBoundingClientRect(); return {x: r.left + r.width / 2, y: r.bottom}; };

  /* ---------- Vems tur ---------- */
  H.banner = (text, seat = -1) => {
    const b = $('turnBanner');
    if (!text) { b.classList.remove('show'); return; }
    b.innerHTML = '';
    if (seat >= 0 && m) {
      const s = m.seats[seat];
      const av = h('span', {class: 'av'}, s.avatar || s.av || '🙂');
      av.style.setProperty('--pc', colorOf(m, seat));
      b.append(av);
      b.style.setProperty('--pc', colorOf(m, seat));
    }
    b.append(h('span', null, text));
    b.classList.add('show');
  };

  /* ---------- Meddelanden mitt på skärmen ---------- */
  H.toast = (text, cls = '', ms = 1700) => {
    const t = h('div', {class: 'toast ' + cls}, text);
    $('toasts').append(t);
    while ($('toasts').children.length > 3) $('toasts').firstChild.remove();
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 400); }, ms * Math.max(Time.scale, .05));
    return t;
  };
  // Text som svävar upp från en punkt på bordet
  H.float = (x, y, text, color, big = false) => {
    const p = Cam.toScreen(x, y, 0.03);
    if (p.behind) return;
    const f = h('div', {class: 'float' + (big ? ' big' : '')}, text);
    f.style.left = p.x + 'px'; f.style.top = p.y + 'px'; f.style.setProperty('--pc', color || '#fff');
    $('floats').append(f);
    setTimeout(() => f.remove(), 2000);
  };

  /* ---------- Tidsgräns (över nätet) ---------- */
  H.clock = sec => {
    const c = $('clock');
    if (sec == null) { c.classList.remove('show'); return; }
    c.classList.add('show');
    c.classList.toggle('low', sec <= 10);
    c.textContent = `0:${String(Math.max(0, Math.ceil(sec))).padStart(2, '0')}`;
  };

  /* ---------- Minikartan: poängzonerna ovanifrån ---------- */
  let live = null;     // puckar under ett kast: [{x, y, owner, id}]
  let leadIds = [];
  H.setLive = list => { live = list; H.mini(); };
  H.setLead = ids => { leadIds = ids || []; };
  const y0 = FOUL - 0.12, y1 = L + TABLE.END;
  H.mini = () => {
    const cv = $('mini');
    if (!cv || !m) return;
    const cssW = cv.clientWidth || 66, ratio = (W + 0.06) / (y1 - y0), cssH = Math.round(cssW / ratio);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(cssW * dpr) || cv.height !== Math.round(cssH * dpr)) { cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr); cv.style.height = cssH + 'px'; }
    const g = cv.getContext('2d'), w = cv.width, hh = cv.height, s = w / (W + 0.06);
    const X = x => (x + W / 2 + 0.03) * s, Y = y => (y1 - y) * s;
    g.clearRect(0, 0, w, hh);
    // rännan och spelytan
    g.fillStyle = '#1b120b'; g.fillRect(0, 0, w, hh);
    const grad = g.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0, '#caa06a'); grad.addColorStop(.5, '#e3c08b'); grad.addColorStop(1, '#caa06a');
    g.fillStyle = grad; g.fillRect(X(-W / 2), Y(L), W * s, (L - y0) * s);
    // zonerna
    g.fillStyle = 'rgba(255,90,130,.14)'; g.fillRect(X(-W / 2), Y(L), W * s, (L - Z3) * s);
    g.fillStyle = 'rgba(255,200,90,.1)'; g.fillRect(X(-W / 2), Y(Z3), W * s, (Z3 - Z2) * s);
    g.fillStyle = 'rgba(30,18,8,.85)';
    [[Z3, 1.2], [Z2, 1.2], [FOUL, 2]].forEach(([yy, lw]) => g.fillRect(X(-W / 2), Y(yy) - lw * dpr / 2, W * s, lw * dpr));
    g.font = `700 ${Math.round(9 * dpr)}px Oswald, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = 'rgba(30,18,8,.6)';
    g.fillText('3', X(0), Y((L + Z3) / 2)); g.fillText('2', X(0), Y((Z3 + Z2) / 2)); g.fillText('1', X(0), Y(L - 0.9));
    // puckarna
    const list = live || m.pucks;
    for (const q of list) {
      if (q.y < y0 - R || q.out) continue;
      const cx = X(q.x), cy = Y(q.y), rr = Math.max(R * s, 3.2 * dpr);
      if (leadIds.includes(q.id)) { g.beginPath(); g.arc(cx, cy, rr + 3.5 * dpr, 0, 7); g.fillStyle = 'rgba(255,240,200,.55)'; g.fill(); }
      g.beginPath(); g.arc(cx, cy, rr, 0, 7);
      g.fillStyle = colorOf(m, q.owner); g.fill();
      g.lineWidth = 1.2 * dpr; g.strokeStyle = 'rgba(255,255,255,.85)'; g.stroke();
    }
  };

  /* ---------- Pratbubblor och snabbmeddelanden ---------- */
  const EMOTES = ['👏', '😮', '😂', '🔥', '😅', '👍', '🎯', '😎'];
  const PHRASES = ['Snyggt!', 'Oj då!', 'Lycka till!', 'Bra match!', 'Hoppsan!', 'Nu kör vi!', 'Tur!', 'Tack för matchen!'];
  let emoteT = 0;
  H.initEmotes = () => {
    const p = $('emotePanel');
    p.innerHTML = '';
    EMOTES.forEach(e => p.append(h('button', {class: 'emo', onclick: () => sendEmote(e)}, e)));
    PHRASES.forEach(e => p.append(h('button', {onclick: () => sendEmote(e)}, e)));
    $('emoteBtn').onclick = () => { Sound.play('soft'); p.classList.toggle('show'); };
  };
  function closeEmotes() { const p = $('emotePanel'); if (p) p.classList.remove('show'); }
  function sendEmote(e) {
    closeEmotes();
