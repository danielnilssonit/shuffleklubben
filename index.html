    M.note(`${inv.av} ${inv.from} bjuder in dig till sitt bord`, 'inv' + inv.code, 15000, [['Nej tack', () => {}, 'ghost'], ['Gå med', () => { if (Game.running()) Game.quit(); joinFlow(inv.code); }, 'primary']]);
  });
  return M;
})();

/* ---- 13b-intro.js ---- */
/* ================= Lär dig spela ================= */
// En guidad träning: speakern (och en ruta på skärmen) visar hur man kastar och säger till efter varje kast: för kort,
// över kanten, snyggt. Steg: första kastet förbi foul-linjen → trean längst bort → sikta, skruva och hängare → klart.
const Intro = (() => {
  const I = {};
  const TIPS = {
    'intro.2': ['Lär dig spela', 'Tryck var som helst och dra nedåt för att ta sats. Ju längre du drar, desto hårdare. Släpp för att kasta!'],
    'intro.3': ['För kort', 'Pucken måste förbi den första linjen. Ta i lite mer!'],
    'intro.4': ['Över kanten', 'Ta i lite mindre nästa gång.'],
    'intro.5': ['Snyggt!', 'Försök nu att hamna i trean, längst bort på bordet.'],
    'intro.6': ['Nästan!', 'Lite längre bort.'],
    'intro.7': ['Tre poäng!', 'Perfekt!'],
    'intro.8': ['Sikta och skruva', 'Dra snett för att sikta åt sidan. Knapparna längst ner skruvar pucken.'],
    'intro.9': ['Hängare och utslag', 'Hänger pucken ut över kanten får du fyra poäng. En hård puck slår ut de andras.'],
    'intro.10': ['Klart!', 'Nu kan du grunderna. Lycka till där ute!']
  };
  let step = null, busy = false;
  I.active = () => step !== null;
  // säger en replik (och visar texten)
  function say(keys, ms = 6500) {
    const last = keys[keys.length - 1], t = TIPS[last] || TIPS[keys[0]];
    if (t) HUD.tip(t[1], ms, t[0]);
    Sound.announce(keys, 2);
  }
  I.start = () => {
    const s = new Net.LocalSession([{name: Profile.name || 'Du', avatar: Profile.avatar || '🙂', color: Profile.color || 'red', kind: 'human', cos: Badges.seatCos()}], {practice: true, target: 999, mode: 'all', per: 10});
    s.m.intro = true;
    Game.start(s);
    step = 'first';
    busy = false;
    // (introduktionens repliker ligger i en egen fil som laddas nu)
    const t0 = Date.now();
    Sound.prepare([], [], ['intro']).then(() => setTimeout(() => { if (step === 'first') say(['intro.1', 'intro.2'], 9000); }, Math.max(0, 1200 - (Date.now() - t0))));
  };
  I.stop = () => { step = null; };
  // efter varje kast i introduktionen
  I.onThrow = sum => {
    if (!step || busy) return;
    const dead = (sum.dead || []).includes(sum.id), fell = (sum.fell || []).includes(sum.id), z = sum.shotZone;
    if (dead) return say(['intro.3']);
    if (fell) return say(['intro.4']);
    if (step === 'first') { step = 'three'; return say(['intro.5']); }
    if (step === 'three') {
      if (z < 3) return say(['intro.6'], 3500);
      step = 'done';
      busy = true;
      say(['intro.7'], 3000);
      // resten av lektionen, en bit i taget, och sedan ett val
      setTimeout(() => { if (step === 'done') say(['intro.8'], 7000); }, 3200);
      setTimeout(() => { if (step === 'done') say(['intro.9'], 7000); }, 10400);
      setTimeout(() => {
        if (step !== 'done') return;
        say(['intro.10'], 4000);
        Store.set('introDone', true);
        Badges.check();
        setTimeout(() => { if (step === 'done') { step = null; Menu.introDone(); } }, 2600);
      }, 17800);
    }
  };
  return I;
})();

/* ---- 14-game.js ---- */
/* ================= Matchen: turer, kast, poängräkning och slut ================= */
// Game styr det som syns: vems tur det är, siktningen, kasten (som spelas upp med samma fysik som räknade fram
// dem), kameran, ljuden och poängräkningen. Själva ställningen kommer från en Session (på samma skärm, som värd
// eller som gäst över nätet), så att allt fungerar likadant hur man än spelar.
const Game = (() => {
  const G = {};
  const {L, R, Y0} = TABLE;
  // queue: händelser i den ordning de kom, {type: 'throw', ev} eller {type: 'jump', m, why}
  let S = null, m = null, gen = 0, queue = [], waiters = [], aimId = null, viewFar = false;
  let remoteAim = null, clockT = 0, autoT = 0, turnKey = null, lastLocalSeat = -1, lostT = 0;
  // tidsgränsen för den aktuella turen (samma tur även om loopen väcks flera gånger)
  let turnClock = {key: null, deadline: 0, timedOut: false};
  let lastTurn = null;
  let chSums = [];          // kasten i en utmaning
  const fxDone = new Set();
  const colorKey = (mm, s) => (mm && mm.seats[s] && mm.seats[s].color) || 'red';
  const hex = (mm, s) => (Rules.COLORS[colorKey(mm, s)] || Rules.COLORS.red).hex;
  G.session = () => S;
  // Pubkväll: TV:n visar bordet (värd utan plats), telefonerna är handkontroller (ingen 3D, ett kastbord i 2D)
  const atTv = s => !!s && (s.role === 'host' ? !!s.tv : !!(s.atTv && s.atTv()));
  G.tvHost = () => !!S && S.role === 'host' && !!S.tv;
  G.controller = () => !!S && S.role === 'client' && atTv(S);
  // alla puckar i en omgång är kastade (så att brickorna visar tomma prickar under poängräkningen)
  G.perFrame = mm => Rules.throwsPerFrame(mm);
  // Speakern: vad en sida heter i de inspelade replikerna: lagets färg, datorspelarens namn, figuren om ingen annan vid
  // bordet har samma figur, annars spelarens färg
  const SAY_NAMES = {Greta: 'greta', Sixten: 'sixten', Majken: 'majken', Bosse: 'bosse', Tyra: 'tyra', Nisse: 'nisse', Ingrid: 'ingrid', Folke: 'folke',
    Svea: 'svea', Kjell: 'kjell', Nigel: 'nigel', Margaret: 'margaret', Dolly: 'dolly', Hank: 'hank', 'Mästaren': 'mastare',
    Liam: 'liam', Molly: 'molly', Yuki: 'yuki', Kenji: 'kenji'};
  const SAY_COLORS = {red: 'rod', blue: 'bla', gold: 'guld', green: 'gron', purple: 'lila', white: 'vit'};
  G.sayName = (mm, sd) => {
    if (mm.teams) return sd === 0 ? 'lag_rod' : 'lag_bla';
    const s = mm.seats[Rules.sideSeats(mm, sd)[0]] || {};
    if (s.kind === 'cpu' && SAY_NAMES[s.name]) return SAY_NAMES[s.name];
    const av = s.avatar || s.av, look = LOOKS[av];
    if (look && look.say && mm.seats.filter(x => (x.avatar || x.av) === av).length === 1) return look.say;
    return SAY_COLORS[s.color] || 'rod';
  };
  // vad speakern kallar en spelare utanför en match (turneringens vinnare)
  G.sayPlayer = p => {
    if (p.kind === 'cpu' && SAY_NAMES[p.name]) return SAY_NAMES[p.name];
    const look = LOOKS[p.av || p.avatar];
    return look && look.say ? look.say : SAY_COLORS[p.color] || 'rod';
  };
  let hangStreak = {}, bestMo = null;
  G.bestMoment = () => (bestMo && m && bestMo.mid === m.id ? bestMo : null);
  // Spelar upp ett kast igen (för klippet): från kastlinjen, sedan kameran som följer pucken i slowmotion
  G.playMoment = async mo => {
    const my = gen, ev = mo.ev, sum = ev.sum, end = m;
    try {
      Pucks.rings([]); HUD.setLead([]);
      Pucks.sync(ev.pre);
      Pucks.ensure(sum.id, ev.seat, colorKey(ev.pre, ev.seat), Pucks.lookOf(ev.pre, ev.seat));
      Pucks.set(sum.id, ev.input.x, Y0);
      Cam.set('aim', {aimX: ev.input.x});
      await wait(900); alive(my);
      const sim = Phys.create(ev.pre.pucks, {id: sum.id, owner: ev.seat, input: ev.input});
      const tracker = {q: sim.p.find(q => q.id === sum.id)};
      Cam.set('replay', {follow: () => ({x: tracker.q.x, y: tracker.q.y, v: Math.hypot(tracker.q.vx, tracker.q.vy)}), snap: true});
      Sound.duckMusic(true);
      await animateSim(sim, my, {tracker, rate: 0.7});
      if (sum.shotZone === 4) { Sound.play('hanger'); Sound.play('cheer', 1); }
      else if (sum.knocked >= 2) Sound.play('cheer', .8);
      await wait(1100);
    } catch (e) { if (!(e instanceof Stop)) throw e; }
    finally {
      Sound.slide(0); Sound.duckMusic(false);
      if (my === gen && end) { Pucks.sync(end); Cam.set('score'); }
    }
  };
  const deficit = {};
  // den egna sidan när exakt en människa spelar på den här skärmen (annars delas inga märken ut)
  function badgeSide() {
    if (!m || !S) return -1;
    const mine = m.seats.map((x, i) => i).filter(i => S.isMine(i) && !S.cpuHere(i));
    return mine.length === 1 ? Rules.side(m, mine[0]) : -1;
  }
  const guestKey = mm => { const o = mm && mm.tour && Tour.opp(mm); return o ? SAY_NAMES[o.name] : null; };
  // stamgästen säger sin replik (pratbubblan och rösten) när speakern har pratat klart
  function guestSays(text, part, my) {
    const t0 = Date.now();
    const go = () => {
      if (!S || my !== gen) return;
      if (Sound.talking() && Date.now() - t0 < 6000) { setTimeout(go, 200); return; }
      HUD.bubble(1, text);
      const g = guestKey(m);
      if (g) Sound.voice(`gast.${g}.${part}`);
    };
    go();
  }
  // laddar matchens namn (och stamgästens repliker) i förväg
  function prepSpeaker() {
    if (!m || m.practice) return;
    const names = [];
    for (let sd = 0; sd < Rules.sides(m); sd++) names.push(G.sayName(m, sd));
    Sound.prepare(names, [guestKey(m)].filter(Boolean));
  }
  G.state = () => m;
  G.running = () => !!S;
  G.busy = () => queue.length > 0;
  const hasJump = () => queue.some(e => e.type === 'jump');

  // Flera kan vänta samtidigt (turen och datorn som kastar åt någon som är borta): alla väcks
  function wake() { const w = waiters; waiters = []; w.forEach(f => f()); }
  const nextEvent = () => new Promise(r => { waiters.push(r); });

  G.start = (session) => {
    G.stop(false);
    S = session; gen++;
    queue = []; viewFar = false; lastLocalSeat = -1;
    Menu.clear();
    Menu.closeOverlays();
    Pucks.demo(false);
    m = S.m;
    // bordets egenskaper och pubens skylt (pubturnén); annars ett vanligt bord
    Phys.setTable(m && m.table || null);
    Scene.setNeon(m && m.tour ? Tour.pub(m).neon : null);
    const pad = G.controller();
    document.body.classList.toggle('tv', G.tvHost());
    document.body.classList.toggle('controller', pad);
    Scene.pad = pad;
    Aim.padOn(pad);
    Sound.setQuiet(pad);
    Main.keepAwake(G.tvHost() || pad);
    if (G.tvHost()) HUD.tvCode(S.code); else HUD.tvCode(null);
    HUD.bind(S);
    HUD.show(true);
    HUD.initEmotes();
    Aim.resetMemory();
    // ett kast kan komma medan man själv siktar (värden kastade åt en som tog för lång tid): avbryt siktet
    S.on('throw', ev => { queue.push({type: 'throw', ev}); Aim.cancel(); wake(); });
    // ett nytt läge ersätter kast som ligger i kö och är äldre än det
    S.on('state', (mm, why) => {
      queue = queue.filter(e => mm && e.type === 'throw' && e.ev.post.id === mm.id && e.ev.post.k > mm.k);
      queue.push({type: 'jump', m: mm, why});
      Aim.cancel(); wake();
    });
    S.on('turnStart', (seat, k) => {
      // gästen har börjat sikta: värdens tidsgräns räknas därifrån (sparas om värden inte har kommit dit än)
      lastTurn = {seat, k, id: m && m.id, at: Date.now()};
      if (m && m.k === k && Rules.current(m) === seat && turnClock.key === clockKey(seat)) turnClock.deadline = Date.now() + 61500;
    });
    S.on('aim', (seat, a) => { if (m && Rules.current(m) === seat && !S.isMine(seat) && aimId) { remoteAim = a; Aim.showRemote(aimId, a, hex(m, seat)); } });
    S.on('emo', (seat, e) => HUD.bubble(seat, e));
    S.on('seats', () => { if (m) HUD.update(m); });
    clearTimeout(lostT);
    S.on('hostlost', () => {
      Menu.note('Tappade kontakten med värden. Försöker igen …', 'hostlost', 0);
      clearTimeout(lostT);
      lostT = setTimeout(() => { if (S && S.hostLost) Menu.note('Värden har varit borta länge.', 'hostlost', 0, [['Vänta', () => {}, 'ghost'], ['Lämna bordet', () => G.quit(), 'primary']]); }, 90000);
    });
    S.on('hostback', () => { clearTimeout(lostT); Menu.unnote('hostlost'); if (S.resync) S.resync(); });
    const bye = text => { const s = S; if (!s) return; Menu.alert(text, () => { if (S === s) G.stop(); Menu.forget(s); try { s.leave(); } catch (e) { /* ok */ } Menu.online(); }); };
    S.on('closed', () => bye('Värden har stängt bordet.'));
    S.on('kicked', () => bye('Du togs bort från bordet.'));
    S.on('gone', seat => {
      if (S.role === 'host') HUD.toast(`${seat.name} tappade anslutningen`, '', 2200);
      // är det dennes tur kastar datorn snart
      const i = S.seats.indexOf(seat);
      if (m && i === Rules.current(m) && turnClock.key === clockKey(i)) turnClock.deadline = Math.min(turnClock.deadline, Date.now() + 12000);
      wake();
    });
    S.on('back', seat => {
      if (S.role === 'host') HUD.toast(`${seat.name} är tillbaka`, '', 1600);
      // är det dennes tur får den tillbaka full tid
      const i = S.seats.indexOf(seat);
      if (m && i === Rules.current(m) && turnClock.key === clockKey(i) && !turnClock.timedOut) turnClock.deadline = Math.max(turnClock.deadline, Date.now() + 61500);
      wake();
    });
    // värden är tillbaka (t.ex. efter en omladdning): säg till igen att jag siktar
    S.on('hostback', () => { if (m && S.isMine(Rules.current(m)) && Aim.active() && S.sendTurn) S.sendTurn(m.k); });
    Sound.music('game');
    Sound.ambience(true);
    Scene.setFinish(Badges.cos().bord);
    Pucks.clear(false);
    if (m) { Pucks.sync(m); HUD.update(m); Scene.drawBoard(m); Figures.sync(m); prepSpeaker(); }
    // pubturnén: välkommen, bordets egenskaper och stamgästens hälsning
    if (m && m.tour && m.k === 0) {
      const pub = Tour.pub(m), opp = Tour.opp(m);
      setTimeout(() => { if (S) { HUD.toast(pub.name, 'big', 2200); Sound.announce(['pub.' + pub.id], 2, `Välkommen till ${pub.name}.`); } }, 500);
      setTimeout(() => { if (S) HUD.tip(pub.desc, 6500, `${pub.city} · ${pub.traits.join(' · ')}`); }, 1600);
      const my = gen;
      setTimeout(() => guestSays(opp.hello, 'hej', my), 2600);
    }
    // en utmaning: visa målet
    chSums = [];
    if (m && m.challenge) { const lv = Challenges.level(m); if (lv) setTimeout(() => HUD.tip(lv.text, 6500, lv.name), 700); }
    // första matchen någonsin: kort om hur man vinner
    if (!Store.get('introSeen') && m && !m.practice && !G.tvHost()) {
      Store.set('introSeen', true);
      setTimeout(() => HUD.tip('Glid dina puckar så långt bort som möjligt utan att de ramlar av. Längst bak ger 3 poäng, och en puck som hänger över kanten ger 4!', 9000), 900);
    }
    $('viewBtn').onclick = () => { viewFar = !viewFar; Sound.play('soft'); Cam.set(viewFar ? 'far' : (Aim.active() || aimId ? 'aim' : Cam.mode())); };
    $('menuBtn').onclick = () => Menu.pause();
    $('mini').onclick = () => $('viewBtn').click();
    loop(gen).catch(e => { if (!(e instanceof Stop)) console.error(e); });
  };
  class Stop extends Error {}
  G.stop = (toMenu = true) => {
    gen++;
    Aim.cancel();
    clearInterval(clockT); clearTimeout(autoT);
    HUD.clock(null);
    HUD.tip(null);
    if (S) { const s = S; S = null; try { s.off(); } catch (e) { /* ok */ } }
    clearTimeout(lostT);
    Menu.unnote('hostlost');
    m = null; queue = []; aimId = null;
    turnClock = {key: null, deadline: 0, timedOut: false};
    wake();
    HUD.show(false);
    HUD.setLive(null); HUD.setLead([]);
    Pucks.clear(false);
    Figures.clear();
    Intro.stop();
    Scene.drawBoard(null);
    if (toMenu) Cam.set('menu');
    document.body.classList.remove('tv', 'controller');
    Phys.setTable(null);
    Scene.setNeon(null);
    Scene.pad = false;
    Aim.padOn(false);
    Sound.setQuiet(false);
    Main.keepAwake(false);
    HUD.tvCode(null);
  };
  const alive = my => { if (my !== gen) throw new Stop(); };

  async function loop(my) {
    while (my === gen) {
      if (queue.length) {
        const e = queue.shift();
        if (e.type === 'jump') applyJump(e); else await playThrow(e.ev, my);
        continue;
      }
      if (!m) { await nextEvent(); alive(my); continue; }
      if (m.over) { await gameOver(my); continue; }
      const seat = Rules.current(m);
      if (S.isMine(seat)) await myTurn(seat, my);
      else if (S.cpuHere(seat)) await cpuTurn(seat, my);
      else await theirTurn(seat, my);
    }
  }

  function applyJump({m: mm, why}) {
    Aim.cancel();
    clearAimPuck();
    if (!mm) { m = null; if (why === 'lobby') { const s = S; G.stop(false); Menu.room(s); } else if (why === 'cupover') { const s = S; G.stop(false); Menu.cupChampion(s); } return; }
    const fresh = why === 'new' || !m || m.id !== mm.id;
    m = mm;
    Figures.sync(m);
    if (fresh) {
      Pucks.clear(false); Aim.resetMemory(); Menu.closeOverlays(); chSums = [];
      if (!m.challenge) HUD.toast(m.frame === 1 && m.k === 0 ? (m.cup ? m.cup.label + '!' : 'Ny match!') : 'Ikapp', 'gold', 1400);
      Sound.music('game');
      prepSpeaker();
      // speakern hälsar välkommen till en ny match (inte på pubturnén, där säger den pubens namn)
      // (i turneringen säger den vilken match det är, och hälsar välkommen till turneringen före den första)
      if (m.cup && m.k === 0) {
        const line = {Final: 'turn.final', Semifinal: 'turn.semi', Kvartsfinal: 'turn.kvart'}[m.cup.label] || 'turn.nasta', first = m.cup.first;
        Sound.prepare([], [], ['turn']).then(() => setTimeout(() => { if (S && m && m.cup && m.k === 0) Sound.announce((first ? ['turn.start'] : []).concat([line]), 2); }, 900));
      } else if (m.frame === 1 && m.k === 0 && !m.challenge && !m.practice && !m.tour) {
        const intro = m.mode === 'hang' || m.mode === 'last' ? ['lage.' + m.mode, 'mal.' + m.target] : ['start', 'mal.' + m.target];
        setTimeout(() => { if (S && m && m.k === 0) Sound.announce(intro, 1); }, 900);
      }
      hangStreak = {};
    }
    Pucks.sync(m);
    HUD.update(m); Scene.drawBoard(m);
    markLeader(false);
  }

  /* ---------- Turerna ---------- */
  function placeAimPuck(seat) {
    clearAimPuck();
    aimId = 'aim' + m.k;
    const o = Pucks.ensure(aimId, seat, colorKey(m, seat), Pucks.lookOf(m, seat));
    const x = 0;
    Pucks.set(aimId, x, Y0, 0.03);
    Anim.tween(220, t => Pucks.set(aimId, x, Y0, 0.03 * (1 - t)), easeIn).then(() => Sound.play('place'));
    Pucks.rings([aimId]);
    return o;
  }
  function clearAimPuck() { if (aimId && Pucks.get(aimId)) Pucks.remove(aimId, 'fast'); aimId = null; remoteAim = null; Aim.showRemote(null, null); }

  function turnIntro(seat) {
    HUD.update(m, {turn: seat});
    Figures.setTurn(seat);
    Scene.drawBoard(m);
    const key = m.id + ':' + m.k;
    const first = turnKey !== key;
    turnKey = key;
    // sista kastet i omgången (ibland säger speakern det)
    if (first && !m.practice && !m.challenge && m.n === G.perFrame(m) - 1 && Math.random() < .6) setTimeout(() => Sound.announce(['sista'], 1), 700);
    return first;
  }

  async function myTurn(seat, my) {
    const first = turnIntro(seat);
    const humansHere = m.seats.filter((s, i) => S.isMine(i)).length;
    // flera på samma skärm: lämna över telefonen innan nästa spelare siktar
    if (first && humansHere > 1 && S.role === 'local' && !m.practice && lastLocalSeat !== seat && lastLocalSeat !== -1) {
      await Menu.passDevice(m, seat);
      alive(my);
    }
    lastLocalSeat = seat;
    const key = clockKey(seat);
    // tiden är ute för min tur: värden kastar åt sig själv (ingen annan kan), en gäst väntar på värdens kast
    if (S.online() && !m.practice && turnClock.key === key && turnClock.timedOut) {
      if (S.role === 'host') { await cpuTurn(seat, my, 'latt', true); return; }
      HUD.banner('Tiden är ute …', seat);
      await Promise.race([nextEvent(), wait(8000)]); alive(my);
      return;
    }
    placeAimPuck(seat);
    viewFar = false;
    Cam.set('aim', {aimX: 0});
    const name = m.seats[seat].name;
    if (first) {
      if (humansHere > 1) { HUD.banner(`${genitive(name)} tur`, seat, 2600); if (m.practice) HUD.toast(`${genitive(name)} tur`, 'gold', 1300); }
      else { HUD.banner('Din tur', seat, 2600); if (S.online()) { Sound.play('myturn'); vibrate([30, 60, 30]); } }
    }
    const noviceHint = Stats.throws < 3 && m.k < 2 ? (G.controller() ? 'Dra nedåt och släpp – titta på TV:n!' : 'Tryck var som helst, dra nedåt och släpp') : null;
    if (S.online() && !m.practice) {
      if (turnClock.key !== key) { turnClock = {key, deadline: Date.now() + 60000, timedOut: false}; if (S.sendTurn) S.sendTurn(m.k); }
      startClock(() => { turnClock.timedOut = true; Aim.cancel(); HUD.toast('Tiden är ute', '', 1500); });
    }
    const res = await Aim.run({seat, color: hex(m, seat), id: aimId, x: 0, hint: noviceHint, onAim: throttleAim()});
    stopClock();
    alive(my);
    if (!res) return;           // avbrutet (nytt läge från värden eller tiden är ute)
    HUD.banner(null);
    Stats.throws++; saveStats();
    if (!S.submit(res.input)) { await wait(300); }
    // kastet kommer tillbaka som en händelse och spelas upp i loopen
    if (!queue.length) await Promise.race([nextEvent(), wait(4000)]);
    alive(my);
  }
  const clockKey = seat => m.id + ':' + m.k + ':' + seat;
  function throttleAim() {
    let last = 0, pend = null, t = 0;
    return a => {
      if (!S || !S.online()) return;
      const now = Date.now();
      const send = () => { last = Date.now(); t = 0; S.sendAim({k: m.k, x: +pend.x.toFixed(4), a: +pend.a.toFixed(5), p: +pend.p.toFixed(4), w: pend.w}); };
      pend = a;
      if (now - last > 110) send(); else if (!t) t = setTimeout(send, 110 - (now - last));
    };
  }

  // auto: värden kastar åt en gäst som är borta eller tog för lång tid. Då gäller kastet bara om det fortfarande
  // är samma tur (k), och gästens puck ligger kvar.
  async function cpuTurn(seat, my, level = null, auto = false) {
    const k0 = m.k, id0 = m.id;
    const still = () => m && m.id === id0 && m.k === k0 && Rules.current(m) === seat && !queue.length;
    const first = auto ? false : turnIntro(seat);
    if (!auto || !aimId || !Pucks.get(aimId)) placeAimPuck(seat);
    viewFar = false;
    Cam.set('aim', {aimX: 0});
    const s = m.seats[seat];
    if (first) HUD.banner(`${s.name} tänker …`, seat);
    const t0 = performance.now();
    const rnd = seeded((m.seed | 0) + m.k * 7919 + seat);
    const choice = await AI.choose(m, seat, level || s.level || 'medel', rnd, s.style || null);
    alive(my);
    if (auto && !still()) return;
    // låtsas sikta: flytta pucken och spänn kastet
    const inp = choice.input, sp = Math.hypot(inp.vx, inp.vy), ang = Math.atan2(inp.vx, inp.vy), p = Phys.powerFor(sp);
    const think = Math.max(0, (900 + Math.random() * 700) - (performance.now() - t0));
    await wait(auto ? 200 : think); alive(my);
    if (auto && !still()) return;
    await Anim.tween(520, t => { if (!auto || still()) Aim.showRemote(aimId, {x: inp.x * easeInOut(t), a: 0, p: 0}, hex(m, seat)); }); alive(my);
    await Anim.tween(650, t => { if (!auto || still()) Aim.showRemote(aimId, {x: inp.x, a: ang * t, p: p * easeOut(t)}, hex(m, seat)); }); alive(my);
    await wait(180); alive(my);
    if (auto && !still()) return;
    Aim.showRemote(null, null);
    HUD.banner(null);
    Sound.play('release', p);
    S.submit(inp, seat, k0);
    if (!queue.length) await Promise.race([nextEvent(), wait(3000)]);
    alive(my);
  }

  async function theirTurn(seat, my) {
    const first = turnIntro(seat);
    if (!aimId || !Pucks.get(aimId)) placeAimPuck(seat);
    if (Cam.mode() !== 'far' || !viewFar) Cam.set(viewFar ? 'far' : 'aim', {aimX: remoteAim ? remoteAim.x : 0});
    const s = m.seats[seat], info = S.seats && S.seats[seat];
    const off = info && info.kind === 'human' && info.online === false;
    if (first || off) HUD.banner(off ? `${s.name} är borta …` : `${s.name} siktar …`, seat);
    // Värden låter datorn kasta åt den som är borta eller tar för lång tid. Tiden räknas från att gästen börjar sikta
    // (gästen säger till), annars från nu med marginal. Samma tidsgräns gäller hela turen.
    const key = clockKey(seat);
    if (S.online() && !m.practice) {
      if (turnClock.key !== key) {
        const early = lastTurn && lastTurn.seat === seat && lastTurn.k === m.k && lastTurn.id === m.id;
        turnClock = {key, deadline: off ? Date.now() + 12000 : early ? lastTurn.at + 61500 : Date.now() + 80000, timedOut: false};
      }
      else if (off) turnClock.deadline = Math.min(turnClock.deadline, Date.now() + 12000);
      startClock(() => {
        if (S && S.role === 'host' && m && Rules.current(m) === seat && turnClock.key === key && !turnClock.timedOut) {
          turnClock.timedOut = true;
          const gone = S.seats[seat] && S.seats[seat].online === false;
          HUD.toast(gone ? `Datorn kastar åt ${s.name}` : `Tiden är ute för ${s.name}`, '', 1800);
          cpuTurn(seat, my, gone ? 'medel' : 'latt', true).catch(() => {});
        }
      });
    }
    await nextEvent();
    stopClock();
    alive(my);
  }
  // Visar nedräkningen för den aktuella turen (de sista 20 sekunderna) och anropar onEnd när den är slut
  function startClock(onEnd) {
    let fired = false, last = -1;
    const tick = () => {
      const left = (turnClock.deadline - Date.now()) / 1000;
      HUD.clock(left <= 20 ? Math.max(0, left) : null);
      if (left <= 10 && left > 0 && Math.ceil(left) !== last) { last = Math.ceil(left); Sound.play('clock'); }
      if (left <= 0 && !fired) { fired = true; HUD.clock(null); clearInterval(clockT); onEnd(); }
    };
    clearInterval(clockT);
    clockT = setInterval(tick, 250);
    tick();
  }
  function stopClock() { clearInterval(clockT); HUD.clock(null); }

  /* ---------- Ett kast spelas upp ---------- */
  async function playThrow(ev, my) {
    Aim.cancel();
    stopClock(clockT);
    HUD.banner(null);
    const pre = ev.pre, seat = ev.seat, sum = ev.sum;
    if (!m || m.id !== pre.id || m.k !== pre.k) { m = pre; Pucks.sync(pre); }
    // pucken man siktade med blir den riktiga pucken
    const color = colorKey(pre, seat);
    if (aimId && Pucks.get(aimId)) Pucks.rename(aimId, sum.id); else Pucks.ensure(sum.id, seat, color, Pucks.lookOf(m, seat));
    aimId = null; remoteAim = null;
    Aim.showRemote(null, null);
    Pucks.rings([]);
    HUD.setLead([]);
    // handen skjuter fram pucken från det spända läget till kastlinjen, sedan glider den själv
    const po = Pucks.get(sum.id);
    if (po && po.st === 'table' && Time.scale >= .2) {
      const x0 = po.x, y0 = po.y, x1 = ev.input.x;
      if (y0 < Y0 - 0.005 || Math.abs(x0 - x1) > 0.002) await Anim.tween(clamp((Y0 - y0) * 600, 60, 150), t => Pucks.set(sum.id, lerp(x0, x1, t), lerp(y0, Y0, t)), t => t * t);
      alive(my);
    }
    const sim = Phys.create(pre.pucks, {id: sum.id, owner: seat, input: ev.input});
    const shot = sim.p.find(q => q.id === sum.id);
    const tracker = {q: shot};
    viewFar = false;
    Cam.set('follow', {follow: () => ({x: tracker.q.x, y: tracker.q.y, v: Math.hypot(tracker.q.vx, tracker.q.vy)})});
    Sound.duckMusic(true);
    // ligger fler kast i kö (skärmen var låst eller fliken dold) spelas de äldre upp direkt
    const fast = Time.scale < .2 || queue.length > 0 || document.hidden;
    await animateSim(sim, my, {fast, tracker});
    alive(my);
    Sound.slide(0);
    Sound.duckMusic(false);
    HUD.setLive(null);
    Figures.lookAt(null);
    m = ev.post;
    // döda puckar (nådde inte foul-linjen) lyfts bort
    const deadIds = sum.dead || [];
    deadIds.forEach(id => { const o = Pucks.get(id); if (o) HUD.float(o.x, o.y, 'Död', '#ff8080'); });
    if (deadIds.length) Sound.play('dead');
    await wait(deadIds.length ? 350 : 60);
    alive(my);
    Pucks.sync(sum.frameEnd ? Object.assign({}, m, {pucks: sum.frameEnd.pucks, gutter: sum.frameEnd.gutter}) : m, true);
    HUD.update(sum.frameEnd ? Object.assign({}, m, {frame: sum.frameEnd.frame, n: G.perFrame(m), scores: m.scores.map((s, i) => s - sum.frameEnd.points[i])}) : m, {turn: -1});
    afterThrowFx(sum, seat, ev);
    markLeader(true, sum.frameEnd ? sum.frameEnd.pucks : null);
    // stora ögonblick visas en gång till i slowmotion
    if (sum.shotZone === 4 || sum.knocked >= 2) {
      const shown = sum.frameEnd ? Object.assign({}, m, {pucks: sum.frameEnd.pucks, gutter: sum.frameEnd.gutter}) : m;
      await replay(ev, my, shown);
      markLeader(true, sum.frameEnd ? sum.frameEnd.pucks : null);
    }
    // titta på resultatet en stund
    Cam.set('far');
    await wait(sum.frameEnd ? 700 : 1250);
    alive(my);
    if (m.challenge) { await challengeStep(sum, my); return; }
    if (sum.frameEnd) await frameEnd(sum, my);
    HUD.update(m);
    Scene.drawBoard(m);
  }

  // Spelar upp en simulering i realtid: flyttar puckarna, låter, krockar, slowmotion vid kanten.
  // opts: {fast (direkt till slutet), tracker ({q}: pucken som kameran följer), rate (grundfart), skip () => bool}
  function animateSim(sim, my, opts = {}) {
    const tracker = opts.tracker || {q: sim.p[sim.p.length - 1]};
    let focus = tracker.q;
    let rate = opts.rate || 1, slowUntil = 0, acc = 0, evIdx = 0, last = performance.now();
    const base = opts.rate || 1, fast = !!opts.fast;
    const pan = x => clamp(x / TABLE.HALF, -1, 1) * .5;
    const hitSeen = new Set();
    return new Promise(resolve => {
      let over = false;
      const done = () => { if (over) return; over = true; clearInterval(wd); HUD.setLive(null); resolve(); };
      // dold flik (skärmen låst): requestAnimationFrame stannar, så spela klart direkt
      const finishNow = () => {
        while (!sim.done) Phys.step(sim);
        for (; evIdx < sim.events.length; evIdx++) { const e = sim.events[evIdx]; if (e.k === 'fall') Pucks.fall(e.a, e); }
        sim.p.forEach(q => { if (!q.out) Pucks.set(q.id, q.x, q.y); });
        Sound.slide(0);
        done();
      };
      const wd = setInterval(() => { if (!over && document.hidden) finishNow(); }, 400);
      const frame = () => {
        if (over) return;
        if (my !== gen) { done(); return; }
        const now = performance.now();
        const dt = Math.min(0.1, (now - last) / 1000); last = now;
        // slowmotion när pucken kryper mot kanten eller vid stora krockar
        const v = Math.hypot(focus.vx, focus.vy);
        let want = base;
        if (Settings.slowmo && !reduceMotion) {
          if (!focus.out && focus.y > L - 0.32 && v < 0.55 && v > 0.01) want = base * 0.42;
          if (now < slowUntil) want = Math.min(want, base * 0.35);
        }
        rate += (want - rate) * Math.min(1, dt * 6);
        const skipping = opts.skip && opts.skip();
        acc += dt * rate * (skipping ? 400 : 1);
        let steps = 0;
        while (acc >= Phys.DT && !sim.done && steps < (skipping ? 1e6 : 60)) { Phys.step(sim); acc -= Phys.DT; steps++; }
        // puckarna snurrar av skruven (och lite av sig själva medan de glider)
        const simDt = steps * Phys.DT;
        if (simDt > 0) sim.p.forEach(q => { const qv = Math.hypot(q.vx, q.vy); if (!q.out && qv > 0) Pucks.addSpin(q.id, -(q.w + qv * 0.8) * simDt); });
        for (; evIdx < sim.events.length; evIdx++) {
          const e = sim.events[evIdx];
          if (e.k === 'hit') {
            const key = e.a + ':' + e.b;
            if (!skipping) {
              Sound.play('hit', e.v, pan(e.x));
              Pucks.puff(e.x, e.y, Math.min(1.5, e.v / 1.5));
              if (e.v > 0.9) Cam.shake(Math.min(0.012, e.v * 0.004));
              if (e.v > 1.2 && !hitSeen.has(key)) slowUntil = now + 420;
              vibrate(e.v > 1 ? 16 : 7);
            }
            hitSeen.add(key);
          } else if (e.k === 'fall') Pucks.fall(e.a, e);
        }
        // följ den som rör sig mest (först den kastade)
        if (focus.out || (focus.vx === 0 && focus.vy === 0)) {
          let best = null, bv = 0.05;
          sim.p.forEach(q => { const qv = Math.hypot(q.vx, q.vy); if (!q.out && qv > bv) { bv = qv; best = q; } });
          if (best) { focus = best; tracker.q = best; }
        }
        let total = 0;
        sim.p.forEach(q => { if (!q.out) { Pucks.set(q.id, q.x, q.y); total += Math.hypot(q.vx, q.vy); } });
        if (!focus.out) Figures.lookAt(focus.x, focus.y);
        Sound.slide(skipping ? 0 : total * Math.min(1, rate * 1.5));
        HUD.setLive(sim.p);
        if (sim.done) done(); else requestAnimationFrame(frame);
      };
      if (fast) finishNow();
      else requestAnimationFrame(frame);
    });
  }

  // Repris i slowmotion efter en hängare eller en dubbelträff: samma kast igen, filmat lågt från sidan
  async function replay(ev, my, after) {
    if (queue.length || reduceMotion || Time.scale < .2 || Settings.slowmo === false) return;
    const pre = ev.pre, sum = ev.sum;
    await wait(900); alive(my);
    if (queue.length) return;
    Pucks.rings([]); HUD.setLead([]);
    Pucks.sync(pre);
    Pucks.ensure(sum.id, ev.seat, colorKey(pre, ev.seat), Pucks.lookOf(pre, ev.seat));
    Pucks.set(sum.id, ev.input.x, Y0);
    const sim = Phys.create(pre.pucks, {id: sum.id, owner: ev.seat, input: ev.input});
    const tracker = {q: sim.p.find(q => q.id === sum.id)};
    let skip = false;
    const onTap = () => { skip = true; };
    document.addEventListener('pointerdown', onTap);
    HUD.replayTag(true);
    Cam.set('replay', {follow: () => ({x: tracker.q.x, y: tracker.q.y, v: Math.hypot(tracker.q.vx, tracker.q.vy)}), snap: true});
    Sound.duckMusic(true);
    try { await animateSim(sim, my, {tracker, rate: 0.6, skip: () => skip}); }
    finally { document.removeEventListener('pointerdown', onTap); HUD.replayTag(false); Sound.slide(0); Sound.duckMusic(false); }
    alive(my);
    await wait(skip ? 100 : 700); alive(my);
    Pucks.sync(after, false);
  }

  function afterThrowFx(sum, seat, ev) {
    if (m.intro) Intro.onThrow(sum);
    const name = m.seats[seat].name, col = hex(m, seat);
    const mine = S.isMine(seat) && !S.cpuHere(seat);
    const shotO = Pucks.get(sum.id);
    // figurerna: den egna sidan jublar, de som blev av med en puck tar sig för pannan, de andra applåderar
    const side = Rules.side(m, seat);
    const lost = new Set((sum.fell || []).concat(sum.dead || []).map(id => { const q = ev.pre.pucks.find(p => p.id === id); return q ? Rules.side(m, q.owner) : -1; }).filter(sd => sd >= 0 && sd !== side));
    const others = kind => { for (let sd = 0; sd < Rules.sides(m); sd++) if (sd !== side && !lost.has(sd)) Figures.reactSide(m, sd, kind, 500); };
    // hängare i rad (samma spelare, kast efter kast)
    hangStreak[seat] = sum.shotZone === 4 ? (hangStreak[seat] || 0) + 1 : 0;
    if (sum.shotZone === 4) {
      HUD.toast(hangStreak[seat] >= 2 ? `${hangStreak[seat]} hängare i rad!` : 'Hängare!', 'big', 2200); Sound.play('hanger'); Sound.play('cheer', 1);
      if (hangStreak[seat] >= 2) Sound.announce([hangStreak[seat] >= 3 ? 'hangrad.3' : 'hangrad.2'], 3, 'Hängare i rad!');
      else Sound.announce(['hangare'], 3, m.mode === 'hang' ? 'Hängare! Tio poäng!' : 'Hängare! Fyra poäng!');
      if (shotO) HUD.float(shotO.x, shotO.y, '4', col, true);
      if (mine) { Stats.hangers++; saveStats(); }
      HUD.confetti([col]);
      Figures.reactSide(m, side, 'cheer', 250); others('clap');
    } else if (sum.knocked >= 2) {
      HUD.toast(sum.knocked >= 3 ? 'Trippelträff!' : 'Dubbelträff!', 'big', 2000); Sound.play('knock'); Sound.play('cheer', .8);
      Sound.announce([sum.knocked >= 3 ? 'trippel' : 'dubbel'], 3, sum.knocked >= 3 ? 'Trippelträff!' : 'Dubbelträff!');
      Figures.reactSide(m, side, 'cheer', 250); lost.forEach(sd => Figures.reactSide(m, sd, 'dismay', 300));
    } else if (sum.knocked === 1) {
      HUD.toast('Utslagen!', 'gold', 1500); Sound.play('knock'); Sound.play('ooh');
      if (Math.random() < .35) Sound.announce(['utslag'], 1, pick(['Utslagen!', 'Bort med den!', 'Snyggt utslag!']));
      Figures.reactSide(m, side, 'cheer', 300); lost.forEach(sd => Figures.reactSide(m, sd, 'dismay', 250));
    }
    else if (sum.fell.includes(sum.id)) { HUD.toast('Över kanten', '', 1300); Sound.play('ooh', .7); if (Math.random() < .4) Sound.announce(['kanten'], 1); Figures.reactSide(m, side, 'dismay', 200); }
    else if (sum.shotZone === 3) {
      if (shotO) HUD.float(shotO.x, shotO.y, '3', col); Sound.play('point', 3);
      // pucken stannade precis före kanten: nästan en hängare
      if (shotO && TABLE.L - shotO.y < 0.036 && Math.random() < .75) Sound.announce(['nastan'], 1);
      else if (Math.random() < .25) Sound.announce(['tre'], 1, 'Snyggt, tre poäng.');
      Figures.reactSide(m, side, 'clap', 300);
    }
    if (mine) {
      // matchens bästa kast (att dela som klipp efteråt)
      const sc = sum.shotZone === 4 ? 100 + (hangStreak[seat] || 0) : sum.knocked >= 3 ? 90 : sum.knocked === 2 ? 80 : sum.knocked === 1 ? 40 : sum.shotZone === 3 ? 20 : 0;
      if (sc && (!bestMo || bestMo.mid !== m.id || sc > bestMo.score)) {
        bestMo = {mid: m.id, score: sc, ev, label: sum.shotZone === 4 ? (hangStreak[seat] >= 2 ? `${hangStreak[seat]} hängare i rad!` : 'Hängare!') : sum.knocked >= 3 ? 'Trippelträff!' : sum.knocked === 2 ? 'Dubbelträff!' : sum.knocked === 1 ? 'Utslag!' : 'Tre poäng!'};
      }
      if (sum.knocked) { Stats.knockouts += sum.knocked; }
      if (sum.shotZone === 3) Stats.threes++;
      saveStats();
      if (hangStreak[seat] >= 2) Badges.event('hangrad');
      if (sum.knocked >= 3) Badges.event('trippel');
      Badges.check();
    }
    // datorspelarna kommenterar stora ögonblick (bara på den här skärmen)
    const big = sum.shotZone === 4 || sum.knocked >= 1 || sum.shotZone === 3;
    if (big && Math.random() < (sum.shotZone === 4 || sum.knocked >= 2 ? 0.9 : 0.45)) {
      const cpus = m.seats.map((x, i) => i).filter(i => S.cpuHere(i));
      if (S.cpuHere(seat)) setTimeout(() => { if (S) HUD.bubble(seat, pick(['😎', 'Ha!', '🎯', 'Nu kör vi!'])); }, 900);
      else if (cpus.length) { const c = pick(cpus); setTimeout(() => { if (S && m) HUD.bubble(c, pick(sum.knocked && !m.pucks.some(q => Rules.sameSide(m, q.owner, c)) ? ['Oj då!', '😮', 'Hoppsan!'] : ['Snyggt!', '👏', 'Tur!', '😮'])); }, 1100); }
    }
    // vem leder nu?
    if (sum.leader >= 0 && sum.leader !== sum.leaderBefore && !sum.frameEnd && Rules.sides(m) > 1) {
      const who = Rules.sideName(m, sum.leader);
      setTimeout(() => HUD.toast(`${who} leder omgången`, '', 1400), 500);
    }
    void name; void ev;
  }

  function markLeader(show, pucksOverride) {
    const list = pucksOverride || (m ? m.pucks : []);
    const sc = m ? Rules.score(list, m) : {counted: []};
    const ids = sc.counted.map(c => c.id);
    Pucks.rings(show ? ids : []);
    HUD.setLead(ids);
    HUD.mini();
  }

  async function frameEnd(sum, my) {
    const fe = sum.frameEnd;
    Cam.set('score');
    await wait(700); alive(my);
    // räkna upp poängen puck för puck
    const counted = fe.counted.slice().sort((a, b) => {
      const qa = fe.pucks.find(q => q.id === a.id), qb = fe.pucks.find(q => q.id === b.id);
      return (qb ? qb.y : 0) - (qa ? qa.y : 0);
    });
    let shown = m.scores.map((s, i) => s - fe.points[i]);
    for (const c of counted) {
      const o = Pucks.get(c.id);
      if (!o) continue;
      shown[c.side != null ? c.side : c.owner] += c.pts;
      Pucks.pulse(c.id);
      HUD.float(o.x, o.y, '+' + c.pts, hex(m, c.owner), c.pts >= 3);
      Sound.play('point', c.pts);
      const mm = Object.assign({}, m, {scores: shown.slice(), frame: fe.frame, n: G.perFrame(m)});
      HUD.update(mm, {bump: true, turn: -1});
      await wait(480); alive(my);
    }
    if (!counted.length) { await wait(500); alive(my); }
    else Sound.play('frame');
    // märken: storomgång, och hur långt efter den egna sidan har legat (för comeback)
    const bs = badgeSide();
    if (bs >= 0 && !m.practice) {
      if (fe.leader === bs && fe.points[bs] >= 8) Badges.event('storomg');
      const behind = Math.max(0, ...m.scores.filter((x, i) => i !== bs)) - m.scores[bs];
      deficit[m.id] = Math.max(deficit[m.id] || 0, behind);
    }
    // speakern och figurerna: vem tog omgången?
    const spoken = sd => Rules.sideName(m, sd).replace(/ & /g, ' och ');
    if (m.practice) { /* ingen speaker i träningen */ }
    else if (fe.leader >= 0 && fe.points[fe.leader] > 0) {
      const p = fe.points[fe.leader];
      Sound.announce(['omg.' + G.sayName(m, fe.leader)].concat(p <= 16 ? ['poang.' + p] : [], frameComment(fe)), 2, `${spoken(fe.leader)} tar omgången, ${p} poäng.`);
      Figures.reactSide(m, fe.leader, 'cheer');
    }
    else Sound.announce(['noll'].concat(frameComment(fe)), 2, 'Inga poäng den här omgången.');
    if (m.practice) { const p = fe.points[0] || 0; if (p > Stats.practiceBest) { Stats.practiceBest = p; saveStats(); if (p > 0) HUD.toast(`Nytt rekord: ${p} poäng!`, 'gold', 2000); } }
    HUD.update(Object.assign({}, m, {frame: fe.frame, n: G.perFrame(m)}), {turn: -1});
    Scene.drawBoard(m);
    await HUD.frameResult(m, fe); alive(my);
    HUD.update(m, {turn: -1});
    if (m.over) return;
    await Pucks.clear(true); alive(my);
    Pucks.sync(m);
    const first = m.order[0];
    HUD.toast(`Omgång ${m.frame}`, 'big', 1500);
    // kan någon vinna i den här omgången? (en gång per omgång, när speakern har pratat klart)
    if (!m.practice && !m.challenge && m.scores.some(sc => m.target - sc <= (m.mode === 'hang' ? 10 : m.mode === 'last' ? 2 : 4))) {
      const k0 = m.k;
      setTimeout(() => { if (S && m && m.k === k0 && !Sound.talking()) Sound.announce(['avgora'], 1); }, 900);
    }
    await wait(500); alive(my);
    if (m.seats.length > 1) HUD.toast(`${m.seats[first].name} börjar`, '', 1400);
  }
  // Vad speakern lägger till efter omgångens poäng: ledningsbyte, comeback, jämnt eller en stor omgång
  function frameComment(fe) {
    if (m.over) return [];
    const before = m.scores.map((s, i) => s - fe.points[i]);
    const leadOf = arr => { const top = Math.max(...arr); return top > 0 && arr.filter(x => x === top).length === 1 ? arr.indexOf(top) : -1; };
    const was = leadOf(before), now = leadOf(m.scores);
    if (now >= 0 && now !== was && now === fe.leader) {
      const gap = was >= 0 ? before[was] - before[now] : 0;
      return [gap >= 5 ? 'comeback' : 'ledning'];
    }
    const sorted = m.scores.slice().sort((a, b) => b - a);
    if (m.scores.length > 1 && sorted[0] > 0 && sorted[0] === sorted[1]) return ['jamnt'];
    if (fe.leader >= 0 && fe.points[fe.leader] >= 7) return ['storomg'];
    return [];
  }

  /* ---------- Utmaningar: är målet nått? ---------- */
  async function challengeStep(sum, my) {
    chSums.push(sum);
    HUD.update(m, {turn: -1});
    const r = Challenges.check(m, sum, chSums);
    if (!r) { HUD.update(m); return; }
    const lv = Challenges.level(m);
    Cam.set('score');
    await wait(900); alive(my);
    let info = null;
    if (lv.daily) { info = Challenges.saveDaily(r.pts || 0); Net.weekPublish(); }
    else if (!r.fail) info = {record: Challenges.save(lv.id, r.stars)};
    Badges.check();
    if (!r.fail && r.stars > 0) { Sound.play(r.stars >= 3 ? 'win' : 'frame'); if (r.stars >= 3) { Sound.play('cheer', 1); HUD.confetti(['#f5d693']); } Sound.announce([r.stars >= 3 ? 'utm.tre' : 'utm.klar'], 2); }
    else { Sound.play('lose'); Sound.announce(['utm.miss'], 2); }
    const choice = await Menu.challengeResult(lv, r, info);
    alive(my);
    if (choice === 'again') { S.rematch(); await wait(50); return; }
    const s = S;
    G.stop();
    Menu.forget(s);
    if (choice === 'next') Menu.challenge(Challenges.LEVELS[Challenges.LEVELS.findIndex(l => l.id === lv.id) + 1]);
    else Menu.challenges();
  }

  /* ---------- Slutet ---------- */
  async function gameOver(my) {
    HUD.banner(null);
    HUD.clock(null);
    HUD.tip(null);
    Pucks.rings([]);
    // vinnaren är en sida (en spelare eller ett lag)
    const w = m.winner, iWon = Rules.sideSeats(m, w).some(i => S.isMine(i) && !S.cpuHere(i)), humansHere = m.seats.filter((s, i) => S.isMine(i)).length;
    // statistik, musik och konfetti en gång per match (loopen kan komma hit igen)
    if (!fxDone.has(m.id)) {
      fxDone.add(m.id);
      if (!m.practice && humansHere >= 1) {
        Stats.games++;
        if (humansHere === 1 && iWon) Stats.wins++;
        if (S.online()) { Stats.online++; if (iWon) Stats.onlineWins++; }
        Stats.best = Math.max(Stats.best, ...(m.frames || []).map(f => Math.max(...f.points)));
        saveStats();
      }
      Sound.music('final');
      Sound.play(iWon || humansHere !== 1 ? 'win' : 'lose');
      if (iWon || humansHere !== 1) Sound.play('cheer', 1.2);
      Sound.announce(['vinn.' + G.sayName(m, w)], 3, `Och vinnaren är ${Rules.sideName(m, w).replace(/ & /g, ' och ')}!`);
      // alla figurer kommer fram: vinnarna jublar, de andra applåderar
      Figures.setTurn(-1);
      Figures.reactSide(m, w, 'cheer', 200);
      for (let sd = 0; sd < Rules.sides(m); sd++) if (sd !== w) Figures.reactSide(m, sd, 'clap', 900);
      // pubturnén: en vinst öppnar nästa motståndare, och stamgästen säger något
      if (m.tour) {
        if (iWon) Tour.beat(m.tour.pub, m.tour.opp);
        const opp = Tour.opp(m);
        // (efter speakerns "Och vinnaren är …")
        setTimeout(() => guestSays(iWon ? opp.lose : opp.win, iWon ? 'forlust' : 'vinst', my), 1400);
      }
      HUD.confetti([Rules.sideColor(m, w).hex]);
      if (iWon && humansHere === 1 && !m.practice) {
        if (m.mode === 'hang') Badges.event('hangjakt');
        if (m.mode === 'last') Badges.event('sistkvar');
        if ((deficit[m.id] || 0) >= 5) Badges.event('comeback');
      }
      Badges.check();
    }
    Cam.set('score');
    const card = S.cup ? Menu.cupAfter(m, S) : Menu.gameOver(m, S);
    let choice;
    for (;;) {
      // värden kan starta en revansch medan vi tittar på resultatet (bara då avbryts kortet)
      choice = await Promise.race([card, nextEvent().then(() => 'event')]);
      alive(my);
      if (choice !== 'event') break;
      if (queue.length) { Menu.closeOverlays(); return; }
    }
    // turneringen: nästa match (TV:n), eller be TV:n gå vidare (telefonerna)
    if (choice === 'next') {
      if (S.role === 'host') S.cupNext(); else { S.request('start'); await nextEvent(); alive(my); }
      await wait(50);
      return;
    }
    if (choice === 'again' || (choice === 'table' && S.role === 'client')) {
      if (S.role === 'client') { await nextEvent(); alive(my); return; }
      S.rematch();
      await wait(50);
      return;
    }
    if (choice === 'table' && S.role === 'host') { S.backToLobby(); await wait(50); return; }
    if (choice === 'tournext' || choice === 'tour') {
      const s = S;
      G.stop();
      Menu.forget(s);
      const nx = Tour.next();
      if (choice === 'tournext' && nx) Menu.tourPlay(nx[0], nx[1]); else Menu.tour();
      return;
    }
    const s = S;
    G.stop();
    Menu.forget(s);
    try { s.leave(); } catch (e) { /* ok */ }
    if (choice === 'online') Menu.online(); else Menu.title();
  }

  // Lämna matchen mitt i
  G.quit = () => {
    const s = S;
    G.stop();
    Menu.leaveCurrent();
    if (s) try { s.leave(); } catch (e) { /* ok */ }
    if (s && s.online()) Menu.online(); else Menu.title();
  };
  G.lookFar = () => { viewFar = true; Cam.set('table'); };
  return G;
})();

/* ---- 14b-clip.js ---- */
/* ================= Dela kastet: reprisen som videoklipp ================= */
// Matchens bästa kast (för spelaren på den här skärmen) spelas upp igen och spelas in med ljud (MediaRecorder).
// Bilden kopieras från 3D-duken direkt efter varje bild (Scene.afterRender) till en mindre duk med klubbens namn och
// vad som hände ("Hängare!"). Klippet delas med telefonens delningsmeny, eller visas med en knapp för att spara det.
const Clip = (() => {
  const C = {};
  C.supported = () => !ARTIFACT && typeof MediaRecorder !== 'undefined' && !!HTMLCanvasElement.prototype.captureStream && typeof Blob !== 'undefined';
  const pickType = () => ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']
    .find(t => { try { return MediaRecorder.isTypeSupported(t); } catch (e) { return false; } }) || '';
  function watermark(g, w, hh, label) {
    const s = Math.max(w, hh) / 1280;
    g.save();
    g.shadowColor = 'rgba(0,0,0,.85)'; g.shadowBlur = 10 * s;
    g.font = `italic 700 ${Math.round(36 * s)}px Georgia, serif`; g.textAlign = 'right'; g.textBaseline = 'bottom';
    g.fillStyle = '#ff7aa2'; g.fillText('Shuffleklubben', w - 20 * s, hh - 18 * s);
    if (label) {
      g.font = `700 ${Math.round(46 * s)}px Oswald, Inter, sans-serif`; g.textAlign = 'left'; g.textBaseline = 'top';
      g.fillStyle = '#f5d693'; g.fillText(label, 22 * s, 20 * s);
    }
    g.restore();
  }
  // Spelar in medan play() pågår. Returnerar klippet (Blob).
  C.record = async (label, play) => {
    const gl = $('gl');
    const k = Math.min(1, 1280 / Math.max(gl.width, gl.height));
    const w = Math.round(gl.width * k / 2) * 2, hh = Math.round(gl.height * k / 2) * 2;
    const cv = document.createElement('canvas'); cv.width = w; cv.height = hh;
    const g = cv.getContext('2d');
    Scene.afterRender = () => { g.drawImage(gl, 0, 0, w, hh); watermark(g, w, hh, label); };
    const stream = cv.captureStream(30);
    const aud = Sound.recordStream();
    if (aud) aud.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    const type = pickType();
    const rec = new MediaRecorder(stream, type ? {mimeType: type, videoBitsPerSecond: 4e6} : {videoBitsPerSecond: 4e6});
    const chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    const stopped = new Promise(r => { rec.onstop = r; });
    rec.start(250);
    try { await play(); await new Promise(r => setTimeout(r, 500)); }
    finally {
      try { rec.stop(); } catch (e) { /* redan stoppad */ }
      await stopped;
      Scene.afterRender = null;
      stream.getTracks().forEach(t => t.stop());
      if (aud) aud.stop();
    }
    return new Blob(chunks, {type: (type || 'video/webm').split(';')[0]});
  };
  // Delar klippet (telefonens delningsmeny) eller visar det med en knapp för att spara
  C.share = async (blob, text) => {
    const ext = /mp4/.test(blob.type) ? 'mp4' : 'webm';
    const file = new File([blob], `shuffleklubben.${ext}`, {type: blob.type});
    try {
      if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: 'Shuffleklubben', text}); return 'shared'; }
    } catch (e) { if (e && e.name === 'AbortError') return 'aborted'; }
    Menu.clipSheet(blob, file.name, text);
    return 'sheet';
  };
  return C;
})();

/* ---- 15-main.js ---- */
/* ================= Start ================= */
const Main = (() => {
  const A = {};
  const setLoad = (p, text) => { const b = $('loadBar'); if (b) b.style.width = Math.round(p * 100) + '%'; if (text && $('loadText')) $('loadText').textContent = text; };
  // Spel över nätet fungerar inte inuti claude.ai (där stoppas anslutningarna)
  A.onlineOk = () => !/claude\.ai|claudeusercontent|anthropic/.test(location.hostname);

  let last = performance.now(), slowFrames = 0, perfChecked = 0, frames = 0, odd = false;
  function tick(now) {
    requestAnimationFrame(tick);
    // i menyerna räcker halva bildfrekvensen (sparar batteri)
    odd = !odd;
    if (Cam.mode() === 'menu' && odd && now - last < 40) return;
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    Anim.tick(now);
    Cam.update(dt);
    Pucks.update(dt); Figures.update(dt);
    if (!Scene.paused && !Scene.noRender && !Scene.pad) { Scene.render({bloom: .32, exposure: 1.15, threshold: 2.2}); if (Scene.afterRender) Scene.afterRender(); }
    // håll bilden flytande: sänk upplösningen om telefonen inte hinner med
    frames++;
    if (dt > 1 / 38) slowFrames++;
    if (now - perfChecked > 2500) {
      if (frames > 30 && slowFrames / frames > 0.45) {
        if (Scene.dpr > 1.05) Scene.setDpr(Math.max(1, Scene.dpr - 0.35));
        else if (Scene.post && !Post.cheap) Post.cheap = true;
      }
      perfChecked = now; slowFrames = 0; frames = 0;
    }
  }

  // Skärmen släcks inte under en pubkväll (TV:n och handkontrollerna). Tas tillbaka när fliken syns igen.
  let wake = null, wakeWant = false;
  A.keepAwake = on => {
    wakeWant = !!on;
    if (!on) { if (wake) { wake.release().catch(() => {}); wake = null; } return; }
    if (wake || !navigator.wakeLock || document.hidden) return;
    navigator.wakeLock.request('screen').then(l => { wake = l; l.addEventListener('release', () => { if (wake === l) wake = null; }); if (!wakeWant) A.keepAwake(false); }).catch(() => {});
  };
  document.addEventListener('visibilitychange', () => { if (!document.hidden && wakeWant) A.keepAwake(true); });

  // Liten påminnelse (när man hamnar direkt vid ett bord): ljudet kommer vid första trycket
  function soundHint() {
    const b = h('button', {id: 'soundHint', 'aria-label': 'Slå på ljudet'}, '🔇 Tryck för ljud');
    document.body.append(b);
    const off = () => { b.classList.add('out'); setTimeout(() => b.remove(), 400); ['pointerdown', 'keydown'].forEach(ev => document.removeEventListener(ev, off, true)); };
    ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, off, true));
    b.onclick = () => { Sound.unlock(); Sound.play('soft'); };
  }

  // väntar tills webbläsaren har ritat n bilder (högst ms, t.ex. i en flik i bakgrunden)
  const drawn = (n, ms = 700) => new Promise(res => { const t = setTimeout(res, ms); const f = () => (--n <= 0 ? (clearTimeout(t), res()) : requestAnimationFrame(f)); requestAnimationFrame(f); });
  A.boot = async () => {
    setLoad(.06, 'Hänger upp lamporna …');
    // 3D-modellerna (egen fil, med förlopp)
    const got = await ModelLib.load(p => setLoad(.06 + .66 * p, `Bär in bordet … ${Math.round(p * 100)} %`));
    // medan scenen byggs: kan ljudet starta utan ett tryck? (annars visas "Tryck för att kliva in"). Först nu, för
    // går det hämtas menymusiken, och den ska inte dela nätet med modellerna.
    const probe = got === false ? null : Sound.probe().catch(() => false);
    if (got === false) {
      setLoad(1, 'Kunde inte hämta 3D-grafiken. Kontrollera anslutningen och försök igen.');
      $('loading').append(h('button', {class: 'btn primary', style: {marginTop: '6px'}, onclick: () => location.reload()}, 'Försök igen'));
      return;
    }
    setLoad(.76, 'Putsar puckarna …');
    await drawn(1, 60);
    try {
      Scene.init($('gl'));
    } catch (e) {
      console.error(e);
      setLoad(1, 'Den här webbläsaren kan inte visa 3D-grafik. Prova Safari eller Chrome.');
      return;
    }
    performance.mark('sk-scen');
    Pucks.init();
    Cam.set('menu', {snap: true});
    requestAnimationFrame(tick);
    setLoad(.92, 'Strör pulver på bordet …');
    // den första bilden (med shaderna) är ritad innan laddningsskärmen går
    await drawn(1);
    setLoad(1);
    performance.mark('sk-ljudkoll');
    const locked = !(await probe);
    performance.mark('sk-ljud');
    $('loading').classList.add('done');
    setTimeout(() => { const l = $('loading'); if (l) l.remove(); }, 800);
    document.body.classList.toggle('lefty', !!Settings.lefty);
    document.querySelectorAll('#spinCtl [data-dir]').forEach(b => { b.onclick = () => { Sound.unlock(); Aim.cycleSpin(+b.dataset.dir); }; });
    const unlock = () => Sound.unlock();
    ['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => document.addEventListener(ev, unlock, {passive: true}));
    Sound.ambience(true);
    // länk till ett bord: ...#ABCD
    const code = Net.cleanCode((location.hash || '').replace('#', '')) || Net.cleanCode(new URLSearchParams(location.search).get('bord'));
    const saved = A.onlineOk() ? Net.saved() : null;
    // Ljudet får inte starta förrän man har tryckt på sidan. Vanlig start: "Tryck för att kliva in" på startskärmen.
    // Omladdning mitt i ett bord eller en länk till ett bord: rakt in, med en liten påminnelse om ljudet.
    const direct = !!(saved && (saved.host || saved.room)) || (code.length === 4 && A.onlineOk());
    performance.mark('sk-fore-meny');
    Menu.title({gate: locked && !direct});
    performance.mark('sk-meny');
    // de inspelade ljuden (bordet, publiken, speakern och sorlet) laddas i bakgrunden
    setTimeout(() => Sound.preload(), 1200);
    // märken för det man redan har gjort (efter en uppdatering): en sammanfattning i stället för en ruta per märke
    Scene.setFinish(Badges.cos().bord);
    const nb = Badges.check(true);
    if (nb) setTimeout(() => Menu.note(`🏅 Du har tagit ${nb === 1 ? 'ett märke' : nb + ' märken'} för det du redan har gjort! Märkena låser upp puckar, hattar och bordsytor.`, 'badges', 7000, [['Visa', () => Menu.stats(), 'primary']]), 2400);
    if (locked && direct) soundHint();
    // webbappen: spara spelet för start utan internet (nu när modellerna är hämtade)
    if (window.SK_REGISTER_SW) setTimeout(() => window.SK_REGISTER_SW(), 2500);
    if (saved && saved.host && !(code.length === 4 && code !== saved.host.code)) {
      // värden laddade om sidan: öppna bordet igen med samma kod och samma ställning
      Mqtt.ready(9000).then(() => {
        Net.lobbyOn();
        const s = Net.host({restore: saved.host});
        if (s.m && s.state !== 'lobby') Game.start(s); else Menu.room(s);
        Menu.note('Bordet är öppet igen.', 'restored', 2500);
      });
    } else if (saved && saved.room && code.length !== 4) {
      setTimeout(() => Menu.joinFlow(saved.room), 300);
    } else if (code.length === 4 && A.onlineOk()) {
      history.replaceState(null, '', location.pathname + location.search);
      const go = () => Menu.joinFlow(code);
      if (!Profile.name) setTimeout(() => Menu.profile(true, go), 400); else setTimeout(go, 300);
    }
    // Lobbyn i bakgrunden: startskärmen visar hur många som är online och andra kan bjuda in en.
    // (Går att stänga av med "Synas i lobbyn" i inställningarna.)
    if (A.onlineOk() && Settings.visible !== false) setTimeout(() => { if (!Net.inLobby()) Net.lobbyOn().then(ok => { if (ok && !Game.running()) Net.status('menu'); }); }, 2500);
    // iPhone och iPad: tips om att lägga spelet på hemskärmen (en gång)
    const standalone = navigator.standalone || (window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches));
    if (IS_IOS && !standalone && A.onlineOk() && !Store.get('a2hs')) setTimeout(() => {
      if (Game.running()) return;
      Store.set('a2hs', true);
      Menu.note('Tips: tryck på Dela och sedan ”Lägg till på hemskärmen”, så startar Shuffleklubben som en app i helskärm.', 'a2hs', 10000, [['OK', () => {}, 'primary']]);
    }, 7000);
    window.addEventListener('hashchange', () => {
      const c = Net.cleanCode(location.hash.replace('#', ''));
      if (c.length === 4 && A.onlineOk()) { history.replaceState(null, '', location.pathname + location.search); Menu.joinFlow(c); }
    });
    // När sidan stängs eller laddas om lämnas bara lobbyn. Bordet och matchen finns kvar, så att man kommer
    // tillbaka dit efter en omladdning (de andra ser att man är borta en stund).
    window.addEventListener('pagehide', () => { try { Net.lobbyOff(); } catch (e) { /* ok */ } });
  };
  return A;
})();

if (/[?&]debug\b/.test(location.search)) window.SK = {Game, Net, Mqtt, Rules, Phys, TABLE, AI, Scene, Cam, Pucks, Figures, Challenges, Tour, Menu, HUD, Aim, Sound, Time, Settings, Profile, Stats, Post, ModelLib, Anim, Bus, Badges, Clip, Intro};

Main.boot();
})();
</script>
<script>window.SK_REGISTER_SW = () => { if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {}); };</script>
